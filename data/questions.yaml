        and Cellular Homeostasis to Memory Consolidation and Integration. Neuron, 81(1),
        12–34. https://doi.org/10.1016/j.neuron.2013.12.025
        本次引文按 PMC 作者稿（PMC3921176）核对。
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3921176/
