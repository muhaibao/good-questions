- id: 2026-11-23-phil-faith
  date: '2026-11-23'
  category: philosophy
  title_zh: 宗教信仰如何能在知识论上得到辩护？
  title_en: How can religious faith be epistemically justified?
  commentary: 提问者感受到的轻蔑，背后是一场更旧的知识论争执：没有充分证据就相信，究竟是对人类的过失，还是在真正的选项面前一种可允许、甚至不可避免的激情决定，或是一种本来就可以是基本的信念。
  source_name: Philosophy Stack Exchange
  source_url: https://philosophy.stackexchange.com/questions/50288/how-can-religious-faith-be-epistemically-justified
  author: lukuss
  source_type: stackexchange
  tags:
  - 信仰
  - 证据主义
  - 改革宗知识论
  - 知识论
  answer:
    format: scholarly
    reviewed_at: '2026-11-23'
    consensus:
      label: 这是长期分裂的哲学争论，没有统一共识。证据主义要求信念与证据相称，并常把无证据的信仰看成过失；反对者或为在真正选项下的激情决定辩护，或主张对上帝的信念可以是「恰当基本的」
      note: >-
        原问题由一位自视为理性的基督徒提出，他感到在当代讨论中一暴露信仰就遭到轻视，并询问为何信仰会被看成软弱，而不是一块尚未充分探索的领域。[1]
        这一社会感受背后的知识论争执，至少可以沿着三条已打开的一手线索来写。Clifford 在 1877 年的《信念的伦理学》中把证据主义提升为普遍的道德要求：「无论何时、何地、对任何人，依据不充分的证据去相信任何事情，都是错误的。」[2]
        James 在《信仰的意志》中明确把 Clifford 当作对手，并辩护如下论题：当我们的理智按其本性无法决定一个真正的选项时，我们的激情本性必须、并且可以合法地作出决定；在这种情况下，说「先不要决定、让问题悬着」，本身也是一种带有失去真理之风险的激情决定。[3]
        Plantinga 在 1981 年的论文中把证据主义异议的根源追溯到古典基础主义，并论证：自明、不可纠正或对感官明显，并不是恰当基本性的必要条件；主张对上帝的信念是恰当基本的，并不等于主张它没有根据、是任意的或缺少证成情境。[4]
        Stanford Encyclopedia 的 Faith 与 The Epistemology of Religion 条目，把上述路线写成信仰知识论中持续并存的模型，而不是已经结算的统一理论。[5][6]
    summary: >-
      原题的表面是「为什么当代有人一听到信仰就换上一副轻蔑或优越的态度」，作者也拒绝只要定义、只要死人语录或只要意见之争。[1] 若把问题收成知识论上可讨论的形式，它就是：宗教信仰如何——如果能够的话——得到认识上的辩护？对这一点，当代哲学并没有共同答案，但有几条边界清楚、且应用一手文本即可陈述的主要立场。
      第一条是证据主义。Clifford 用一艘移民船的船主作引子：即便船主真诚地相信船只适航，若他是靠压制怀疑、避免调查才得到这份真诚，他仍然没有权利依据当时那点证据去相信。文章在「探究的义务」一节收束为那句最常被引用的话：无论何时、何地、对任何人，依据不充分的证据去相信任何事情，都是错误的。紧接着他还写：一个人若把童年或事后被说服得来的信念压下怀疑、回避讨论它的书籍与人物，并把扰乱该信念的问题看成不虔诚，则此人的一生是对人类的长期罪过。[2] 按此标准，许多宗教信仰若拿不出与其确信程度相称的证据，就不仅是「不够理性」，而且是伦理上的失败。
      第二条路线直接针对这一禁令。James 把文章写成对信仰之正当性的辩护：即使我们仅仅逻辑的理智尚未被强制，我们仍有权利采取一种相信的态度。[3] 他先引入技术区分：假设可以是活的或死的，选项可以是强迫的或可回避的、重大的或琐碎的；当一个选项既是强迫的、活的、又是重大的，便是「真正的选项」。[3] 然后他提出论题：每当真正的选项按其本性无法在理智上决定时，我们的激情本性必须、并且可以合法地在命题之间作出决定；此时「先不要决定」本身也是一种激情决定，并带有同样的失去真理的风险。[3] 宗教假设若被理解为这类真正的选项，则暂停判断并不比相信更中性。需要强调的是：James 并没有主张可以任意愿意自己去相信任何事情——他自己也用林肯是否存在、床上的风湿病等例子说明，意志并不能随便改写已被理智判定的事实。[3]
      第三条路线改变了「证据」在结构中的位置。Plantinga 指出，两类看起来相反的人其实共享一个前提：有神信念只有在有充分证据时才在理智上可接受——无论是批评者因此判它不理性，还是自然神学传统因此忙着提供证明。[4] 他把这一前提与古典基础主义联系起来：恰当的基本命题只包括自明、不可纠正或对感官明显的命题，而上帝存在不在其中，所以必须有证据。[4] 他的反题是：这些并不是恰当基本性的必要条件；而且，主张对上帝的信念是恰当基本的，并不等于说它没有根据、是任意的或缺少证成情境。改革宗知识论者可以从自己的例证出发，而不必接受「伟大的南瓜」之类反例可以任意混入基本信念的说法；他还可以与 Calvin 一样，主张上帝在我们里面放置了一种在周围世界中看见其作为的自然倾向，而这并不适用于「伟大的南瓜」。[4]
      SEP 的综述把这些路线写成对「信仰既大胆又要求合理性」这一张力的不同处理：Clifford 把证据主义做成绝对道德要求；改革宗知识论则借助外在主义，主张有神信念可以是得到保证的，即使其真对信者而言只是基本地、而不是从其他更基本信念推论出来地明显。[5][6] 没有任何一条已经消灭另外两条。若原问题要的是「如何得到辩护」，诚实的回答只能是：有几种相互竞争的辩护策略，它们在什么算证据、什么算任意、以及暂停判断是否中性这些问题上并不一致。
    definitions:
    - term: 证据主义（evidentialism）
      text: 一种关于信念规范的主张：信念应与证据相称；在 Clifford 的强形式里，依据不充分的证据去相信任何事情，无论何时何地、对任何人都是错误的。[2] SEP 把「信念只有在与证据相称时才得证成」称作起初显得很有说服力的立场。[6]
    - term: 真正的选项（genuine option）
      text: James 的术语：一个既是强迫的、又是活的、又是重大的选项。活的假设是对当事人而言构成真实可能性的假设；强迫的选项无法靠回避来取消；重大的选项关系重大后果。他认为，当这类选项按其本性无法在理智上决定时，激情本性可以合法地介入。[3]
    - term: 恰当基本的信念（properly basic belief）
      text: 不必基于其他命题的证据、却仍可以是理性或得到保证的信念。Plantinga 反对把恰当基本性仅限于自明、不可纠正或对感官明显的命题，并主张对上帝的信念可以是恰当基本的，同时否认这会使该信念变成没有根据或任意的。[4]
    milestones:
    - year: '1877'
      name: Clifford 发表《信念的伦理学》
      explanation: 在 Contemporary Review 刊出，后收入 Lectures and Essays（1879）第二卷。文中提出「依据不充分的证据去相信即错」的普遍禁令。[2]
    - year: '1896'
      name: James 宣讲《信仰的意志》
      explanation: 他把文章写成对在宗教事务上采取相信态度的权利的辩护，并针对 Clifford 的禁令提出关于真正选项与激情决定的论题。文集通常署 1897 年出版；本次引文据公开的 Wikisource 文本。[3]
    - year: '1981'
      name: Plantinga 论证「对上帝的信念可以是恰当基本的」
      explanation: 在 Noûs 发表 *Is Belief in God Properly Basic?*，把证据主义异议与古典基础主义联系起来，并陈述改革宗知识论的核心反题。他后来在 *Warranted Christian Belief*（2000）等著作中扩展了这一模型；本次未打开该书全文，故不以之引页。[4]
    views:
    - position: 没有充分证据就相信，在认识上是不负责任的，在伦理上也是错的；宗教信仰若不能满足这一标准，就不能在知识论上得到辩护
      consensus_role: 近代以来最常被用来质疑信仰之合理性的规范立场之一
      evidence:
        label: 经典的规范论文，不是对当代宗教经验的经验调查
        note: >-
          Clifford 的文章以思想实验和道德论证为主，提出的是一条普遍原则，而不是对某一具体教义之证据的评审。[2]
          「不充分」如何度量、科学与历史中不可避免的不确定信念是否也被一网打尽，是后来文献对这条原则的常见追问；这些反驳只有在打开相应文本后才能详细展开。
          原问题中的社会轻蔑，不能直接等同于 Clifford 的伦理论证：有人轻视信仰，可能并不持有如此之强的原则。
      holders:
      - name: William Kingdon Clifford
        identity: 英国数学家与哲学家。《The Ethics of Belief》作者。本次文本据 Wikisource 所刊、转载于 Lectures and Essays（1879）第二卷第 177–211 页的版本；文首先刊于 Contemporary Review，1877 年 1 月。[2]
      argument: >-
        若宗教信仰要在知识论上得到辩护，按 Clifford 的标准，辩护只能来自与确信程度相称的证据，而不能来自真诚、安慰或童年养成的习惯。船主的例子要说明的是：真诚本身不够；若这份真诚是靠避开调查「偷来的」，则即使后来证明船是适航的，他当时也没有权利那样相信。[2]
        把原则推广到一般信念之后，禁令变得非常强：错的不是「相信了假的东西」，而是「在证据不足时相信」。因此，一个把怀疑压下去、回避反对书籍与人物、并把扰乱性提问视为不虔诚的人，其生活被写成对人类的长期罪过——即便他从未觉得自己在作恶。[2]
        对原问题而言，这一侧可以解释部分轻蔑态度的知识论来源：在证据主义者看来，信仰若意味着在证据不够时仍坚持，那就不是「尚未探索的土地」，而是对一种公共认识义务的放弃。它并不能证明所有宗教信仰都必然证据不足，但它把举证责任放在信者一边。
      quotes:
      - text: >-
          To sum up: it is wrong always, everywhere, and for anyone, to believe
          anything upon insufficient evidence.
        text_zh: 总而言之：无论何时、何地、对任何人，依据不充分的证据去相信任何事情，都是错误的。
        attribution: William Kingdon Clifford，The Ethics of Belief
        locator: 第一节 “The Duty of Inquiry” 的收束句；Wikisource 所刊 Lectures and Essays（1879）第二卷文本
        ref: 2
      - text: >-
          If a man, holding a belief which he was taught in childhood or persuaded of
          afterwards, keeps down and pushes away any doubts which arise about it in
          his mind, purposely avoids the reading of books and the company of men that
          call in question or discuss it, and regards as impious those questions which
          cannot easily be asked without disturbing it—the life of that man is one long
          sin against mankind.
        text_zh: 若一个人持有童年所学或事后被说服接受的信念，把心中生起的任何怀疑压下去、推开，有意避开那些质疑或讨论该信念的书籍与人们的交往，并把那些一经提出便不免扰乱该信念的问题视为不虔诚——则此人的一生，是对人类的一项长期罪过。
        attribution: William Kingdon Clifford，The Ethics of Belief
        locator: 紧随上述总则之后的段落；第一节 “The Duty of Inquiry”
        ref: 2
    - position: 当一个宗教假设构成真正的、且按其本性无法仅靠理智裁定的选项时，激情本性必须并且可以合法地作出决定；要求此时仍「暂停判断」，本身并不是中立的
      consensus_role: 对过度证据主义最著名的实用/意志主义反驳之一
      evidence:
        label: 经典讲演文本，属于规范与心理学论证，而非对宗教命题的经验证实
        note: >-
          James 明确把讨论放在「独断」的地基上，即设定有真理、并且我们的心智注定要达到它，从而把系统的哲学怀疑论暂时放在一边。[3]
          他的许可是有条件的：选项必须是真正的，并且「按其本性」无法在理智上决定；对已被理智判定的事实，他否认意志可以随意改写。[3]
          因此，这一辩护能走多远，取决于某一具体宗教信仰是否真的满足「真正的选项」以及「理智无法决定」这两个前提——这不能由讲演本身普遍担保。
      holders:
      - name: William James
        identity: 美国哲学家与心理学家。《The Will to Believe》作者。文中自称把这篇讲演带到听众面前，作为对在宗教事务上采取相信态度之权利的辩护；Wikisource 与 Project Gutenberg 均提供该文集的公开文本。[3]
      argument: >-
        James 并不否认 Clifford 听起来「健康」，甚至说其文风有时过于雄健感人；他要争的是，这条禁令被用到了它不能单独统治的地方。[3] 文章开头就把目标说成：为我们有权利在宗教事务上自愿采取相信态度作辩护，即使仅仅逻辑的理智尚未被强制。[3]
        关键装置是「真正的选项」。若两个假设对你都是死的，或你可以用回避取消选择，或事情无足轻重，证据主义式的暂停判断往往代价很低。可一旦选项是活的、强迫的、重大的，而且按其本性无法在理智上决定，则「让问题悬着」并不比「是」或「否」更少激情，也带着失去真理的同样风险。[3]
        宗教假设在 James 的处理中被说得相当宽泛：它至少断言最美好的事物更为永恒，并且我们若相信这一宗教真理，即便现在也会更好。若这两个分支事实上为真，则是否相信就不再是对一件已完结的理智题目的冷处理。[3] 这一侧为宗教信仰提供的辩护，因此不是「已经证明为真」，而是「在真正的选项面前，等待更多证据并不是唯一合法的认识态度」。
        对原问题中被轻视的信者而言，James 可以提供的不是一块免战牌，而是一种反问：批评者以为自己只是在「按证据办事」，但在某些选项上，拒绝相信本身也已经是一种会带来损失的激情决定。
      quotes:
      - text: >-
          The thesis I defend is, briefly stated, this: Our passional nature must, and
          lawfully may, decide an option between propositions, whenever it is a genuine
          option that cannot by its nature be decided on intellectual grounds; for to say,
          under such circumstances, “Do not decide but leave the question open,” is
          itself a passional decision, just like deciding “yes” or “no,” and is attended
          with the same risk of losing the truth.
        text_zh: 我所辩护的论题，简言之是这样的：每当一个真正的选项按其本性无法在理智根据上被决定时，我们的激情本性必须、并且可以合法地在命题之间作出决定；因为在这种情况下，说「不要决定，让问题悬着」，本身就是一种激情的决定，正像决定「是」或「否」一样，并且带着同样的失去真理的风险。
        attribution: William James，The Will to Believe
        locator: 文中以 “The thesis I defend is, briefly stated, this” 引出的论题陈述；Wikisource 文本
        ref: 3
      - text: >-
          I have brought with me to-night something very like a sermon on justification
          by faith to read to you—I mean an essay in justification of faith, a defense of
          our right willfully to adopt a believing attitude in religious matters, in spite
          of the fact that our merely logical intellect may not have been coerced.
        text_zh: 今晚我带来的，很像一篇关于「因信称义」的讲道——我是说一篇为信仰作辩护的文章，为我们有权利在宗教事务上自愿采取一种相信的态度作辩护，尽管我们仅仅逻辑的理智可能尚未被强制。
        attribution: William James，The Will to Believe
        locator: 开篇说明文章旨趣的段落；Wikisource 文本
        ref: 3
    - position: 对上帝的信念不必从其他命题推论出来也可以是恰当基本的；这并不使它变成没有根据或任意的，因此宗教信仰可以在不满足古典证据主义的情况下仍是理性的
      consensus_role: 20 世纪后期改革宗知识论的核心主张，是对证据主义结构本身的挑战
      evidence:
        label: 已打开的 1981 年期刊论文；后续专著仅按 SEP 述及，不引页码
        note: >-
          Plantinga 1981 年的论文是哲学论证，旨在反驳「有神信念只有在有充分命题证据时才理性」这一共同前提，并说明改革宗知识论不必接受「任何信念都可以是基本的」。它并不提供对上帝存在的新的经验证明，也不试图在这篇短文里给出完备的恰当基本性标准。[4]
          作者当时署于 Calvin College。他后来以 warrant（保证）和 sensus divinitatis 等概念在 *Warranted Christian Belief*（2000）中扩展模型；这些后来的细节本次未打开全书，只在 SEP 综述中被提及，故不引用其页码或原句。[5][6]
      holders:
      - name: Alvin Plantinga
        identity: '《Is Belief in God Properly Basic?》（Noûs, 1981）作者。论文标题下将单位署为 Calvin College。[4]'
      argument: >-
        Plantinga 要移动的不是某条证据的权重，而是整幅关于「何谓理性信念」的图画。他指出，证据主义的批评者与自然神学的辩护者都同意：只有具备充分证据，有神信念在理智上才可接受。更精确地说，一个人只有在知道或理性地相信某些支持该命题的其他命题、并据此相信它时，才是理性的。[4]
        若古典基础主义是对的，上帝存在确实很难成为基本信念。但他认为，把恰当基本性限于自明、不可纠正或对感官明显，并不是必要的；这一限制本身就站不住。于是，「对上帝的信念不是恰当基本的」就不能再靠那幅旧图画来维持。剩下的问题变成：若有人把有神信念当作基本的，他是否就得承认几乎任何信念——例如对「伟大的南瓜」的信念——也可以是恰当基本的？Plantinga 的回答是否定的。改革宗知识论者对自己的例证负责，而不必符合反对者的例证；他还可以指出相关差别，例如与 Calvin 一样认为上帝在人里面放置了一种在世界中看见其作为的自然倾向，而并不存在关于「伟大的南瓜」的类似倾向。[4]
        结论段把三点收在一起：自明、不可纠正或对感官明显，不是恰当基本性的必要条件；主张对上帝的信念是恰当基本的，并不等于主张它没有根据、是任意的或缺少证成情境；即使还没有一套完备标准，也不必把几乎任何信念都当成恰当基本的。[4]
        对原问题而言，这一侧提供的辩护是结构性的：信仰不必先通过 Clifford 式的证据审查才算理智上可尊重。它仍然必须面对已知的反驳，并且「恰当基本」不等于「不可批评」。但它阻断了那句最常见的轻蔑——「你没有证据，所以你的信念从一开始就不合格」。
      quotes:
      - text: >-
          These two groups unite in holding that theistic belief is rationally acceptable
          only if there is sufficient evidence for it. More exactly, they hold that a person
          is rational or reasonable in accepting theistic belief only if she has sufficient
          evidence for it—only if, that is, she knows or rationally believes some other
          propositions which support the one in question, and believes the latter on the
          basis of the former.
        text_zh: 这两类人一致认为，有神信念只有在有充分证据时才是理性上可接受的。更精确地说，他们主张：一个人只有在拥有充分证据时——也就是说，只有在她知道或理性地相信某些支持该命题的其他命题、并据此相信后者时——在接受有神信念上才是理性或合理的。
        attribution: Alvin Plantinga，Is Belief in God Properly Basic?
        locator: Noûs 15(1), 1981, 第 41 页，开篇
        ref: 4
      - text: >-
          By way of conclusion then: being self-evident, or incorrigible, or evident to
          the senses is not a necessary condition of proper basicality. Furthermore, one
          who holds that belief in God is properly basic is not thereby committed to the
          idea that belief in God is groundless or gratuitous or without justifying
          circumstances. And even if he lacks a general criterion of proper basicality,
          he is not obliged to suppose that just any or nearly any belief—belief in the
          Great Pumpkin, for example—is properly basic.
        text_zh: 作为结论：自明、不可纠正、或对感官明显，并不是恰当基本性的必要条件。此外，主张对上帝的信念是恰当基本的人，并不因此就得承认：对上帝的信念是没有根据的、任意的、或缺少证成情境的。即使他还缺少一套关于恰当基本性的普遍标准，他也并无义务假定：随便什么或几乎随便什么信念——例如对「伟大的南瓜」的信念——都是恰当基本的。
        attribution: Alvin Plantinga，Is Belief in God Properly Basic?
        locator: Noûs 15(1), 1981, 第 51 页，结论段
        ref: 4
    open_parts: >-
      三种立场在「什么算证据」「暂停判断是否中性」「基本信念如何避免任意性」上仍然对立，当代哲学没有形成统一的结算。[5][6]
      James 的辩护依赖「真正的选项」与「理智按其本性无法决定」；某一具体宗教主张是否满足这些条件，不能由这篇讲演自动给出，也容易随当事人的文化与教育背景而变化。[3]
      Plantinga 1981 年的论文并没有完整给出恰当基本性的标准，他自己也把这写成仍可暂付阙如的一点；后来以 warrant 与 sensus divinitatis 展开的模型，需要直接打开《Warranted Christian Belief》等书才能核对，本文不作转引。[4][5]
      原问题还包含一层社会学与心理上的轻蔑感受。哲学上的证据主义可以解释其中一部分知识论来源，但不能单独解释「为什么是现在、为什么以这种方式表现」；那需要思想史或经验研究，不在本次打开的文本范围内。[1]
      Locke 等更早的证据主义表述，以及其他宗教传统中的信仰模型，只有在打开相应原文后才能纳入；本文没有把它们写成已核对的论据。
    references:
    - id: 1
      citation: lukuss (2018). How can religious faith be epistemically justified? Philosophy Stack Exchange.
      url: https://philosophy.stackexchange.com/questions/50288/how-can-religious-faith-be-epistemically-justified
    - id: 2
      citation: 'Clifford, W. K. (1877/1879). The ethics of belief. In Lectures and essays (Vol. 2, pp. 177–211). London: Macmillan. (First published in Contemporary Review, January 1877.)'
      url: https://en.wikisource.org/wiki/The_Ethics_of_Belief
    - id: 3
      citation: 'James, W. (1896/1897). The will to believe. In The will to believe and other essays in popular philosophy.'
      url: https://en.wikisource.org/wiki/The_Will_to_Believe
    - id: 4
      citation: 'Plantinga, A. (1981). Is belief in God properly basic? Noûs, 15(1), 41–51.'
      url: https://www.andrewmbailey.com/ap/Belief_in_God_Properly_Basic.pdf
    - id: 5
      citation: 'Bishop, J., & McKaughan, D. J. (2023). Faith. In E. N. Zalta & U. Nodelman (Eds.), The Stanford Encyclopedia of Philosophy (substantive revision December 9, 2023).'
      url: https://plato.stanford.edu/entries/faith/
