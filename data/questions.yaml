        McCarthy, J., Minsky, M. L., Rochester, N., & Shannon, C. E. (1955, August 31). A proposal for the Dartmouth summer research project on artificial intelligence. 本次打开并核对的是 John McCarthy 在 Stanford 站点发布的 HTML 文本：https://www-formal.stanford.edu/jmc/history/dartmouth/dartmouth.html 。另下载了 Computer History Museum 对原件的扫描件（19 页，HTTP 200），但引文以该 HTML 文本为准。
