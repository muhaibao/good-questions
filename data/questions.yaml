        OpenAI Help Center. Why does ChatGPT say “Context window full” or “Chat memory full”? 本次按 2026-11-23 打开的页面文本核对。
      url: https://help.openai.com/en/articles/20001639-why-does-chatgpt-say-context-window-full-or-chat-memory-full
    - id: 6
