- id: 2026-11-23-ai-programmable
  date: '2026-11-23'
  category: ai
  title_zh: 面向最终用户的应用，还会真正可编程吗？如果会，该怎么实现？
  title_en: Will end-user applications ever be truly programmable? If so, how?
  commentary: >-
    当常用软件从可改的工具变成「防弹玻璃」后的服务，用户是更轻松了，还是失去了把工具弯成自己思维形状的能力？这个问题问的不是要不要多几个插件，而是个人计算一度许诺过的那种可塑性能不能回来。
  source_name: Patrick Collison — Questions
  source_url: https://patrickcollison.com/questions
  author: Patrick Collison
  source_type: curated
  tags:
  - 终端用户编程
  - 个人计算
  - Smalltalk
  - 可塑性软件
  - 大语言模型
  answer:
    format: scholarly
    reviewed_at: '2026-11-23'
    consensus:
      label: >-
        终端用户应当能够改写自己的工具，这一理想在个人计算的经典文献里很明确，在表格、脚本和宏里也从未完全消失；但 Collison 所指出的趋势——移动与网页应用日益运转在「防弹玻璃」之后——与该理想之间的紧张，并没有一个被普遍接受的技术解决答案。用自然语言驱动代码生成是近年一条真实的新路径，现有研究表明它并没有自动取消「如何把意图说成系统能执行的话」这一门槛
      note: >-
        Collison 的问题清单把 Emacs、Smalltalk、Genera 和 VBA 写成可塑性终端用户计算的体现，并判断今天的终端用户软件日益运转在防弹玻璃之后，在移动和网页这些增长领域尤其如此；他还写下「终端用户计算正变得不像一辆自行车，而更像一条供心智乘坐的单轨」。[1]
        这是一份个人问题清单中的评论，不是调查或受控实验；「日益」是作者的判断，本文不加统计外推。
        Kay 与 Goldberg 在 1977 年把 Smalltalk 和「interim Dynabooks」写成一种人人可拥有的个人动态媒介，并强调儿童也能写出做认真事情的程序。[2]
        Ko 等人 2011 年的综述则指出，今天大多数程序并非由职业软件开发者写出，并给出终端用户编程的一个操作性定义；他们同时强调，这些用户仍然面对设计、测试与调试等软件工程质量问题。[3]
        Liu、Sarkar 等人 2023 年的 CHI 论文承认，代码生成大模型把自然语言映射为代码，使「用英语来编程」成为一种可实现的前景，但也表明：只有一小部分自然说法能有效引导生成，非专家必须面对 abstraction matching 的困难。[4]
    summary: >-
      Patrick Collison 在自己的问题清单里问：面向最终用户的应用，还会真正可编程吗？如果会，该怎么实现？[1] 他把 Emacs、Smalltalk、Genera 和 VBA 看作同一种设想的化身：若应用不按你的需要工作，你可以比较容易地改它或扩展它。他接着写到，今天的终端用户软件却日益运转在防弹玻璃之后，在移动应用和网页应用这些增长领域里尤其明显；不但越来越难改应用逻辑，就连直接操作自己的数据也变得更难。他举的对比是：用 Visual Basic 给 Outlook 写一段日历分析脚本很容易，对 Google Calendar 做同一件事则非常费事。[1]
      他把这一转变压缩成一句判断：终端用户计算正变得不像一辆自行车，而更像一条供心智乘坐的单轨。[1] 后果是人们越来越需要针对每一领域的专用软件，而不是用通用工具去处理图表和数据。他并不把专用工具说成纯然的退步——它们可以最大限度地提高易用性，并分摊复杂、专门功能的成本——但宏和浏览器插件的流行，在他看来强烈表明：用户是聪明的，并且想要更多控制。[1] 问题的收束是：我们是否该放弃早先那种赋能用户的设想，还是有可能达到一种更好的均衡？[1]
      这一提问有一条很长的前史。Kay 与 Goldberg 在 Xerox PARC 的 Learning Research Group 中，把梦想结晶为一种笔记本大小、人人可拥有、几乎能处理主人全部信息相关需求的个人动态媒介（Dynabook），并为此设计了 Smalltalk 语言、实现于他们称为「interim Dynabooks」的小型计算机上。[2] 他们把计算机写成一种主动的「元媒介」：它能回应询问和实验，使信息可以与学习者形成双向对话；在他们看来，除个别教师这一媒介外，这种性质从未有过。[2] 他们还特别写到，以儿童为用户时，孩子们确实能写出做认真事情的程序。[2]
      学术综述表明，终端用户编程并没有随着「防弹玻璃」而消失，但主战场往往不在 Collison 所担心的那些封闭应用里。Ko 等人开篇即写：今天大多数程序并非由职业软件开发者写出，而是由其他领域的专家为了自己需要计算支持的目标而写出。[3] 他们把终端用户编程定义为：编程的主要目的，是为了个人使用该程序的结果，而不是供有不同需求的大量用户使用。[3] 职业开发者领取报酬是为了交付并长期维护软件；终端用户写程序，则是为了支持自己领域里的某个目标。[3] 换句话说，「最终用户会不会编程」在表格、脚本和领域工具里一直在发生；Collison 问的是，面向消费级应用的那种可塑性，会不会在移动和网页主导的界面里回来。
      近年一条新的候选答案是：让自然语言成为编程界面。Liu、Sarkar 等人写道，代码生成大模型把自然语言映射为代码；若终端用户程序员改用英语这样已知的自然语言，表面上几乎不必有意识地投入学习，而这一前景可以通过大模型来实现。[4] 但他们随即指出，在近乎无穷的自然说法里，只有一小部分能有效引导代码生成；对非专家的终端用户程序员来说，学会这一点就是 abstraction matching 的挑战。[4] 他们在电子表格数据分析的场景里做了 24 人对照的出声思维实验，并认为：把生成的代码再翻译回可预测的自然语言，有助于用户理解模型的范围、能力，以及要有效使用它所需的那种语言。[4] 因此，大模型给出了一条「如何再变得可编程」的新路径，但它并没有自动兑现「真正可编程」，反而把新的表述门槛放到了明处。
    definitions:
    - term: 可塑性的终端用户计算（malleable end-user computing）
      text: >-
        Collison 用来称呼 Emacs、Smalltalk、Genera 和 VBA 所体现的那种设想：如果应用不做你想做的事，你可以比较容易地调整或扩展它，使之适合自己的目的。[1] 这与他把当今许多移动和网页应用描述为运转在「防弹玻璃」之后的状态相对。
    - term: 终端用户编程（end-user programming）
      text: >-
        Ko 等人给出的定义是：编程以取得一个程序的结果，而该结果主要供个人使用，而不是供有不同需求的大量用户使用。[3] 关键不在于使用哪种语言，而在于意图：程序是达到某个自身目标的手段。他们并指出，这一短语由 Nardi（1993）在对办公场所电子表格使用的研究中推广。[3]
    - term: 抽象匹配（abstraction matching）
      text: >-
        Liu、Sarkar 等人用来描述自然语言编程里的核心困难：当用户已有明确意图时，如何从近乎无穷的自然说法里选出一句，使自己相信系统会把它可靠地映射为满意的解。[4] 这需要把说法匹配到系统能执行的那一层粒度、细节、用词和语法。
    milestones:
    - year: '1977'
      name: Kay 与 Goldberg 发表《Personal Dynamic Media》
      explanation: >-
        在 IEEE Computer 上阐述 Dynabook 设想，并介绍已在 Smalltalk 中写出的各类系统，作为个人计算媒介的内核图像；文中把计算机写成可回应询问与实验的主动「元媒介」。[2]
    - year: '2011'
      name: Ko 等人综述终端用户软件工程
      explanation: >-
        在 ACM Computing Surveys 中界定 End-User Software Engineering，总结终端用户在需求、设计、复用、测试和调试上面临的质量问题，并给出终端用户编程的操作性定义。[3]
    - year: '2023'
      name: 用代码生成大模型做终端用户编程的实证研究
      explanation: >-
        Liu、Sarkar 等人在 CHI 2023 报告：自然语言到代码的前景是真实的，但非专家必须克服 abstraction matching；他们提出把代码再译回可预测自然语言的 grounded abstraction matching，并做了 24 人对照实验。[4]
    views:
    - position: 终端用户计算曾经允许把应用改成自己的工具，但在移动和网页主导的增长领域里，软件日益被放在「防弹玻璃」之后；用户仍想要控制，只是通道变窄了
      consensus_role: 这是 Collison 本人的诊断，不是一项已有统计验证的行业共识；它把一种被广泛感觉到的封闭化说成了明确的问题
      evidence:
        label: 个人问题清单中的评论与举例，而非调查或受控研究
        note: >-
          文本来自 patrickcollison.com/questions，作者自署为 Patrick Collison，并欢迎把有趣阅读寄到 patrick@collison.ie。[1]
          「日益」「尤其如此」「强烈表明」都是作者的定性判断；本次未打开可核对的产业统计来支撑或反驳「越来越难改应用逻辑」的幅度。
          Emacs、Smalltalk、Genera、VBA、Outlook 与 Google Calendar 是作者给出的例证，本文只按原页转述，不另行增补未核对的产品史细节。
      holders:
      - name: Patrick Collison
        identity: 页面标题为 “Questions · Patrick Collison”，文首写明这些是他认为有意思的一些问题，并给出邮箱 patrick@collison.ie。本次只依据该页已打开文本确定身份，不添加页面未写明的职务或机构。[1]
      argument: >-
        Collison 先给出一条对照。一侧是 Emacs、Smalltalk、Genera 和 VBA：它们体现了一种可塑性的终端用户计算，若应用不合用，你就改它或扩展它。[1] 另一侧是今天的情形：终端用户软件日益运转在防弹玻璃之后，在移动和网页这些增长领域尤其明显；不但更难改逻辑，也更难直接操作自己的数据。Visual Basic 加 Outlook 可以很快写出日历分析，Google Calendar 上做同样的事却非常费事。[1]
        「自行车 / 单轨」的比喻把利害说得更尖锐。自行车是你可以转向、拆改、用自己的力去骑的工具；单轨则把你送向预定方向，平稳，但你不能把轨道掰弯。[1] 他承认专用软件并非全无好处：领域工具可以提高易用性，并分摊复杂功能的成本；他也写到，Sublime 内置的 ⌘-T 比每一个第三方 Emacs 包都更好用。尽管如此，宏和浏览器插件的流行「强烈表明」用户聪明，并且想要更多控制。[1]
        所以他真正留下的，不是一句怀旧，而是一个未决的设计问题：是否该放弃早先那种赋能用户的设想，还是有可能达到更好的均衡？[1] 后文的两条线索——个人动态媒介的历史，以及自然语言编程的近况——都是在回应「如果会，该怎么实现」。
      quotes:
      - text: >-
          Emacs, Smalltalk, Genera, and VBA embody a vision of malleable end-user computing: if the application doesn't do what you want, it's easy to tweak or augment it to suit your purposes. Today, however, end-user software increasingly operates behind bulletproof glass. This is especially true in the growth areas: mobile and web apps.
        text_zh: Emacs、Smalltalk、Genera 和 VBA 体现了一种可塑性终端用户计算的设想：如果应用不做你想做的事，你可以很容易地调整或扩展它，使之适合你的目的。然而在今天，终端用户软件日益运转在防弹玻璃之后。在增长领域中尤其如此：移动应用和网页应用。
        attribution: Patrick Collison，Questions
        locator: 问题 “Will end-user applications ever be truly programmable? If so, how?” 下首段；https://patrickcollison.com/questions
        ref: 1
      - text: >-
          End-user computing is becoming less a bicycle and more a monorail for the mind.
        text_zh: 终端用户计算正变得不像一辆自行车，而更像一条供心智乘坐的单轨。
        attribution: Patrick Collison，Questions
        locator: 同一问题下单独成段的一句
        ref: 1
      - text: >-
          Still, despite these benefits, the popularity of macros and browser plugins strongly suggest that users are smart and want more control.
        text_zh: 尽管有这些好处，宏和浏览器插件的流行仍强烈表明：用户是聪明的，并且想要更多控制。
        attribution: Patrick Collison，Questions
        locator: 同一问题下讨论专用软件之后的一句（原文动词为 suggest，此处按网页逐字抄录）
        ref: 1
    - position: 「让非职业程序员也能改写自己的媒介」是个人计算的经典纲领，而且终端用户编程在表格和脚本中一直大规模存在；要恢复的不是「用户开始编程」这一事实，而是在封闭应用里重新获得那种可修改性
      consensus_role: 在人机交互与终端用户软件工程中被广泛采用的历史判断；它支持 Collison 的问题是有根的，但提醒我们：可编程性并未从计算里消失，只是往往不发生在他点名的那些消费级应用里
      evidence:
        label: 1977 年的一手宣言，以及 2011 年对终端用户软件工程的权威综述
        note: >-
          Kay 与 Goldberg 的文章是对 Xerox PARC 工作的展望与已实现系统的展示，不是对当今移动生态的预测。[2] 本次打开并核对的是 The New Media Reader 的重印本（标明原刊为 Computer 10(3):31–41, March 1977），引语页码按该重印本。
          Ko 等人的综述发表于 ACM Computing Surveys 43(3), Article 21 (2011)，是对既有研究的分类与概念澄清，并引用了 Scaffidi 等人关于电子表格与数据库使用者数量的估计；本次未打开 Scaffidi 等人的原始报告，故不转写其中的具体数字，只转述综述正文中已写出的对比。[3]
      holders:
      - name: Alan Kay、Adele Goldberg
        identity: >-
          《Personal Dynamic Media》（Computer, 1977）作者。文首写明他们属于 Xerox Palo Alto Research Center 的 Learning Research Group，并介绍 Smalltalk 及所谓 interim Dynabooks。[2]
      - name: Amy J. Ko 等
        identity: >-
          《The State of the Art in End-User Software Engineering》（ACM Computing Surveys, 2011）作者。通讯作者 A. J. Ko 的地址署为 University of Washington 的 The Information School；文首还列出 Microsoft Corporation、University of Cambridge、Oregon State University、MIT Media Laboratory、Carnegie Mellon University 等合作者单位。[3]
      argument: >-
        若把 Collison 的问题只读成对旧编辑器的怀念，就会看漏它真正接上的那条线。Kay 与 Goldberg 要的不是更多专业程序员，而是一种人人可拥有的个人动态媒介：一种笔记本大小的「知识操纵器」，有能力处理主人几乎全部与信息有关的需求。[2] 为此他们设计了 Smalltalk，并在小型计算机上实现。更关键的是他们对媒介本身的主张：计算机若能充分提供嵌入与查看信息的方法，就可以成为所有其他媒介；而且这种新的「元媒介」是主动的，能回应询问和实验，使信息把学习者卷入双向对话。他们写到，除个别教师外，这种性质从未有过，其意涵广阔而难以抗拒。[2] 以儿童为用户时，他们报告：孩子们确实能写出做认真事情的程序——用符号指称对象，包含循环与递归，并在选择策略之前做相当程度的设想，还要交互地发现和去掉想法里的「虫子」。[2]
        三十多年后，Ko 等人的综述把这一现象写成已经非常普遍的实践。他们开篇说：今天大多数程序并非由职业软件开发者写出，而是由其他领域的专家，为了自己需要计算支持的目标而写出，例如教师为节省时间而写评分表格。[3] 终端用户与职业开发者的差别首先在目标：后者受雇去交付并维护软件；前者写程序是为了支持自己领域里的某个目标。编程经验是另一回事，系统管理员或科研人员即使技能很高，也可能只把编程当作完成主业的手段。[3] 他们随即强调：尽管优先级不同，终端用户仍然面对选择接口、测试、验证和调试等软件工程问题，而且错误可以造成严重后果。[3]
        把两份文献和 Collison 的观察放在一起，问题会变得更精确。终端用户编程并没有消失，它大量发生在表格、脚本和领域工具里；Kay 所设想的那种「媒介本身可被主人改写」的理想，也并没有从研究议程上被宣布取消。真正收紧的，是 Collison 所说的那些增长中的消费级应用：它们把逻辑和数据放在玻璃后面，使「改应用」不再是默认能力。于是「还会真正可编程吗」问的不是用户会不会写公式，而是那种可塑性会不会重新成为普通应用的一部分。
      quotes:
      - text: >-
          Several years ago, we crystallized our dreams into a design idea for a personal dynamic medium the size of a notebook (the Dynabook) which could be owned by everyone and could have the power to handle virtually all of its owner’s information-related needs.
        text_zh: 数年前，我们把梦想结晶为一个设计设想：一种笔记本大小的个人动态媒介（Dynabook），可以被每一个人拥有，并有能力处理其主人几乎全部与信息有关的需求。
        attribution: Alan Kay 与 Adele Goldberg，Personal Dynamic Media
        locator: The New Media Reader 重印本第 393 页；原刊 Computer 10(3), 1977
        ref: 2
      - text: >-
          Moreover, this new “metamedium” is active—it can respond to queries and experiments—so that the messages may involve the learner in a two-way conversation. This property has never been available before except through the medium of an individual teacher. We think the implications are vast and compelling.
        text_zh: 而且，这一新的「元媒介」是主动的——它能回应询问和实验——从而使信息可以把学习者卷入一场双向对话。除了通过个别教师这一媒介之外，这种性质以前从未有过。我们认为其意涵是广阔而令人难以抗拒的。
        attribution: Alan Kay 与 Adele Goldberg，Personal Dynamic Media
        locator: The New Media Reader 重印本第 393–394 页
        ref: 2
      - text: >-
          Most programs today are written not by professional software developers, but by people with expertise in other domains working towards goals for which they need computational support.
        text_zh: 今天的大多数程序并非由职业软件开发者写出，而是由在其他领域拥有专长的人写出，他们是为了那些需要计算支持的目标而工作。
        attribution: Ko 等，The State of the Art in End-User Software Engineering
        locator: ACM Computing Surveys 43(3), Article 21，第 21:1 页，摘要首句
        ref: 3
      - text: >-
          We then define end-user programming as “programming to achieve the result of a program primarily for personal, rather public use.”
        text_zh: 我们随即将终端用户编程定义为「编程以取得一个程序的结果，而该结果主要供个人使用，而非供公开使用」。
        attribution: Ko 等，The State of the Art in End-User Software Engineering
        locator: 第 21:4 页，§2.2 End-User Programming（原文在 rather 与 public 之间未写 than，此处按 PDF 逐字抄录）
        ref: 3
    - position: 大语言模型使自然语言成为一种真实的编程界面，但这并不等于终端用户已经「真正可编程」；用户仍须学会如何把意图说成模型能可靠执行的话
      consensus_role: 近年HCI与代码生成研究中的一条重要新路径；它回应了「如果会，该怎么实现」，但现有实证把它写成仍待设计的交互问题，而不是已经完成的替代方案
      evidence:
        label: CHI 2023 的系统设计与 24 人对照出声思维实验
        note: >-
          论文聚焦电子表格中的数据分析，使用 Codex 把自然语言查询映射为 Python 并执行；不能自动外推到所有消费级移动或网页应用，也不能代表此后所有代码模型的能力。[4]
          样本为 n=24 的实验室研究，比较的是 grounded abstraction matching 与一种基于既有查询组织原则的未锚定做法；作者报告 grounded 方法改善了终端用户对模型范围、能力和所需语言的理解，以及从系统失败中恢复的能力，但这不是对「应用将普遍可编程」的因果证明。[4]
          本次打开的是 arXiv:2304.06597 的 PDF，文内给出 CHI ’23 与 DOI 10.1145/3544548.3580817；未另打开 ACM 官方 HTML。
      holders:
      - name: Michael Xieyang Liu、Advait Sarkar、Carina Negreanu、Benjamin Zorn、Jack Williams、Neil Toronto、Andrew D. Gordon
        identity: >-
          CHI 2023 论文《“What It Wants Me To Say”: Bridging the Abstraction Gap Between End-User Programmers and Code-Generating Large Language Models》作者。Liu 署名为 Microsoft Research 与 Carnegie Mellon University，Sarkar 署名为 Microsoft Research、University of Cambridge 与 University College London，二人标注同等贡献；其余作者署为 Microsoft Research（英国或美国，以文首为准）。[4]
      argument: >-
        Collison 问「如果会，该怎么实现」。一条晚近的回答是：不必再让用户进入 VBA 或 Lisp，而是让他们用已经会的自然语言来驱动应用。Liu 等人把这一前景写得很明确：编程语言是极强的用户界面，但对缺少计算训练的非专家终端用户程序员来说也极难学习；若他们改用英语这样的自然语言，这种语言用户已经知道，表面上几乎不必有意识地投入学习或努力，而这一前景可以通过把自然语言映射为代码的大模型来实现。[4]
        他们立刻加上限制。在近乎无穷的自然说法里，只有一小部分能有效引导代码生成；对非专家来说，学会这一点就是 abstraction matching 的挑战。[4] 实验室和田野研究已经表明，自然语言与代码之间的映射被理解得很差，生成的代码可能包含隐蔽错误，并且可能难以验证。[4] 换句话说，玻璃后面并没有因为多了一个对话框就自动重新变得可塑；用户仍然必须摸清系统愿意执行的那一层说法。
        作者提出的设计对策，不是假装这一层不存在，而是把系统已经执行的动作再翻译回一种系统化、可预测的自然语言，给用户一个可编辑的、接地的例子，说明「要稳定地调用同一动作，该怎么说」。[4] 在电子表格数据分析的 24 人对照实验中，他们发现这种锚定做法改善了终端用户对代码生成模型之范围与能力的理解，以及要有效使用它所需要的那种语言。[4]
        对原问题而言，这是一条真实的实现路径，也是一份尚未完成的答案。它表明「真正可编程」可以不再只等于「打开脚本编辑器」，但用户要能把自己的意图说成系统听得懂、且自己事后还能检验的话，仍然需要新的界面与学习。Collison 所担心的数据与逻辑封闭，也不会仅仅因为有了对话界面就自动解除。
      quotes:
      - text: >-
          Code-generating large language models map natural language to code. However, only a small portion of the infinite space of naturalistic utterances is effective at guiding code generation. For non-expert end-user programmers, learning this is the challenge of abstraction matching.
        text_zh: 代码生成大模型把自然语言映射为代码。然而，在无穷的自然说法空间里，只有一小部分能有效引导代码生成。对非专家的终端用户程序员来说，学会这一点就是抽象匹配的挑战。
        attribution: Liu、Sarkar 等，“What It Wants Me To Say”
        locator: 摘要首三句；CHI ’23，arXiv:2304.06597
        ref: 4
      - text: >-
          What if end-user programmers could instead use a natural language such as English? Natural language is already known to the user, and ostensibly requires little conscious investment of effort or learning. This prospect can be realized through large language models: deep neural networks using the transformer architecture, trained on large corpora, fine-tuned to generate code from natural language.
        text_zh: 倘若终端用户程序员改为使用英语这样的自然语言，会怎样？自然语言是用户已经知道的，而且表面上几乎不需要有意识地投入努力或学习。这一前景可以通过大语言模型来实现：它们是使用 Transformer 架构、在大规模语料上训练、并被微调以由自然语言生成代码的深度神经网络。
        attribution: Liu、Sarkar 等，“What It Wants Me To Say”
        locator: 第 1 节 Introduction
        ref: 4
    open_parts: >-
      Collison 的核心问题仍然开放：消费级移动和网页应用会不会重新变得可塑，还是领域专用、不可改写的工具会继续占上风。[1] 本文没有打开关于应用平台政策、应用商店限制或开放 API 变迁的系统证据，因此不能把「防弹玻璃」写成已经完成的历史定律。
      终端用户编程的经典研究主要观察电子表格、脚本和领域工具；[3] 这些实践的存在，并不能直接回答「Outlook 式的可脚本性是否会回到 Google Calendar 一类的封闭服务」。
      自然语言编程目前的实证，多集中在代码生成、电子表格或特定工作流，样本也相对较小。[4] 它是否能在不暴露底层数据与逻辑的前提下，恢复 Collison 所说的那种控制，仍然有待更多研究。大模型本身也会引入新的失败模式（隐蔽错误、难以验证、用户必须学习「它想让我说什么」），这些限制已被该论文指出，但尚未被写成已被克服的问题。[4]
      同一清单上相邻的问题还提到 “magic ink”；本次解答不把那一问题的文献并入本题。Bret Victor 的相关文章未用作本条参考文献。
    references:
    - id: 1
      citation: >-
        Collison, P. Questions. 其中条目 “Will end-user applications ever be truly programmable? If so, how?”. 本次按 2026-11-23 打开的页面文本核对。
      url: https://patrickcollison.com/questions
