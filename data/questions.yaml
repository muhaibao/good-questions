      url: https://msuweb.montclair.edu/~lebelp/SchumpeterChapter7.pdf
    - id: 3
      citation: 'Kaufman, H. (1976). Are government organizations immortal? Washington, DC: The Brookings Institution.'
      url: https://gwern.net/doc/sociology/1976-kaufman-aregovernmentorganizationsimmortal.pdf
    - id: 4
      citation: 'Buffett, W. E. (1990, March 2). Chairman’s letter — 1989. Berkshire Hathaway Inc.'
      url: https://berkshirehathaway.com/letters/1989.html

- id: 2026-11-23-sci-riemann
  date: '2026-11-23'
  category: science
  title_zh: 黎曼猜想是否成立？
  title_en: The Riemann Hypothesis
  commentary: >-
    素数的平均分布已被素数定理抓住，但偏离平均有多远，却被一条复平面上的直线管着——如果黎曼是对的。把「尚未证明」和「证据已经很多」同时说清楚，比把猜想说成即将被计算解决更重要。
  source_name: Clay Mathematics Institute — Millennium Problems
  source_url: https://www.claymath.org/millennium/riemann-hypothesis/
  author: Clay Mathematics Institute
  source_type: curated
  tags:
  - 黎曼猜想
  - 素数分布
  - 千禧年难题
  - 解析数论
  - ζ 函数
  answer:
    format: scholarly
    reviewed_at: '2026-11-23'
    consensus:
      label: >-
        这是一个尚未被证明的猜想，也是 Clay 数学研究所千禧年七题之一。大量数值验证和若干部分定理，构成了支持它为真的重要证据，但都不等于证明。官方陈述写明许多数学家视之为今日纯数学中最重要的未解问题之一，并判断现在已有相当多证据；本次未找到可核对的系统民意调查数字，因此不虚构「百分之多少的解析数论学家相信它」的比例
      note: >-
        Clay 官方页面把黎曼猜想陈述为：ζ 函数所有「非显然」的零点都是实部为 1/2 的复数；并写明这已对前 10,000,000,000,000 个解做过检查，但真正的证明才会阐明素数分布中的许多谜团。[1]
        Bombieri 撰写的官方问题陈述给出精确表述：非显然零点的实部等于 1/2；并写「在许多数学家看来」，这一猜想及其对一般 L 函数的推广，「可能是今日纯数学中最重要的未解问题」。[2]
        在证据一节，他承认过去存在怀疑（或许更多来自失败的证明尝试，而非坚实的启发式理由），但认为今天已经有相当多支持它的证据。[2]
        Conrey 在 2003 年的综述里也列出「相信 RH 的若干理由」，包括大规模数值检查和临界线上已证明的零点比例，并记载 Hardy 与 Littlewood 首先证明了 1/2 直线上有无穷多零点。[4]
        这些都是权威作者的定性判断，不是抽样调查。数值上，Clay 页面给出的是 10^13 这一公开数字；Platt 与 Trudgian 在 2020 年的 arXiv 预印本中声称，以区间算术做了严格核验，直到高度 3·10^12，覆盖最低的 12,363,153,437,138 个非显然零点。[1][5] 有限范围内的核验，无论做到哪一步，都不能取代对所有零点的证明。
    summary: >-
      Clay 数学研究所把黎曼猜想列为千禧年难题，并在条目页上用两句话点出它和素数定理的分工：素数定理决定素数的平均分布，黎曼猜想告诉我们偏离平均有多远。该猜想在 Riemann 1859 年的论文中提出，断言 ζ 函数所有「非显然」的零点都是实部为 1/2 的复数。[1]
      Bombieri 为 Clay 撰写的官方陈述把说法写精确。Riemann ζ 函数在半平面 Re(s)>1 由级数定义，并解析延拓到整个复平面；它在负偶数处有所谓平凡零点，其余零点则对应于一个整函数 ξ(t) 的零点。Riemann 猜想就是：ξ(t) 的所有零点都是实的；换成 ζ(s) 的语言，即非显然零点的实部等于 1/2。[2] Riemann 自己在 1859 年的论文里已经写出：在所述范围内确实找到了大约那么多的实根，「而且很可能所有的根都是实的」；他接着说，这里当然希望有一个更严格的证明，但在几次短暂而徒劳的尝试后，他暂时放下了这一寻找，因为对当时的主要目标似乎并不必要。[3][2]
      这一猜想之所以处于素数理论的中心，是因为它管着素数计数函数偏离其平均值的程度。Clay 页面把这一点写成与素数定理的对照。[1] Bombieri 写得更明确：黎曼猜想成立，等价于 π(x) 与对数积分 Li(x) 的偏差为 O(√x log x)；误差项也不能再改善很多，因为已知它会在两个方向上振荡到至少 Li(√x) log log log x 的量级（Littlewood）。若猜想失败，将在素数分布中造成严重混乱；单单这一点，就使它成为素数理论中主要的未决问题。[2] 关于平均分布本身，Conrey 记载：最后一步留给了 Hadamard 与 de la Vallée Poussin，他们在 1896 年彼此独立地证明 ζ(s) 在实部等于 1 处不取零，并由此推出高斯的猜想，也就是现在所称的素数定理。[4] 素数定理已经证明；黎曼猜想要回答的，是比平均值更精细的误差。
      支持猜想为真的证据是多方面的，但必须与证明分开。Bombieri 写明，尽管过去有过怀疑，今天已经有相当多证据：包括大范围的数值检验，以及「超过 40% 的非显然零点是单零点且满足黎曼猜想」（他在此处引用 Selberg、Levinson 与 Conrey 的工作）；他还认为，就启发式力量而言，有限域上代数簇的相应理论提供了最好的证据。[2] Conrey 把 Hardy 与 Littlewood 首先证明「1/2 直线上有无穷多零点」写进历史，并列出当时可见的数值结果（例如 van de Lune 对前 100 亿个零点的检查）作为「相信 RH 的理由」。[4] 更晚近，Platt 与 Trudgian 在 2020 年的预印本中报告：用区间算术严格核验了直到高度 3·10^12 的范围，并陈述定理：最低的 12,363,153,437,138 个非显然零点实部都是 1/2；他们同时强调，在缺乏证明的情况下，获得部分核验极为重要。[5] Clay 页面目前写的是前 10^13 个解已受检查。[1] 无论采用哪一则公开数字，有限个零点的核实都不能推出对全部零点的证明。
      因此，对「黎曼猜想是否成立」的审慎回答是：它仍是未证明的猜想；就其与素数分布的关系、以及已有的数值与部分解析证据而言，把它当作很可能为真的中心猜想，是官方陈述和重要综述中的主流态度；但证据再强，也不等于定理。本次没有打开任何可引用的学科民调，故不把这一态度换算成百分比。
    definitions:
    - term: 黎曼猜想（Riemann hypothesis）
      text: >-
        Bombieri 给出的正式表述是：ζ(s) 的非显然零点的实部等于 1/2。[2] 所谓非显然零点，是相对于位于负偶数 −2, −4, … 的平凡零点而言的其他零点。等价地，Riemann 引入的偶整函数 ξ(t) 的所有零点都是实的。[2] Clay 页面则用较非正式的话说：所有「非显然」零点都是实部为 1/2 的复数。[1]
    - term: 素数定理（Prime Number Theorem）
      text: >-
        关于素数平均分布的已证定理。Conrey 的历史叙述是：Hadamard 与 de la Vallée Poussin 在 1896 年彼此独立地证明 ζ(s) 在实部等于 1 时不取零，并由此推出高斯关于 π(x) 可用对数积分逼近的猜想，这一结果现在称为素数定理。[4] Clay 页面把它和黎曼猜想对举：前者决定平均分布，后者关乎对平均的偏离。[1] 本次未打开 1896 年的原始论文，上述历史脉络以 Conrey 已核对的综述为准。
    - term: 临界线（critical line）
      text: >-
        复平面上实部等于 1/2 的垂直直线。黎曼猜想断言，ζ 的所有非显然零点都位于这条线上。Conrey 记载，Hardy 与 Littlewood 首先证明这条线上已经有无穷多零点；这是一条真正的定理，但距离「全部零点都在这条线上」仍然很远。[4]
    milestones:
    - year: '1859'
      name: Riemann 提出猜想
      explanation: >-
        在提交柏林科学院的论文《Ueber die Anzahl der Primzahlen unter einer gegebenen Grösse》中，Riemann 给出与 ζ 函数零点相联系的素数计数公式，并表示很可能 ξ(t) 的所有根都是实的，同时承认这里需要更严格的证明。[3][2]
    - year: '1896'
      name: 素数定理被证明
      explanation: >-
        据 Conrey 的综述，Hadamard 与 de la Vallée Poussin 彼此独立地证明 ζ(s) 在实部为 1 处不取零，并由此推出素数定理。[4] 平均分布成为定理；更精细的误差项仍取决于黎曼猜想。[2]
    - year: '2000'
      name: Clay 千禧年问题官方陈述
      explanation: >-
        Bombieri 撰写《Problems of the Millennium: the Riemann Hypothesis》，给出猜想的精确表述，并综述其与素数分布的关系以及当时可见的证据（包括 van de Lune 等人对前 15 亿个零点的核验，以及超过 40% 的非显然零点已被证明在临界线上）。[2]
    - year: '2020'
      name: 大规模严格数值核验的一项报告
      explanation: >-
        Platt 与 Trudgian 在 arXiv:2004.09765v1 中声称，用区间算术严格核验了直到高度约 3·10^12 的范围，覆盖最低的 12,363,153,437,138 个非显然零点。[5] 本次未打开 2021 年《Bulletin of the London Mathematical Society》的期刊排印本，数字以该预印本为准。有限核验仍不是证明。
    views:
    - position: 黎曼猜想是一个关于 ζ 函数非显然零点实部的未证明陈述，其成立等价于素数计数函数对平均值的偏差被限制在大约 √x 的量级；若失败，将严重扰乱我们对素数分布的理解
      consensus_role: 对猜想内容及其数论后果的标准陈述，与 Clay 官方页面和 Bombieri 的正式文本一致
      evidence:
        label: 千禧年问题官方陈述、Riemann 1859 年论文的公开英译，以及综述中对素数定理的历史叙述
        note: >-
          Bombieri 的文本是 Clay 委托的官方问题描述，不是一篇给出新证明的研究论文；其中关于等价误差项和 Littlewood 振荡的陈述，是对已知解析数论结果的综述，本次未打开 Littlewood 的原始论文。[2]
          Riemann 的原句按 Wilkins 1998 年公开英译（并对照其德文转写）核对；Bombieri 对同一德文句另有英译，二者措辞略有不同，本文分别注明。[2][3]
          素数定理的 1896 年证明只通过 Conrey 的综述转述，未打开 Hadamard 与 de la Vallée Poussin 的原文。[4]
      holders:
      - name: Enrico Bombieri
        identity: 'Clay 千禧年问题官方陈述《Problems of the Millennium: the Riemann Hypothesis》署名作者 E. Bombieri。本次只依据该 PDF 文首署名确定其为此官方文本的作者，不添加文中未写明的职务或头衔。[2]'
      - name: Bernhard Riemann
        identity: 1859 年论文《Ueber die Anzahl der Primzahlen unter einer gegebenen Grösse》的作者。Clay 页面称其为德国数学家 G.F.B. Riemann（1826–1866）。[1][3]
      - name: J. Brian Conrey
        identity: 《The Riemann Hypothesis》（Notices of the AMS, 2003）作者。文中作者介绍写明：J. Brian Conrey is director of the American Institute of Mathematics。[4]
      argument: >-
        先要分开两件已经不相同的事。素数的平均分布，按照 Conrey 的叙述，已由 1896 年的素数定理解决：Hadamard 与 de la Vallée Poussin 证明 ζ 函数在实部等于 1 的直线上不取零，并由此推出高斯的猜想。[4] Clay 页面随后指出，黎曼猜想要说的是另一层事实：偏离这一平均有多远。[1]
        Riemann 自己把猜想写得很克制。他估计了一定高度内 ξ(t) 的零点数目，并说在这些界限内的确大约找到了那么多实根，「而且很可能所有的根都是实的」；紧接着又希望有更严格的证明，但暂时放下了。[3] Bombieri 引用同一德文句，并把它翻译为 “it is very likely that all zeros are real”，然后给出今天的标准表述：ζ(s) 的非显然零点实部等于 1/2。[2]
        这一「很可能」之所以变成素数理论的中心问题，是因为零点的位置直接进入素数计数的显式公式。Bombieri 写明：猜想成立，等价于 π(x) = Li(x) + O(√x log x)；而误差项也不能再改善很多。[2] 他又写了一句更重的话：若黎曼猜想失败，将在素数分布中造成严重混乱；单单这一事实，就使它成为素数理论中主要的未决问题。[2] 官方页面的预告与此一致：若能证明它对每一个「有意思的」解都成立，将阐明素数分布中的许多谜团。[1]
        所以，本题首先不是「计算得够不够多」，而是一个尚未关闭的存在性命题：是否所有非显然零点都落在那条垂直线上。平均分布已经是定理；这条更精细的约束还不是。
      quotes:
      - text: >-
          The prime number theorem determines the average distribution of the primes. The Riemann hypothesis tells us about the deviation from the average. Formulated in Riemann’s 1859 paper, it asserts that all the ‘non-obvious’ zeros of the zeta function are complex numbers with real part 1/2.
        text_zh: 素数定理决定素数的平均分布。黎曼猜想告诉我们偏离平均有多远。它在 Riemann 1859 年的论文中提出，断言 ζ 函数所有「非显然」的零点都是实部为 1/2 的复数。
        attribution: Clay Mathematics Institute，Riemann Hypothesis 条目页
        locator: 页面开篇三句；https://www.claymath.org/millennium/riemann-hypothesis/
        ref: 1
      - text: >-
          Riemann hypothesis. The nontrivial zeros of ζ(s) have real part equal to 1/2.
        text_zh: 黎曼猜想。ζ(s) 的非显然零点的实部等于 1/2。
        attribution: 'E. Bombieri，Problems of the Millennium: the Riemann Hypothesis'
        locator: 第 1 页，正式陈述（PDF 将 1/2 排成叠式分数）
        ref: 2
      - text: >-
          The failure of the Riemann hypothesis would create havoc in the distribution of prime numbers. This fact alone singles out the Riemann hypothesis as the main open question of prime number theory.
        text_zh: 黎曼猜想一旦失败，将在素数分布中造成严重混乱。单单这一事实，就使黎曼猜想成为素数理论中主要的未决问题。
        attribution: 'E. Bombieri，Problems of the Millennium: the Riemann Hypothesis'
        locator: 第 4 页
        ref: 2
      - text: >-
          One now finds indeed approximately this number of real roots within these limits, and it is very probable that all roots are real. Certainly one would wish for a stricter proof here; I have meanwhile temporarily put aside the search for this after some fleeting futile attempts, as it appears unnecessary for the next objective of my investigation.
        text_zh: 人们现在的确在这些界限内找到了大约这么多的实根，而且很可能所有的根都是实的。这里当然希望有一个更严格的证明；与此同时，在几次短暂而徒劳的尝试之后，我暂时放下了这一寻找，因为对当前研究的下一个目标而言，它似乎并不必要。
        attribution: Bernhard Riemann，On the Number of Prime Numbers less than a Given Quantity（David R. Wilkins 英译，1998 年初步版本）
        locator: 该英译 PDF 第 4 页；德文转写相应句为 “es ist sehr wahrscheinlich, dass alle Wurzeln reell sind.”
        ref: 3
    - position: 已有的数值核验和部分定理，构成了相信黎曼猜想为真的重要理由，但无论检查了多少个零点、也无论证明了临界线上有多大比例的零点，都不能代替对全部零点的证明
      consensus_role: 官方陈述和重要综述对「证据很多、仍未证明」的共同立场；相信它为真是常见态度，但必须依据已打开文献的定性表述来写，而不能写成一次未核对的学科公投
      evidence:
        label: 官方证据综述、2003 年 Notices 综述，以及一篇强调「严格核验仍非证明」的数值论文
        note: >-
          Bombieri 在 2000 年引用的数值纪录是 van de Lune、te Riele 与 Winter 对前 15 亿个零点的检查，以及 Odlyzko 在很高处选定区间中的计算；「超过 40%」这一比例，他归给 Selberg、Levinson 与 Conrey 的工作，并在文献表中列出 Conrey 1989 年的论文标题。本次未打开这些被引的原始论文，故不转写其证明细节或更新后的比例数字，只转述 Bombieri 与 Conrey 2003 年综述中已经写出的判断。[2][4]
          Conrey 文中「前 100 亿」「Wedeniwski 的分布式计算声称前 1000 亿」等数字是 2003 年可见的报告，其中部分后来被 Platt 与 Trudgian 批评为缺乏经同行评审的计算细节；引用时只作为当时综述的记载，不以之作为当前最严格的核验纪录。[4][5]
          Platt 与 Trudgian 的结果来自本次打开的 arXiv:2004.09765v1（2020 年 4 月 22 日）；检索显示其后有 2021 年期刊版本，但本次未打开该期刊 PDF，故不把期刊页码或可能的修订写成已核对事实。[5]
          「许多数学家认为它可能是最重要的未解问题」「今天已有相当多证据」是 Bombieri 的措辞，不是民调结果。[2]
      holders:
      - name: Enrico Bombieri
        identity: 同上，Clay 官方陈述作者；证据判断见该文本第 III、IV 节。[2]
      - name: J. Brian Conrey
        identity: 美国数学会《Notices》2003 年 3 月长文作者，文中署为 American Institute of Mathematics 主任；文内亦讨论他自己与他人在临界线比例、矩猜想等方面的工作。[4]
      - name: Dave Platt、Tim Trudgian
        identity: >-
          《The Riemann hypothesis is true up to 3·10^12》（arXiv:2004.09765v1）作者。Platt 署为 University of Bristol 的 School of Mathematics，Trudgian 署为 The University of New South Wales Canberra 的 School of Science。[5]
      argument: >-
        把「还没有证明」说成「没有理由相信」，并不符合官方陈述的口气。Bombieri 在「证据」一节开头就写：尽管过去有过怀疑——或许更多是因为失败的证明尝试太多，而不是因为有坚实的反面启发式——但公平地说，今天已经有相当多支持它的证据；一般的黎曼猜想也与我们目前的数论知识相容。[2] 他列举的直接证据包括：强的数值证据；以及已经证明有超过 40% 的非显然零点是单零点且满足黎曼猜想。[2] 在他看来，就启发式而言，有限域上代数簇的相应理论甚至提供了最好的证据。[2]
        Conrey 把这一态度写得更口语，也更具体。他列出「相信 RH 的若干理由」，其中一条是「数十亿个零点不会错」：当时他引 van de Lune 的工作，称前 100 亿个零点已在线上。[4] 历史方面，他记载 Hardy 与 Littlewood 首先证明了 1/2 直线上已有无穷多零点；Selberg 得到了正比例，Levinson 证明了至少 1/3，这一比例后来被改进到 40%。[4] 这些都是真定理，不是数值观察——可它们仍然只覆盖「无穷多」或「一个正比例」，而不是全部。
        数值这边，纪录在官方文本之后还在延伸，也必须读得更小心。Clay 页面目前写的是前 10^13 个解已受检查。[1] Platt 与 Trudgian 则强调：在缺乏证明时，获得部分核验极为重要，但计算必须是严格的；他们对若干较早、未发表于同行评审期刊的宣称提出了关于舍入与截断误差的疑虑，并在自己的预印本中报告：用区间算术核验到高度 3,000,175,332,800，即最低的 12,363,153,437,138 个非显然零点实部都是 1/2。[5] 即便接受这一更强的有限核验，它仍然只是一个很大的有限范围。反例如果存在，原则上仍可能出现在尚未检查的高度；Bombieri 也提到过一种意见：若反例存在，或许会在 |ζ(1/2+it)| 异常大的峰附近。[2]
        因此，把目前的局面说成「几乎已经算完了，只差写下来」，是不准确的。更准确的说法是：在已打开的权威文本里，这一猜想被当作有大量证据、因而值得认真相信的未解问题；证明仍然付之阙如，有限的计算不能填补这个缺口。至于「绝大多数解析数论学家相信它为真」这样的定量说法，本次没有打开相应的调查数据，故不采用。
      quotes:
      - text: >-
          Notwithstanding some skepticism voiced in the past, based perhaps more on the number of failed attempts to a proof rather than on solid heuristics, it is fair to say that today there is quite a bit of evidence in its favor.
        text_zh: 尽管过去有过一些怀疑——其基础或许更多是失败的证明尝试的数量，而非坚实的启发式理由——但公平地说，今天已经有相当多支持它的证据。
        attribution: 'E. Bombieri，Problems of the Millennium: the Riemann Hypothesis'
        locator: 第 5 页，第 III 节 Evidence for the Riemann hypothesis 首句
        ref: 2
      - text: >-
          In the opinion of many mathematicians the Riemann hypothesis, and its extension to general classes of L-functions, is probably today the most important open problem in pure mathematics.
        text_zh: 在许多数学家看来，黎曼猜想以及它向一般 L 函数类的推广，可能是今日纯数学中最重要的未解问题。
        attribution: 'E. Bombieri，Problems of the Millennium: the Riemann Hypothesis'
        locator: 第 1 页
        ref: 2
      - text: >-
          Hardy and Littlewood gave the first proof that infinitely many of the zeros are on the 1/2-line.
        text_zh: Hardy 与 Littlewood 首先证明了：有无穷多零点位于 1/2 直线上。
        attribution: J. Brian Conrey，The Riemann Hypothesis
        locator: Notices of the AMS 50(3) (2003)，第 344 页（本次按 Internet Archive 保存的官方 PDF 核对）
        ref: 4
      - text: >-
          We verify numerically, in a rigorous way using interval arithmetic, that the Riemann hypothesis is true up to height 3 · 10^12. That is, all zeroes β + iγ of the Riemann zeta-function with 0 < γ ≤ 3 · 10^12 have β = 1/2.
        text_zh: 我们以区间算术、用严格的方式数值核验了：黎曼猜想直到高度 3·10^12 都成立。也就是说，Riemann ζ 函数所有满足 0 < γ ≤ 3·10^12 的零点 β + iγ，都有 β = 1/2。
        attribution: Dave Platt 与 Tim Trudgian，The Riemann hypothesis is true up to 3·10^12
        locator: arXiv:2004.09765v1，第 1 页，摘要（原文指数为 3 · 10^{12}）
        ref: 5
      - text: >-
          This has been checked for the first 10,000,000,000,000 solutions. A proof that it is true for every interesting solution would shed light on many of the mysteries surrounding the distribution of prime numbers.
        text_zh: 这一点已对前 10,000,000,000,000 个解做过检查。若能证明它对每一个有意思的解都成立，将阐明围绕素数分布的许多谜团。
        attribution: Clay Mathematics Institute，Riemann Hypothesis 条目页
        locator: 页面正文末段
        ref: 1
    open_parts: >-
      黎曼猜想本身仍未证明；也不存在一个被普遍接受、即将完成的证明纲领。Bombieri 甚至把有限域上的类似物看作启发式上最好的证据，但那是另一类对象上已经证明的理论，不能直接移植为对 ζ(s) 的证明。[2]
      Conrey 在文末写下他个人的看法：RH 是一个真正算术性的问题，可能不会屈服于分析方法；要取得进展，或许需要考虑 L 函数族，而所需的许多工具仍然缺乏。[4] 这是作者的判断，不是一条已被证实的元定理。
      数值核验的前沿数字会继续被刷新，也可能因方法是否严格（区间算术、截断误差、是否经过同行评审）而发生争议。[5] Clay 页面上的 10^13 与 Platt–Trudgian 预印本中的约 1.236×10^13 个零点，都应读作「到某一界限为止为真」，而不是终局证明。[1][5]
      「大多数专家相信它为真」这一印象在综述的语气里很清楚，但本次没有打开可引用的问卷调查；任何具体百分比都不应被编造。对一般 L 函数的广义黎曼猜想，以及它与随机矩阵模型、算术几何之间的关系，官方陈述有所涉及，但已超出「这个猜想是否成立」的直接范围，这里不展开未逐条核对的后续文献。
