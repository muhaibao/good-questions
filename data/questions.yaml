- id: 2026-11-24-ai-variable-input
  date: '2026-11-24'
  category: ai
  title_zh: 神经网络如何处理长度或尺寸不固定的输入？
  title_en: How can neural networks deal with varying input sizes?
  commentary: >-
    许多重要问题的输入天然没有固定长度或尺寸。若把神经网络理解成「第一层必须是固定宽度的向量」，就很难解释它如何处理一句话、一张任意大小的图，或一个元素个数不预先给定的集合——这不是实现细节，而是架构本身要回答的问题。
  source_name: AI Stack Exchange
  source_url: https://ai.stackexchange.com/questions/2008/how-can-neural-networks-deal-with-varying-input-sizes
  author: Asciiom
  source_type: stackexchange
  tags:
  - 神经网络
  - 可变长度输入
  - 循环网络
  - 卷积网络
  - 集合模型
  answer:
    format: scholarly
    reviewed_at: '2026-11-24'
    consensus:
      label: >-
        不存在单一技巧，但有几类已被论文明确写出的机制：用递归/循环按时间一步一步吃进序列，从而使权重不依赖于序列长度；用全卷积网络处理任意空间尺寸的图像并输出相应尺寸的结果；用对集合元素先逐个变换再求和的架构处理元素个数可变、且应与排列无关的输入。注意力模型则对序列中的位置做运算，序列长度不必等于某个固定的第一层宽度
      note: >-
        原问题（2016 年由 Asciiom 提出）的直觉是对的：若输入层神经元数目固定，变长文本不能靠简单地增删文字来「缩放」成固定向量，否则会改变原意。本次解答不以该问答中的技术细节为证据，而只依据实际打开的论文。
        Elman 批评把时间展开成固定长度向量的做法，并给出一步一输入的简单循环网络。[1]
        Sutskever、Vinyals 与 Le 明确指出，普通深度网络只能用于能被编码成固定维向量的输入与目标，并给出用 LSTM 把变长序列映射到固定维向量、再解码出目标序列的方法。[3]
        Long、Shelhamer 与 Darrell 把「接受任意尺寸输入并产生相应尺寸输出」写成全卷积网络的关键洞见。[5]
        Zaheer 等人给出在可数论域上、对排列不变的集合函数的分解定理，并由此设计可在集合上运算的网络。[4]
        Vaswani 等人的 Transformer 以注意力取代循环与卷积，编码器中每个位置可以关注输入序列的所有位置；文中写到的「masking」是为了保持解码器的自回归性质，本次打开的文本并未把 padding mask 写成处理变长输入的正式方法，故不把后者算作该文的结果。[6]
    summary: >-
      若一种网络的第一层是「固定长度向量乘以固定大小的权重矩阵」，那么输入长度一变，这个矩阵就对不上。许多任务却正是这种情形：句子可长可短，图像可大可小，集合的元素个数也可以事先未知。Sutskever、Vinyals 与 Le 把这一限制写得很直白：尽管深度网络灵活而强大，它们只能被用在输入和目标都能被合理地编码成固定维向量的问题上；语音识别、机器翻译和问答，都是长度事先未知的序列问题。[3]
      一条历史更早的出路，是不再把整段时间「摊开」成一个超长向量，而是让网络在时间中运行。Elman 指出，用输入层为最长可能模式预留位置的做法，既强加了时长上限，又暗示所有输入向量应同样长，这在语言这类希望对可变长度模式有可比表示的领域尤其麻烦。他给出的替代是让时间通过它对加工过程的影响被表示出来，也就是给系统以动态记忆：隐层模式被反馈给自己，当前内部表示因而处在先前内部状态的语境之中。[1]
      Hochreiter 与 Schmidhuber 的 LSTM 把这类循环网络推进到可以跨越很长的时间间隔；Sutskever 等人则把它做成编码器–解码器：一只 LSTM 按时间步读入输入序列，得到一个大的固定维向量，另一只 LSTM 再从该向量抽出输出序列。输入和输出的长度因此都不必在架构里被写成一个固定数字。[2][3]
      图像上的对应想法是卷积。Long、Shelhamer 与 Darrell 表明，把分类网络改写成全卷积网络后，它们可以从任意尺寸的输入预测密集输出，从而不必先把图像强制重采样到某个固定边长再送进全连接层。[5]
      若输入根本不是有序序列，而是一个集合，关键约束就变成排列不变性。Zaheer 等人证明：在可数论域上，一个作用在集合上的函数是排列不变的，当且仅当它可以写成 ρ（对集合中每个元素的 φ 再求和）的形式；把 φ 和 ρ 换成神经网络，就得到可以对可变基数集合运算的 Deep Sets。[4]
      Transformer 不再依赖循环，但对序列位置做自注意力，编码器中每个位置可以关注输入序列的所有位置；位置信息则由位置编码提供。序列长度因此仍然可以变化，只是计算方式与循环不同。需要分清的是：该文中明确写出的 mask，是为了阻止解码器看到未来位置，以保持自回归性质，而不是一篇关于批处理补零的说明书。[6]
    definitions:
    - term: 循环 / 递归加工（recurrent processing）
      text: >-
        不把整段输入一次展开成固定长度的向量，而是按时间步读入，并用反馈连接把近期输入的表示保存在激活之中。Elman 称之为动态记忆；Hochreiter 与 Schmidhuber 把这种「短期记忆」与缓慢变化的权重所体现的「长期记忆」相对照。[1][2]
    - term: 序列到序列学习（sequence to sequence learning）
      text: >-
        Sutskever、Vinyals 与 Le 给出的端到端方法：用一层或多层 LSTM 把输入序列映射为固定维向量，再用另一只深度 LSTM 从该向量解码出目标序列，从而对输入和输出的长度都只做很少的先验假定。[3]
    - term: 全卷积网络（fully convolutional network, FCN）
      text: >-
        Long、Shelhamer 与 Darrell 所说的、由卷积层组成、不依赖固定尺寸全连接输入层的网络：它接受任意尺寸的输入，并产生相应尺寸的输出，用于像素级预测等空间密集型任务。[5]
    - term: 排列不变的集合函数（permutation-invariant function on sets）
      text: >-
        对集合元素的次序不敏感的函数。Zaheer 等人在可数论域上证明，这类函数可以分解为「先对每个元素做变换 φ，再求和，最后用 ρ 读出」；这一结构使同一个网络可以处理元素个数不同的集合。[4]
    milestones:
    - year: 1990
      name: Elman 的简单循环网络
      explanation: >-
        Jeffrey L. Elman 在 Cognitive Science 发表《Finding Structure in Time》，批评把时间展开为固定长度向量的做法，并发展以隐状态反馈为动态记忆的循环架构，用于加工时间序列。[1]
    - year: 1997
      name: LSTM
      explanation: >-
        Sepp Hochreiter 与 Jürgen Schmidhuber 提出 Long Short-Term Memory，用恒定误差流和门控来缓解常规循环反向传播中误差消失或爆炸的问题，使网络能够跨越很长的时间间隔。[2]
    - year: 2014–2015
      name: 序列到序列学习与全卷积网络
      explanation: >-
        Sutskever、Vinyals 与 Le 给出用 LSTM 做一般序列到序列学习的方法（arXiv:1409.3215v3，2014 年 12 月）。Long、Shelhamer 与 Darrell 则给出接受任意尺寸输入的全卷积语义分割网络（arXiv:1411.4038v2，2015 年 3 月）。[3][5]
    - year: 2017
      name: Deep Sets 与 Transformer
      explanation: >-
        Zaheer 等人给出排列不变集合函数的结构和相应网络（NIPS 2017；本次打开 arXiv:1703.06114v3）。Vaswani 等人提出完全基于注意力、不再使用循环与卷积的 Transformer（本次打开 arXiv:1706.03762v7）。[4][6]
    views:
    - position: 对有序、长度不固定的序列，循环网络按时间步共享同一组权重，用隐状态（以及后来的编码器–解码器）吸收可变长度
      consensus_role: 处理变长语言和序列的经典路径，也被后来的序列到序列学习直接继承
      evidence:
        label: 原论文中的问题陈述与方法描述
        note: >-
          Elman 明确把「输入层必须为最长模式预留位置、并暗示所有向量等长」列为空间化时间的缺陷，并针对可变长度的语言单位给出替代架构。[1]
          Sutskever 等人把「DNN 只能用于固定维输入和输出」写成要克服的限制，并给出 LSTM 编码器–解码器。[3]
          LSTM 原文的重点是长时程误差流，而不是「变长」这一命题本身，但它把循环网写成对时间变化输入与输入序列的加工，是后文能够处理任意长度序列的前提。[2]
      holders:
      - name: Jeffrey L. Elman
        identity: >-
          《Finding Structure in Time》（Cognitive Science, 14, 179–211, 1990）作者。本次打开的公开转载首页将作者写作 Jeffrey L. Elman；通信地址为 Center for Research in Language, C-008, University of California, La Jolla, CA 92093。作者页列出的官方 PDF 地址本次未能打开（HTTP 500/404），引文取自实际打开的公开转载。[1]
      - name: Sepp Hochreiter、Jürgen Schmidhuber
        identity: >-
          《Long Short-Term Memory》（Neural Computation 9(8):1735–1780, 1997）作者。本次打开的作者机构副本写明：Hochreiter 当时在 Technische Universität München 的 Fakultät für Informatik；Schmidhuber 当时在瑞士卢加诺的 IDSIA。[2]
      - name: Ilya Sutskever、Oriol Vinyals、Quoc V. Le
        identity: >-
          《Sequence to Sequence Learning with Neural Networks》（arXiv:1409.3215v3, 14 Dec 2014）作者。文首三人所属均署为 Google。[3]
      argument: >-
        Elman 的出发点，正是原问题里那种「固定输入层」的困难。若把时间写成向量的下标，第一个事件占据第一个分量，第二个事件占据第二个分量，整个向量再被模型并行加工，那么输入层必须按可能出现的最长模式来设计，并且会暗示所有输入应一样长。对语音中的音段和句子来说，人们恰恰希望可变长度的模式仍有可比的表示。Elman 的替代是让时间通过它对加工的影响被表示：在每个时刻读入当前输入，并把隐层模式反馈给自己，从而使内部表示处在先前状态的语境里。长度于是不再是第一层的宽度，而是运行了多少步。[1]
        LSTM 保留了「按时间步运行、权重在时间上共享」这一前提，并处理常规循环反向传播中误差沿时间指数吹大或消失的问题。它被设计成即使在有噪声、不可压缩的输入序列上，也能跨越超过 1000 步的时间间隔。[2]
        Sutskever 等人把这一能力用到输入和输出长度都可以变的任务上。他们的方法几乎不对序列结构做假定：一只多层 LSTM 逐步读完输入，得到固定维向量，另一只深度 LSTM 再从该向量生成目标序列。这样，变长对变长被分解成「变长到固定维」再「固定维到变长」，而两端的长度都不必在权重矩阵的形状里被写死。[3]
      quotes:
      - text: >-
          Second, the shift register imposes a rigid limit on the duration of patterns
          (since the input layer must provide for the longest possible pattern), and
          furthermore, suggests that all input vectors be the same length. These problems
          are particularly troublesome in domains such as language, where one
          would like comparable representations for patterns that are of variable
          length.
        text_zh: 其次，移位寄存器对模式的持续时间施加了刚性限制（因为输入层必须为可能的最长模式预留位置），并且还暗示所有输入向量应具有相同长度。这些问题在语言这类领域尤其麻烦：人们希望对可变长度的模式仍有可比的表示。
        attribution: Jeffrey L. Elman, Finding Structure in Time
        locator: 第 181 页，「The Problem with Time」一节。本次打开的是公开转载，页码与 Cognitive Science 14 (1990) 的期刊页码一致。
        ref: 1
      - text: >-
          Despite their flexibility and power, DNNs can only be applied to problems whose inputs and targets
          can be sensibly encoded with vectors of fixed dimensionality. It is a significant limitation, since
          many important problems are best expressed with sequences whose lengths are not known a-priori.
        text_zh: 尽管深度神经网络灵活而强大，它们却只能被用于输入和目标都能被合理地编码成固定维向量的问题。这是一个重要限制，因为许多重要问题最好被表达为长度事先未知的序列。
        attribution: Ilya Sutskever、Oriol Vinyals 与 Quoc V. Le, Sequence to Sequence Learning with Neural Networks
        locator: 第 1 节，第 1 页，arXiv:1409.3215v3
        ref: 3
      - text: >-
          Our method uses a multilayered Long Short-Term Memory (LSTM) to map the input sequence
          to a vector of a fixed dimensionality, and then another deep LSTM to decode the target sequence from the vector.
        text_zh: 我们的方法用一个多层长短期记忆网络（LSTM）把输入序列映射到一个固定维的向量，然后再用另一个深度 LSTM 从该向量解码出目标序列。
        attribution: Ilya Sutskever、Oriol Vinyals 与 Quoc V. Le, Sequence to Sequence Learning with Neural Networks
        locator: 摘要，arXiv:1409.3215v3
        ref: 3
    - position: 对空间尺寸不固定的图像，卷积核可以按输入大小被反复施用；全卷积网络因此能接受任意尺寸输入并给出相应尺寸的输出
      consensus_role: 计算机视觉里处理可变分辨率与密集预测的标准架构思路
      evidence:
        label: 打开的全卷积网络论文中的明确陈述
        note: >-
          Long、Shelhamer 与 Darrell 在摘要和后文中反复写明「任意尺寸输入 / 相应尺寸输出」这一性质，并把它作为把既有分类网络改写成全卷积形式的要点。[5]
          本次未能打开 Goodfellow、Bengio 与 Courville《Deep Learning》第 9 章的独立 PDF（官方 PDF 链接返回 404）；官方 HTML 虽已下载，但为便于核对的精确页码引文，本文不以该书为引用来源。
      holders:
      - name: Jonathan Long、Evan Shelhamer、Trevor Darrell
        identity: >-
          《Fully Convolutional Networks for Semantic Segmentation》（arXiv:1411.4038v2, 8 Mar 2015）作者。文首所属署为 UC Berkeley；文内标注 Long 与 Shelhamer 贡献相等。[5]
      argument: >-
        图像的宽和高常常不固定。若网络末端是按某一固定边长设计的全连接层，实践中往往先把图像重采样到这个尺寸，而这正是原问题里对文本不可行、对图像也并不总是无害的做法。全卷积网络的想法是：卷积本身并不要求输入具有预先规定的宽高——核在空间上被施用的次数可以随输入而变，输出的空间尺寸随之缩放。[5]
        Long 等人把既有分类网络「卷积化」：全连接层被改写成卷积，从而使同一个网络既能在任意尺寸的输入上做前向计算，又能输出空间对应的类别图。他们的关键洞见被直接写在摘要里：建造接受任意尺寸输入、并产生相应尺寸输出的全卷积网络，以便高效地进行推断和学习。[5]
        这一机制与循环网络处理变长序列是平行的：共享的是局部运算（卷积核或循环权重），变化的是运算被重复的次数，而不是第一层权重矩阵的形状。
      quotes:
      - text: >-
          Our key insight is to build “fully convolutional” networks that take input of arbitrary size and produce
          correspondingly-sized output with efficient inference and learning.
        text_zh: 我们的关键洞见是建造「全卷积」网络：它们接受任意尺寸的输入，并产生相应尺寸的输出，同时进行高效的推断与学习。
        attribution: Jonathan Long、Evan Shelhamer 与 Trevor Darrell, Fully Convolutional Networks for Semantic Segmentation
        locator: 摘要，第 1 页，arXiv:1411.4038v2
        ref: 5
    - position: 对无固定次序、元素个数也可变的输入，应当使用排列不变（或等变）的集合架构，而不是假装它们是某个固定长度的向量
      consensus_role: 针对「变长且无自然顺序」这一情形的代表性理论结果
      evidence:
        label: 带有明确定理陈述的会议论文（NIPS 2017 / 打开的 arXiv v3）
        note: >-
          主定理（Theorem 2）在可数论域上给出充分必要条件；对不可数论域（如实数集合），作者只证明了固定大小集合上的分解，并猜想一般情形仍成立。引用时需要保持这一限定，不能把定理说成已对任意不可数集合、任意基数完成证明。[4]
      holders:
      - name: Manzil Zaheer、Satwik Kottur、Siamak Ravanbakhsh、Barnabás Póczos、Ruslan Salakhutdinov、Alexander J. Smola
        identity: >-
          《Deep Sets》（arXiv:1703.06114v3, 14 Apr 2018；文首标明 31st Conference on Neural Information Processing Systems, NIPS 2017）作者。文首所属署为 Carnegie Mellon University，其中 Zaheer 与 Smola 同时署 Amazon Web Services。[4]
      argument: >-
        并非所有可变大小的输入都是序列。一组标签、一朵点云、一个顾客集合，往往不具有应被网络利用的次序；这时，正确的不变性不是「对长度变化保持可运行」，而是「对元素的排列保持不变」。Zaheer 等人把传统机器学习算法写成针对固定维实例而设计，并指出把它们扩展到排列不变的集合上并不平凡。[4]
        在可数论域上，他们证明：一个作用在集合 X 上的函数是排列不变的，当且仅当它可以分解为 ρ（∑_{x∈X} φ(x)）。含义很具体：先用同一个变换 φ 处理每一个元素，再把结果加起来（求和与次序无关，也与有多少个元素无关），最后用 ρ 读出集合级的结果。把 φ 和 ρ 换成恰当的网络，就得到 Deep Sets。[4]
        需要同时记下限定：对不可数的 X（例如 X = ℝ），他们只证明了这一分解在固定大小的集合上成立，并猜想一般情形仍为等式。因此，把 Deep Sets 写成「已彻底解决任意连续域上任意基数集合的表示」，超过了本文打开的定理范围。[4]
      quotes:
      - text: >-
          In contrast to traditional approach of operating on fixed dimensional vectors,
          we consider objective functions defined on sets that are invariant to permutations.
        text_zh: 与在固定维向量上运算的传统路径相对，我们考虑定义在集合上、且对排列保持不变的目标函数。
        attribution: Manzil Zaheer 等, Deep Sets
        locator: 摘要，arXiv:1703.06114v3，第 1 页
        ref: 4
      - text: >-
          Property 1 A function f : 2^X → Y acting on sets must be permutation invariant to the order of
          objects in the set, i.e. for any permutation π : f ({x1 , . . . , xM }) = f ({xπ(1) , . . . , xπ(M) }).
        text_zh: '性质 1：一个作用在集合上的函数 f : 2^X → Y 必须对集合中对象的次序保持排列不变，亦即对任意排列 π，有 f({x1, …, xM}) = f({xπ(1), …, xπ(M)})。'
        attribution: Manzil Zaheer 等, Deep Sets
        locator: 第 2 节 Property 1，第 2 页，arXiv:1703.06114v3。公式中的指数与下标按原文写出；2^X 对应原文的 2X。
        ref: 4
    open_parts: >-
      这几类机制回答的是不同的结构假定：序列有次序，图像有空间网格，集合没有应被尊重的次序。把其中任何一种说成「神经网络处理变长输入的方法」，都会掩盖这种差别。
      原问答里常被提到的零填充（zero-padding），是一种常见的工程做法，用来把不同长度的例子补齐以便成批计算；本次打开的上述论文并未把「补零加 mask」写成一条被证明的一般方法。Vaswani 等人文中的 masking，明确是为了阻止解码器关注后续位置、以保持自回归性质，不应被改写成变长批处理的补零说明书。[6]
      Transformer 能够处理不同长度的序列，是因为它对位置做注意力和按位置共享的前馈运算，而不是因为第一层具有固定宽度；但原文并没有单独给出一条「变长输入定理」，对位置编码在极长序列上的外推等问题，需要另找专门文献，不能由本文代为断言。
      递归神经网络（把树或句子按句法递归地归约）在原问答中也被提及，但本次未打开相关原论文，故不转述其技术细节。
    references:
    - id: 1
      citation: >-
        Elman, J. L. (1990). Finding structure in time. Cognitive Science, 14, 179–211. 作者页列出的官方 PDF（http://crl.ucsd.edu/~elman/Papers/fsit.pdf）本次请求失败。实际打开并据以核对引文的是公开转载 https://papers.baulab.info/papers/Elman-1990.pdf （亦下载了 https://jontallen.ece.illinois.edu/Public/Elman-FindingStructureinTime.90.pdf 作为对照）。
      url: https://papers.baulab.info/papers/Elman-1990.pdf
    - id: 2
      citation: >-
        Hochreiter, S., & Schmidhuber, J. (1997). Long short-term memory. Neural Computation, 9(8), 1735–1780. 本次打开的是作者机构提供的 PDF：https://ml.jku.at/publications/older/2604.pdf 。
      url: https://ml.jku.at/publications/older/2604.pdf
    - id: 3
      citation: >-
        Sutskever, I., Vinyals, O., & Le, Q. V. (2014). Sequence to sequence learning with neural networks. arXiv:1409.3215v3 [cs.CL].
      url: https://arxiv.org/pdf/1409.3215
    - id: 4
      citation: >-
        Zaheer, M., Kottur, S., Ravanbakhsh, S., Póczos, B., Salakhutdinov, R., & Smola, A. J. (2017). Deep sets. arXiv:1703.06114v3 [cs.LG]. 文首标明 31st Conference on Neural Information Processing Systems (NIPS 2017)。本次未打开会议正式版的单独页码，故页码以打开的 arXiv v3 为准。
      url: https://arxiv.org/pdf/1703.06114
    - id: 5
      citation: >-
        Long, J., Shelhamer, E., & Darrell, T. (2015). Fully convolutional networks for semantic segmentation. arXiv:1411.4038v2 [cs.CV].
      url: https://arxiv.org/pdf/1411.4038
    - id: 6
      citation: >-
        Vaswani, A., Shazeer, N., Parmar, N., Uszkoreit, J., Jones, L., Gomez, A. N., Kaiser, Ł., & Polosukhin, I. (2017/2023). Attention is all you need. arXiv:1706.03762v7 [cs.CL] (2 Aug 2023). 用于说明注意力对序列位置运算以及文中 masking 的含义；不以该文未写出的 padding 方案为据。
      url: https://arxiv.org/pdf/1706.03762
- id: 2026-11-24-biz-infrastructure
  date: '2026-11-24'
  category: business
  title_zh: 基础设施到底怎么了？为什么现在造得又慢又贵？
  title_en: What's going on with infrastructure?
  commentary: >-
    同一座城市，百年前用几年开通几十座地铁站，如今三条车站就要耗去数十亿美元——问题把「单位造价为何上升」从印象变成可核对的经验问题，并且迫使我们分清：超支相对预算，与造价相对历史，并不是同一件事。
  source_name: Patrick Collison — Questions
  source_url: https://patrickcollison.com/questions
  author: Patrick Collison
  source_type: curated
  tags:
  - 基础设施
  - 建设成本
  - 巨型项目
  - 公共交通
  answer:
    format: scholarly
    reviewed_at: '2026-11-24'
    consensus:
      label: >-
        美国若干标志性交通基础设施的单位造价在过去半个多世纪里确实大幅上升，这一现象有官方历史数据和专项研究支持；但对「为什么」，文献给出的是互补而非已经统一的解释——巨型项目系统性超支、制度与采购能力、以及 1970 年代前后公路造价拐点——而「改造物理世界的有效技术已经恶化」仍是有待检验的假说，不是既成结论
      note: >-
        Flyvbjerg 把巨型项目的表现概括为「铁律」：超预算、超工期，一次又一次；他所依据的是相对批准预算与计划工期的超支、超时，以及效益短收，而不是一条已经过通货膨胀调整的百年单位造价曲线。[2]
        Transit Costs Project 的终期报告则做跨国、按项目的比较，认为纽约第二大道地铁一期相对其合成的低成本基线贵 8 到 12 倍，并把溢价分解为车站体量与系统设计、劳动力使用，以及采购与软成本等制度因素；作者同时认为高成本城市可以转向低成本国家的做法。[3]
        Brooks 与 Liscow 利用他们整理的州际公路建设支出数据，发现实际每英里支出从 1960 年代到 1980 年代上升了三倍以上，并把拐点定在 1970 年代初；他们排除了可观察地理条件和单位劳动力、材料价格作为主要解释，同时给出与「公民发声」制度变化以及收入、房价相关的提示性证据。[4]
        本次未找到可引用的系统专家调查，因此不把「学界已就单一原因达成共识」写成事实。Collison 把上述对照表述为一个问题，并写下「我们改造物理世界的有效技术似乎已大幅恶化」这一判断；它应作为有待解释的假说阅读，其页中若干美元数字也须与他所引原始出处分开核对。[1]
    summary: >-
      Collison 提出的问题，核心不是「个别工程是否延期」，而是：在施工技术按理应当进步的一个世纪里，为什么美国建造同类基础设施的代价和速度看起来急剧恶化。[1]
      他给出两组对照。纽约地铁首份合同于 1900 年 2 月 21 日授予，28 座车站在 1904 年 10 月 27 日开通，历时约 4.7 年；他写总成本约为 11 亿美元（2019 年美元）。2000 年 4 月，大都会交通署（MTA）决定修建第二大道地铁，一期三条车站于 2017 年 1 月 1 日开通，他写造价为 44.5 亿美元，按每站计算约为前者的 37 倍。另一组对照是：州际公路系统早期造价约为每英里 150 万美元（2019 年美元），而旧金山一条公交道当时预计 2.2 英里花费 3.093 亿美元，即每英里约 1.4 亿美元。他承认后一组并非同类比较（旧金山是在既有城市环境中做改善，而不是新建公路），但仍称之为每英里多付约 93 倍。[1]
      这些美元数字首先是 Collison 的表述。他所注的州际公路出处，是联邦公路管理局局长 J. Richard Capka 2006 年在国会的证词；本次打开的证词文本写的是：艾森豪威尔 1953 年就任时，已完工 6,000 英里，花费 9.55 亿美元——这是当时美元，证词中并未出现「2019 年美元计每英里约 150 万美元」这一换算。[1][5]
      第二大道地铁一期的造价，本次打开的 MTA 项目页确认了 2017 年 1 月开通，但未给出总造价。[6] Transit Costs Project 终期报告写：这段约 2.7 公里、三座车站的延期线于 2017 年开通，造价为 46 亿美元（支出年度美元），或按他们的换算为 53 亿美元（2020 年美元）；其中十份施工合同的「硬成本」为 31.6 亿美元。该报告并称，按他们收录的九百余个快速轨道交通项目看，一期是全球每公里最贵的地铁之一。[3]
      旧金山 Van Ness 公交优先走廊的官方项目页，在本次打开时把「成本估算」写作 3.459 亿美元，并注明其中包含公用设施更换、重铺路面和接触网系统等不仅限于公交提升的范围；页面标注预测完工时间为 2022 年 4 月，状态为已完成。Collison 当时所用的 3.093 亿美元是更早的预测数字，且本次打开的官方页未核对「2.2 英里」这一长度。[1][7]
      把对照从「例子」推进到「机制」，已有文献至少做了三件不同的事。Flyvbjerg 讨论的是巨型项目相对于自身预算与工期的系统性失败。[2] Transit Costs Project 讨论的是同时期不同城市、不同制度下单位造价的巨大差异。[3] Brooks 与 Liscow 讨论的是美国州际公路这一相对同质产品在时间上的实际每英里支出上升。[4] 三者都支持「美国现在造得更贵」这一现象的某些面向，但它们解释的并不是同一个统计量；也不自动等于「工程技术本身退步了」。
    definitions:
    - term: 巨型项目（megaproject）
      text: >-
        Flyvbjerg 将其概括为通常造价十亿美元或以上、耗时多年、涉及众多公私利益相关方、具有转型性并影响数百万人的大型复杂事业；他强调它们在 Aspiration、周期、复杂性和利益相关方上不同于把常规项目简单放大。[2]
    - term: 造价超支与单位造价上升
      text: >-
        超支比较的是决算（或实施中的成本）与最初批准的预算；单位造价上升比较的是不同时期或不同地方建成每一英里、每一公里或每一座车站的实际支出。前者可以在单位造价并不更高的情况下发生（预算订得过低），后者即使项目「按预算完成」也可能很高。Flyvbjerg 的「铁律」主要针对前者；Brooks 与 Liscow 以及 Transit Costs Project 的国际比较主要针对后者。[2][3][4]
    - term: 软成本（soft costs）
      text: >-
        Transit Costs Project 将其包括设计、规划、强制账户（force account）、保险、施工管理和预备费等；他们为了跨国比较，把第三方设计、规划和项目管理成本做了口径对齐。在其对照案例中，这类费用通常在硬合同成本之上再加 5%–10%（最常见为 7%–8%），而第二大道地铁一期达到 21%。[3]
    milestones:
    - year: 1953–1956
      name: 州际公路系统的早期完工规模与 1956 年法案
      explanation: >-
        Capka 在 2006 年证词中写道，艾森豪威尔 1953 年就任时，已完成 6,000 英里、花费 9.55 亿美元；1956 年 6 月 29 日签署的《1956 年联邦援助公路法》把州际系统扩大到 41,000 英里，并确立了新的融资安排。[5]
    - year: 1970s
      name: 州际公路每英里支出的拐点
      explanation: >-
        Brooks 与 Liscow 发现，实际每英里建设支出从 1960 年代到 1980 年代上升三倍以上，并把上升的拐点定在 1970 年代初；他们指出这一时间与「公民发声」进入政府决策的制度变化重合，且收入与房价在统计上几乎完全解释了成本上升，而单位劳动力和材料价格不能。[4]
    - year: 2017
      name: 纽约第二大道地铁一期开通
      explanation: >-
        MTA 官方项目页写明，一期于 2017 年 1 月 1 日开通运营，将 Q 线从 63 街延伸至 96 街，并新增 72 街与 86 街车站。[6] Transit Costs Project 将其造价记为 46 亿美元（支出年度美元），并作为美国高成本案例的核心解剖对象。[3]
    views:
    - position: 巨型项目系统性超预算、超工期，根源在于激励、乐观偏差与「最不适者得以建成」，而不是偶然的管理失手
      consensus_role: 工程与项目管理文献中被广泛引用的概括；它说明「当代巨型项目平均表现很差」，但直接回答的是相对预算的超支，而不是百年单位造价为何上升
      evidence:
        label: 对既有巨型项目绩效数据的综述，而非对单一城市地铁造价的历史重建
        note: >-
          本次打开的是 2014 年 Project Management Journal 论文的作者稿（arXiv:1409.0003，Draft 9.2）。作者给出「十项中有九项超支」、50% 以上的超支并不罕见等概括，并列举英法海峡隧道、丹佛机场、波士顿 Big Dig 等例子；这些比例与案例来自他及其合作者此前的数据库与论文，本文按其在该综述中的表述使用，不另充作本次独立复算。[2]
      holders:
      - name: Bent Flyvbjerg
        identity: >-
          本次打开的作者稿署名为牛津大学赛德商学院 Major Programme Management 讲席教授及创始主任（Professor and Founding Chair）。[2]
      argument: >-
        Flyvbjerg 把巨型项目写成一种与常规项目不同的类型，并认为政治、技术、经济与美学四种「崇高」共同推高了这类项目的规模与频率。[2]
        在「铁律」一节，他根据绩效数据写道：十个这类项目中有九个发生成本超支；实际超支达 50% 很常见，超过 50% 也不罕见。效益短收同样常见，并且在他看来，在可比较数据覆盖的约七十年里，超支幅度并未随时间或地理而明显改善。[2]
        他把成功定义为同时达到预算、工期与效益目标，并估计若这三项各自大约只有十分之一达标，则三项同时达标大约是千分之一；即便这些比例错了一倍，成功率仍极低。他用这句话来说明所谓「巨型项目的铁律」：超预算、超工期，一次又一次。「最佳实践是离群值，平均实践则是灾难。」[2]
        在解释上，他后来把乐观偏差（optimism bias）与策略性误报（strategic misrepresentation）视为比 Hirschman「隐藏的手」更好的原因说明，并讨论「最不适者得以生存」：被建成的往往不是最好的项目。[2]
        对原问题而言，这一传统有力地说明：当代巨型项目经常比承诺的更贵、更慢。但它比较的是项目与其自己的预算，不能单独证明 1904 年的地铁或 1960 年代的州际公路在单位产出上必然更便宜，也不等于已经证明「施工技术退化了」。
      quotes:
      - text: >-
          Nine out of ten such projects have cost overruns. Overruns of up to 50 percent in real terms are common, over 50 percent not uncommon.
        text_zh: 这类项目十项中有九项出现成本超支。按实际值计，高达 50% 的超支很常见，超过 50% 也不罕见。
        attribution: Bent Flyvbjerg，What You Should Know About Megaprojects and Why
        locator: arXiv:1409.0003 作者稿 Draft 9.2，PDF 第 9 页（文内页码 9），“The Iron Law of Megaprojects”一节
        ref: 2
      - text: >-
          This serves to illustrate what may be called the "iron law of megaprojects": Over budget, over time, over and over again (Flyvbjerg, 2011). Best practice is an outlier, average practice a disaster in this interesting and very costly area of management.
        text_zh: 这可以用来说明所谓「巨型项目的铁律」：超预算、超工期，一次又一次。在这一既有趣又代价高昂的管理领域里，最佳实践是离群值，平均实践则是灾难。
        attribution: Bent Flyvbjerg，What You Should Know About Megaprojects and Why
        locator: 同一作者稿 PDF 第 11 页（文内页码 11）
        ref: 2
    - position: 纽约等地的超高地铁造价，主要来自车站过度建设、劳动力使用方式和采购—软成本等制度因素，而不是「原子变重了」；高成本城市可以通过改制度向低成本国家看齐
      consensus_role: 近年来对美国轨道交通造价国际差异最系统的专项研究之一；证据来自案例解剖与成本数据库，不是随机实验，作者自己对乘数的精确性有保留
      evidence:
        label: 多国案例研究与自建的快速轨道交通造价数据库
        note: >-
          终期报告作者为 Eric Goldwyn、Alon Levy、Elif Ensari 与 Marco Chitti，PDF 创建于 2023 年 2 月；项目站点页脚标明 Marron Institute。报告把第二大道地铁一期相对合成基线的溢价写作 8 到 12 倍，并说明各因子是相乘的，看上去精确到 9.34 的计算，最好只读作 8–12 的区间。比较依赖于会计口径、项目范围和数据可得性，作者承认精确比较困难。[3]
      holders:
      - name: Eric Goldwyn、Alon Levy、Elif Ensari、Marco Chitti
        identity: >-
          Transit Costs Project 终期报告《Understanding Transit Infrastructure Costs in American Cities》作者；报告致谢感谢 NYU Marron 在项目进行期间的支持，项目站点页脚版权为 Marron Institute。[3]
      argument: >-
        报告开篇即提出：美国的轨道交通基础设施造价属于世界最高之列；但若能把制度实践调整到与瑞典、意大利、土耳其等高效率、低成本国家一致，造价可以下降。[3]
        在「成本溢价」一节，他们把第二大道地铁一期相对合成基线（主要依据意大利、伊斯坦布尔和瑞典，并参考巴黎、柏林以及赫尔辛基、西班牙等）贵出 8 到 12 倍，归因于三项一次乘数：实体结构（车站与隧道，以及系统与标准化）、劳动力、以及采购与软成本。[3]
        就车站而言，他们认为纽约的车站施工方法本身就使车站成本增至三倍：96 街车站的开挖长度是 187 米站台的 2.6 倍，另外两座车站约是站台的两倍长，且因采用更昂贵的深挖技术，每立方米成本更高；对照案例中，车站开挖通常只比站台长 3%–20%。一期硬成本中 77% 是车站。他们估计，仅车站过大一项就把项目成本提高约 2.06 倍。[3]
        劳动力方面，美国东北部劳动力约占硬成本的 40%–60%，低成本案例为 19%–30%；若劳动力份额从 25% 升至 50%、其余不变，总体项目成本约为 1.5 倍。他们判断，差异至多只有四分之一来自薪酬水平，更多来自蓝领冗余和白领过度配备。[3]
        采购规范（对立关系、机构内部能力不足、竞争不足、把风险转移给承包商从而导致加价）据他们估计使成本提高约 1.85 倍；第二大道地铁的软成本为硬成本之上再加 21%，高于对照案例常见的 7%–8%。[3]
        第一章给出的硬成本总额是 31.6 亿美元（他们在计算中排除了 2.29 亿美元的 63 街车站改造，因为无法拆分土建与装修）。第七章写一期于 2017 年开通，造价 46 亿美元（支出年度美元）。[3]
        这一解释与 Collison 的问题直接相关：如果同时期的意大利或瑞典能够以低得多的单位造价建地铁，那么主要约束就不像是「施工技术整体退化」，而更像是可改革的设计标准、用工和采购制度。报告自己也把这一点写成「好消息」。[3]
      quotes:
      - text: >-
          Based on our detailed case studies and data collection, we identified three primary factors that comprise total project costs and explain why Phase 1 of New York’s Second Avenue Subway is 8 to 12 times more expensive than our composite baseline case.
        text_zh: 基于详细的案例研究和数据收集，我们识别出构成项目总成本的三项主要因素，并以此来解释：为什么纽约第二大道地铁一期比我们的合成基线案例贵 8 到 12 倍。
        attribution: Eric Goldwyn、Alon Levy、Elif Ensari 与 Marco Chitti，Transit Costs Project 终期报告
        locator: 终期报告第 1.4 节 “The cost premium, in brief”，文内第 13 页
        ref: 3
      - text: >-
          This short extension opened for revenue service in 2017 and cost $4.6 billion in current year-of-expenditure dollars, or $5.3 billion in 2020 dollars.
        text_zh: 这段短延伸线于 2017 年开通运营，造价为 46 亿美元（按支出年度美元计），或 53 亿美元（2020 年美元）。
        attribution: 同上
        locator: 第 7 章引言，文内第 326 页；脚注说明换算以施工中点 2011 年为准、按 CPI 把 46 亿调至 2020 年美元
        ref: 3
    - position: 美国州际公路的实际每英里建设支出在 1960–1980 年代上升了三倍以上，主要不像是单位投入品价格或「把最难路段留到最后」，而与 1970 年代初的制度变化以及收入、房价上升相伴随
      consensus_role: 针对相对同质的公路产品、跨越数十年州级支出数据的重要经验研究；作者把因果分解称为提示性证据
      evidence:
        label: 数字化的州际公路州级支出与完工里程面板（1956 年以降），以及与地理、政治、法律变量的合并分析
        note: >-
          本次打开的是 Brookings Hutchins Center Working Paper #54（2019 年 8 月），不是其后可能存在的期刊正式发表本；页码与可能的修订不以期刊版为准。作者明确区分「记录时间趋势」与「对原因给出提示性证据」，并写明若干常见解释（单位劳动力或材料价格、可观察的地理难度）与数据不符。[4]
      holders:
      - name: Leah Brooks、Zachary Liscow
        identity: >-
          工作论文署名分别为乔治·华盛顿大学 Trachtenberg 公共政策与公共管理学院、耶鲁法学院。[4]
      argument: >-
        与地铁项目的国际横截面不同，Brooks 与 Liscow 选择州际公路，正是因为它在空间和时间上相对同质，并且总里程大体固定，从而有可能追踪「每一英里花了多少钱」的长期变化。[4]
        他们的两项主要贡献是：第一，记录实际每英里建设支出从 1960 年代到 1980 年代上升三倍以上，拐点在 1970 年代初；即使控制预先存在的地理条件，这一上升仍然存在，因此不能主要归因于规划者把「最难修的路段」留到最后（至少在可观察的地理变量意义上）。[4]
        第二，他们利用后期各州成本的巨大离散来检视常见假说。单位劳动力和材料的实际价格在此期间变动很小，因而不能驱动大部分上升；他们把这一点类比于医疗文献中「价格对数量」的区分，认为更像是数量（做了更多、或不同的事情）而非单价。对时间不变的因素，以及加入州固定效应，也几乎不改变这一时间趋势。[4]
        在提示性解释里，支出上升的时间与 1970 年代初「公民发声」进入政府决策相重合；并且上升的收入与房价在统计上几乎完全解释了成本增加。[4]
        这一结果直接支撑 Collison「大多数人已经知道基础设施越来越贵，但幅度令人吃惊」的观察中，关于公路的那一半：至少就州际公路新建设而言，实际单位支出的大幅上升是可以在官方支出与完工里程中读到的。但它并不自动外推到地铁或高铁，也不把「公民发声」或房价写成已被识别的唯一因果机制；作者自己用了「suggestive evidence」。[1][4]
      quotes:
      - text: >-
          First, we find that spending per mile on Interstate construction increased more than three-fold (in real terms) from the 1960s to the 1980s. We date the inflection point of increase to the early 1970s.
        text_zh: 第一，我们发现州际公路建设的每英里支出（按实际值计）从 1960 年代到 1980 年代上升了三倍以上。我们把这一上升的拐点定在 1970 年代初。
        attribution: Leah Brooks 与 Zachary Liscow，Infrastructure Costs
        locator: Brookings Hutchins Center Working Paper #54（2019 年 8 月）摘要
        ref: 4
      - text: >-
          In particular, the increased spending per mile coincides with the rise of “citizen voice” in government decision-making in the early 1970s. And rising incomes and housing prices nearly completely statistically explain the increase in costs. We also largely rule out several common explanations for rising costs, such as increases in per-unit labor or materials prices.
        text_zh: 具体而言，每英里支出的上升与 1970 年代初「公民发声」进入政府决策相重合。而且，收入与房价的上升在统计上几乎完全解释了成本的增加。我们也在很大程度上排除了若干常见解释，例如单位劳动力或材料价格的上涨。
        attribution: 同上
        locator: 同一摘要
        ref: 4
    open_parts: >-
      Collison 把对照的幅度写成一个更强的判断：「如果技术意味着用更少做更多，那么我们改造物理世界的有效技术似乎已大幅恶化。」[1] 已打开的研究更支持把现象读作制度、激励、设计标准和投入数量的变化，而不是物理学或施工机械本身退步；Transit Costs Project 甚至明确认为纽约可以学到意大利或斯堪的纳维亚的造价水平。[3] 但这仍是一项关于「有效技术」的假说，尚未被单一因果识别所关闭。
      历史对照本身也不完全同类。1904 年的地铁与 2017 年的第二大道地铁在安全、无障碍、劳工、环保和城市密集度上的标准不同；Collison 对公交道与州际公路的比较，他自己已标明不是 like-for-like。[1] 他所引 11 亿美元（2019 年美元）的早期地铁总造价，出处是一本本次未能打开的专著，本文只作为他的表述记录，不以官方统计复核。
      「相对预算超支」与「单位造价的长期上升」仍需要被分开追踪：一个按预算完成、但预算已经极高的项目，不会出现在 Flyvbjerg 的超支统计里，却正是 Brooks–Liscow 与 Transit Costs Project 所关心的对象。[2][3][4]
      趋势是否会持续、维护现有存量是否也会失去能力、哪些国家是例外，仍是 Collison 原问题中未决的部分。[1] 本次没有打开一份已完成的全球「例外国家」清单的独立评估，因此不把个别低成本案例写成已经完成的国际排名。
