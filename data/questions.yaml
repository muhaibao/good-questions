- id: 2026-11-24-ai-ml
  date: '2026-11-24'
  category: ai
  title_zh: 人工智能和机器学习有什么区别？
  title_en: What is the difference between artificial intelligence and machine learning?
  commentary: >-
    这两个词在日常和产业话语里几乎被当成同义词，但它们的历史外延并不重合。把「从经验中改进的程序」和「更广的智能机制」分开，才能看清搜索、逻辑与专家系统为什么也曾是人工智能的中心，以及为什么今天的成功路径又高度集中在从数据中学习。
  source_name: AI Stack Exchange
  source_url: https://ai.stackexchange.com/questions/35/what-is-the-difference-between-artificial-intelligence-and-machine-learning
  author: interlucid
  source_type: stackexchange
  tags:
  - 人工智能
  - 机器学习
  - 定义
  - 学科史
  answer:
    format: scholarly
    reviewed_at: '2026-11-24'
    consensus:
      label: >-
        主流教材和代表学者通常把机器学习视为人工智能的一个子领域：它研究如何让程序凭借经验改进在某类任务上的表现；人工智能则是更广的、旨在理解并建造智能体或智能机器的领域。与此同时，人工智能本身没有单一的官方或法律定义，定义沿「人类表现 vs 理性」「思考 vs 行为」等维度分化，边界是模糊的
      note: >-
        McCarthy 把人工智能说成「制造智能机器、尤其是智能计算机程序的科学与工程」，并明确它不必局限于生物学上可观察的方法。[2]
        Mitchell 给出了至今仍被广泛转述的机器学习定义：若程序在经验 E 下，于任务类 T 上按指标 P 衡量的表现有所改进，则称它在学习。[4]
        Russell 与 Norvig 把机器学习列为图灵测试所需能力之一，并强调人工智能还包括知识表示、自动推理、自然语言、视觉与机器人等；他们同时用一张四分表说明「人工智能是什么」在教科书里本就没有统一定义。[5]
        达特茅斯建议书在 1955 年已把「学习」和其他智能特征并列写入同一项研究构想，说明二者的重叠是原初的，而不是后来才出现的营销用法。[1]
        本次试图打开 AAAI 的「What is AI」页面，得到 HTTP 404，也未打开可核对的 ISO 或 IEEE 正式定义页，因此不把任何一条表述写成「官方法定定义」。
    summary: >-
      问题的关键不是找出一句可以写入词典的对照表，而是看清两套用法如何叠在一起。1955 年 8 月 31 日，McCarthy、Minsky、Rochester 与 Shannon 提交的达特茅斯夏季研究计划建议书，已经以「artificial intelligence」为题，并把研究建立在这样一条猜想上：学习或智能的任何其他特征，原则上都可以被精确描述，从而使机器能够模拟它。[1]
      Russell 与 Norvig 在《Artificial Intelligence: A Modern Approach》第四版中写道，这一名称本身是在 1956 年被创造的；他们把人工智能说成一门不仅试图理解、而且试图建造智能实体的领域，并指出它涵盖学习、感知，以及下棋、证明定理、写诗、诊断疾病等具体任务。[5]
      机器学习则把焦点收窄到「经验如何改进表现」。Mitchell 在 1997 年的教科书里把学习问题写成任务 T、表现度量 P 与经验 E 的三元组；同一书的序言把这个领域概括为如何构造会随经验自动改进的计算机程序。[4]
      早在 1959 年，Samuel 已经以「machine learning」为题，用跳棋程序展示：计算机可以被编写成学得比程序作者本人下得更好，并认为「让计算机从经验中学习，最终应能省去大量逐条编写的细节」。[3]
      因此，一个审慎的对照是：人工智能是更宽的目标与问题域；机器学习是其中一条、如今最为显赫的路径，即从数据或经验中改进。这条路径并不能穷尽历史上和今天仍然存在的其他人工智能路径，例如逻辑推理、搜索与基于规则的专家系统；反过来，达特茅斯建议书也提醒我们，学习从来就在人工智能的问题清单里，而不是后来从外面贴上去的标签。[1][2][5]
    definitions:
    - term: 人工智能（artificial intelligence, AI）
      text: >-
        McCarthy 的表述是「制造智能机器、尤其是智能计算机程序的科学与工程」；它与用计算机理解人类智能相关，但不必局限于生物学上可观察的方法。[2]
        Russell 与 Norvig 则强调，这一领域不仅试图理解、而且试图建造智能实体，并同时列出多种彼此并不等价的教科书定义。[5]
    - term: 机器学习（machine learning, ML）
      text: >-
        Mitchell 的标准定义：若一个计算机程序从经验 E 中学习，是相对于某类任务 T 和表现度量 P 而言的，则当它在 T 上按 P 衡量的表现随经验 E 改进时，就称它在学习。[4]
        用更日常的话说：不把正确行为全部预先写死，而是让程序在数据或与环境的互动中把自己做得更好。
    - term: 理性智能体（rational agent）
      text: >-
        Russell 与 Norvig 用来组织当代人工智能定义的一个理想标准：理性智能体是这样行动的系统——追求最好的结果，在不确定时则追求最好的期望结果。「理性」在这里对照的是理想化标准，而不是「是否像人」。[5]
    milestones:
    - year: 1955–1956
      name: 达特茅斯建议书与夏季研究计划
      explanation: >-
        建议书日期为 1955 年 8 月 31 日，作者为当时任职于 Dartmouth College 的 J. McCarthy、Harvard University 的 M. L. Minsky、I.B.M. Corporation 的 N. Rochester，以及 Bell Telephone Laboratories 的 C. E. Shannon。1956 年夏季的研讨会被 Russell 与 Norvig 称为这一领域的正式诞生地；建议书已把学习与其他智能特征并列写入同一猜想。[1][5]
    - year: 1959
      name: Samuel 的跳棋机器学习研究
      explanation: >-
        Arthur L. Samuel 发表《Some Studies in Machine Learning Using the Game of Checkers》，以跳棋为载体检验机器学习程序，并在摘要中声称程序可以学得比编写它的人下得更好。本次打开的是一篇公开转载，文末注明原载 IBM Journal, Vol. 3, No. 3, July, 1959；未能打开原刊页码。[3]
    - year: 1997
      name: Mitchell《Machine Learning》中的学习定义
      explanation: >-
        Tom M. Mitchell 的教科书把机器学习问题写成任务、表现与经验的三元组，成为此后教材与课程中最常被引用的形式化定义之一。[4]
    views:
    - position: 机器学习是人工智能的一个子领域，研究如何让程序凭借经验改进在指定任务上的表现；人工智能的目标与方法比「从数据中学习」更宽
      consensus_role: 教科书和经典文献中最常见的层级关系
      evidence:
        label: 一手定义与教材陈述，而非抽样调查
        note: >-
          判断依据是 McCarthy 对人工智能的界定、Mitchell 对机器学习的界定，以及 Russell 与 Norvig 把机器学习列为人工智能诸能力之一的教材结构。[2][4][5]
          这是概念上的包含关系，不是对产业用语或课程设置的统计。Samuel 的 1959 年论文表明，「机器学习」这一用语在人工智能的早期工作中已经出现。[3]
      holders:
      - name: John McCarthy
        identity: >-
          1955 年达特茅斯建议书署名作者（当时写明任职于 Dartmouth College）。本次打开的《What is Artificial Intelligence?》修订于 2007 年 11 月 12 日，文首署名为 Computer Science Department, Stanford University；同一站点 1998 年 7 月 12 日的导言页称其为 Professor of Computer Science, Stanford University。[1][2]
      - name: Tom M. Mitchell
        identity: >-
          《Machine Learning》（McGraw-Hill, 1997）作者。本次打开的是作者卡内基梅隆大学页面上公开的全书 PDF；序言中他写到自己所在的智识环境是 Carnegie Mellon，但未在本次打开的序言与第 1 章中另写正式职衔，故不以未核对的头衔称呼。[4]
      - name: Stuart J. Russell、Peter Norvig
        identity: >-
          《Artificial Intelligence: A Modern Approach》第四版（Pearson, 2021）作者。本次打开并核对的是作者在 Berkeley 站点公开的第 1 章与书前页，未在这些页上另行引用其当时任职机构。[5]
      argument: >-
        若采用 McCarthy 的说法，人工智能要回答的是如何制造智能机器，尤其是智能程序；方法不必模仿生物可观察的机制。[2]
        机器学习把其中一条路径写精确：先指定任务和衡量好坏的尺度，再问经验是否让这项尺度上升。Mitchell 的定义故意不预先规定「经验」必须是带标签的数据集，因此监督学习、强化学习等都可以落在同一格式里；但它确实把问题收窄到「表现是否随经验改进」，而不是「系统是否在任何意义上都可被称为智能」。[4]
        Russell 与 Norvig 的教材结构把这一收窄说得很清楚。在他们讨论图灵测试时，机器学习与自然语言处理、知识表示、自动推理并列，是让计算机通过测试所需的能力之一，而不是人工智能的全部；总测试还要再加上计算机视觉与机器人。[5]
        历史材料也支持「包含而非等同」。Samuel 的跳棋研究已经使用「machine learning」这一标题，讨论的是编程计算机使之从经验中学习，从而减少逐条编写；这正是后来 Mitchell 所形式化的那类问题，但它出现在人工智能的早期文献传统里，而不是在一个与人工智能无关的独立学科里。[3]
      quotes:
      - text: >-
          It is the science and engineering of making intelligent machines,
          especially intelligent computer programs.  It is related to the
          similar task of using computers to understand human intelligence,
          but AI does not have to confine itself to methods that are
          biologically observable.
        text_zh: 它是制造智能机器、尤其是智能计算机程序的科学与工程。它与用计算机理解人类智能这一相近任务有关，但人工智能不必把自己局限于生物学上可观察的方法。
        attribution: John McCarthy, What is Artificial Intelligence?
        locator: 2007 年 11 月 12 日修订版，「Basic Questions」一节对 “What is artificial intelligence?” 的回答，https://www-formal.stanford.edu/jmc/whatisai/node1.html
        ref: 2
      - text: >-
          Definition: A computer program is said to learn from experience E with respect
          to some class of tasks T and performance measure P, if its performance at tasks in
          T, as measured by P, improves with experience E.
        text_zh: 定义：一个计算机程序被称为从经验 E 中学习，是相对于某类任务 T 和表现度量 P 而言的；若它在任务类 T 上按 P 衡量的表现随经验 E 而改进，则称它在学习。
        attribution: Tom M. Mitchell, Machine Learning
        locator: 第 1 章第 1.1 节，第 2 页（McGraw-Hill, 1997）。本次打开并核对的是作者页面上的全书 PDF。
        ref: 4
      - text: >-
          A rational agent is one that acts so as to achieve the best outcome or, when there is uncertainty,
          the best expected outcome.
        text_zh: 理性智能体是这样行动的系统：追求最好的结果，在存在不确定性时，则追求最好的期望结果。
        attribution: 'Stuart J. Russell 与 Peter Norvig, Artificial Intelligence: A Modern Approach, 第 4 版'
        locator: '第 1 章第 4 页，「Acting rationally: The rational agent approach」'
        ref: 5
    - position: 人工智能没有单一官方定义，历史上也包含大量不以「从数据中学习」为中心的路径；学习与其他智能特征从一开始就被写在同一项研究计划里，因此二者的重叠是原初的，边界则始终模糊
      consensus_role: 与「机器学习是子领域」并行的补充判断，用来防止把包含关系误写成一条法定界限
      evidence:
        label: 原始建议书、教材中的定义分类，以及作者对「尚无坚实的智能定义」的直接陈述
        note: >-
          McCarthy 在同一篇面向外行的问答里写明：目前还没有一种不依赖与人类智能对照的、坚实的智能定义；智能也不是一个可以简单地用是否来回答的单一事物。[2]
          Russell 与 Norvig 用四类、八条教科书定义说明「人工智能是什么」本身就沿着思考/行为、人类/理性两条轴变化。[5]
          达特茅斯建议书把学习与语言、抽象、解题、自我改进并列，说明学习被当作人工智能问题的一个方面，而不是后来才并入的外部标签。[1]
          本次未能打开 AAAI、ISO 或 IEEE 的正式定义页，故不把任何一条表述升级为行业或法律标准。
      holders:
      - name: John McCarthy、Marvin L. Minsky、Nathaniel Rochester、Claude E. Shannon
        identity: >-
          《A Proposal for the Dartmouth Summer Research Project on Artificial Intelligence》（1955 年 8 月 31 日）的署名作者；建议书分别写明其当时所属为 Dartmouth College、Harvard University、I.B.M. Corporation、Bell Telephone Laboratories。[1]
      - name: Stuart J. Russell、Peter Norvig
        identity: 同上，第四版第 1 章对既有教科书定义的整理。[5]
      argument: >-
        若只说「机器学习是人工智能的子集」，容易让人以为存在一份大家都签字的官方清单。打开的文本并不支持这一点。McCarthy 承认，我们还不能一般地刻画哪些计算过程应当被称为智能；机器能否被称为智能，也不是一个单一的是非题。[2]
        Russell 与 Norvig 把这一点写成教材的起点：他们并没有给出唯一正确的定义，而是展示八条已有定义如何沿两个维度排列——上方关心思维与推理，下方关心行为；左侧以人类表现为成败标准，右侧以他们称为「理性」的理想智能为标准。[5]
        在这样的地图上，机器学习可以出现在不止一个格子里：它既是 Bellman 那种「与人类思维相关的活动」（其中包括学习）的一部分，也可以是理性智能体用来改进策略的手段。把人工智能等同于机器学习，会抹掉图中其余的格子，例如逻辑主义传统、搜索、知识表示，以及不以学习为核心的专家系统路线。[2][5]
        与此同时，也不宜把机器学习说成后来才出现的、与人工智能平行的另一门学科。达特茅斯建议书的开篇猜想已经把「learning or any other feature of intelligence」写在同一句话里；Russell 与 Norvig 叙述 1956 年夏季研讨班时，也把 Arthur Samuel 列为与会者之一。[1][5]
        更准确的说法是：包含关系是当前最稳妥的学术用法，但被包含的双方，其外延都随方法和时代而移动，并且从来没有一份可引用的法定定义把边界划死。
      quotes:
      - text: >-
          The study is to proceed on the basis of the conjecture
          that every aspect of learning or any other feature of intelligence can
          in principle be so precisely described that a machine can be made to
          simulate it.
        text_zh: 这项研究将基于如下猜想进行：学习或智能的任何其他特征，原则上都可以被如此精确地描述，以至于可以让机器来模拟它。
        attribution: J. McCarthy、M. L. Minsky、N. Rochester、C. E. Shannon，达特茅斯夏季研究计划建议书
        locator: 开篇第二句，日期为 August 31, 1955。本次打开并核对的是 McCarthy 在 Stanford 形式化方法站点上发布的 HTML 文本。
        ref: 1
      - text: >-
          We have claimed that AI is exciting, but we have not said what it is. Definitions of artificial
          intelligence according to eight textbooks are shown in Figure 1.1. These definitions vary
          along two main dimensions.
        text_zh: 我们声称人工智能令人兴奋，但还没有说它是什么。图 1.1 列出了八本教科书中的人工智能定义。这些定义沿两个主要维度变化。
        attribution: 'Stuart J. Russell 与 Peter Norvig, Artificial Intelligence: A Modern Approach, 第 4 版'
        locator: 第 1 章第 1 节，第 1 页；图 1.1 在第 2 页
        ref: 5
    open_parts: >-
      「机器学习是人工智能的子领域」是对打开的经典文献与教材最为吻合的层级关系，但它不是一份官方标准，也不能自动翻译成今天所有产品宣传、课程名称或招聘启事里的用法。产业话语里两者经常互换，这种用法上的混淆本身需要专门的语言调查，不在本次打开的一手文献范围内。
      McCarthy 已写明：尚不存在一种不依赖与人类智能对照的坚实智能定义。[2] 只要「智能」本身没有统一定义，人工智能与机器学习的边界就只能是工作约定，而不是已关闭的定理。
      本次未能打开 AAAI、ISO 或 IEEE 的正式定义页；若那些文件给出了不同的工作定义，需要直接核对原文，而不能由本文代为断言。
    references:
    - id: 1
