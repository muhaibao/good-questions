      url: https://arxiv.org/abs/1906.06755
- id: 2026-11-11-biz-gdp-constant
  date: '2026-11-11'
  category: business
  title_zh: 为什么美国人均 GDP 的长期增长率如此「诡异地」恒定？
  title_en: Why is GDP growth so weirdly constant?
  commentary: 大萧条、两次世界大战、计算机革命都没能让美国人均 GDP 的长期趋势线拐弯——这一事实是所有现代增长理论的「地基」，却也让人追问：到底是什么在决定那条斜率？
  source_name: Patrick Collison — Questions
  source_url: https://patrickcollison.com/questions
  author: Patrick Collison
  source_type: curated
  tags:
  - 经济增长
  - 平衡增长路径
  - 创意生产函数
  - 宏观经济
  answer:
    format: scholarly
    reviewed_at: '2026-11-11'
    consensus:
      label: 「美国前沿增长约 2%、长期稳定」是公认的典型事实；「为何稳定」有主流解释但存在争议
      note: Jones 在《宏观经济学手册》中把「近 150 年美国人均 GDP 以约每年 2% 的速度非常稳定地增长」列为前沿增长的关键典型事实，并指出所有现代增长理论都是以此为前提设计的。[2]
        但对稳定性的解释——是真正的稳态，还是若干力量恰好相互抵消——学界并不一致；Jones 本人的研究倾向后者。[4][5][6]
    summary: Patrick Collison 注意到：把过去约 150 年美国 GDP 取对数画出来，几乎是一条直线；他追问斜率由什么决定、是否意味着「几乎没有什么能在长期影响经济」，以及为何国家之间的增长又差异很大。[1]
      事实层面，Jones 的整理显示：1870–2007 年美国人均 GDP 年均增长 2.03%，1900–1950 年为 2.06%，1950–2007 年为 2.16%；大萧条虽使人均 GDP
      四年内下降近 20%，但只是暂时的。[2] 解释层面主要有三类：（1）新古典与内生增长模型以「平衡增长路径」为核心，把恒定增长当作稳态的特征，其中长期增长来自技术/创意进步；[2] （2）Jones
      等人认为美国其实并不在稳态：受教育程度和研发强度几十年来持续上升，这类「转移动态」解释了近期增长的大部分，而它们恰好抵消了「创意越来越难找」带来的研究生产率下降；[5][6][7] （3）国家层面的增长率在十年尺度上几乎不相关（相关系数仅
      0.1–0.3），说明「稳定」主要是前沿经济体在长期平均后的现象，而非普遍规律。[8] 从更长的历史看，持续指数增长本身只是近两个世纪的现象。[2]
    definitions:
    - term: 平衡增长路径（balanced growth path）
      text: 所有经济变量都以恒定指数速率增长的状态。Jones 指出，美国长期增长的稳定性比任何其他事实都更能为增长模型聚焦平衡增长路径提供理由。[2]
    - term: Kaldor 典型事实
      text: Nicholas Kaldor（1961）概括的若干长期规律，例如人均产出持续增长、资本—产出比和实际利率没有明显趋势等；Jones（2002）把它们作为「美国接近稳态」这一传统观点的依据加以引用。[3][5]
    - term: 创意生产函数与研究生产率
      text: 在创意驱动的增长模型中，增长率可以分解为「研究生产率 × 有效研究人数」。Bloom 等人发现研究投入大幅上升而研究生产率急剧下降。[7]
    milestones:
    - year: '1956'
      name: Solow 新古典增长模型
      explanation: 长期人均增长由外生技术进步决定，资本积累只影响水平。Jones 把 Solow（1956）列为以「稳定指数增长」为设计前提的现代增长理论之首。[2]
    - year: '1995'
      name: Jones 的「规模效应」时间序列检验
      explanation: Jones 指出：若增长率与研发人员数量成正比（早期内生增长模型的「规模效应」），那么二战后研发人员的大幅增长应使增长率显著上升，而数据中没有出现这种上升。[4][5]
        一句话：研究的人多了好几倍，增长率却没变。
    - year: '2002'
      name: 「远离稳态」的解释
      explanation: Jones 构建模型调和「教育与研发强度持续上升」与「增长率稳定」两者，增长核算显示这些因素解释了近期美国增长的约 80%，来自世界人口增长的不足 20%。[5]
    - year: '2020'
      name: 「创意越来越难找」
      explanation: Bloom、Jones、Van Reenen 与 Webb 以摩尔定律为例：如今维持芯片密度翻倍所需的研究人员是 1970 年代初的 18 倍以上。[7]
    views:
    - position: 稳定增长反映前沿经济体处在（或近似处在）平衡增长路径上
      consensus_role: 传统主流框架
      evidence:
        label: 长期时间序列与典型事实
        note: 证据主要是描述性的长期序列与 Kaldor 事实；它与理论高度契合，但并不能独立证明「稳态」是正确解释。[2][3]
      holders:
      - name: Charles I. Jones（作为事实的整理者）
        identity: 斯坦福大学商学院教授、NBER 研究员（据《The Facts of Economic Growth》所署单位）。[2]
      argument: Jones 在《宏观经济学手册》第 2A 卷中总结：「150 年稳定、持续的指数增长」是前沿的关键特征，Solow（1956）、Lucas（1988）、Romer（1990）与
        Aghion–Howitt（1992）等所有现代增长理论都以此为前提。[2] 在这种框架里，技术进步的速度决定斜率，而大多数冲击（包括大萧条）只影响水平或造成暂时偏离，这正是 Collison
        观察到「几乎什么都不改变长期趋势」的理论版本。[1][2] Jones 同时提醒，平衡增长路径的逻辑暗示增长可以无限持续，但其他事实与理论让人质疑这一逻辑。[2]
      quotes:
      - text: For nearly 150 years, GDP per person in the US economy has grown at a remarkably steady
          average rate of around 2% per year.
        text_zh: 近 150 年来，美国经济的人均 GDP 以每年约 2% 的、非常稳定的平均速度增长。
        attribution: Charles I. Jones，The Facts of Economic Growth
        locator: Handbook of Macroeconomics 第 2A 卷第 5 页（作者 PDF 第 3 页）
        ref: 2
    - position: 稳定是「多种力量恰好抵消」的结果，美国并不在稳态
      consensus_role: 有影响力的修正观点
      evidence:
        label: 模型 + 增长核算，依赖创意生产函数设定
        note: 结论依赖于半内生增长模型的假设（如增长最终由研究人员增长驱动），核算结果会随参数而变；但「研究投入上升、研究生产率下降」的证据在多个行业中被记录。[5][6][7]
      holders:
      - name: Charles I. Jones
        identity: 《Sources of U.S. Economic Growth in a World of Ideas》（AER 2002）作者，撰写时所署单位为加州大学伯克利分校。[5]
      - name: John G. Fernald
        identity: 与 Jones 合著 NBER 工作论文 19830，所署单位为旧金山联邦储备银行研究部。[6]
      - name: Nicholas Bloom、John Van Reenen、Michael Webb
        identity: 与 Jones 合著《Are Ideas Getting Harder to Find?》（AER 2020）；文中所署单位分别为斯坦福大学、MIT/LSE、斯坦福大学。[7]
      argument: Jones（2002）指出，受教育时间与研发强度在至少 50 年里大幅上升：1940 年美国成年人中高中毕业者不足 25%，1993 年超过 80%；美国劳动力中科学家与工程师的比例从
        1950 年约 0.25% 升到 1993 年超过 0.75%。在几乎任何增长模型里，这都应提高增长率，但美国人均 GDP 增长率在 125 年间出奇地稳定。[5] 他的调和办法是：长期增长取决于全世界的创意发现（最终取决于人口增长），但只要研发强度和教育水平持续上升，增长可以在一段时间内以更快的恒定速率进行。[5]
        Fernald 与 Jones 据此估计，1950 年以来超过 3/4 的增长反映了教育与研发强度的上升，随着这些转移动态消退，美国增长可能在某个时点放缓。[6] Bloom 等人则从另一侧给出证据：研究生产率在急剧下降，靠研究人员数量的增加才维持了增长。[7]
        也就是说，那条直线可能是「越来越难找的创意」与「越来越多的研究者」的巧合平衡。
      quotes:
      - text: Nevertheless, constant growth can temporarily proceed at a faster rate, provided research
          intensity and educational attainment rise steadily over time.
        text_zh: 尽管如此，只要研发强度和受教育程度随时间稳步上升，恒定增长就可以暂时以更快的速度进行。
        attribution: Charles I. Jones，AER（2002）
        locator: 摘要，第 220 页
        ref: 5
      - text: Modern growth theory suggests that more than 3/4 of growth since 1950 reflects rising educational
          attainment and research intensity.
        text_zh: 现代增长理论表明，1950 年以来超过 3/4 的增长反映的是受教育程度和研发强度的上升。
        attribution: John G. Fernald 与 Charles I. Jones，NBER Working Paper 19830
        locator: 摘要
        ref: 6
    - position: 「恒定」主要是前沿经济体的长期平均现象，单个国家的增长率高度不稳定
      consensus_role: 重要限定
      evidence:
        label: 跨国面板数据
        note: Easterly 等人的结果基于 1993 年前后的跨国数据；它说明国别增长受冲击影响很大，但不直接否定美国序列的稳定性。[8]
      holders:
      - name: William Easterly、Michael Kremer、Lant Pritchett、Lawrence H. Summers
        identity: NBER 工作论文 4474《Good Policy or Good Luck?》作者；Easterly 所署单位为世界银行，Kremer 为 MIT。[8]
      argument: Easterly 等人发现，各国增长率跨十年的相关系数只有 0.1–0.3，而教育水平、政治稳定性等国家特征的跨十年相关系数为 0.6–0.9；冲击（尤其贸易条件冲击）在解释增长方差中作用很大。[8]
        他们提出两种可能：要么冲击相对于国家特征对长期增长很重要，要么全球技术进步决定长期增长、国家特征决定相对收入水平。[8] 后一种解读与「前沿增长稳定」相容：美国的直线可能反映的是全球前沿技术进步的速度。Collison
        原问题也指出，国家之间的增长无论短期还是长期都差异很大。[1] 再往前看，Jones 整理的 Maddison 数据显示，公元 1 年到 1820 年「西方」人均生活水平只是大约翻倍，持续指数增长是极为晚近的现象。[2][9]
      quotes:
      - text: However, growth rates are highly unstable over time, with a correlation across decades of
          .1 to .3, while country characteristics are stable, with cross-decade correlations of .6 to
          .9.
        text_zh: 然而，增长率随时间高度不稳定，跨十年的相关系数仅为 0.1 至 0.3；而国家特征是稳定的，其跨十年相关系数为 0.6 至 0.9。
        attribution: Easterly、Kremer、Pritchett 与 Summers，NBER Working Paper 4474
        locator: 摘要
        ref: 8
    open_parts: 第一，美国增长的稳定性究竟是深层稳态，还是若干趋势的暂时抵消，仍无定论；若是后者，教育与研发强度上升放缓后增长可能减速。[5][6] 第二，创意生产函数的形状决定了增长的未来，Fernald
      与 Jones 特别指出人工智能若能在一定程度上替代研究劳动，可能带来更高增长，这是根本不确定性。[6] 第三，为什么冲击（大萧条、战争）对美国长期趋势影响如此之小、而对许多其他国家却有持久影响，尚缺统一解释。[2][8]
      第四，长期 GDP 序列本身依赖历史国民账户重建，其早期数据的精度也是讨论的一部分。[9]
    references:
