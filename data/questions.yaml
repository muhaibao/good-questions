- id: 2026-11-22-sci-sleep
  date: '2026-11-22'
  category: science
  title_zh: 我们为什么要睡觉？
  title_en: Why sleep?
  commentary: 睡眠占去生命的三分之一，大脑在其中却并不关机。把「休息」说成全部答案，反而让这个日常事实变得更难解释。
  source_name: Edge.org Annual Question 2002
  source_url: https://www.edge.org/response-detail/11624
  author: Terrence J. Sejnowski
  source_type: curated
  tags:
  - 睡眠
  - 记忆巩固
  - 突触稳态
  - 代谢
  answer:
    format: scholarly
    reviewed_at: '2026-11-22'
    consensus:
      label: 睡眠对健康与认知很重要，长期剥夺可造成严重甚至致死的后果，这一点有明确的实验证据；但「睡眠的功能究竟是什么」仍没有一个被普遍接受的单一答案。单纯的休息说并不完整；记忆巩固、突触稳态、代谢清除、以及节能与适应等，是主要的竞争或互补假说
      note: >-
        Sejnowski 在 2002 年已写明：尽管睡眠重要，其目的仍是一个谜；大脑在睡眠中保持高度活动，因此「为了休息」不可能是全部故事。[1]
        Rechtschaffen 与 Bergmann 回顾大鼠盘上脱水（disk-over-water）剥夺实验，确认延长的完全睡眠剥夺若不被中止，大鼠通常在约两至三周内死亡或出现濒死征象；但他们也写明，并未找到明确的死亡原因，因而这一戏剧性结果本身并没有告诉我们睡眠何以必要。[2]
        Siegel 认为，尽管有人主张睡眠具有跨物种的普遍生理功能，对此功能是什么并没有共识。[3]
        记忆巩固、突触稳态与代谢清除是此后文献中影响很大的正面假说，但各自仍有未决问题和竞争解释。[4][5][6]
    summary: >-
      2002 年，Sejnowski 把问题写成：我们每天都要睡，为什么要把生命的三分之一花在这种蛰伏状态里？睡眠剥夺会损害判断、损害健康，最终导致死亡；可是目的仍然不明。他又指出，睡眠中的大脑保持高度活动，因此「我们睡觉是为了休息」这一简单说法不可能是全部故事，并猜测慢波睡眠可能是结构重组、把白天获得的信息整合进长期记忆的时间。[1]
      后续与同时期的一手研究并没有把这个猜测变成一条已被普遍接受的定律，但把问题的层次分得更清楚了。一方面，睡眠看起来确是生物必需：在大鼠中，受控的长期睡眠剥夺会稳定地导致体重下降（尽管进食增加）、皮肤损伤、能量消耗升高等综合征，并在数周内致死；作者在 2002 年的回顾里仍承认，他们远远没有发现自己希望知道的「睡眠何以必要」。[2]
      另一方面，关于「普遍功能是什么」，假说很多而且并不都互相兼容。Siegel 把睡眠看作与植物和动物中广泛存在的蛰伏状态相连续的一种适应性不活动，认为它通过安排行为的时机并在活动无益时节约能量而提高效率；他同时写明，主张存在某种尚未发现的普遍重要功能，并没有共识。[3]
      在脑功能一侧，至少有三条经常被讨论的线索。Rasch 与 Born 综述了百余年的「睡眠与记忆」研究，认为当前理论强调睡眠中的系统巩固：慢波睡眠中的再激活把新编码的表征转化并整合进长期记忆，随后的 REM 睡眠可能使之稳定；这与「睡眠只是被动地避开干扰」的较早说法形成对照。[4]
      Tononi 与 Cirelli 的突触稳态假说（SHY）则主张，睡眠是大脑为可塑性付出的代价：觉醒中的学习使突触净增强，睡眠再通过下调使能量、空间和学习能力恢复。[5]
      Xie 等人则报告，自然睡眠或麻醉使小鼠脑内细胞间隙约增加 60%，从而加速脑脊液与组织间液的对流交换，提高 β-淀粉样蛋白等代谢废物的清除；他们提出，睡眠的恢复作用可能部分来自清除清醒时积累的潜在神经毒性产物。[6]
      这些假说可以竞争，也可以在不同层次上互补；目前没有哪一条已经单独解释了跨物种的睡眠时间差异、睡眠中的丰富脑活动、以及剥夺后的全部病理。Sejnowski 关于记忆整合的提议，应放在这条仍在展开的证据脉络里来看，而不是当成已被证实的定律。
    definitions:
    - term: 突触稳态假说（synaptic homeostasis hypothesis, SHY）
      text: Tononi 与 Cirelli 提出：睡眠的基本功能是恢复突触稳态。觉醒中的学习（以及发育中的突触生成）使突触强度增加，带来能量与供给负担、信噪比下降并饱和学习能力；睡眠中的自发活动使净突触强度重新归一，从而恢复细胞稳态并有助于记忆的巩固与整合。[5] 他们把它概括为：睡眠是「我们为可塑性付出的代价」。
    - term: 系统巩固（system consolidation）
      text: Rasch 与 Born 用来描述当前主流记忆理论的一个过程：新编码的神经元记忆表征在慢波睡眠中被再激活，从而被转化并整合进长期记忆；随后的 REM 睡眠可能使转化后的记忆稳定下来。[4] 这与把睡眠仅仅看成避开干扰的「被动」保护不同。
    - term: 适应性不活动（adaptive inactivity）
      text: Siegel 的提法：睡眠最好被理解成动植物界广泛存在的蛰伏状态的一个变体，其本身是高度适应的，因为它优化行为的时机与持续时间，并在活动并无益处时降低能量使用。[3]
    milestones:
    - year: '1989'
      name: 大鼠睡眠剥夺系列实验的综合
      explanation: Rechtschaffen 等人用 disk-over-water 方法完成大鼠完全睡眠剥夺与异相睡眠剥夺的系列研究，并在 1989 年发表综合讨论。他们 2002 年的更新确认了死亡、体重与能量消耗变化、外观与皮肤损伤等主要效应，同时强调功能与死因仍未阐明。[2]
    - year: '2002'
      name: Sejnowski 提出「为什么要睡觉」
      explanation: 在 Edge 年度问题中指出休息说不完整，并猜想慢波睡眠中可能发生结构重组与长期记忆整合。[1]
    - year: '2009'
      name: Siegel 将睡眠视为适应性不活动
      explanation: 在《Nature Reviews Neuroscience》的Perspective中论证：睡眠时长与强度的主要决定因素是生态学变量，并不存在已被确认的单一普遍生理功能。[3]
    - year: '2013'
      name: 记忆巩固综述与代谢清除实验
      explanation: Rasch 与 Born 发表关于睡眠与记忆的长篇综述；[4] 同年 Xie、Nedergaard 等人报告睡眠期间脑内代谢废物清除加快。[6] Tononi 与 Cirelli 在 2014 年的《Neuron》综述中系统重述并扩展了突触稳态假说。[5]
    views:
    - position: 睡眠是生物必需的，但「为了休息」不能解释全部现象，其功能至今没有单一被普遍接受的答案
      consensus_role: 对问题现状的审慎判断，得到睡眠剥夺实验与功能综述的支持
      evidence:
        label: 受控动物剥夺实验的回顾，以及关于功能共识的综述判断
        note: >-
          Sejnowski 的短文是 2002 年 Edge 上的提问与评论，不是实验报告。[1]
          Rechtschaffen 与 Bergmann 2002 年的更新发表于 Sleep 25(1):18–24，回顾并确认 1989 年系列实验的主要发现；作者写明自己当时已退休、实验室已关闭。官方 Oxford 的 article-pdf 本次返回 403，journalsleep.org 返回 500/404；本次打开并核对的是带有 Oxford 下载标记（Downloaded from https://academic.oup.com/sleep/article/25/1/18/2750067）的出版社 PDF 副本。[2]
          Siegel 的文章是 2009 年的 Perspective，不是一项新的剥夺实验；「没有共识」是作者对当时文献的判断。[3]
      holders:
      - name: Terrence J. Sejnowski
        identity: 据 2002 年 Edge 原文署名：Computational Neuroscientist；Francis Crick Professor, the Salk Institute；Investigator, Howard Hughes Medical Institute；与 Patricia Churchland 合著《The Computational Brain》。[1]
      - name: Allan Rechtschaffen、Bernard M. Bergmann
        identity: '《Sleep Deprivation in the Rat: An Update of the 1989 Paper》（Sleep, 2002）作者，单位署为芝加哥大学精神病学与心理学系。[2]'
      - name: Jerome M. Siegel
        identity: >-
          《Sleep viewed as a state of adaptive inactivity》（Nature Reviews Neuroscience, 2009）作者。文中作者信息将其署于加州大学医学院精神病学系，通讯地址为退伍军人事务部大洛杉矶医疗系统（Veterans Affairs Greater Los Angeles Healthcare System, North Hills, California）。[3]
      argument: >-
        Sejnowski 把日常事实收成一个尖锐的问题：既然必须每天睡，而且剥夺会通向判断力丧失、健康损害乃至死亡，为什么还要把这么多时间交给一种蛰伏状态？他又立刻堵上最省事的答案：睡眠中的脑并没有停下来，因此「休息」不能是全部故事。[1]
        大鼠实验把「必需」说得更硬。Rechtschaffen 与 Bergmann 确认：若完全睡眠剥夺不被中止，所有被剥夺的大鼠都死亡或出现濒死征象，通常约在两至三周；异相睡眠剥夺的死亡则约在四至六周被确认。[2] 但在概述里，他们把主要贡献写成：至少在大鼠中，受控实验表明睡眠和异相睡眠是生物学必需，长期睡眠缺失会可靠地产生一组特定而显著的生理改变；同时承认，他们远没有发现自己希望知道的「睡眠何以必要」——死亡本身是非特异症状，而他们又没有找到明确的死因，因此这一最戏剧的结果并没有多告诉我们睡眠为什么必要。[2]
        Siegel 则从比较与生态的角度写明：虽然有人提出睡眠具有跨所有物种的普遍生理功能，对于那一功能可能是什么，并没有共识；功能理论数量很多，没有哪一种已被很好地确立。[3]
        把这三份文献放在一起：必要性有证据，单一功能没有定论；休息说在 2002 年就已经不够用了。
      quotes:
      - text: >-
          Despite the importance of sleep its purpose is a mystery.
        text_zh: 尽管睡眠很重要，它的目的却仍是一个谜。
        attribution: Terrence J. Sejnowski，Why Sleep?，Edge.org Annual Question 2002
        locator: 正文第一段末句
        ref: 1
      - text: >-
          The brain remains highly active during sleep, so the simple explanation that
          we sleep in order to rest cannot be the whole story.
        text_zh: 大脑在睡眠期间保持高度活动，因此「我们睡觉是为了休息」这一简单解释不可能是全部故事。
        attribution: Terrence J. Sejnowski，Why Sleep?，Edge.org Annual Question 2002
        locator: 正文第二段首句
        ref: 1
      - text: >-
          Certainly, we did not discover anywhere near as much as we would have liked
          about why sleep is necessary. The deaths of the sleep deprived rats were the
          most dramatic consequences of sleep deprivation, but since death per se is
          such a nonspecific symptom, and since we did not find an unambiguous cause
          of death, that dramatic symptom did not tell us much about why sleep was
          necessary.
        text_zh: 当然，关于睡眠何以必要，我们远没有发现自己希望知道的那么多。被剥夺睡眠的大鼠之死亡，是睡眠剥夺最戏剧性的后果；但是，由于死亡本身是如此非特异的症状，而我们又没有找到明确的死因，这一戏剧性的症状并没有多告诉我们睡眠为什么必要。
        attribution: 'Allan Rechtschaffen 与 Bernard M. Bergmann，Sleep Deprivation in the Rat: An Update of the 1989 Paper'
        locator: Overview 一节，Sleep 25(1), 2002，第 22–23 页
        ref: 2
      - text: >-
          Although it has been proposed that sleep has a universal physiological function
          across all species, there is no consensus as to what that function might be.
        text_zh: 尽管有人提出，睡眠在所有物种中具有一种普遍的生理功能，但对于那一功能可能是什么，并没有共识。
        attribution: Jerome M. Siegel，Sleep viewed as a state of adaptive inactivity
        locator: 引言第 2 段，Nature Reviews Neuroscience，2009 年 Advance Online Publication 第 1 页
        ref: 3
    - position: 睡眠的一项重要功能是记忆巩固与整合：慢波睡眠中的再激活把新信息转化进长期记忆；这与 Sejnowski 2002 年的猜想方向一致，但应视为仍在发展的证据传统，而不是已证实的唯一定律
      consensus_role: 睡眠与记忆领域近几十年的主流积极假说之一，有大量实验与综述支持，同时与其他功能假说并存
      evidence:
        label: 长篇权威综述对历史与近期发现的综合，以及 2002 年的前瞻性猜想
        note: >-
          Rasch 与 Born 的文章发表于 Physiological Reviews 93(2):681–766（2013）。本次打开的是 PMC 提供的全文（PMC3768102）；其摘要与正文引言可逐字核对。作者在摘要中给出的是对领域的总体阅读，不是单次新实验。[4]
          Sejnowski 的记忆整合想法在原文中以问句提出（「会不会我们每晚睡觉是为了记得更好、想得更清楚？」），应当保持这一语气，不应改写成已经证实的结论。[1]
          本次未能在 PMC 抽取页中核对他二人当时的任职机构，故身份只按其作为该综述作者来写。
      holders:
      - name: Björn Rasch、Jan Born
        identity: 《About Sleep's Role in Memory》（Physiological Reviews, 2013）作者。[4]
      - name: Terrence J. Sejnowski
        identity: 在 2002 年 Edge 短文中提出慢波睡眠可能发生结构重组与长期记忆整合的问题。[1]
      argument: >-
        Sejnowski 写到，计算机模型与当时的实验证据指向：慢波睡眠可能是脑细胞进行广泛结构重组的时间；白天获得的信息需要许多小时，才能通过生化反应被整合进长期记忆。[1] 这是一个有方向的假说，不是一条定律。
        十一年后，Rasch 与 Born 把「睡眠有益于记忆保持」写成一个已有一个多世纪研究确立的事实，并区分了两种理论图景：较早的说法给睡眠一种被动角色——主要是保护记忆免受干扰；当前理论则强调一种主动角色，即记忆在睡眠中经历系统巩固。[4]
        他们概括的较新图景是：睡眠是优化记忆巩固的脑状态，相对地，清醒的脑被优化用于编码；巩固起源于对最近编码之神经元记忆表征的再激活，这些再激活发生在慢波睡眠中，并把相应表征转化以整合进长期记忆；随之而来的 REM 睡眠可能使转化后的记忆稳定下来。[4]
        这一传统解释了为什么「休息」不够：若关键步骤是离线再激活与系统重排，睡眠中高度有序的脑活动就不再是反证，而可能是机制本身。即便如此，综述处理的主要是记忆这一条线，并不宣称它排除了代谢、稳态或生态解释；对不同记忆系统、睡眠阶段与物种的外推，仍是开放的。
      quotes:
      - text: >-
          Computer models of the sleeping brain and recent experimental evidence point
          toward slow-wave sleep as a time during which brain cells undergo extensive
          structural reorganization. It takes many hours for the information acquired
          during the day to be integrated into long-term memory through biochemical
          reactions. Could it be that we go to sleep every night in order to remember
          better and think more clearly?
        text_zh: 睡眠脑的计算机模型与近期的实验证据，指向慢波睡眠是脑细胞进行广泛结构重组的时间。白天获得的信息需要许多小时，才能通过生化反应被整合进长期记忆。会不会我们每天晚上去睡觉，是为了记得更好、想得更清楚？
        attribution: Terrence J. Sejnowski，Why Sleep?，Edge.org Annual Question 2002
        locator: 正文倒数第二段
        ref: 1
      - text: >-
          Specifically, newer findings characterize sleep as a brain state optimizing
          memory consolidation, in opposition to the waking brain being optimized for
          encoding of memories. Consolidation originates from reactivation of recently
          encoded neuronal memory representations, which occur during SWS and transform
          respective representations for integration into long-term memory. Ensuing REM
          sleep may stabilize transformed memories.
        text_zh: 具体而言，较新的发现把睡眠刻画为优化记忆巩固的脑状态，相对地，清醒的脑被优化用于记忆的编码。巩固起源于对最近编码的神经元记忆表征的再激活，这些再激活发生在慢波睡眠（SWS）期间，并把相应的表征转化以整合进长期记忆。随之而来的 REM 睡眠可能使转化后的记忆稳定下来。
        attribution: Björn Rasch 与 Jan Born，About Sleep's Role in Memory
        locator: 摘要，Physiological Reviews 93(2), 2013
        ref: 4
    - position: 睡眠也可能是为了恢复突触与细胞稳态，或加速清除清醒时积累的代谢废物；从生态学看，它还可以被理解成节约能量、安排行为时机的适应性不活动
      consensus_role: 与记忆巩固并列的主要竞争或互补假说，各自有代表性文献，但都尚未成为唯一被接受的总答案
      evidence:
        label: 假说综述、小鼠实验与比较神经科学的 Perspective
        note: >-
          Tononi 与 Cirelli 2014 年文章是对 SHY 的长篇综述，发表于 Neuron 81(1):12–34。本次打开了 PMC 全文（PMC3921176，作者稿）以及一份大学课程提供的 NIHMS PDF 副本；引文按 PMC 作者稿的 Summary 与开篇核对，页码标为正式刊本的起始部分，以免作者稿与期刊页码错位。[5]
          Xie 等人 2013 年的报告发表于 Science 342(6156):373 页起。本次打开了 PMC 全文（PMC3880190）以及科学排印本 PDF（第 373 页摘要可逐字核对）。「60%」与清除加快是在活体小鼠中、以扩散测量和双光子成像得到的结果，外推到人类或「睡眠的全部恢复作用」需要谨慎。[6]
          Siegel 2009 年的适应性不活动说是对比较与生态证据的解释性综合，不是对单一机制的实验证明；他在 Box 2 中明确写到，已提出的功能理论很多，没有哪一种已被很好地确立。[3]
      holders:
      - name: Giulio Tononi、Chiara Cirelli
        identity: 《Sleep and the Price of Plasticity》（Neuron, 2014）作者，通讯单位署为威斯康星大学麦迪逊分校精神病学系。[5]
      - name: Lulu Xie、Maiken Nedergaard 等
        identity: >-
          《Sleep Drives Metabolite Clearance from the Adult Brain》（Science, 2013）作者。据该文，第一作者与通讯作者 Maiken Nedergaard 等主要署美国罗切斯特大学医学中心神经外科、胶质疾病与治疗分部（Center for Translational Neuromedicine）；Charles Nicholson 署纽约大学。[6]
      - name: Jerome M. Siegel
        identity: 《Sleep viewed as a state of adaptive inactivity》（Nature Reviews Neuroscience, 2009）作者。[3]
      argument: >-
        若记忆巩固是「把新的东西装进去」，突触稳态假说问的是另一个问题：不断学习之后，突触如何不至于过强、过耗能、再学不动。Tononi 与 Cirelli 提出，觉醒时为了学习当前环境中的统计规律，需要在全脑范围内增强连接；这增加细胞的能量与补给需求，降低信噪比并饱和学习。睡眠中的自发活动使净突触强度重新归一，恢复细胞稳态；按活动依赖的方式选择性地下调突触，也可以解释睡眠对记忆获得、巩固与整合的益处。[5] 他们把这一功能写成：睡眠是大脑为可塑性付出的代价。[5]
        Xie 等人则从代谢稳态切入。他们报告，自然睡眠或麻醉与细胞间隙约 60% 的增加相关，脑脊液与组织间液的对流交换显著增强，从而加快睡眠期间 β-淀粉样蛋白的清除；据此提出，睡眠的恢复功能可能是增强清除清醒中枢神经系统中积累的潜在神经毒性废物的结果。[6] 这是针对小鼠的机制性证据，说明「休息」也可以指一种在清醒时不便完成的清理过程，但它并不自动解释梦、记忆再激活或跨物种的睡眠时长差异。
        Siegel 提醒第三条轴线：也许不必先假定有一种尚未发现的、对所有动物都至关重要的生理修复，才能理解睡眠何以保存下来。他主张，睡眠通过安排行为时机、并在活动无益时减少能量使用来提高行为效率，最好被看作广泛存在的蛰伏状态之一；当前证据表明，生态学变量是跨物种睡眠时长与强度的主要决定因素。[3] 他同时指出，已提出的功能理论很多，彼此有的互相排斥，有的未必不能共存，但没有哪一种已被很好地确立。[3]
        因此，记忆、稳态、解毒与节能可以同时为真，也可以只在某些物种、某些睡眠阶段或某种时间尺度上为真。把其中任何一条写成「我们睡觉的原因」，都超出了这些文献各自的证明范围。
      quotes:
      - text: >-
          The synaptic homeostasis hypothesis (SHY) proposes that sleep is the price
          the brain pays for plasticity.
        text_zh: 突触稳态假说（SHY）提出：睡眠是大脑为可塑性付出的代价。
        attribution: Giulio Tononi 与 Chiara Cirelli，Sleep and the Price of Plasticity
        locator: Summary 首段，Neuron 81(1), 2014（PMC 作者稿；正式刊本第 12 页起）
        ref: 5
      - text: >-
          Thus, the restorative function of sleep may be a consequence of the enhanced
          removal of potentially neurotoxic waste products that accumulate in the awake
          central nervous system.
        text_zh: 因此，睡眠的恢复功能，可能是增强清除那些在清醒的中枢神经系统中积累的、具有潜在神经毒性的废物的结果。
        attribution: Lulu Xie、Maiken Nedergaard 等，Sleep Drives Metabolite Clearance from the Adult Brain
        locator: 摘要末句，Science 342(6156), 2013, 第 373 页
        ref: 6
      - text: >-
          A large number of theories of sleep function have been proposed, but none is
          well established. Many theories seem to be mutually exclusive, whereas others
          might not be incompatible.
        text_zh: 已经提出了大量关于睡眠功能的理论，但没有哪一种是被很好地确立的。许多理论看起来互相排斥，而另一些则未必不能兼容。
        attribution: Jerome M. Siegel，Sleep viewed as a state of adaptive inactivity
        locator: Box 2 “Some theories of sleep function”，Nature Reviews Neuroscience, 2009
        ref: 3
    open_parts: >-
      睡眠功能是否必须是单一的、在所有物种中相同的，本身就是未决问题：Rechtschaffen 与 Bergmann 已指出，把大鼠结果外推到其他物种的证据相当混杂，而他们的方法也主要适用于体型相近的动物。[2] Siegel 则强调跨物种睡眠时长差异极大，并认为这更支持生态学解释。[3]
      记忆巩固、突触稳态与胶质淋巴/代谢清除是否描述同一过程的不同层面，还是部分独立的功能，仍待更直接的实验裁决；本次打开的文献提出了各自的机制，但没有提供统一的终审。[4][5][6]
      人类致命性失眠、睡眠阶段（慢波与 REM）的不同贡献、以及发育与衰老中的变化，都可能要求比「一个功能」更细的答案。Sejnowski 的记忆整合提议与后来的系统巩固综述方向一致，但 2002 年文本本身只是猜想，不应被写成已经证实。[1][4]
    references:
    - id: 1
      citation: >-
        Sejnowski, T. J. (2002). Why Sleep? Edge.org Annual Question 2002: “What is your
        question? ... Why?”
      url: https://www.edge.org/response-detail/11624
    - id: 2
      citation: >-
        Rechtschaffen, A., & Bergmann, B. M. (2002). Sleep deprivation in the rat: An update
        of the 1989 paper. Sleep, 25(1), 18–24. 该文回顾的 1989 年综合报告为 Rechtschaffen, A.,
        Bergmann, B. M., Everson, C. A., Kushida, C. A., & Gilliland, M. A. (1989). Sleep
        deprivation in the rat: X. Integration and discussion of the findings. Sleep, 12(1),
        68–87。本次打开的是带 Oxford 下载标记的出版社 PDF 副本；官方 article-pdf 本次未能直接下载。
      url: https://academic.oup.com/sleep/article/25/1/18/2750067
    - id: 3
      citation: >-
        Siegel, J. M. (2009). Sleep viewed as a state of adaptive inactivity. Nature Reviews
        Neuroscience, 10(10), 747–753. https://doi.org/10.1038/nrn2697
        本次核对使用加州大学洛杉矶分校 Semel Institute 提供的作者 PDF。
      url: https://teams.semel.ucla.edu/sites/default/files/publications/09%20phylogeny%20Nature%20Reviews%20Neuroscience%20Siegel.pdf
