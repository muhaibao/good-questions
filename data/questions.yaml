- id: 2026-11-24-biz-real-incomes
  date: '2026-11-24'
  category: business
  title_zh: 自 1950 年代以来，实际收入是否大幅下降了？
  title_en: Did real incomes drop significantly since the 1950s?
  commentary: >-
    「以前一个工人就能养家买房」是很强的记忆，但记忆不是序列。把中位数与平均数、工资与家庭总资源、税前市场收入与税后加转移支付、以及所用价格指数逐一摊开，答案会从「是或否」变成「取决于你在测量什么」。
  source_name: Economics Stack Exchange
  source_url: https://economics.stackexchange.com/questions/39251/did-real-incomes-drop-significantly-since-the-1950s
  author: MWB
  source_type: stackexchange
  tags:
  - 实际收入
  - 工资
  - 不平等
  - 收入分配
  answer:
    format: scholarly
    reviewed_at: '2026-11-24'
    consensus:
      label: >-
        就美国官方住户与全职全年工作者的普查序列而言，自 1950 年代中期或 1960 年代以来，实际中位收入并没有「大幅下降」，而是有明显上升；但 1970 年代之后男性全职收入增长显著放缓，平均数快于中位数，且不同研究因收入定义和价格指数，对 1980 年前后下半部分人群的判断存在实质性分歧
      note: >-
        原问题明确针对 1950 年代以来的美国，并询问实际收入是否显著下降。美国普查局历史收入表 H-5、P-36、P-38 提供了可核对的官方水平（以 2025 年美元计，2000 年起用 C-CPI-U，2000 年前用 R-CPI-U-RS）。这些序列的起点并不都是 1950 年：住户中位数自 1967 年，全职全年工作者的中位个人收入自 1955 年，中位个人劳动所得自 1960 年。[2][3][4]
        国会预算办公室把分析起点放在 1979 年，并同时报告税前（含社会保险）与税后加转移支付的住户收入；其 2024 年趋势文件的文字结论是：1979–2021 年各五等分的平均收入在两种口径下都增长了，但最高五等分增长最多，不平等上升，转移支付和联邦税对不平等的抑制程度也在增强。具体累计增长率印在图表中，本次未能从该 PDF 的文字层读出数字，故不转写图中未见诸文字的百分比。[5]
        Piketty、Saez 与 Zucman 的分配性国民账户把焦点放在 1980–2014 年的税前国民收入：人均实际税前国民收入上升约 60%，但底部 50% 成年人大体停滞在约 16,000 美元（2014 年美元）；即使在税后，工作年龄的底部 50% 自 1980 年以来也接近零增长。这是另一组定义、另一个时期，不能直接改写成「自 1950 年代以来实际收入大幅下降」。[6]
        Auten 与 Splinter 使用税收数据做了不同的国民收入分配，认为 1979–2019 年底部一半的实际税前收入上升超过三分之一、税后上升三分之二；自 1962 年以来，底部、中间和顶部五等分的人均实际税后收入都增加了两倍以上。测量方法之争本身说明：文献并没有一个已经关闭的「是/否」。[7]
    summary: >-
      原问题来自 Economics Stack Exchange，提问者显示名为 MWB（2020 年 8 月 17 日）。问题把 1950 年代的美国记忆——不必上大学也能养活一大家和一位全职主妇、容易买房、开大型汽车且不担心油价——对照为「实际收入是否自此显著下降」，并附带提及一位历史教授关于二战黄金储备的私人理论。[1]
      这首先是一个测量问题，而且「自 1950 年代以来」往往不是文献最常用的起算点。普查住户中位收入从 1967 年才有连续的官方历史表；国会预算办公室的分配序列从 1979 年开始；Piketty、Saez 与 Zucman 关于底部 50%「停滞」的核心陈述，针对的是 1980 年以后的税前国民收入。把 1970 或 1980 年以后某个子群体的停滞，说成 1950 年代以来整体实际收入大幅下降，会混淆时期和口径。[2][5][6]
      就普查局当期发布的、按 2025 年美元调整的序列看：全种族住户中位收入从 1967 年的 56,230 美元升至 2025 年的 87,460 美元，平均收入从 62,890 美元升至 126,700 美元；后者大约翻了一倍，前者升幅较小，符合平均数被顶端拉高的形态。1973 年和 1979 年的住户中位数分别为 63,680 美元和 63,670 美元，此后有过停滞和回撤（例如 2010 年为 70,110 美元），但 2025 年仍明显高于 1960 年代末。[2]
      若改看全职、全年工作者的中位个人劳动所得（表 P-38）：男性从 1960 年的 47,720 美元升至 1973 年的 67,760 美元，1990 年代中期一度回落到约 61,920 美元（1995 年），其后再次上升，2025 年为 72,380 美元，高于 1960 年，也略高于 1973 年；女性则从 1960 年的 28,960 美元升至 2025 年的 60,760 美元，升幅更大。表 P-36 的中位个人收入可回溯到 1955 年：男性从 41,640 美元升至 2025 年的 77,340 美元，女性从 26,850 美元升至 62,730 美元。按这些官方序列，答案不是「大幅下降」。[3][4]
      这并不意味着「人人都过得像记忆中的 1950 年代那样宽裕」。住户中位数会随住户人数和双职工比例变化；劳动所得只覆盖全职全年工作者，不含福利（如雇主医疗保险）的货币化；普查的价格指数（表注为 2000 年起的 C-CPI-U 与此前的 R-CPI-U-RS）与国会预算办公室所用的个人消费支出（PCE）价格指数、以及 Piketty–Saez–Zucman 所用的国民收入平减指数都不同。选择哪一条序列，会改变「中间位置涨了多少」，尤其会改变对 1980 年以后下半部分人群的判断。[2][5][6][7]
      至于提问中的黄金储备假说，本次没有打开专门检验该说法的一手文献，因此不予评述。
    definitions:
    - term: 实际收入（real income）
      text: >-
        用某一价格指数剔除通货膨胀后的收入。同一名义序列，用消费者价格指数（如普查表使用的 C-CPI-U / R-CPI-U-RS）、个人消费支出价格指数（国会预算办公室趋势文件明确采用 BEA 的 PCE）或国民收入平减指数（Piketty、Saez 与 Zucman 在底部 50% 陈述中注明），会得到不同的「实际」水平与增速。[2][5][6]
    - term: 中位数与平均数（median vs mean）
      text: >-
        中位数是排序后处于正中位置的住户或个人的收入；平均数是全部收入除以单位数，对顶端更敏感。普查表 H-5 在 1967–2025 年间，全种族住户平均数的上升明显快于中位数，这本身就是分布上端相对更快增长的一种表现。[2]
    - term: 税前市场收入与税后加转移支付
      text: >-
        国会预算办公室把「税前收入」定义为市场收入加上社会保险（社会保障、联邦医疗保险、失业保险和工伤保险等），「税后收入」再加核定的低收入转移、减去联邦税；Piketty、Saez 与 Zucman 的税后国民收入则扣除全部税收并加回全部转移与公共支出，使税前、税后都加总到国民收入。Auten 与 Splinter 同样区分税前国民收入与含转移的税后收入。不同「税后」并不完全同义。[5][6][7]
    - term: 全职全年工作者（full-time, year-round workers）
      text: >-
        普查表 P-36、P-38 的观察单位是有全年全职工作的人（1980 年 3 月起为 15 岁及以上；更早年份为次年 3 月时 14 岁及以上），不是所有成年人口，也不是住户。它更接近「一份全职工作的报酬」，不能直接回答「一个家庭需要几份收入」。[3][4]
    milestones:
    - year: 1955–1967
      name: 美国普查局个人与住户收入历史表的起点
      explanation: >-
        表 P-36（全职全年工作者中位个人收入）自 1955 年，表 P-38（中位个人劳动所得）自 1960 年，表 H-5（住户中位与平均收入）自 1967 年。它们是回答「自 1950 年代以来」时最接近的一套官方连续水平，但没有一条正好从 1950 年的住户中位数开始。[2][3][4]
    - year: 1979–1980
      name: 两条常被用来讨论「中下层停滞」的研究起点
      explanation: >-
        国会预算办公室分配序列从 1979 年开始；Piketty、Saez 与 Zucman 关于底部 50% 税前收入停滞的核心陈述，针对 1980–2014 年。这两条线都晚于 1950 年代，不宜直接替代原问题的时期。[5][6]
    - year: 2018–2024
      name: 分配性国民账户的两种对立估计公开发表
      explanation: >-
        Piketty、Saez 与 Zucman 的方法论文章 2018 年发表于 Quarterly Journal of Economics；Auten 与 Splinter 对税收数据的长期估计 2024 年发表于 Journal of Political Economy，并直接反驳前一组对底部 50% 实际收入几乎不变的判断。[6][7]
    views:
    - position: 按美国普查局官方的住户中位数和全职全年工作者中位数，自 1950 年代中期或 1960 年代以来实际收入没有大幅下降，而是上升；1970 年代之后男性全职劳动所得的增长明显放慢
      consensus_role: 讨论这一问题时最接近「官方、可复核水平」的出发点；它不解决福利、税收、住户结构以及顶端不平等
      evidence:
        label: 普查局 CPS ASEC 历史收入表，本次直接打开 xlsx 读取水平
        note: >-
          表 H-5、P-36、P-38 由本次打开的官方 xlsx 读取。美元为 2025 年美元，表注写明 2000–2025 年使用 C-CPI-U、此前使用 R-CPI-U-RS。序列有多次调查设计与处理修订（表中以年份脚注标出，如 2013、2017、2020、2024），不同断点之间的水平不能当成完全同质的微观定义。住户收入未按住户人数等价调整。[2][3][4]
      holders:
      - name: 美国普查局（U.S. Census Bureau）
        identity: >-
          Current Population Survey 年度社会与经济补充调查（CPS ASEC）历史收入表的发布机构；表 H-5 注明资料来源为 1968–2026 年 ASEC，表 P-36 为 1956–2026 年，表 P-38 为 1961–2026 年。[2][3][4]
      argument: >-
        若把原问题理解为「一个典型美国住户或一份全职工作的实际货币收入，是否明显低于 1950 或 1960 年代」，普查表给出的回答是否定的。[2][3][4]
        全种族住户中位收入（H-5，2025 年美元）1967 年为 56,230 美元，2025 年为 87,460 美元；同期平均收入从 62,890 美元升至 126,700 美元。中位数在 1970 年代后期到 1980 年代初几乎没有再升（1973 年 63,680 美元，1979 年 63,670 美元，1982 年 60,480 美元），2010 年也只有 70,110 美元，但这些波动是从已经高于 1967 年的水平上发生的，而不是跌回 1960 年代末之下。[2]
        男性全职全年劳动所得的中位数（P-38）是最接近「一份全职男工的工资」的官方序列之一。它在 1960–1973 年从 47,720 美元升至 67,760 美元，随后到 1995 年回落至 61,920 美元，再升至 2025 年的 72,380 美元。因此，相对于 1960 年是明显上升；相对于 1973 年的局部高点，中间有过约二十年的停滞和回撤，到 2020 年代才再次超过该高点。女性同一序列则持续上升，1960 年为 28,960 美元，2025 年为 60,760 美元。[4]
        表 P-36 把观察延伸到 1955 年（中位个人收入，口径与劳动所得不完全相同）：男性从 41,640 美元升至 2025 年的 77,340 美元，女性从 26,850 美元升至 62,730 美元。这是本次打开的官方表里，最接近「自 1950 年代」这一提问起点的一条。[3]
        这些数字不能直接验证「那时一份收入就够买房养家」的记忆：它们没有计入住房相对价格的特殊变化，也没有把一个住户里有几个挣钱的人摊开来。它们只说明：把「实际收入」理解成普查意义上的中位货币收入时，并没有出现自 1950 年代或 1960 年代以来的大幅下降。
      quotes: []
    - position: 若把目光转到 1980 年以后的税前国民收入，底部 50% 成年人几乎没有增长，政府再分配只抵消了不平等上升的一小部分——但这是另一段时期、另一套定义，不能代替「自 1950 年代以来」的判断
      consensus_role: 分配性国民账户中最有影响的一组估计之一，常被用来讨论「增长没有到下半部分」；其时期和口径与原问题并不重合
      evidence:
        label: 将税收、调查与国民账户对齐、覆盖全部国民收入的估计
        note: >-
          本次打开的是 2018 年 Quarterly Journal of Economics 正式发表 PDF（作者稿站点副本 https://gabriel-zucman.eu/files/PSZ2018QJE.pdf ）。核心数字针对 1980–2014 年，使用国民收入平减指数和成年个人（配偶之间平分收入）作为单位。文中机构署名在本次打开的PDF首页未见单独的作者单位行，因此身份只按其作为该文作者来写。[6]
      holders:
      - name: Thomas Piketty、Emmanuel Saez、Gabriel Zucman
        identity: >-
          《Distributional National Accounts: Methods and Estimates for the United States》（Quarterly Journal of Economics, 2018）作者。[6]
      argument: >-
        这三位作者要解决的问题，是税收和调查数据通常覆盖不了全部国民收入，从而难以回答「宏观增长的多大份额落到了底部 50%、中间 40% 和顶部 10%」。他们的序列同时给出税前与税后国民收入。[6]
        摘要中的关键句是：1980 至 2014 年，成年人均实际税前国民收入上升了 60%，但底部 50% 停滞在大约每年 16,000 美元。中间阶层（中位数到第 90 百分位）自 1980 年以来增长了 40%，部分因为免税的附加福利上升；顶端则大幅上涨。[6]
        在引言的发现综述里，他们把同一事实写得更完整：底部 50% 成年人的平均税前收入自 1980 年以来停滞在约 16,000 美元（2014 年美元，使用国民收入平减指数），而人均国民收入增长 60%，达到 2014 年的 64,500 美元；底部 50% 的收入份额从 1980 年约 20% 降到 2014 年的 12%。顶部 1% 成年人的平均税前收入从 42 万美元升至约 130 万美元，份额从 1980 年代初约 12% 升至 2014 年的 20%。两个群体几乎交换了份额。[6]
        关于税后，他们的判断是：政府再分配只抵消了税前不平等上升的一小部分；即使在税收和转移之后，自 1980 年以来，分布底部 50% 中的工作年龄成年人也接近零增长。增加的个性化转移支付很大程度上指向老年人和中产，落到底部 50% 挣钱者头上的部分不足以显著抬高他们的收入。[6]
        把这一研究放回原问题：它有力说明，自 1980 年以来，增长在他们的税前国民收入核算中高度偏向顶端，底部 50% 的税前水平几乎没有上升。它并不声称 1950 年代到 1980 年也是下降的，更不能单独改写普查中位数在 1955 或 1967 年以来上升这一事实。时期、单位（成年个人对住户）、收入概念和平减指数都不同。[2][6]
      quotes:
      - text: >-
          Average pretax real national income per adult has increased 60% from 1980 to 2014, but we find that it has stagnated for the bottom 50% of the distribution at about $16,000 a year.
        text_zh: 成年人均实际税前国民收入在 1980 至 2014 年间上升了 60%，但我们发现，分布底部 50% 停滞在大约每年 16,000 美元。
        attribution: Thomas Piketty、Emmanuel Saez 与 Gabriel Zucman，Distributional National Accounts
        locator: 摘要，Quarterly Journal of Economics 133(2), 2018, 第 553 页
        ref: 6
      - text: >-
          Even after taxes and transfers, there has been close to zero growth for working-age adults in the bottom 50% of the distribution since 1980.
        text_zh: 即使在税收和转移支付之后，自 1980 年以来，分布底部 50% 中的工作年龄成年人也接近零增长。
        attribution: 同上
        locator: 第 557 页，引言中第二条主要发现
        ref: 6
    - position: 改用另一套把缺报收入、家庭结构与转移支付处理不同的税收数据估计，底部一半自 1979 年以来的实际收入明显上升，自 1960 年代初以来各五等分的人均实际税后收入都增加了两倍以上
      consensus_role: 对 Piketty–Saez–Zucman 序列最重要的系统性反估计之一；结论依赖如何分配税表上看不到的国民收入，并非没有争议
      evidence:
        label: 以税表为起点、逐步补齐国民收入并调整税收改革与社会变迁的长期估计
        note: >-
          本次打开的是 2024 年 Journal of Political Economy 正式发表 PDF（作者站点 https://www.davidsplinter.com/AutenSplinter-Tax_Data_and_Inequality.pdf ）。作者写明观点不代表美国财政部或国会税收联合委员会。他们把自己与 Piketty、Saez、Zucman 的差异，主要归因于如何分配税表上未出现的收入。[7]
      holders:
      - name: Gerald Auten、David Splinter
        identity: >-
          论文署名分别为美国财政部税收分析办公室（Office of Tax Analysis, US Treasury Department）、美国国会税收联合委员会（Joint Committee on Taxation）。文内声明结论仅代表作者本人。[7]
      argument: >-
        Auten 与 Splinter 从税表收入出发，校正税基变化、申报行为、婚姻率下降等社会变迁，并补上税表遗漏的收入，以估计 1960 年以来的国民收入分配。摘要即给出与「顶端份额急剧上升、中下层停滞」叙事相反的判断：税前顶端份额更低、1980 年以来升幅更小；不断增加的政府转移和税收累进性，使所有收入组的实际收入都在上升，税后顶端份额几乎没有什么变化。[7]
        在正文中，他们直接对照 Piketty、Saez 与 Zucman：后者估计底部 50% 的平均实际税前收入在 1979–2019 年间几乎不变；而他们的分析显示，底部一半的实际税前收入上升超过三分之一，实际税后收入上升三分之二。底部 50% 的税前份额下降 5.1 个百分点，税后份额只下降 3.1 个百分点，即税收和转移抵消了该份额下降的 40%。[7]
        把窗口拉回到 1960 年代初，他们估计税前顶部 1% 份额从 1962 年的 11.1% 降至 1979 年的 9.4%，再升至 2019 年的 13.8%，整个时期大约只上升 3 个百分点；税后顶部 1% 份额自 1979 年以来只升 1.4 个百分点，自 1962 年以来只升 0.2 个百分点。更关键的是针对原问题的一句：自 1962 年以来，底部、中间和顶部五等分的人均实际税后收入都增加了两倍以上。[7]
        如果接受这组估计，那么即使不看普查中位数，仅就「人均实际税后资源」而言，自 1960 年代初以来也不是下降，而是各段都有大幅度上升；与 Piketty–Saez–Zucman 的分歧，集中在 1979 年以后底部一半的税前是否停滞，以及税后增长有多少。这一分歧本身就是当前文献的一部分，不宜用其中一方去宣布另一方已被否定，但足以阻止把「自 1950 年代以来实际收入大幅下降」写成已有共识的事实。[6][7]
      quotes:
      - text: >-
          PSZ estimated that average real pretax incomes of the bottom 50% remained virtually unchanged between 1979 and 2019. In contrast, our analysis shows that real pretax incomes increased by more than one-third and real aftertax income increased by two-thirds for the bottom half of the distribution.
        text_zh: Piketty、Saez 与 Zucman 估计，底部 50% 的平均实际税前收入在 1979 至 2019 年间几乎没有变化。相比之下，我们的分析显示，分布下半部分的实际税前收入上升了超过三分之一，实际税后收入上升了三分之二。
        attribution: Gerald Auten 与 David Splinter，Income Inequality in the United States
        locator: Journal of Political Economy 132(7), 2024, 第 2182 页
        ref: 7
      - text: >-
          Furthermore, since 1962 average real per capita aftertax incomes more than tripled for the bottom, middle, and top income quintiles.
        text_zh: 此外，自 1962 年以来，底部、中间和顶部收入五等分的人均实际税后收入都增加了两倍以上。
        attribution: 同上
        locator: 结论段，同一论文（本次按打开的 PDF 正文核对，未另标可能的附录页码）
        ref: 7
    - position: 国会预算办公室从 1979 年算起的住户分配显示，所有五等分的平均收入在税前和税后都增长了，但最高五等分增长最多，不平等仍然上升
      consensus_role: 美国联邦立法机构的官方分配统计，口径与时期都写得清楚；它不覆盖 1950 年代，却是讨论「1970 年代末以来」时最常用的官方参照之一
      evidence:
        label: CBO 2024 年发布的 1979–2021 年趋势说明，以及关于 2021 年水平的配套报告
        note: >-
          趋势文件的文字层给出了定性结论，但各五等分的具体累计增长率印在图中，本次未能从 PDF 文本中读出这些百分比，因此不引用图中数字。所有金额按 2021 年美元、用 BEA 的 PCE 价格指数调整。2020–2021 年受疫情及大规模财政应对影响，CBO 在 2021 年报告中提醒这两年不寻常。[5]
      holders:
      - name: 美国国会预算办公室（Congressional Budget Office）
        identity: >-
          2024 年 9 月报告与趋势幻灯的发布机构。趋势文件写明由税务分析司的 Ellen Steele 与 Bilal Habib 在 Edward Harris、John McClelland 等人指导下撰写，但结论以机构名义发布，并声明不做政策建议。[5]
      argument: >-
        CBO 的窗口从 1979 年到 2021 年，使用的是住户（而不是成年个人），并把「税前」定义为市场收入加社会保险，「税后」再加入以收入核定的转移、减去联邦税。[5]
        趋势文件「主要发现」的第一段写：在此期间，顶端住户的收入显著高于底端；平均收入无论在税前还是在税后加转移之后，对所有五等分都增长了，但在最高五等分中增长最多。以收入核定的转移主要流向底部附近，并且相对税前收入的比重上升，主要受 Medicaid 支出推动。较高收入住户的平均联邦税率通常更高，但各段平均税率都有所下降，降幅在最低五等分最大。用基尼系数衡量，税前和税后的不平等都上升了，不过转移和税收对不平等的抑制程度也增强了。[5]
        因此，在 CBO 的口径里，1979 年以来同样不是「各段实际收入都在下降」；争论的是增长如何分布，以及税和转移改变了多少。把这一结论接到原问题上，需要重复那句限制：它不回答 1950 年代到 1979 年发生了什么，那一段仍然主要依赖普查表。[2][5]
      quotes:
      - text: >-
          Over that period, average income, both before and after means-tested transfers and federal taxes, grew for all quintiles (or fifths) of the income distribution, but it increased most among households in the highest quintile.
        text_zh: 在那一时期，无论在核定转移和联邦税之前还是之后，平均收入对收入分布的所有五等分都增长了，但在最高五等分的住户中增长最多。
        attribution: Congressional Budget Office，Trends in the Distribution of Household Income From 1979 to 2021
        locator: 2024 年 9 月趋势文件 “Summary of CBO’s Main Findings”，文内第 2 页；“that period” 指 1979–2021 年
        ref: 5
    open_parts: >-
      「自 1950 年代以来实际收入是否大幅下降」在普查中位数上可以得到一个相当清楚的「否」；一旦问题被改写成「底部一半在 1980 年以后有没有分享增长」，答案就取决于税前还是税后、单位是成年个人还是住户、以及如何分配税表上看不到的国民收入。Piketty–Saez–Zucman 与 Auten–Splinter 的分歧仍是活跃的方法之争，本文只报告双方已打开文本中的判断，不裁定哪一套调整「正确」。[6][7]
      住房是原问题记忆里的关键商品。Elizabeth Warren 与 Amelia Warren Tyagi 的《The Two Income Trap》在原帖回答中被提及，但本次未打开该书，因此不转述其家庭预算分解，只指出：普查和国民账户中的「实际收入」使用一般价格指数，并不等于「相对于房价的购买力」。
      工资与总薪酬（含雇主缴纳的医疗保险等）的差别，会改变对「停滞」的判断；Piketty、Saez 与 Zucman 已强调免税附加福利抬高了中间阶层的增长，但本次没有另外打开一套可引用的官方总薪酬中位数长期表（BLS 实时收入新闻稿的历史序列本次未能取得），故不补充未核对的薪酬数字。[6]
      原问题中关于二战黄金储备的假说，本次没有打开专门文献，不予评述。
