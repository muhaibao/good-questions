- id: 2026-11-12-sci-navier-stokes
  date: '2026-11-12'
  category: science
  title_zh: 三维纳维–斯托克斯方程的光滑解是否总是存在？
  title_en: Navier–Stokes existence and smoothness
  commentary: 描述水流与气流的方程写下来快两百年了，数学家却仍无法证明：三维流体从光滑初值出发，会不会在有限时间内「爆破」出无穷大。这是千禧年难题中离日常物理最近的一道，近十年又因计算机辅助证明和机器学习而重新升温。
  source_name: Clay Mathematics Institute — Millennium Problems
  source_url: https://www.claymath.org/millennium/navier-stokes-equation/
  author: Clay Mathematics Institute
  source_type: curated
  tags:
  - 偏微分方程
  - 流体力学
  - 千禧年难题
  - 有限时间爆破
  answer:
    format: scholarly
    reviewed_at: '2026-11-12'
    consensus:
      label: 开放问题；对答案方向没有可引用的共识
      note: Clay 官方问题描述要求证明四种表述之一：在 R³ 或周期区域上光滑、能量有界的解对所有时间存在，或者给出爆破反例。[1] 截至本文核对日，没有被接受的解答。与 P vs NP
        不同，这里没有可引用的专家民调，因此本文不对「多数人相信哪一边」下判断。官方陈述作者 Fefferman 认为标准 PDE 方法不足以解决问题；Tao 的「平均化方程」爆破结果从技术上支持了这一判断。[1][5]
    summary: 纳维–斯托克斯（Navier–Stokes, NS）方程描述不可压缩粘性流体的速度场和压强。Fefferman 在官方问题描述中说明，动量方程就是流体微元的牛顿定律 f = ma，另一条方程表示流体不可压缩。[1]
      二维情形的全局光滑解早已由 Ladyzhenskaya 证明；三维情形下，只知道小初值时或在一段短时间内有光滑解。若存在有限的「爆破时间」，速度必然在该时刻附近无界。[1] 另一条路线是弱解：Leray
      1934 年证明三维 NS 总有弱解，但弱解是否唯一至今未知。[1][2] Caffarelli–Kohn–Nirenberg 1982 年的部分正则性定理表明，奇异集在一维抛物型 Hausdorff
      测度意义下为零。Fefferman 称这是「迄今已知最好的部分正则性定理」，并说再往前走似乎非常困难。[1][4] 近十年的进展主要是「障碍」和「相邻问题」上的突破。Tao（2016）构造了一个保留能量恒等式的「平均化」NS
      方程，并证明它会有限时间爆破，说明仅靠调和分析估计和能量恒等式无法证明正则性。[5] Buckmaster 与 Vicol（2019）证明某类弱解不唯一；[6] Albritton、Brué
      与 Colombo（2022）在带外力的情形下证明 Leray 解不唯一。[7] Chen 与 Hou 严格证明了有边界、光滑初值下二维 Boussinesq 方程和三维轴对称 Euler（无粘）方程的有限时间近自相似爆破。[8]
      2025 年 Wang 等人的预印本用机器学习结合高精度优化，系统找到多族「不稳定」自相似奇点解。[9] 不过，这些结果都不是 Clay 问题本身的解答：无边界、有粘性的三维 NS 是否会爆破，仍然悬而未决。
    definitions:
    - term: 纳维–斯托克斯方程
      text: 关于速度 u(x,t) 与压强 p(x,t) 的偏微分方程组。动量方程中含粘性项 νΔu 与外力 f，同时要求 div u = 0（不可压缩）。粘性系数 ν = 0 时即为 Euler
        方程。[1]
    - term: 有限时间爆破（blowup）
      text: 光滑解在有限时间 T 内失去光滑性。对 NS（ν > 0），若存在有限爆破时间，速度在 T 附近必然无界。[1] 通俗说，就是方程预言某处流速或其梯度会在有限时间内变成无穷大。
    - term: 弱解
      text: 把方程与光滑的检验函数相乘、积分并分部积分，使导数落到检验函数上，得到对 u 要求更低（只需平方可积等）的广义解。[1] 常见策略是先构造弱解，再证明弱解其实是光滑的；这一步对三维
        NS 只取得部分成功。[1]
    milestones:
    - year: '1934'
      name: Leray 弱解
      explanation: Leray 证明三维 NS 方程总存在满足适当增长条件的弱解。[1][2] 这保证了「某种意义上的解」存在，但不保证它光滑或唯一。
    - year: '1982'
      name: Caffarelli–Kohn–Nirenberg 部分正则性
      explanation: 在 Scheffer 工作的基础上证明适当弱解的奇异集的一维抛物型 Hausdorff 测度为零。由此推出，奇异集不可能包含一条时空曲线。[1][4]
    - year: 2000 前后
      name: 列为千禧年大奖难题
      explanation: Clay 数学研究所把 NS 方程的存在性与光滑性列为千禧年难题之一，官方问题描述由 Charles Fefferman 撰写。[1][3]
    - year: '2016'
      name: Tao 的「平均化」NS 爆破
      explanation: Tao 构造了 NS 方程的一个平均化版本，它满足同样的能量恒等式，却存在有限时间爆破的光滑解。这表明任何正则性证明都必须用到非线性项更精细的结构。[5]
    - year: 2019–2022
      name: 弱解不唯一
      explanation: Buckmaster–Vicol 证明某类有限能量弱解不唯一；[6] Albritton–Brué–Colombo 证明带外力时 Leray 解不唯一。[7]
    - year: 2022–2025
      name: Euler 爆破证明与机器学习搜索
      explanation: Chen–Hou 证明有边界的三维轴对称 Euler 方程可从光滑初值有限时间爆破；[8] Wang 等人用机器学习发现多族不稳定自相似解，精度据称满足计算机辅助证明的要求（预印本）。[9]
    views:
    - position: 现有技术不足以证明光滑性，需要本质上的新思想
      consensus_role: 官方陈述与障碍结果共同支持的判断
      evidence:
        label: 严格的障碍定理 + 权威专家意见
        note: Tao 的结果是定理，严格表明「只用能量恒等式和调和分析估计」的证明路线行不通；[5] Fefferman 的判断是专家意见，不是定理。[1]
      holders:
      - name: Charles L. Fefferman
        identity: Clay 千禧年难题 NS 问题官方描述的作者。[1]
      - name: Terence Tao
        identity: 《Finite time blowup for an averaged three-dimensional Navier–Stokes equation》（J. Amer.
          Math. Soc., 2016）作者。[5]
      argument: Fefferman 指出，二维的结论对三维没有启示，因为主要困难在二维并不存在。CKN 定理是迄今最好的部分正则性结果，再往前推进似乎非常困难。[1] Tao 把 NS 写成
        ∂ₜu = Δu + B(u,u)，并用平均化算子替换双线性项 B。新方程同样满足能量恒等式，却可以从光滑初值有限时间爆破。[5] 换言之，任何「只用能量守恒和一般性估计」的论证都不足以排除爆破，因为同样的论证会对一个确实爆破的方程「错误地」成立。
      quotes:
      - text: Standard methods from PDE appear inadequate to settle the problem. Instead, we probably
          need some deep, new ideas.
        text_zh: 偏微分方程的标准方法看来不足以解决这个问题。我们很可能需要某些深刻的新思想。
        attribution: Charles L. Fefferman，Clay 官方问题描述
        locator: 第 4 页，结尾段
        ref: 1
      - text: This demonstrates that any attempt to positively resolve the Navier-Stokes global regularity
          problem in three dimensions has to use finer structure on the nonlinear portion B(u,u) of the
          equation than is provided by harmonic analysis estimates and the energy identity.
        text_zh: 这表明，任何试图正面解决三维纳维–斯托克斯全局正则性问题的尝试，都必须利用方程非线性部分 B(u,u) 的更精细结构，而不能只依赖调和分析估计和能量恒等式所提供的信息。
        attribution: Terence Tao，J. Amer. Math. Soc.（2016）
        locator: 摘要（arXiv:1402.0290）
        ref: 5
    - position: 爆破可能真实存在：从相关模型出发，构造或计算出奇点
      consensus_role: 活跃的研究纲领；对真正的 NS 尚无结论
      evidence:
        label: 相关方程上的严格证明 + 高精度数值
        note: 已有严格证明的爆破针对的是平均化 NS、有边界的 Euler 方程等相邻问题；[5][8] Wang 等人的结果是预印本，研究对象同样是有边界的 Euler 与多孔介质方程。[9]
          对无边界、有粘性的三维 NS，没有爆破证据。
      holders:
      - name: Terence Tao
        identity: 在 2016 年论文摘要中提出把平均化方程的爆破结果推广到真正 NS 方程的研究纲领。[5]
      - name: Jiajie Chen、Thomas Y. Hou
        identity: '《Stable nearly self-similar blowup of the 2D Boussinesq and 3D Euler equations with
          smooth data I: Analysis》作者。[8]'
      - name: Yongji Wang 等
        identity: 预印本《Discovery of Unstable Singularities》（2025）作者。[9]
      argument: Chen 与 Hou 受早期数值证据启发，严格证明了在有边界、能量有限的光滑初值下，二维 Boussinesq 与三维轴对称 Euler 方程会出现有限时间、近自相似的爆破。[8]
        Wang 等人指出，数值研究以往主要找到「稳定」奇点；而对于无边界的 Euler 与 NS 等关键开放问题，人们预计起作用的是「不稳定」奇点。这类奇点要求无限精确地调好初值，因此极难发现。[9]
        他们用定制的机器学习架构和高精度 Gauss–Newton 优化器找到了多族不稳定自相似解。[9] Fefferman 也提醒，Euler 方程的数值计算极不稳定，难以从中得出可靠结论。[1]
        这正是此类工作转向计算机辅助证明的原因。
      quotes:
      - text: Whether singularities can form in fluids remains a foundational unanswered question in mathematics.
        text_zh: 流体中是否会形成奇点，仍是数学中一个基础性的未解问题。
        attribution: Wang 等，arXiv 预印本（2025）
        locator: 摘要
        ref: 9
    - position: 弱解框架本身不足以挑出「物理上正确」的解
      consensus_role: 已被严格证明的相邻结论
      evidence:
        label: 严格定理
        note: Buckmaster–Vicol 与 Albritton–Brué–Colombo 的不唯一性定理均发表于 Annals of Mathematics；[6][7] 但无外力情形下
          Leray–Hopf 解是否唯一仍未解决。
      holders:
      - name: Tristan Buckmaster、Vlad Vicol
        identity: 《Nonuniqueness of weak solutions to the Navier–Stokes equation》（Annals of Mathematics,
          2019）作者。[6]
      - name: Dallas Albritton、Elia Brué、Maria Colombo
        identity: 《Non-uniqueness of Leray solutions of the forced Navier–Stokes equations》（Annals of
          Mathematics, 2022）作者。[7]
      argument: 经典策略是先证明弱解存在，再证明弱解光滑。[1] 但如果弱解可以不唯一，「某个弱解存在」就不足以确定流体的演化。Buckmaster 与 Vicol 证明三维 NS 的某类有限能量弱解不唯一；[6]
        Albritton 等人进一步证明，在适当外力下，连满足能量不等式的 Leray 解也可以不唯一。[7] 这些结果不回答 Clay 问题，却说明弱解理论与「物理上合理解」之间的缝隙是真实存在的。
    open_parts: 第一，Clay 问题本身：无边界（R³ 或周期区域）、有粘性的三维 NS，从任意光滑初值出发是否都有全局光滑解。[1] 第二，若爆破存在，是否通过 Wang 等人所说的不稳定自相似奇点发生，以及能否用计算机辅助证明把数值发现变成定理。[9]
      第三，无外力时 Leray–Hopf 弱解是否唯一。[7] 第四，即使数学上存在爆破，它与真实湍流物理有何关系，目前也没有定论。
    references:
    - id: 1
      citation: Fefferman, C. L. Existence and smoothness of the Navier–Stokes equation. Clay Mathematics
        Institute 官方问题描述（PDF，文中未注明日期，附勘误）。
      url: https://www.claymath.org/wp-content/uploads/2022/06/navierstokes.pdf
    - id: 2
      citation: Leray, J. (1934). Sur le mouvement d’un liquide visqueux emplissant l’espace. Acta Mathematica,
        63, 193–248. 书目据 [1] 的参考文献 [5]；本次未打开原文。
      url: null
    - id: 3
      citation: Clay Mathematics Institute. Navier–Stokes Equation（千禧年难题页面）。
      url: https://www.claymath.org/millennium/navier-stokes-equation/
    - id: 4
      citation: Caffarelli, L., Kohn, R., & Nirenberg, L. (1982). Partial regularity of suitable weak
        solutions of the Navier–Stokes equations. Communications on Pure and Applied Mathematics, 35,
        771–831. 书目据 [1] 的参考文献 [2]；本次未打开原文。
      url: null
    - id: 5
      citation: Tao, T. (2016). Finite time blowup for an averaged three-dimensional Navier–Stokes equation.
        Journal of the American Mathematical Society, 29(3), 601–674. doi:10.1090/jams/838；摘要据 arXiv:1402.0290。
      url: https://www.ams.org/journals/jams/2016-29-03/S0894-0347-2015-00838-4/
    - id: 6
      citation: Buckmaster, T., & Vicol, V. (2019). Nonuniqueness of weak solutions to the Navier–Stokes
        equation. Annals of Mathematics, 189(1), 101–144.
      url: https://annals.math.princeton.edu/2019/189-1/p03
    - id: 7
      citation: Albritton, D., Brué, E., & Colombo, M. (2022). Non-uniqueness of Leray solutions of the
        forced Navier–Stokes equations. Annals of Mathematics, 196(1). 预印本 arXiv:2112.03116。
      url: https://arxiv.org/abs/2112.03116
    - id: 8
      citation: 'Chen, J., & Hou, T. Y. (2022). Stable nearly self-similar blowup of the 2D Boussinesq
        and 3D Euler equations with smooth data I: Analysis. arXiv:2210.07191.'
      url: https://arxiv.org/abs/2210.07191
    - id: 9
      citation: Wang, Y., Bennani, M., Martens, J., et al. (2025). Discovery of unstable singularities.
        arXiv:2509.14185（预印本，未经同行评议）。
      url: https://arxiv.org/abs/2509.14185
- id: 2026-11-12-biz-oil-negative
  date: '2026-11-12'
  category: business
  title_zh: 为什么原油期货价格会变成负数？
  title_en: Why is the oil future price negative?
  commentary: 2020 年 4 月 20 日，「卖油还要倒贴钱」真的发生了。这道题逼人把期货合约、实物交割和储罐容量放在一起想：屏幕上那个价格，到底是什么东西的价格？
  source_name: Economics Stack Exchange
  source_url: https://economics.stackexchange.com/questions/36127/why-is-the-oil-future-price-negative
  author: chatGPT（Stack Exchange 用户名）
  source_type: stackexchange
  tags:
  - 期货
  - 原油
  - 储存
  - 市场微观结构
  answer:
    format: scholarly
    reviewed_at: '2026-11-12'
    consensus:
      label: 「发生了什么」有较强共识；各因素的相对权重与是否存在不当交易仍有争议
      note: CFTC 工作人员的中期报告与美国能源信息署（EIA）的分析都认为基本面因素奠定了基础：新冠疫情导致需求骤降、库欣（Cushing）交割地储罐接近满载、合约须实物交割。临近到期的集中平仓和流动性下降则放大了跌幅。[1][2]
        学术研究对「原油 ETF 展期是元凶」的说法给出了否定证据，[3] 但「按结算价交易」（TAS）机制与掠夺性交易贡献多大仍有分歧。[3][4] CFTC 报告明确不评估是否存在操纵或违法交易，也不认定根本原因。[1]
    summary: 负价格只出现在一张特定合约上：NYMEX 的 WTI 原油 2020 年 5 月合约。它在 4 月 20 日，即到期前一个交易日，以每桶 −37.63 美元结算，盘中最低 −40.32
      美元；当天其他月份的 WTI 合约都以正价结算。[1] 因此，负价格并不意味着「石油本身一文不值」，而是说：在那一天，持有这张即将到期、必须在俄克拉何马州库欣提货的合约，是一种负担。EIA 解释，持有
      WTI 期货到期的人必须在库欣进行实物交割；通常只有约 1% 的期货最终走到实物交割，绝大多数人在到期前平仓。[2] 2020 年春，疫情使原油和成品油消费骤降，过剩原油涌入储罐。CFTC 报告指出，到
      2020 年 3 月，库欣可用的工作库容已接近满载。[1] 提问者问：「为什么不囤着等疫情过去？为什么投机者不进场把价格买回正数？」答案是：囤油需要储罐，而储罐恰恰最稀缺。没有预订储罐的多头只能付高价找库容，或者以任何价格平仓。[2][3]
      负价格正是对接盘者承担交割和储存成本的补偿。EIA 的说法是，部分合约持有人以负价格卖出合约，「实际上是付钱给对手方，让自己得以退出头寸」。[2] 研究者进一步指出，年初的「超级升水」（远月价格远高于近月）吸引了大量现金–持有套利者买入近月、卖出远月并预订库欣储罐，这本身加剧了库容紧张。[3]
      另有研究认为，单靠平仓压力只能把价格压到约每桶 7 美元，其余跌幅需要结合盘中动态与 TAS 交易来解释。[4]
    definitions:
    - term: 实物交割期货
      text: 到期时多头必须在约定地点接收现货、空头必须交付现货的期货合约。WTI 合约的交割地是俄克拉何马州库欣。[2] 不想接货的人必须在到期前平仓。
    - term: 升水结构（contango）
      text: 远月合约价格高于近月合约价格的期限结构。升水足够大时，「现在买油存起来、同时卖出远月合约」的现金–持有套利有利可图，但这需要储存能力。[3]
    - term: 按结算价交易（TAS）
      text: 一种允许参与者以当日结算价或与其相差固定价差的价格成交的订单类型。原油合约自 2001 年起提供 TAS 交易。[1]
    - term: 未平仓量（OI）
      text: 在某个交割月份已建立、尚未被对冲交易了结或通过交割履约的合约总数。[1] 4 月初到 4 月 20 日开盘，5 月合约的未平仓量从 634,727 张降到 108,593 张。[1]
    milestones:
    - year: '1983'
      name: WTI 期货上市
      explanation: NYMEX WTI 原油期货开始交易；此后 37 年间从未出现过负价格。[1][2]
    - year: 2020 年 3–4 月
      name: 库欣接近满载、交易所准备负价格
      explanation: 到 3 月库欣工作库容已接近满载；3 月末至 4 月初，NYMEX 与部分行业参与者开始为 WTI 出现负价格做技术与定价模型上的准备。[1]
    - year: '2020-04-20'
      name: 5 月合约结算于 −37.63 美元
      explanation: 价格在美东时间约 14:08 至 14:30 结算期间低于零，盘中最低 −40.32 美元；当天触发了 30 多次动态熔断。[1]
    - year: '2020-11-23'
      name: CFTC 中期报告
      explanation: CFTC 市场监督部与首席经济学家办公室发布中期工作人员报告，梳理基本面与交易层面的因素。[1]
    views:
    - position: 基本面与交割约束：储罐满了，即将到期的合约就成了负资产
      consensus_role: 官方分析的主线
      evidence:
        label: 官方数据与监管调查
        note: 依据是 EIA 的库存与炼厂数据，以及 CFTC 对持仓、成交与订单簿的分析。[1][2] 但 CFTC 报告是中期报告，明确不判定根本原因。[1]
      holders:
      - name: 美国能源信息署（EIA）
        identity: 美国能源部下属统计与分析机构，2020 年 4 月 27 日发布《Today in Energy》分析。[2]
      - name: CFTC 市场监督部与首席经济学家办公室工作人员
        identity: 2020 年 11 月中期报告作者；报告观点仅代表工作人员，不代表委员会。[1]
      argument: CFTC 报告列出的基本面因素是：全球原油本已供过于求，疫情又带来前所未有的需求下降；市场担心欧佩克+等产油方来不及减产，进而担心储存能力，这在作为交割地的库欣尤为突出。[1]
        EIA 补充说，截至 4 月 17 日当周，美国炼厂开工量降至每天 1,280 万桶，比上年同期少 24%。[2] 当没有储罐的多头必须在最后时刻离场，而接盘者要承担交割和储存，价格就可以跌破零。
      quotes:
      - text: In summary, a variety of factors coincided leading up to, on, and around April 20, when
          WTI Contract prices fell from $17.73 per barrel at the beginning of the trading session to finally
          settle at -$37.63 per barrel.
        text_zh: 总之，在 4 月 20 日前后及当天，多种因素同时出现：WTI 合约价格从交易时段开始时的每桶 17.73 美元跌落，最终结算于每桶 −37.63 美元。
        attribution: CFTC 工作人员中期报告（2020）
        locator: 第 II 节「执行摘要」，第 3 页
        ref: 1
      - text: with some contract holders resorting to selling their futures contracts at negative prices,
          in effect paying a counterparty to allow them to exit their positions.
        text_zh: 一些合约持有人不得不以负价格卖出期货合约，实际上是付钱给对手方，让自己得以退出头寸。
        attribution: U.S. Energy Information Administration（2020）
        locator: 《Today in Energy》2020 年 4 月 27 日，第 3 段
        ref: 2
    - position: 「超级升水」引来的套利占满了库容；原油 ETF 不是元凶
      consensus_role: 有实证支持的学术解释
      evidence:
        label: 单组作者的实证研究（已发表于 Energy Journal）
        note: Granger 因果检验显示 USO 资金流对 WTI 价格影响很小。[3] 需要注意的是，作者在致谢中说明该研究由 USO 的管理人 USCF 资助，存在潜在利益冲突；目前也缺少独立团队用不同数据的复现。[3]
      holders:
      - name: Adrian Fernandez-Perez
        identity: 奥克兰理工大学高级研究员（据论文署名）。[3]
      - name: Ana-Maria Fuertes
        identity: 伦敦城市大学商学院金融与计量经济学教授（据论文署名）。[3]
      - name: Joëlle Miffre
        identity: Audencia 商学院金融学教授（据论文署名）。[3]
      argument: 作者认为，疫情带来的需求骤降与俄沙之争引发的供给冲击，使 WTI 曲线在 2020 年初进入升水并演变为「超级升水」。这吸引了大量现金–持有套利，迅速推高了库欣库存。[3]
        5 月合约临近到期时，大量多头急于离场；对库欣储罐即将「满顶」的恐惧触发了恐慌性抛售和流动性冻结。[3] 他们据此反驳了「最大的原油 ETF（USO）展期砸盘」的流行说法。[3]
      quotes:
      - text: We show empirically that USO flows do not cause the price of WTI futures in general, nor
          of CLK20 in particular.
        text_zh: 我们的实证结果表明，USO 的资金流既不是 WTI 期货价格总体变动的原因，也不是 CLK20（2020 年 5 月合约）价格变动的原因。
        attribution: Fernandez-Perez、Fuertes 与 Miffre，工作论文版本（2020）
        locator: 摘要
        ref: 3
    - position: 平仓压力只能解释一部分，其余来自盘中动态与 TAS「掠夺性交易」
      consensus_role: 有争议的补充解释
      evidence:
        label: 会议论文中的回归与理论模拟
        note: 该文发表于 2023 年美国经济学会年会论文集，本文未能确认其是否已在同行评议期刊正式发表；结论依赖模型设定。[4] Fernandez-Perez 等人也把 TAS 列为可能的加剧因素，[3]
          但对其权重的判断不同。
      holders:
      - name: Yiqing Ge、Wenjin Kang、Ke Tang、Liyan Yang
        identity: 《Closing Pressure, Predatory Trading, and the Negative Price of Oil》作者，署名单位为清华大学、澳门大学与多伦多大学。[4]
      argument: 作者承认，储存短缺加上急于平仓的多头（即「平仓压力」）确实压低了价格。但他们的基准回归只能把 4 月 20 日的价格解释到约每桶 7 美元，远高于实际结算价 −37.63
        美元。[4] 他们把盘中动态和 TAS 套利纳入模型：套利者先在 TAS 市场大量买入互换交易商卖出的合约，再在普通市场（包括结算时段）分批卖出，压低结算价。这样模拟出的价格约为每桶 −40
        美元。[4] 换句话说，实物交割规则加上 TAS 掠夺性交易，才足以解释负价格的深度。
      quotes:
      - text: Empirical tests confirm this negative price effect of closing pressure, but it is estimated
          to bring the price down to only $7/barrel.
        text_zh: 实证检验证实了平仓压力的压价效应，但据估计它只能把价格压到每桶 7 美元左右。
        attribution: Ge、Kang、Tang 与 Yang，AEA 2023 年会论文
        locator: 摘要
        ref: 4
    open_parts: 第一，TAS 机制与结算窗口内的集中卖出到底贡献了多少跌幅，不同研究的估计差距很大。[3][4] 第二，是否存在操纵或其他不当交易：CFTC 中期报告明确把这一问题排除在范围之外，[1]
      本文也未检索到据此作出的公开定论，因此不作判断。第三，实物交割合约在储存极度受限时是否需要改变设计（例如交割地、结算方式），尚无共识。第四，EIA 当时判断负价格主要局限于金融市场，实物市场中很少有卖家真的倒贴钱卖油；[2]
      这一区分对理解「油价为负」的经济含义很关键。
    references:
    - id: 1
      citation: 'U.S. Commodity Futures Trading Commission, Division of Market Oversight & Office of the
        Chief Economist (2020, November 23). Interim Staff Report: Trading in NYMEX WTI Crude Oil Futures
        Contract Leading up to, on, and around April 20, 2020.'
      url: https://www.cftc.gov/media/5296/InterimStaffReportNYMEX_WTICrude/download
    - id: 2
      citation: U.S. Energy Information Administration (2020, April 27). Low liquidity and limited available
        storage pushed WTI crude oil futures prices below zero. Today in Energy.
      url: https://www.eia.gov/todayinenergy/detail.php?id=43495
    - id: 3
      citation: Fernandez-Perez, A., Fuertes, A.-M., & Miffre, J. (2023). The negative pricing of the
        May 2020 WTI contract. The Energy Journal, 44(1). doi:10.5547/01956574.44.1.afer。期刊页面对自动访问拦截，摘要与引语据作者
        2020 年工作论文版本《On the Negative Pricing of WTI Crude Oil Futures》（奥克兰理工大学托管 PDF）。
      url: https://acfr.aut.ac.nz/__data/assets/pdf_file/0004/541903/WTI-crude-oil-prices_Adrian-2021DMC.pdf
    - id: 4
      citation: Ge, Y., Kang, W., Tang, K., & Yang, L. Closing pressure, predatory trading, and the negative
        price of oil. 美国经济学会（AEA）2023 年年会论文。
      url: https://www.aeaweb.org/conference/2023/program/paper/FRQksbtk
- id: 2026-11-12-biz-wikipedia
  date: '2026-11-12'
  category: business
  title_zh: 经济学家如何解释人们为什么无偿编辑维基百科？
  title_en: How do economists explain why people contribute to Wikipedia?
  commentary: 不领工资、大多匿名，却合力写出了人类最大的百科全书。这是公共品理论的一道活体考题：标准模型预测「人越多越搭便车」，维基百科的自然实验却给出了相反的结果。
  source_name: Economics Stack Exchange
  source_url: https://economics.stackexchange.com/questions/39425/how-do-economists-explain-why-people-contribute-to-wikipedia
  author: user16353
  source_type: stackexchange
  tags:
  - 公共品
  - 同伴生产
  - 激励
  - 社会收益
  answer:
    format: scholarly
    reviewed_at: '2026-11-12'
    consensus:
      label: 「非金钱的社会收益与认可在起作用」有较强的因果证据；哪种动机最重要没有定论
      note: 一项准自然实验（中文维基百科在中国大陆被封锁）[1] 和一项随机田野实验（在维基百科向新编辑随机颁发象征性奖励）[3] 都表明，社会收益和认可会显著改变贡献行为。不过两项研究分别针对特定社群和特定干预，外推到「所有编辑为什么编辑」需要谨慎。Benkler
        的同伴生产理论提供了解释框架，但它本身不是因果检验。[2] 本文没有纳入编辑动机的自报问卷研究，因为未能打开原文核对。
    summary: 提问者把维基百科看作一个「公共品博弈」：贡献者得不到钱，多数匿名，似乎也得不到声誉。这正是经济学的经典难题。Zhang 与 Zhu 概括说，公共品私人供给的文献认为贡献激励与群体规模呈反向关系，即人越多越容易搭便车。[1]
      他们利用一次外生冲击做检验：中文维基百科在中国大陆被封锁，相当于贡献者群体突然缩小。结果，未被封锁的贡献者平均减少了 42.8% 的贡献，而不是像搭便车理论预测的那样增加。[1] 他们的解释是社会效应：贡献者获得的社会收益随自身贡献量和群体规模一同增加，群体缩小削弱了这种收益；越看重社会收益的人，减少得越多。[1]
      法学学者 Benkler 从制度角度提出「基于公共资源的同伴生产」（commons-based peer production），把它视为与市场、企业并列的第三种生产方式。[2] 他认为，人的动机多种多样，社会心理回报在某些情况下与金钱回报此消彼长；而大项目被拆成许多小块后，让任何一个人参与所需的动机都很小。[2]
      Gallus 在维基百科上做了大规模随机田野实验，发现纯象征性的奖励能显著提高新编辑的留存率，效果持续到干预后四个季度。[3] 综合来看，经济学家并不把维基百科当作「理性人假设的反例」，而是把它当作检验非金钱激励（社会收益、身份认同、认可与地位）的天然实验室。
    definitions:
    - term: 公共品
      text: 具有非排他性（难以阻止他人使用）和非竞争性（一人使用不减少他人可用量）的物品。Benkler 引用经济学传统，指出信息可以被任意多的人使用而不减少其可得性。[2]
    - term: 基于公共资源的同伴生产
      text: Benkler 提出的概念：一种依靠分散的信息收集与交换来降低参与者不确定性的生产方式；个体自行认领任务，出于多种动机完成它，而不是听从价格信号或管理命令。[2]
    - term: 间接收益（indirect appropriation）
      text: 不依赖排他性（如知识产权）来获取自身努力价值的方式，例如通过参与开源项目积累人力资本、获得声誉或创造的乐趣。[2]
    views:
    - position: 社会收益随群体规模增长：人越多，贡献越值得
      consensus_role: 有准自然实验支持的主要经济学解释
      evidence:
        label: 准自然实验（American Economic Review）
        note: 封锁带来的群体规模变化是外生的，识别较干净；[1] 但样本是中文维基百科的特定时期，社会收益的具体内容（被阅读、被认可、与他人互动）没有直接测量。
      holders:
      - name: Xiaoquan (Michael) Zhang、Feng Zhu
        identity: '《Group Size and Incentives to Contribute: A Natural Experiment at Chinese Wikipedia》（AER,
          2011）作者。[1]'
      argument: 若贡献只是为了让公共品存在，群体缩小时剩下的人应该多做一点。但数据显示，剩下的人反而少做了 42.8%。[1] 作者据此认为，贡献者获得的是一种随受众和同伴规模而增长的社会收益：写给更多人看、与更多人协作更有意义。[1]
        越看重社会收益的人，在封锁后减少得越多，这一点与解释一致。[1]
      quotes:
      - text: We find, however, that after an exogenous reduction of group size at Chinese Wikipedia,
          the nonblocked contributors decrease their contributions by 42.8 percent on average.
        text_zh: 然而我们发现，在中文维基百科的群体规模外生缩小之后，未被封锁的贡献者平均减少了 42.8% 的贡献。
        attribution: Zhang 与 Zhu，American Economic Review（2011）
        locator: 摘要
        ref: 1
    - position: 多元动机 + 模块化：把任务切碎，微小的动机就够了
      consensus_role: 有影响力的理论框架
      evidence:
        label: 理论与案例分析（法学期刊长文）
        note: Benkler 用 Linux、维基百科等案例建立理论，没有做因果检验；[2] 其中关于动机的部分借用了 Lerner 与 Tirole 等人对开源动机的梳理（据 [2] 转述，本文未打开原文）。
      holders:
      - name: Yochai Benkler
        identity: 《Coase’s Penguin, or, Linux and The Nature of the Firm》（Yale Law Journal, 2002）作者；发表时为纽约大学法学院教授（据论文脚注）。[2]
      argument: Benkler 的第一步论证是：人的动机是多样的，在某些经验领域里，金钱回报的存在会挤掉其他社会心理回报，因此一个远离金钱、提供社会心理回报的项目能吸引金钱吸引不来的人，或人们一天中的某些时段。[2]
        第二步是模块化：把项目拆成许多可以在短时间内完成的小块，参与所需的动机就可以很小。[2] 他还指出，创造的乐趣、声誉和人力资本积累等「间接收益」在很大程度上回答了同伴生产的激励问题。[2]
      quotes:
      - text: The second analytic move involves understanding that when a project of any size is broken
          up into little pieces, each of which can be performed by an individual in a short amount of
          time, the motivation to get any given individual to contribute need only be very small.
        text_zh: 第二步分析是认识到：当一个任意规模的项目被拆成许多小块，而每一块都能由一个人在短时间内完成时，让任何一个人参与贡献所需的动机就只需非常小。
        attribution: Yochai Benkler，Yale Law Journal（2002）
        locator: 第 112 卷，第 378 页
        ref: 2
    - position: 认可与身份：象征性奖励也能留住志愿者
      consensus_role: 有随机实验支持的补充解释
      evidence:
        label: 大规模随机田野实验（Management Science）
        note: 随机化保证获奖与此前表现无关，因果识别强；[3] 但研究对象是新编辑的留存率，而不是资深编辑的长期贡献，结论不宜直接推广。
      holders:
      - name: Jana Gallus
        identity: 《Fostering Public Good Contributions with Symbolic Awards》（Management Science, 2017）作者，署名单位为加州大学洛杉矶分校
          Anderson 管理学院。[3]
      argument: Gallus 在维基百科随机给新编辑颁发纯象征性的奖励。这些奖励不带来金钱或职业机会，地位提升也只体现在刚加入不久的社区中的化名身份上。[3] 结果显示，奖励显著提高了新编辑的留存率，效果持续四个季度。作者认为这可以用对社区的认同感增强来解释，也与关于地位、声誉和认可的研究一致。[3]
      quotes:
      - text: The analysis reveals that awards have a sizeable effect on newcomer retention, which persists
          over the four quarters following the initial intervention.
        text_zh: 分析显示，奖励对新编辑的留存有相当大的影响，并且这种影响在初次干预后的四个季度内持续存在。
        attribution: Jana Gallus，Management Science（2017）
        locator: 摘要
        ref: 3
    open_parts: 第一，社会收益、身份认同、乐趣和学习等动机各自的权重是多少，目前缺少能同时区分它们的因果研究。[1][3] 第二，这些发现能否推广到其他语言版本、其他时期，以及其他开放协作平台。第三，大语言模型大量使用维基百科内容、读者越来越多地通过
      AI 间接接触维基内容，这会不会削弱 Zhang 与 Zhu 所说的「受众规模带来的社会收益」？这是新的开放问题，尚无系统研究可引。
    references:
    - id: 1
      citation: 'Zhang, X. (M.), & Zhu, F. (2011). Group size and incentives to contribute: A natural
        experiment at Chinese Wikipedia. American Economic Review, 101(4), 1601–1615. doi:10.1257/aer.101.4.1601'
      url: https://www.aeaweb.org/articles?id=10.1257/aer.101.4.1601
    - id: 2
      citation: Benkler, Y. (2002). Coase’s penguin, or, Linux and The Nature of the Firm. Yale Law Journal,
        112, 369–446.
      url: https://yalelawjournal.org/pdf/354_t5aih5i1.pdf
    - id: 3
      citation: 'Gallus, J. (2017). Fostering public good contributions with symbolic awards: A large-scale
        natural field experiment at Wikipedia. Management Science, 63(12), 3999–4015. doi:10.1287/mnsc.2016.2540'
      url: https://pubsonline.informs.org/doi/10.1287/mnsc.2016.2540
- id: 2026-11-12-ai-nn-weak
  date: '2026-11-12'
  category: ai
  title_zh: 神经网络在哪些众所周知的问题上表现并不好？
  title_en: What are some well-known problems where neural networks don't do very well?
  commentary: 在「大模型无所不能」的氛围里，反问短板更有价值。表格数据、分布外外推、捷径学习和少样本抽象推理都在提醒我们：「万能逼近」不等于「会泛化」。
  source_name: Artificial Intelligence Stack Exchange
  source_url: https://ai.stackexchange.com/questions/18576/what-are-some-well-known-problems-where-neural-networks-dont-do-very-well
  author: AB_IM
  source_type: stackexchange
  tags:
  - 深度学习
  - 表格数据
  - 泛化
  - 外推
  - 捷径学习
  answer:
    format: scholarly
    reviewed_at: '2026-11-12'
    consensus:
      label: 「中等规模表格数据上树模型常优于神经网络」有多项基准支持，但正被表格基础模型挑战；外推与捷径学习的局限证据较强，边界仍在移动
      note: Grinsztajn 等人用 45 个数据集做的基准，以及 Shwartz-Ziv 与 Armon 的独立比较，都发现 XGBoost 等树模型优于当时的深度表格模型。[1][2]
        2025 年发表于 Nature 的 TabPFN 则报告，在不超过 10,000 个样本的数据集上，它大幅超越此前所有方法。[3] 因此更准确的说法是：用传统方式逐个数据集训练的神经网络，在中等规模表格数据上长期不占优。外推方面有理论结果：ReLU
        多层感知机沿任意方向会迅速趋于线性。[4] 捷径学习和少样本抽象推理方面的证据主要来自观点性综述和专门基准，[5][6][7] 结论随模型进步在变化。
    summary: 提问者想要具体例子：哪些（非时序的）回归任务上，神经网络不是最先进的方法？最直接的答案是表格数据，即行代表样本、列代表异质特征的电子表格式数据。Grinsztajn、Oyallon
      与 Varoquaux 用 45 个标准数据集和大规模超参数搜索（每个学习器约 2 万计算小时）做了系统基准，发现在中等规模（约 1 万个样本）数据上，树模型仍是最先进的，而且这还没算上它们速度更快的优势。[1]
      他们把原因归结为归纳偏置的差异：神经网络不擅长忽略无信息特征、会破坏数据原有的「朝向」，也难以学习不规则的函数。[1] Shwartz-Ziv 与 Armon 的比较同样发现，XGBoost
      在多个数据集上胜过新提出的深度表格模型，包括那些模型原论文使用的数据集，而且需要的调参少得多。[2] 但这条结论正在被改写：Hollmann 等人的 TabPFN 是在数百万个合成数据集上预训练的
      Transformer，在 ≤10,000 样本的数据集上大幅超越此前所有方法。[3] 第二类短板是外推。Xu 等人证明 ReLU MLP 沿离开原点的任意方向会迅速收敛为线性函数，因此无法外推大多数非线性函数。[4]
      第三类是捷径学习：Geirhos 等人认为，深度学习的许多问题是同一症状的不同表现，即模型学到在标准基准上有效、换到更难的测试条件就失效的决策规则。[5] 第四类是少样本学习、因果建模和组合泛化。Lake
      等人、Chollet 和 Marcus 从不同角度论证，当时的深度网络在这些方面与人类智能差距明显。[6][7][8]
    definitions:
    - term: 表格数据
      text: 以行和列组织的数据，例如电子表格，每列可以是不同类型、不同量纲的特征。[3] 与图像、文本不同，它没有天然的空间或序列结构。
    - term: 外推（extrapolation）
      text: 模型对训练分布支撑集之外的输入作出预测。[4] 与之相对的是插值，即在训练数据覆盖的范围内预测。
    - term: 捷径学习（shortcut learning）
      text: 模型学到在标准基准上表现良好、但无法迁移到更具挑战性的测试条件（如真实场景）的决策规则。[5]
    milestones:
    - year: 2016–2017
      name: 「像人一样学习和思考的机器」
      explanation: Lake 等人在 Behavioral and Brain Sciences 发表靶文章，主张机器需要因果模型、直觉物理与心理学，以及组合性和「学会学习」。[6]
    - year: '2019'
      name: ARC 抽象推理基准
      explanation: Chollet 把智能定义为「技能获取效率」，并提出抽象与推理语料库（ARC）。[7]
    - year: '2020'
      name: 捷径学习与外推理论
      explanation: Geirhos 等人提出捷径学习框架；[5] Xu 等人分析 MLP 与图神经网络如何外推。[4]
    - year: 2021–2022
      name: 表格数据基准
      explanation: 两项独立基准都发现树模型在表格数据上优于深度模型。[1][2]
    - year: '2025'
      name: 表格基础模型
      explanation: TabPFN 在 Nature 发表，报告在小规模表格数据上超越梯度提升树等基线。[3]
    views:
    - position: 表格数据：梯度提升树至今仍是很强的基线
      consensus_role: 多项基准的共同发现（正受挑战）
      evidence:
        label: 系统基准研究
        note: 两组作者用不同数据集与流程得出一致结论；[1][2] 但结论限于中等规模数据，且早于 TabPFN 一类的预训练表格模型。[3]
      holders:
      - name: Léo Grinsztajn、Edouard Oyallon、Gaël Varoquaux
        identity: 《Why do tree-based models still outperform deep learning on tabular data?》作者。[1]
      - name: Ravid Shwartz-Ziv、Amitai Armon
        identity: '《Tabular Data: Deep Learning is Not All You Need》作者。[2]'
      - name: Noah Hollmann 等（反方证据）
        identity: 《Accurate predictions on small data with a tabular foundation model》（Nature, 2025）作者。[3]
      argument: Grinsztajn 等人的结论是：树模型的归纳偏置更适合表格数据：它对无信息特征稳健，能保留数据原有的朝向（不像神经网络那样具有旋转不变性），也容易拟合不规则的函数。[1]
        想造出专门针对表格数据的神经网络，就要逐条克服这些挑战。[1] TabPFN 换了思路：不在单个数据集上从头训练，而是在数百万个合成数据集上「学会如何学习」，然后在新数据集上直接推断。[3]
      quotes:
      - text: Results show that tree-based models remain state-of-the-art on medium-sized data (∼10K samples)
          even without accounting for their superior speed.
        text_zh: 结果表明，即使不考虑树模型在速度上的优势，它们在中等规模数据（约 1 万个样本）上仍是最先进的方法。
        attribution: Grinsztajn、Oyallon 与 Varoquaux（2022）
        locator: 摘要（arXiv:2207.08815）
        ref: 1
      - text: Although deep learning has revolutionized learning from raw data and led to numerous high-profile
          success stories, gradient-boosted decision trees have dominated tabular data for the past 20
          years.
        text_zh: 尽管深度学习彻底改变了从原始数据中学习的方式，并带来了许多引人注目的成功案例，但在过去 20 年里，梯度提升决策树一直主导着表格数据。
        attribution: Hollmann 等，Nature（2025）
        locator: 摘要（原文中的参考文献角标已略去）
        ref: 3
    - position: 分布外泛化：外推失败与捷径学习
      consensus_role: 有理论与大量实证支持的局限
      evidence:
        label: 理论证明 + 综述性观点
        note: Xu 等人的外推结论是针对 ReLU MLP 的数学结果（基于神经正切核分析），并有实验支持；[4] Geirhos 等人的捷径学习是一篇视角文章，它把大量已发表的失败案例统一到一个框架下，本身不是新的实验。[5]
      holders:
      - name: Keyulu Xu、Stefanie Jegelka 等
        identity: '《How Neural Networks Extrapolate: From Feedforward to Graph Neural Networks》作者。[4]'
      - name: Robert Geirhos、Matthias Bethge 等
        identity: 《Shortcut Learning in Deep Neural Networks》（Nature Machine Intelligence, 2020）作者。[5]
      argument: 万能逼近定理只保证在训练数据覆盖的范围内能拟合得很好，不保证范围之外的行为。Xu 等人证明，ReLU MLP 一离开训练区域就近乎线性，所以对大多数非线性目标无法正确外推，除非把合适的非线性编码进架构或特征中。[4]
        Geirhos 等人则指出，模型常常利用数据中的「捷径」，例如背景纹理或数据集特有的伪相关；这些规则在同分布测试集上看起来很好，换到真实场景就失效。[5] 这一点与本站已收录的「深度神经网络为什么容易被愚弄」相互补充。
      quotes:
      - text: Shortcuts are decision rules that perform well on standard benchmarks but fail to transfer
          to more challenging testing conditions, such as real-world scenarios.
        text_zh: 捷径是这样一类决策规则：它们在标准基准上表现良好，却无法迁移到更具挑战性的测试条件，例如真实世界的场景。
        attribution: Geirhos 等，Nature Machine Intelligence（2020）
        locator: 摘要（arXiv:2004.07780）
        ref: 5
    - position: 少样本、因果与组合泛化：与人类学习方式的差距
      consensus_role: 有影响但有争议的批评
      evidence:
        label: 观点性综述与专门基准
        note: Lake 等人与 Marcus 的论证主要是综述和观点；[6][8] Chollet 提供了可检验的 ARC 基准。[7] 这些批评写于大语言模型兴起之前或早期，近年模型在部分基准上进步明显，差距的大小存在争议。
      holders:
      - name: Brenden M. Lake、Tomer D. Ullman、Joshua B. Tenenbaum、Samuel J. Gershman
        identity: 《Building Machines That Learn and Think Like People》（Behavioral and Brain Sciences）作者。[6]
      - name: François Chollet
        identity: 《On the Measure of Intelligence》作者，ARC 基准提出者。[7]
      - name: Gary Marcus
        identity: '《Deep Learning: A Critical Appraisal》作者。[8]'
      argument: Lake 等人主张，真正像人一样学习的机器需要构建支持解释与理解的因果模型，而不只是做模式识别；需要以直觉物理和直觉心理学为基础；还要利用组合性与「学会学习」，以便快速习得新任务并推广。[6]
        Chollet 认为，只测某项任务的技能不等于测智能，因为无限的先验或无限的训练数据可以「买到」任意水平的技能。他因此提出用技能获取效率来衡量智能，并构建了 ARC。[7] Marcus
        列出了深度学习的十项担忧，认为要实现通用人工智能，深度学习必须辅以其他技术。[8]
      quotes:
      - text: Despite their biological inspiration and performance achievements, these systems differ
          from human intelligence in crucial ways.
        text_zh: 尽管这些系统受到生物学启发并取得了出色的表现，它们在一些关键方面与人类智能不同。
        attribution: Lake 等，Behavioral and Brain Sciences
        locator: 摘要（arXiv:1604.00289）
        ref: 6
    open_parts: 第一，像 TabPFN 这样的表格基础模型能否推广到更大规模、更高维的表格数据，从而终结「树模型在表格数据上占优」这一经验规律。[1][3] 第二，规模扩大（更多数据、更大模型）能否在根本上缓解外推失败与捷径学习，还是只是把失败推到更远的分布之外。[4][5]
      第三，少样本抽象推理上的差距还剩多少，取决于如何防止基准被「训练进去」，这正是 Chollet 强调的先验与经验控制问题。[7]
    references:
    - id: 1
      citation: Grinsztajn, L., Oyallon, E., & Varoquaux, G. (2022). Why do tree-based models still outperform
        deep learning on tabular data? NeurIPS 2022 Datasets and Benchmarks Track. arXiv:2207.08815.
      url: https://arxiv.org/abs/2207.08815
    - id: 2
      citation: 'Shwartz-Ziv, R., & Armon, A. (2021). Tabular data: Deep learning is not all you need.
        arXiv:2106.03253（后发表于 Information Fusion）。'
      url: https://arxiv.org/abs/2106.03253
    - id: 3
      citation: Hollmann, N., Müller, S., Purucker, L., Krishnakumar, A., et al. (2025). Accurate predictions
        on small data with a tabular foundation model. Nature, 637, 319–326.
      url: https://www.nature.com/articles/s41586-024-08328-6
    - id: 4
      citation: 'Xu, K., Zhang, M., Li, J., Du, S. S., Kawarabayashi, K., & Jegelka, S. (2020). How neural
        networks extrapolate: From feedforward to graph neural networks. arXiv:2009.11848.'
      url: https://arxiv.org/abs/2009.11848
    - id: 5
      citation: Geirhos, R., Jacobsen, J.-H., Michaelis, C., Zemel, R., Brendel, W., Bethge, M., & Wichmann,
        F. A. (2020). Shortcut learning in deep neural networks. Nature Machine Intelligence, 2. arXiv:2004.07780.
      url: https://arxiv.org/abs/2004.07780
    - id: 6
      citation: Lake, B. M., Ullman, T. D., Tenenbaum, J. B., & Gershman, S. J. (2017). Building machines
        that learn and think like people. Behavioral and Brain Sciences, 40, e253. arXiv:1604.00289.
      url: https://arxiv.org/abs/1604.00289
    - id: 7
      citation: Chollet, F. (2019). On the measure of intelligence. arXiv:1911.01547.
      url: https://arxiv.org/abs/1911.01547
