        Kay, A., & Goldberg, A. (1977). Personal dynamic media. Computer, 10(3), 31–41. 本次打开并核对的是 The New Media Reader 重印本（标注原刊信息同上），页码按该重印本。
      url: https://www.newmediareader.com/book_samples/nmr-26-kay.pdf
