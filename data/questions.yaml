- id: 2026-11-11-psych-multitask
  date: '2026-11-11'
  category: psychology
  title_zh: 多任务处理是一个神话吗？
  title_en: Is multitasking a myth?
  commentary: 边开会边回消息、边写代码边刷信息流，我们到底是在「同时做」，还是在飞快地来回切换并为每次切换付费？这道题把实验室里的瓶颈理论与日常的媒体多任务习惯连在了一起。
  source_name: Psychology Stack Exchange
  source_url: https://psychology.stackexchange.com/questions/3708/is-multitasking-a-myth
  author: user3554
  source_type: stackexchange
  tags:
  - 多任务
  - 注意力
  - 任务切换
  - 认知控制
  - 媒体使用
  answer:
    format: scholarly
    reviewed_at: '2026-11-11'
    consensus:
      label: 「同时执行两项需要中枢加工的任务而毫无代价」在大多数情况下不成立，这一点有较强共识；但「多任务完全不可能」也不准确
      note: 双任务范式中的心理不应期（PRP）效应是被广泛用作多任务代价的指标，被归因于反应选择阶段的容量限制。[1][2] 同时，Fischer 与 Plessow 的综述强调并行与串行加工并不相互排斥，经过练习的特定任务组合可达到近乎完美的时间共享，也存在所谓「超级多任务者」。[1][3][4]
        至于「习惯性媒体多任务者认知控制更差」，证据不一致，元分析在校正小样本效应后不再显著。[5][6][7]
    summary: 如果「多任务」指同时完成两件都需要思考和决策的事而不付出代价，那么它在大多数情况下确实接近神话。双任务实验中，两项任务呈现得越接近，第二项任务的反应越慢、错误越多，这一心理不应期效应被广泛视为反应选择这一容量有限阶段的瓶颈所致。[1][2]
      任务切换研究也显示，即使有准备时间，切换仍有「残余代价」。[9] 但「完全不可能」同样不准确：Fischer 与 Plessow 综述指出，并行与串行加工不是非此即彼，人们会根据环境要求灵活调整；Schumacher
      等人（2001）报告，两项选择反应任务在仅五次练习后即可达到「完美时间共享」；Watson 与 Strayer（2010）描述了多任务时成绩不下降的「超级多任务者」。[1][3][4] 日常意义上的「媒体多任务」是另一个问题：Ophir、Nass
      与 Wagner（2009）发现重度媒体多任务者更易受无关刺激干扰、任务切换反而更差，[5] 但后续重复研究与元分析未能稳健复现这一关联，[6] Uncapher 与 Wagner 的综述认为整体证据倾向于重度媒体多任务者在若干认知领域表现较差，但许多研究并未发现差异，因果方向也不明。[7]
      2020 年的一项研究把重度媒体多任务与注意力走神和遗忘联系起来。[8] 结论：对需要中枢加工的任务，所谓多任务基本是快速切换，并伴随可测量的代价；简单、练熟或使用不同通道的任务可以部分并行；习惯性多任务是否会损害认知仍未定论。
    definitions:
    - term: 心理不应期（PRP）效应
      text: 在双任务范式中，两个刺激呈现的时间间隔越短，第二项任务的反应时越长、错误越多；短间隔与长间隔下第二项任务反应时之差即 PRP 效应，常被用作双任务代价的指标。[1][2]
    - term: 任务切换代价
      text: 在不同任务之间转换时相对重复同一任务出现的额外反应时或错误。Elchlepp、Monsell 与 Lavric 的综述指出，即使有准备时间，提前把注意转向相关属性的能力也有限，存在「残余代价」。[9]
    - term: 媒体多任务指数
      text: Ophir 等人设计的问卷指标，衡量一个人在使用媒体时平均同时使用多少种媒体，用于区分重度与轻度媒体多任务者。[5]
    milestones:
    - year: '1994'
      name: Pashler 的双任务干扰综述
      explanation: 《Psychological Bulletin》综述简单任务中的双任务干扰，PRP 效应与中枢瓶颈观点由此成为经典参照（本文据 [1] 的引用与概述）。[1][2]
    - year: '2001'
      name: 练习后的「完美时间共享」
      explanation: Schumacher 等人报告，在两项选择反应任务同时呈现且同等优先的条件下，仅五次练习即可达到双任务成绩等于单任务成绩（据 [1] 的概述）。[1][3]
    - year: '2009'
      name: 媒体多任务者的认知控制
      explanation: Ophir、Nass 与 Wagner 在 PNAS 报告重度媒体多任务者更易受干扰、任务切换更差。[5]
    - year: 2017–2020
      name: 重复研究、元分析与神经证据
      explanation: Wiradhany 与 Nieuwenstein 的元分析在校正小样本效应后不再显著；[6] Uncapher 与 Wagner 2018 年综述证据；[7] Madore
        等人 2020 年把媒体多任务、注意力走神与遗忘联系起来。[8]
    views:
    - position: 中枢瓶颈：需要决策的任务无法真正同时进行，只能串行或切换
      consensus_role: 主流实验心理学观点
      evidence:
        label: 数十年双任务与任务切换实验
        note: PRP 与切换代价是稳健、可重复的实验现象；但瓶颈的性质（结构性还是策略性）仍有争论。[1]
      holders:
      - name: Harold Pashler
        identity: '《Dual-task interference in simple tasks: Data and theory》（Psychological Bulletin, 1994）作者；本文未能打开原文，其观点据
          [1] 转述。[2]'
      - name: Rico Fischer、Franziska Plessow
        identity: '《Efficient multitasking: parallel versus serial processing of multiple tasks》（Frontiers
          in Psychology, 2015）作者，系统综述该领域。[1]'
      - name: Stephen Monsell 等
        identity: 任务切换研究者；此处引用其与 Elchlepp、Lavric 合著的 2021 年《Journal of Cognition》综述与实验论文。[9]
      argument: Fischer 与 Plessow 介绍，在 PRP 范式中两项任务的时间重叠越大，第二项任务越慢、越易出错；这一 PRP 效应被广泛用作在容量有限的反应选择阶段产生的双任务代价的指标。[1]
        换言之，当两件事都需要「选择怎么回应」时，大脑往往一次只能处理一件，另一件必须排队。任务切换研究则显示，即使提前有时间准备，在刺激出现前把注意转向相关属性或对象的能力也有限，存在「残余代价」。[9]
        这正是「多任务是神话」说法的科学内核：看似同时，其实是交替，并且每次交替都有代价。
      quotes:
      - text: The PRP effect reflects a widely used measure of dual-task costs evolving at the capacity-limited
          response-selection stage in dual-tasking (Figure 1A).
        text_zh: PRP 效应是一种被广泛使用的双任务代价指标，这种代价产生于双任务中容量有限的反应选择阶段（图 1A）。
        attribution: Fischer 与 Plessow，Frontiers in Psychology（2015）
        locator: 正文「PRP」相关小节
        ref: 1
    - position: 并非绝对：练习、任务类型与个体差异可以带来部分并行
      consensus_role: 重要限定
      evidence:
        label: 实验证据，但条件特定
        note: 「完美时间共享」与「超级多任务者」的证据来自特定任务与样本；其普遍性有限，且本文对 [3][4] 原文的数据未能直接核对，据 [1] 的综述转述。[1][3][4]
      holders:
      - name: Eric H. Schumacher 等
        identity: 2001 年《Psychological Science》「虚拟完美时间共享」研究作者（据 [1]）。[3]
      - name: Jason M. Watson、David L. Strayer
        identity: '《Supertaskers: Profiles in extraordinary multitasking ability》（Psychonomic Bulletin
          & Review, 2010）作者（据 [1]）。[4]'
      argument: Fischer 与 Plessow 认为，并行与串行加工并不相互排斥，只问其中一种模式的问题过于简化；从更并行到更串行加工的转变关键取决于多项任务执行的条件，高效多任务体现为根据环境要求灵活调整任务成分调度策略的能力。[1]
        他们介绍，Schumacher 等人（2001）让被试同时、同等优先地完成视觉—手动与听觉—言语两项选择反应任务，仅五次练习后即达到双任务成绩等于单任务成绩的「完美时间共享」标准；[1][3]
        另有研究发现了与单任务相比多任务时成绩不下降的「超级多任务者」。[1][4]
      quotes:
      - text: Parallel and serial processing of multiple tasks are not mutually exclusive. Therefore,
          questions focusing exclusively on either task-processing mode are too simplified.
        text_zh: 多项任务的并行加工与串行加工并不相互排斥。因此，只聚焦其中一种任务加工模式的问题过于简化了。
        attribution: Fischer 与 Plessow，Frontiers in Psychology（2015）
        locator: 摘要
        ref: 1
    - position: 习惯性媒体多任务与较差的注意控制相关——但证据不一致、因果不明
      consensus_role: 有争议的研究领域
      evidence:
        label: 相关研究为主，复现性存疑
        note: Ophir 等人（2009）是相关研究；Wiradhany 与 Nieuwenstein 的元分析在校正小样本效应后不再显著；Uncapher 与 Wagner 的综述明确指出因果方向尚待确定。[5][6][7]
      holders:
      - name: Eyal Ophir、Clifford Nass、Anthony D. Wagner
        identity: 《Cognitive control in media multitaskers》（PNAS 2009）作者。[5]
      - name: Wisnu Wiradhany、Mark R. Nieuwenstein
        identity: 两项重复研究与元分析（Attention, Perception & Psychophysics, 2017）作者。[6]
      - name: Melina R. Uncapher、Anthony D. Wagner
        identity: 《Minds and brains of media multitaskers》（PNAS 2018）综述作者。[7]
      argument: Ophir 等人发现，重度媒体多任务者更易受环境中无关刺激和记忆中无关表征的干扰，这导致了一个令人意外的结果：他们在任务切换测验中表现更差，可能是因为难以过滤无关任务集的干扰。[5]
        但 Wiradhany 与 Nieuwenstein 的两项重复研究共 14 项检验中只有 5 项显著，其中只有 2 项在更保守的贝叶斯分析中成立；对 39 个效应量的元分析显示弱但显著的关联，在校正小样本效应后变得不显著。[6]
        Uncapher 与 Wagner 的综述则认为，证据总体倾向于重度媒体多任务者在若干认知领域表现较差，但许多研究并未发现差异，且需要进一步确定因果方向。[7] Madore 等人 2020
        年用脑电与瞳孔测量发现，注意力走神与遗忘相关，并在媒体多任务与记忆之间起中介作用。[8]
      quotes:
      - text: Taken together, these findings lead us to question the existence of an association between
          media multitasking and distractibility in laboratory tasks of information processing.
        text_zh: 综合来看，这些发现使我们质疑：在实验室信息加工任务中，媒体多任务与易分心之间是否真的存在关联。
        attribution: Wiradhany 与 Nieuwenstein，Attention, Perception & Psychophysics（2017）
        locator: 摘要
        ref: 6
      - text: While the literature is still sparse, and is marked by both convergent and divergent findings,
          the balance of evidence suggests that heavier media multitaskers exhibit poorer performance
          in a number of cognitive domains, relative to lighter media multitaskers (although many studies
          find no performance differences between groups).
        text_zh: 尽管相关文献仍然稀少，且既有趋同也有分歧的发现，但证据总体表明，与轻度媒体多任务者相比，重度媒体多任务者在若干认知领域表现较差（尽管许多研究发现两组之间没有表现差异）。
        attribution: Uncapher 与 Wagner，PNAS（2018）
        locator: 摘要
        ref: 7
    open_parts: 第一，中枢瓶颈是大脑的结构性限制，还是为避免任务间串扰而采取的策略性串行化，仍有争论。[1] 第二，练习带来的并行能力能否迁移到复杂、真实的工作情境（如驾驶时打电话、编程时开会），实验室证据有限。[1][3]
      第三，「超级多任务者」的比例与稳定性有多大，需要更多独立复现。[4] 第四，媒体多任务与注意控制之间是否存在关联、方向如何（多任务导致注意力差，还是注意力差的人更爱多任务），仍未解决。[6][7][8]
