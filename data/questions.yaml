- id: 2026-11-26-phil-guns
  date: '2026-11-26'
  category: philosophy
  title_zh: 「枪不杀人，人杀人」是不是一个好论证？
  title_en: Is 'guns don't kill people, people kill people' a good argument?
  commentary: 这句口号把工具和行动者对立起来，听起来像在谈因果，往往却在暗示责任或政策结论。用标准的「若非则不」检验去看，它作为对因果的否认站不住；作为「只有人可被归责」的提醒，也推不出「因此枪支没有问题」。
  source_name: Philosophy Stack Exchange
  source_url: https://philosophy.stackexchange.com/questions/10975/is-guns-dont-kill-people-people-kill-people-a-good-argument
  author: Crab Bucket
  source_type: stackexchange
  tags:
  - 因果
  - 责任
  - 非正式论证
  - 武器
  answer:
    format: scholarly
    reviewed_at: '2026-11-26'
    consensus:
      label: 若把这句口号理解成「枪支不是致死的原因」，它与英美侵权和刑法中占主导的「若非则不」（but-for / sine qua non）因果检验相冲突。若把它理解成「只有人才能承担道德或法律责任」，这一提醒更可辩护，但从中推不出「因此枪支或某类金融工具就没有问题」。本次讨论是概念分析，不是对持枪与死亡率的实证研究综述
      note: 斯坦福哲学百科「Causation in the Law」条目把法律中占主导的「事实上的因果」检验陈述为 sine qua non 或 but-for 检验：若非被告的行为，受害人是否仍会受到她所受到的伤害？该检验要求被告的行为是伤害的必要条件，其吸引力正在于它抓住了我们在解释事件与归责时都关心的问题：被告的行为是否造成了差别。[1]
        把同一反事实问题问向「若非有枪」，在许多枪杀中答案为否，于是枪支可以是事实上的原因之一，即使它不是道德主体。原帖还指出，这句句式已被用于汽车和证券化债务，并常被暗示推出「因此 X 没有问题」；后一步是额外的规范跳跃，并不由「人是行动者」自动给出。本次没有打开关于枪支可获得性与杀人罪的经验研究，故不把政策效应写成已核对的结论。
    summary: 「枪不杀人，人杀人」像一句关于因果的断言，但它通常还想带走一句政策结论。要判断它是不是好论证，需要先分开两件事：某物是否是伤害的原因，以及谁应当被归责。关于前者，法律哲学里最常用、也最简约的检验是反事实的「若非则不」：若非某一因素，伤害是否仍会发生。斯坦福哲学百科对这一主导检验的概括是：它问「若非被告的行为，受害人是否仍会受到她所受到的伤害」，并要求该行为是伤害的必要条件；人们在乎它，正因为解释和责任都关心「这一点是否造成了差别」。[1]
      枪杀若在「若非有这把枪（或这类武器）」时本不会以同一方式发生，则枪支可以是事实上的原因，即使扣扳机的是人。于是，把口号读成对因果贡献的否认，是一个坏论证：它把「人是行动者」错当成「工具不能进入因果故事」。把口号读成「只有人可被责备、枪支不是罪犯」，则更接近责任归属的常识；可是原帖所指出的那一步——「因此枪支（或跑车、或证券化债务）没有问题」——并不能从「只有人是主体」推出。工具可以改变伤害的可能性、方式或严重程度，而不需要自己成为道德主体。作为论证，这句口号至多是在转移论题：从「工具是否参与因果」跳到「应不应规制工具」，中间缺少独立的前提。
    definitions:
    - term: 若非则不 / 必要条件检验（but-for / sine qua non test）
      text: 斯坦福哲学百科所述、在侵权与刑法中占主导地位的「事实上的因果」检验。它提出反事实问题：若非被告的行为，受害人是否仍会受到她所受到的伤害？也被称为必要条件检验，因为它要求该行为对伤害而言是必要的。[1]
    - term: 事实上的因果（cause-in-fact）
      text: 该条目所陈述的、法律因果两层要求中的第一层。按其中转述的常规看法，这一层才是真正对应科学或事实因果概念的部分；第二层（近因等）则常常混有政策考量。[1]
    views:
    - position: 若口号被用来否认枪支是致死的原因，则它不是一个好论证：标准的反事实检验允许工具成为事实上的原因
      consensus_role: 把既有的法律因果检验应用到这句口号上的分析，不是一条专门讨论该口号的新定理
      evidence:
        label: 哲学百科对主导法律检验的综述；本次把该检验应用到口号上，应用本身不是条目里的原句
        note: 条目讨论的是「被告的行为」，而不是「枪支」这个对象。将 but-for 问句改写成「若非有枪」是分析上的平移，需要承认：有些死亡在没有这把枪时仍可能以其他方式发生，此时该枪可能通不过必要条件检验。条目也指出，叠加因果等情形会使单纯的
          but-for 检验陷入困境，法院实际上会修改它。[1] 因此，这里只主张「不能一般地否认枪支的因果贡献」，而不是主张「每一起案件中枪都是 but-for 原因」。
      holders:
      - name: Stanford Encyclopedia of Philosophy 条目 “Causation in the Law”
        identity: 首次发布于 2019 年 10 月 3 日，本次打开的是 2024 年 2 月 4 日修订本。页面转换文本未提供可逐字核对的作者署名行，故此处按条目本身引用，不补写未经该页核对的作者姓名。[1]
      argument: 口号的力量来自一种看似显然的对比：人会行动，枪不会。可是「事实上的因果」并不要求原因必须是行动者。but-for 检验问的是必要性，不是主体性。[1] 许多枪杀满足：若非有枪，受害人不会以这种方式死去。此时否认枪的因果贡献，只是把「谁该受审」的问题伪装成「什么算原因」。原帖把它推广到汽车和金融工具，恰好暴露了同一结构：我们不会因为「开车的是人」就否认车辆在致死过程中的因果角色。作为对因果的否认，这句口号是失败的。
      quotes:
      - text: 'This minimalist requirement is by far the dominant explicit test for cause in fact in both
          torts and criminal law. It is the “sine qua non”, or “but-for” test. Such a test asks a counterfactual
          question: “but for the defendant’s action, would the victim have been harmed as she was?” This
          test is also sometimes called the necessary condition test, because it requires the defendant’s
          action have been necessary to the victim’s harm. The appeal of this test stems from this fact.
          The test seems to isolate something we seem to care a lot about, both in explaining events and
          in assessing responsibility for them, namely, did the defendant’s act make a'
        text_zh: 这一最低限度的要求，是侵权法和刑法中迄今为止占主导地位的、明示的「事实上的因果」检验。它就是 “sine qua non” 或 「若非则不」检验。这一检验提出一个反事实问题：「若非被告的行为，受害人是否仍会受到她所受到的伤害？」它有时也被称为必要条件检验，因为它要求被告的行为对受害人的伤害而言是必要的。这一检验的吸引力正来自于此。它似乎分离出了我们在解释事件和评定责任时都非常关心的东西，即：被告的行为是否造成了差别。
        attribution: Stanford Encyclopedia of Philosophy，Causation in the Law
        locator: §2.2 The dominant definition of cause-in-fact（2024-02-04 修订本）。引文在 “make a” 处随条目原文转入下一句，本次不补写未完整截取的后续词语。
        ref: 1
    - position: 若口号只是提醒「责任归于行动者，而不是归于作为物体的枪」，它有一定道理，但由此不能推出「因此枪支没有问题」
      consensus_role: 对口号的善意读法，并指出原帖所关心的那一步规范跳跃
      evidence:
        label: 概念分析；「因此 X 没有问题」这一步来自原帖对其修辞用法的观察，不是一项新的经验发现
        note: 法律条目本身把「解释事件」和「评定责任」并列，说明因果贡献与归责相关但不是同一件事。[1] 善意读法把口号放在归责一侧。即便如此，要从「枪不是被告」推出「不必关注枪的设计、可获得性或某类金融工具」，仍需要额外前提。本次未核对枪支管制的经验文献，故不在此给出政策结论。
      holders:
      - name: Stanford Encyclopedia of Philosophy 条目 “Causation in the Law”
        identity: 同上。此处依据的是该条目把因果贡献与责任评定相关联、但又分为不同问题的陈述，而不是该条目对枪支口号的直接评论——条目并未讨论这句口号。[1]
      argument: 有一种更宽容的理解：说话者并不是在做物理学，而是在说刑法和道德的主语必须是人。枪不能被定罪，人才能。这一提醒本身并不荒谬，而且与「我们既关心解释、也关心责任」的法律实践相容。[1]
        它之所以仍然常常是坏论证，是因为公共讨论里它很少停在这一提醒上。原帖准确地看到了那句潜台词：因此枪支是可以的，因此快车是可以的，因此证券化债务是可以的。可是「不是道德主体」并不等于「不是使伤害发生或加重的因素」，更不等于「规制该因素没有理由」。要完成这一步，还必须论证工具不改变风险，或改变了也不构成公共理由——而这些都是独立的、需要另外证据的主张。缺少它们，口号就只是在用因果的语法，运送一个它并未证明的政策结论。
    open_parts: 「若非则不」检验在重叠因果、抢先因果等情形中并不够用，条目对此有专门讨论；本次没有把那些技术修正展开为对口号的逐案应用。[1] 枪支作为「原因」的经验强度（可获得性是否改变杀人罪或自杀率）是另一项大量文献，本次未打开，故明确不加进结论。把同一句式用到汽车或金融工具时，各自的反事实背景和规制理由也不相同，不能用一句口号统一判决。
    references:
    - id: 1
      citation: Causation in the law. (2024, February 4). In Stanford Encyclopedia of Philosophy (substantive
        revision of the entry first published October 3, 2019). 本次打开并核对的是条目页：https://plato.stanford.edu/entries/causation-law/
      url: https://plato.stanford.edu/entries/causation-law/
- id: 2026-11-26-phil-download
  date: '2026-11-26'
  category: philosophy
  title_zh: 非法下载音乐是不道德的吗？
  title_en: Is it immoral to download music illegally?
  commentary: 把未经授权的下载叫作「盗版」或「偷窃」，是权利人常用的道德语言，但知识产权的客体可以同时被许多人使用、也不会因为被复制而耗尽。是不是不道德，取决于「偷窃」类比是否成立，以及激励论证能走多远——这两点在哲学里都有严肃争议。
  source_name: Philosophy Stack Exchange
  source_url: https://philosophy.stackexchange.com/questions/1597/is-it-immoral-to-download-music-illegally
  author: stoicfury
  source_type: stackexchange
  tags:
  - 知识产权
  - 版权
  - 伦理学
  - 非竞争性
  answer:
    format: scholarly
    reviewed_at: '2026-11-26'
    consensus:
      label: 非法下载在实定法上通常构成侵权，但「因此它不道德」并不是哲学上的定论。反对把复制等同于偷窃的核心理由是：知识对象具有非排他、非竞争性，多一人使用并不消耗原物。这一理由构成对限制性权利的初步质疑，但并不是自动的许可：激励创作的功利论证，以及对未经同意之风险的反驳，仍然存在
      note: Hettinger（1989）指出，知识产权制度尤其难以证成；他把版权、专利和商业秘密的对象称为「知识对象」，并强调它们是非排他的：可以同时出现在许多地方，且不会因使用而被消耗，增加一个使用者的边际成本为零。他也记录了权利人把未经授权的获取称为「盗版」或信息偷窃，并举翻录朋友唱片等为例，同时认为这些现象表明公众对制度的性质与正当性存在广泛分歧。[1]
        斯坦福哲学百科「Intellectual Property」在「信息是非竞争性的」一节，把「复制并不剥夺任何人的占有」概括为反对限制性权利的初步论证，并明确引用 Hettinger 等；随即指出该论证的第一前提是弱点：并非凡可被许多人同时使用的信息，都产生应被最大开放的初步道德要求，且未经授权的复制即使未抢走一笔本会发生的销售，也可能把未经同意的风险加给权利人。[2]
    summary: 「非法下载音乐是否不道德」不能靠「法律禁止因此不道德」或「不过是复制因此无所谓」其中任何一句来结束。Hettinger 把问题放回制度证成：财产制度塑造社会，而知识财产尤其难以证成。权利人常把翻录唱片、拷贝程序等称为「盗版」或信息偷窃，但
      Hettinger 认为这类现象恰恰说明，公众对知识财产制度的性质与正当性并无共识，需要专门审视。[1] 他给出的关键事实是对象本身的性质：他把版权、专利和商业秘密的对象叫作知识对象，并强调它们是非排他的——可以同时在许多地方出现，使用并不消耗它们，多提供给一个使用者的边际成本为零。[1]
      斯坦福哲学百科把这一思路整理成更形式的「非竞争性」论证：若作品可被许多人同时使用和消费，则应允许最大程度的获取与使用；知识作品正是非竞争性的，因此对限制性知识产权有初步的反面理由。百科同时标明，弱点在第一前提：敏感的个人信息、国家安全信息等同样是非竞争性的，却并不因此产生应被最大开放的初步道德要求；即便复制者本来就不会合法购买，未经授权的复制仍可能把未经同意的风险加在权利人身上。[2]
      于是，较稳妥的结论是：把非法下载直接等同于偷窃，忽视了复制并不取走原物这一事实，道德上并不自动成立；但「非竞争性」本身也推不出「因此可以不顾作者与激励地下载」。是否不道德，还要看具体情境里激励、同意、替代购买以及公平使用等因素，而不是一句口号。
    definitions:
    - term: 知识对象的非排他性（nonexclusive）
      text: Hettinger 用来刻画版权、专利和商业秘密之对象的性质：它们可以同时处于许多地方，并且不会因使用而被消耗；向额外使用者提供的边际成本为零。[1]
    - term: 非竞争性（non-rivalrous）
      text: 斯坦福哲学百科在批评性综述中使用的概念：知识作品通常不会因被使用而被消耗，并且可以被许多人同时使用；「做一份拷贝并不剥夺任何人的占有」。[2]
    milestones:
    - year: '1989'
      name: Hettinger《Justifying Intellectual Property》
      explanation: '刊于 Philosophy & Public Affairs 18(1): 31–52。文章感谢美国商务部国家电信与信息管理局对其早期研究的支持。本次打开并核对的是作者提供的
        PDF。[1]'
    - year: 2011/2022
      name: 斯坦福哲学百科「Intellectual Property」条目
      explanation: 首次发布于 2011 年 3 月 8 日，本次打开的是 2022 年 8 月 18 日修订本。[2]
    views:
    - position: 把非法下载直接叫作偷窃是有误导的，因为知识对象可以同时被许多人使用、并不会因复制而耗尽；知识产权制度本身仍需要独立的证成
      consensus_role: 对「盗版=偷窃」类比最有影响的哲学质疑之一
      evidence:
        label: 一篇经典的同行评议哲学论文，加上百科对其非竞争性论证的转述
        note: Hettinger 的文章是对版权、专利和商业秘密制度的一般证成讨论，并非专门的「下载音乐」案例分析；他把翻录朋友的唱片列为权利人所称的侵权活动之一。[1] 本文不把 1989
          年的技术例子（磁带、录像）当成对当代流媒体市场效应的估计。
      holders:
      - name: Edwin C. Hettinger
        identity: 《Justifying Intellectual Property》（Philosophy & Public Affairs, 1989）作者。文首脚注说明其原初研究完成于在美国商务部国家电信与信息管理局工作期间。[1]
      argument: 若下载不道德是因为它「和偷一张光盘一样」，论证的负担在于说明：被取走的到底是什么。Hettinger 指出，知识对象与有体物不同，它们可以同时在许多地方，使用并不消耗它们。[1]
        因此，未经授权的拷贝并不像偷窃那样让原拥有者失去那份物体。他同时记录，「盗版」「偷窃」是权利人的语言，而公众是否接受这一制度，本身就是分歧。[1] 这意味着，非法性可以成立，但道德结论还不能从「偷窃」二字自动运出；必须另外说明，为何要赋予对非排他对象的排他控制。
      quotes:
      - text: 'These objects are nonexclusive: they can be at many places at once and are not consumed
          by their use. The marginal cost of providing an intellectual object to an additional user is
          zero'
        text_zh: 这些对象是非排他的：它们可以同时处于许多地方，并且不会因使用而被消耗。向额外的一个使用者提供一个知识对象的边际成本为零。
        attribution: Edwin C. Hettinger，Justifying Intellectual Property
        locator: Philosophy & Public Affairs 18(1) (1989)，「Intellectual Objects as Nonexclusive」一节起首，作者
          PDF 约第 36 页附近
        ref: 1
    - position: 非竞争性只提供反对限制性权利的初步理由，并不自动使非法下载成为道德上可允许的行为
      consensus_role: 对前一论证之第一前提的有影响批评，与「需要证成」的立场兼容
      evidence:
        label: 哲学百科中的综述与反例，不是一项关于音乐市场的新试验
        note: 该节把 Kuflik、Hettinger、Barlow 列为初步论证的代表，随即指出第一前提的弱点，并引用 Moore（2012）与 Himma（2005b）的反驳方向。[2]
          条目转换文本未提供可逐字核对的作者署名行，故按条目本身引用。
      holders:
      - name: Stanford Encyclopedia of Philosophy 条目 “Intellectual Property”
        identity: 2011 年首次发布、2022 年 8 月 18 日修订的百科条目。本次打开并核对该页「Information is Non-Rivalrous」一节。[2]
      argument: 即便接受「多一份拷贝不会让原文件消失」，也不等于「因此应允许最大获取」。百科把这一跳跃写成明确的第一前提，并给出反例：敏感个人信息同样可以被许多人同时使用，却并不因此产生应被最大开放的初步道德要求。它还提醒，即使复制者本来就不会购买正版，未经授权的复制仍可能把未经同意的风险加给权利人。[2]
        对音乐下载而言，这意味着：否定偷窃类比，并不自动完成辩护。仍需要面对激励（没有一定的控制，部分作品是否还会被创作和发行）、同意，以及「这次下载是否替代了一次本会发生的付费」等独立问题。法律上的「非法」也不能单独定道德之罪，但「非竞争性」同样不能单独颁发道德许可证。
      quotes:
      - text: Since intellectual works are not typically consumed by their use and can be used by many
          individuals concurrently (making a copy does not deprive anyone of their possessions), we have
          a strong case against moral and legal intellectual property rights (Kuflik 1989; Hettinger 1989;
          Barlow 1997). [...] The weak point in this argument is the first premise (Moore 2012; Himma,
          2005b).
        text_zh: 由于知识作品通常不会因其被使用而被消耗，并且可以被许多个体同时使用（制作一份拷贝并不剥夺任何人的占有），我们便有了反对道德上和法律上的知识产权的强理由（Kuflik 1989；Hettinger
          1989；Barlow 1997）。[…] 这一论证的弱点在于第一个前提（Moore 2012；Himma, 2005b）。
        attribution: Stanford Encyclopedia of Philosophy，Intellectual Property
        locator: §4.2 Information is Non-Rivalrous（2022-08-18 修订本）
        ref: 2
    open_parts: 当代流媒体改变了「一次下载是否替代一次销售」的经验背景，1989 年与百科修订本都不是对 2020 年代音乐市场的计量研究。[1][2] 公平使用、价格、地区限制、以及艺术家与发行商之间的收入分配，都会改变具体判断，但本次没有打开相应的经验文献。功利主义的激励论证是证成知识产权的另一条主线，条目另有专节，本次只在限度内提及，不把它写成已逐段核对的完整理论。
    references:
    - id: 1
      citation: Hettinger, E. C. (1989). Justifying intellectual property. Philosophy & Public Affairs,
        18(1), 31–52. 本次打开并核对的是作者提供的 PDF：https://hettingern.people.charleston.edu/Hettinger%20-%20Justifying%20Intellectual%20Property.pdf
      url: https://hettingern.people.charleston.edu/Hettinger%20-%20Justifying%20Intellectual%20Property.pdf
    - id: 2
      citation: Intellectual property. (2022, August 18). In Stanford Encyclopedia of Philosophy (substantive
        revision of the entry first published March 8, 2011). 本次打开并核对的是条目页：https://plato.stanford.edu/entries/intellectual-property/
      url: https://plato.stanford.edu/entries/intellectual-property/
- id: 2026-11-26-psych-upside-down
  date: '2026-11-26'
  category: psychology
  title_zh: 学会倒着读写之后，我对自己做了什么？
  title_en: By learning to read and write upside down, what did I do to myself?
  commentary: 学会倒着写之后，手写时分不清小写 b 和 d，听起来像「给自己制造了阅读障碍」。更准确的心理学名称是负迁移：一项新技能干扰了旧技能的某个局部。镜像书写本身也是文献里有记载的现象，不必首先把它病理化。
  source_name: Psychology Stack Exchange
  source_url: https://psychology.stackexchange.com/questions/232/by-learning-to-read-and-write-upside-down-what-did-i-do-to-myself
  author: Wayne Werner
  source_type: stackexchange
  tags:
  - 学习迁移
  - 镜像书写
  - 读写
  - 负迁移
  answer:
    format: scholarly
    reviewed_at: '2026-11-26'
    consensus:
      label: 在一种情境中学会倒着或反向读写，从而干扰正常手写中的个别字母（如 b 与 d），最贴切的既有概念是负迁移，而不是「给自己造成了发展性阅读障碍」。镜像书写和镜像阅读在儿童、部分发展性阅读障碍者、某些健康左利手成人以及脑损伤后都有记载，机制并不单一
      note: Perkins 与 Salomon（1992）把学习迁移定义为：在一种情境中的学习增强（正迁移）或损害（负迁移）另一种相关表现；并区分近迁移与远迁移。[1] Gottfried、Sancar
        与 Chatterjee（2003）在一篇关于获得性镜像书写与阅读的病例研究中写明：幼儿、发展性阅读障碍者以及一些健康的左利手成人可能写出镜像文字；脑损伤后的持续性镜像书写则很少见，且提出过运动、视空间和视觉词形等多种假说。[2]
        原提问者的困难局限于手写 b/d、并不影响阅读或打字，更符合局部负迁移，而不是获得性阅读障碍或发展性阅读障碍的诊断标准——后两者本次也没有把诊断手册作为核对对象。
    summary: 原提问者在青少年时期自学倒着（以及可能的反向）读写，此后手写小写 b 和 d 变得非常困难，以至于要用「b 指向词尾」这类常与阅读障碍联系起来的策略；阅读和打字则不受影响。他问：这是不是一种非常有限的、自己造成的阅读障碍？就已打开的文献而言，更准确的说法是负迁移。Perkins
      与 Salomon 把迁移定义为：在一种情境或材料上的学习，增强或损害另一种相关情境中的表现；损害的那一侧就叫负迁移。教育通常期望正迁移，但研究也表明迁移——尤其是远迁移——常常并不发生；一旦发生，也可以沿相反方向起作用。[1]
      把「倒着写」练到流畅，意味着另一套字母方向与笔画顺序被高度练习，于是在回到常规手写时，最容易在方向对立的一对字母上出错，这与负迁移「损害相关表现」的定义相符，也解释了为什么干扰可以只出现在手写、而不出现在阅读或键盘输入。镜像现象本身并不罕见到必须立刻病理化。Gottfried
      等人指出，幼儿、发展性阅读障碍者和一些健康左利手成人都可能写出镜像文字；他们自己报告的是一例脑外伤后持续性镜像书写与阅读的病人，并强调单一机制无法解释所有镜像现象。[2] 该病例与提问者的主动练习不是同一回事，但它说明：反向的字形表征可以在神经系统中被组织起来，而不必等于「患上了发展性阅读障碍」。较稳妥的自我描述因此是：通过刻意练习获得了一项不寻常的技能，并在与旧技能重叠的局部（手写
      b/d）付出了负迁移的代价。
    definitions:
    - term: 正迁移与负迁移（positive / negative transfer）
      text: Perkins 与 Salomon 的定义：在一种情境中的学习增强另一种相关表现，称为正迁移；损害另一种相关表现，称为负迁移。迁移还包括近迁移（到紧密相关的情境）和远迁移（到相当不同的情境）。[1]
    - term: 镜像书写与镜像阅读（mirror writing / mirror reading）
      text: Gottfried 等人把镜像书写定义为：单个字母和整个词串以相反方向产出；镜像阅读则指相对于正常书写的词，更偏好阅读镜像反转的词。把这些字对着镜子，可以正常读出。[2]
    milestones:
    - year: '1992'
      name: Perkins 与 Salomon 的「学习迁移」百科条目
      explanation: 为《国际教育百科全书》第二版撰写，文面日期 1992 年 9 月 2 日。作者单位为哈佛研究生教育学院（Perkins）与海法大学、亚利桑那大学（Salomon）。[1]
    - year: '2003'
      name: Gottfried、Sancar 与 Chatterjee 的获得性镜像书写病例
      explanation: '刊于 Neuropsychologia 41: 96–107。作者单位为宾夕法尼亚大学医院神经科与认知神经科学中心。[2]'
    views:
    - position: 手写时把 b 和 d 弄混，最好理解为对「倒着写」这项新技能的负迁移，而不是自己制造了发展性阅读障碍
      consensus_role: 用标准学习理论对个案的概念归类；并非针对该提问者的专门实验
      evidence:
        label: 百科条目中的定义与一般研究发现，加上提问者自我报告的症状范围
        note: Perkins 与 Salomon 讨论的是迁移的一般机制（低路/反射性迁移与高路/有意抽象），并指出远迁移常常不发生。[1] 他们没有研究「倒着写」这一具体训练。把 b/d
          混淆归为负迁移，是因为症状局限于与方向高度相关的手写表现，这与定义相符，但不是一项已发表的个案试验。
      holders:
      - name: David N. Perkins、Gavriel Salomon
        identity: 《Transfer of Learning》作者。文首单位为哈佛研究生教育学院，以及海法大学与亚利桑那大学。[1]
      argument: 提问者担心的是一个诊断标签。迁移理论提供了一个更窄、也更可检验的描述：新学习损害了旧表现的某一部分。[1] 「倒着写」与常规书写共用字母形状，却在方向上相反，正是容易互相干扰的近关系。只在手写时出现、阅读和打字完好，进一步符合「局部负迁移」而不是全面的字词系统崩溃。这并不否认发展性阅读障碍者也可以出现字母反转，而是说：由主动练习带来的、局限于产出方向的干扰，不必先被写成一种自我诱发的疾病。
      quotes:
      - text: Transfer of learning occurs when learning in one context enhances (positive transfer) or
          undermines (negative transfer) a related performance in another context. Transfer includes near
          transfer (to closely related contexts and performances) and far transfer (to rather different
          contexts and performances).
        text_zh: 当在一种情境中的学习增强（正迁移）或损害（负迁移）另一种情境中的相关表现时，就发生了学习迁移。迁移包括近迁移（到紧密相关的情境和表现）和远迁移（到相当不同的情境和表现）。
        attribution: David N. Perkins 与 Gavriel Salomon，Transfer of Learning
        locator: International Encyclopedia of Education, 2nd ed. 条目摘要，文面日期 1992-09-02
        ref: 1
    - position: 镜像读写是已知现象，可见于没有脑损伤的人群，也可见于脑损伤后的罕见病例；不能把提问者的情况直接等同于获得性镜像书写，但后者说明反向字形表征可以被神经系统组织起来
      consensus_role: 临床与认知神经科学中的现象记录，用来给「我做了什么」提供对照，而不是给提问者做诊断
      evidence:
        label: 一篇病例研究及其文献回顾，样本不是自学倒着写的健康青少年
        note: Gottfried 等人的病人是 51 岁、外伤后持续性镜像书写与阅读者，与提问者的主动练习不同。[2] 文中「幼儿、发展性阅读障碍者和一些健康左利手成人可能写出镜像文字」是对既有文献的概述，并附有文献号，不是该文自己的新抽样调查。作者还强调，不同损伤部位和多种假说说明不存在单一机制。[2]
      holders:
      - name: Jay A. Gottfried、Feyza Sancar、Anjan Chatterjee
        identity: '《Acquired mirror writing and reading: evidence for reflected graphemic representations》作者，单位为宾夕法尼亚大学医院神经科、认知神经科学中心。[2]'
      argument: 如果镜像书写只出现在疾病里，提问者把自己的症状想成「有限的阅读障碍」就更有诱惑力。Gottfried 等人的综述性开场表明并非如此：一些没有脑损伤的人也会写出镜像文字，包括健康的左利手成人。[2]
        他们自己的病例则展示了另一种极端——损伤后持久的镜像偏好。两者都说明，反向的书写方向可以作为一种稳定的表现出现。对原问题，有用的对照是：提问者保留了正方向阅读和打字，干扰集中在手写的一对字母，这既不像该文的获得性综合征，也不必被写成发展性阅读障碍的缩小版。更谨慎的说法是获得了一项技能，并在重叠的运动—字形映射上付出了代价。
      quotes:
      - text: Young children, developmental dyslexics, and some healthy left-handed adults may produce
          mirror text [10,36].
        text_zh: 幼儿、发展性阅读障碍者以及一些健康的左利手成人，可能会写出镜像文字 [10,36]。
        attribution: Jay A. Gottfried、Feyza Sancar 与 Anjan Chatterjee，Acquired mirror writing and reading
        locator: 'Neuropsychologia 41 (2003): 96–107，引言段'
        ref: 2
    open_parts: 本次没有打开专门追踪「刻意练习倒着写」对正常字母分辨之因果效应的实验，因而对提问者个案的判断是概念归类，不是临床诊断。b/d 混淆与发展性阅读障碍的关系是另一项文献，不能从一句「阅读障碍者也可能写镜像字」推出互为充分条件。[2]
      干扰是否会随停止练习或针对性再训练而消退，也超出了这两篇文本的范围。
    references:
    - id: 1
      citation: 'Perkins, D. N., & Salomon, G. (1992, September 2). Transfer of learning. In International
        Encyclopedia of Education (2nd ed.). Oxford: Pergamon. 本次打开并核对的是作者后来上传的条目文本：https://openlab.citytech.cuny.edu/fywpd/files/2020/01/transferoflearning.pdf'
      url: https://openlab.citytech.cuny.edu/fywpd/files/2020/01/transferoflearning.pdf
    - id: 2
      citation: 'Gottfried, J. A., Sancar, F., & Chatterjee, A. (2003). Acquired mirror writing and reading:
        Evidence for reflected graphemic representations. Neuropsychologia, 41, 96–107. 本次打开并核对的是作者页 PDF：https://neuroaesthetics.med.upenn.edu/assets/user-content/documents/publications/gottfried-sancar-chatterjee-2003-01.pdf'
      url: https://neuroaesthetics.med.upenn.edu/assets/user-content/documents/publications/gottfried-sancar-chatterjee-2003-01.pdf
- id: 2026-11-26-psych-self-interest
  date: '2026-11-26'
  category: psychology
  title_zh: 人们何时会按自身利益行事，何时又不会？
  title_en: What influences when people act in accordance with their self-interest and when they don't?
  commentary: 经济学的默认故事是人人追求物质私利，但实验室里的讨价还价、公共品和惩罚，描绘的却是另一幅图景：一部分人在乎公平，而环境决定了「公平类型」还是「自私类型」会主导均衡。这个机制能解释不少何时利己、何时不利己，但还不能直接等于对投票或区划政治的完整答案。
  source_name: Patrick Collison — Questions
  source_url: https://patrickcollison.com/questions
  author: Patrick Collison
  source_type: curated
  tags:
  - 自利
  - 公平
  - 社会偏好
  - 实验经济学
  answer:
    format: scholarly
    reviewed_at: '2026-11-26'
    consensus:
      label: 「所有人只追求物质自利」作为普遍描述，与大量受控实验不符。Fehr 与 Schmidt 的综合模型主张：除了纯粹自利者，还有一部分人具有以自我为中心的不平等厌恶；究竟是公平类型还是自私类型主导均衡，取决于经济环境。把这一实验室结论直接推广到投票、区划等政治态度，仍缺少本次已核对的专门证据
      note: Fehr 与 Schmidt（1999）开篇即并列两组「令人困惑」的事实：人们在竞争性市场中会利用其议价能力，但在双边讨价还价中往往不会；人们在自愿合作博弈中会利用搭便车机会，可一旦有机会惩罚搭便车者，稳定合作就能维持，尽管惩罚对惩罚者是有成本的。他们证明，如果一些人关心公平，这些现象可以在同一框架中得到解释，并且经济环境决定哪一类人主导均衡行为。[1]
        他们把公平建成以自我为中心的不平等厌恶：人们愿意放弃部分物质收益，以使结果更公平，但并不人均地关心他人之间的不平等。[1] 原问题中的政治例子（限制性区划、富裕选民的党派选择）属于政治心理学中「象征政治
        vs 自利」的传统，本次未能打开 Sears 或 Chong 等人的全文，故不把实验室环境效应写成对那些例子的已核解释。
    summary: 「人们何时按自身利益行事」先要澄清：这里的「自身利益」若指物质回报最大化，则它并不是对所有环境和所有人的好描述。Fehr 与 Schmidt 指出，几乎所有经济模型都假定所有人只追求物质自利、并不关心「社会」目标本身；这或许适用于一些人，但肯定不是所有人。已有大量证据表明，公平动机会影响许多人的行为。[1]
      他们关心的不是再增加一种与自利无关的特殊动机，而是寻找一条能同时解释几组相反事实的原则。竞争性市场里，人们会利用议价优势；双边讨价还价里，往往不会。自愿公共品博弈里，人们会搭便车；一旦可以付出代价去惩罚搭便车者，合作就能稳定下来。[1]
      他们的回答是：除了纯粹自利者，还有一部分人具有以自我为中心的不平等厌恶，愿意牺牲部分物质收益来减少与自己相关的不公平；然后，环境决定是公平类型还是自私类型主导均衡。[1] 于是，「何时利己、何时不利己」至少有一个有模型、有实验的答案：在高度竞争、个体难以影响规范的市场里，自利行为更容易主导；在面对面的分配、或存在可实施的惩罚与互惠的地方，公平约束更容易被看见。Patrick
      Collison 原问里的政治例子——房主支持抬高房价的区划，或富裕选民支持表面上不利于自己钱包的政党——需要另外的政治态度研究才能下同样强度的判断；本次核对停留在社会偏好的实验与理论，而不把那些政治例子写成已被同一篇论文证明。
    definitions:
    - term: 以自我为中心的不平等厌恶（self-centered inequity aversion）
      text: Fehr 与 Schmidt 对公平的建模方式：人们抵制不平等的结果，愿意放弃部分物质收益以移向更公平的结果；若这种厌恶是以自我为中心的，则他们并不本身关心其他人之间的不平等，而只关心自己的物质收益相对于他人是否公平。[1]
    milestones:
    - year: '1999'
      name: Fehr 与 Schmidt 的公平、竞争与合作理论
      explanation: '刊于 Quarterly Journal of Economics 114(3): 817–868。本次打开并核对的是公开转载 PDF。[1]'
    views:
    - position: 并非所有人都只追求物质自利；一部分人具有公平或不平等厌恶，这一假设足以在不放弃理性的前提下解释多组看似矛盾的实验
      consensus_role: 实验经济学中极有影响的社会偏好模型
      evidence:
        label: 一篇 QJE 理论—综述论文，所依赖的是既有的市场、讨价还价与公共品实验，而不是作者自己的一次新现场试验
        note: 作者强调，除了引入一部分关心公平的人，不必放松理性假设。[1] 文中对工资设定、垄断定价的引用（如 Kahneman、Knetsch 与 Thaler 1986）是对既有研究的转述。模型参数（公平类型的比例、厌恶系数）需要与具体实验相校准，不能直接读成人口中的固定比例。
      holders:
      - name: Ernst Fehr、Klaus M. Schmidt
        identity: 《A Theory of Fairness, Competition, and Cooperation》（Quarterly Journal of Economics,
          1999）的作者。本次打开的 PDF 文首未列出当时职务，故不补充未核到的机构头衔。[1]
      argument: 如果人人永远按物质私利行动，双边最后通牒、有代价的惩罚以及某些定价与工资约束就很难理解；如果人人永远公平，竞争性市场中对议价力的利用又不好解释。Fehr 与 Schmidt
        的策略是保留理性，只改动机的组成：人口中同时存在自利者与不平等厌恶者。[1] 「何时按自身利益行事」于是不再是性格测验，而变成一个关于组成与规则的问题。这一主张直接打击了「经济人是对所有互动的忠实描述」，但并不否认自利在许多环境中确实主导。
      quotes:
      - text: There is strong evidence that people exploit their bargaining power in competitive markets
          but not in bilateral bargaining situations. There is also strong evidence that people exploit
          free-riding opportunities in voluntary cooperation games. Yet, when they are given the opportunity
          to punish free riders, stable cooperation is maintained, although punishment is costly for those
          who punish. This paper asks whether there is a simple common principle that can explain this
          puzzling evidence. We show that if some people care about equity the puzzles can be resolved.
          It turns out that the economic environment determines whether the fair types or the selfish
          types dominate equilibrium behavior.
        text_zh: 有强证据表明，人们在竞争性市场中会利用其议价能力，但在双边讨价还价情境中却不会。也有强证据表明，人们在自愿合作博弈中会利用搭便车的机会。然而，当他们有机会惩罚搭便车者时，稳定的合作得以维持，尽管惩罚对实施惩罚的人是有成本的。本文追问：是否存在一条简单的共同原则，能够解释这些令人困惑的证据。我们表明，如果一些人关心公平，这些困惑就可以得到解决。结果是：经济环境决定了公平类型还是自私类型会主导均衡行为。
        attribution: Ernst Fehr 与 Klaus M. Schmidt，A Theory of Fairness, Competition, and Cooperation
        locator: Quarterly Journal of Economics 114(3) (1999)，开篇摘要段
        ref: 1
    - position: 同一批人也会在某些环境中表现得自私、在另一些环境中表现得公平：竞争性市场更容易让自利行为主导，而双边分配或可惩罚的合作则更容易让公平类型起作用
      consensus_role: 该模型的关键比较静态，用来直接回答「何时」
      evidence:
        label: 同一论文中的理论结果及其所依据的实验模式
        note: 「环境决定哪一类主导」是作者自己的概括，细节分布在市场、讨价还价和公共品各节。本次不把未逐节展开的命题写成比摘要更强的定量规律。投票、税收遵从等在脚注中被提及，但不是本文核对的中心证据。[1]
      holders:
      - name: Ernst Fehr、Klaus M. Schmidt
        identity: 同上。[1]
      argument: 原问题要的是条件，而不是「人到底自私还是不自私」的一次表决。Fehr 与 Schmidt 把条件写在环境上：当竞争使单一个体很难把结果拉向公平，自利类型可以主导可见行为；当互动是双边的，或惩罚使公平类型能够约束搭便车者，公平行为就更容易维持。[1]
        这对日常直觉有直接推论：在匿名、可替代、规则冷酷的市场里，预期人们按物质利益行事往往更准；在关系紧密、能实施制裁或面对面分配的场合，只按钱包计算则常常出错。至于政策态度——例如清楚的房产利益与相对模糊的税收—再分配利益——是否服从同一逻辑，需要政治领域的专门证据，不能从这些博弈实验里直接读取。
    open_parts: 实验室博弈中的「物质自利」与政治领域中的「自身利益」（包括身份、象征态度、对群体的认同）不是同一个变量。Sears、Chong 等人关于自利何时影响政策态度的研究，与本题的政治例子更直接相关，但本次没有打开其全文，故不引用其具体结论。不平等厌恶模型也不是唯一的社会偏好理论（互惠、纯利他、羞耻等竞争理论本次未核对）。现场、跨文化和长期制度如何改变「公平类型」的比例，仍是开放问题。[1]
