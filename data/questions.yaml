        Hoffman, J., & Rosenkrantz, G. Omnipotence. The Stanford Encyclopedia of Philosophy. First published 21 May 2002; substantive revision 21 May 2026. 本次打开并核对的是 https://plato.stanford.edu/entries/omnipotence/ 。
