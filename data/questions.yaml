- id: 2026-11-23-ai-chatgpt-context
  date: '2026-11-23'
  category: ai
  title_zh: ChatGPT 是如何记住前面问题的上下文的？
  title_en: How does ChatGPT retain the context of previous questions?
  commentary: >-
    「再说详细一点」之所以能接上上一句，并不等于系统拥有了人那种跨时间的长期记忆。把窗口里的对话历史，和后来单独产品化的「记忆」分开，才能看清大模型到底记住了什么、又在哪里必然会忘。
  source_name: Artificial Intelligence Stack Exchange
  source_url: https://ai.stackexchange.com/questions/38150/how-does-chatgpt-retain-the-context-of-previous-questions
  author: milez
  source_type: stackexchange
  tags:
  - ChatGPT
  - 上下文窗口
  - Transformer
  - 记忆
  - 注意力机制
  answer:
    format: scholarly
    reviewed_at: '2026-11-23'
    consensus:
      label: >-
        公开的模型原理与官方说明较为一致：多轮对话里的「记住前文」，首先是把先前的用户消息和模型回复再次放进有限的上下文窗口，而不是一次生成之后把对话写入模型权重；后来的 Memory 是另一套、与当前窗口分开的机制。ChatGPT 未公开的内部工程细节（如何截断、是否摘要、缓存如何实现）不能从已发表论文直接断言
      note: >-
        OpenAI 的 API 文档把每次文本生成请求写成独立、无状态的，并说明多轮对话可以通过在下一次请求中再次提供先前消息来实现；上下文窗口则是一次请求里输入、输出（以及对某些模型还包括推理 token）所用 token 的总和，超出上限可能导致输出被截断。[4]
        ChatGPT 帮助中心写明：当前对话中用户的消息和 ChatGPT 的回复都会占用空间，对话填满后会提示上下文窗口已满；删除已保存的记忆并不会给当前对话腾出更多空间。[5]
        同一帮助中心把 Memory 描述为可跨聊天记住相关偏好与细节的单独功能，并写明保存的记忆与聊天记录分开存储。[6]
        Transformer 用自注意力在一段序列内部建立位置之间的直接联系，[2] GPT-3 则把「不更新梯度、只通过文本交互给出任务」称为上下文学习（in-context learning），并标明其上下文窗口是有限的。[3]
        以上说明的是公开机制与产品层面的区分。本题提出者在论坛上的重建与此方向一致，但并不是 OpenAI 对 ChatGPT 内部实现的官方说明书；[1] 本文不把 KV cache 等常见推理优化写成已核实的 ChatGPT 产品细节。
    summary: >-
      2022 年 12 月 4 日，milez 在 Artificial Intelligence Stack Exchange 提问：ChatGPT 之所以能理解「告诉我更多」并接着上一轮往下说，技术上到底是怎么做到的？它是否重用先前问题的激活值？是否另有一条专门的上下文输入？[1]
      公开文献能比较有把握回答的部分是：当代对话系统并不是在每一次回复之后改写模型参数，从而获得一种「装进网络里的长期记忆」。OpenAI 在 API 文档中写明，每次文本生成请求本身是独立、无状态的；要实现多轮对话，需要把先前的消息作为参数再次提供给下一次请求。[4] 提问者后来在自答中也把这一图景概括为：先前的提示与输出会按输入长度所允许的范围追加进下一次提示，于是「全部上下文实际上都在提示里」。[1] ChatGPT 帮助中心从产品一侧给出了相应的约束：你的消息和 ChatGPT 的回复都会占用空间，对话填满后会提示上下文窗口已满。[5]
      窗口里的这些 token 之所以能被模型用上，要回到 Transformer：自注意力把同一序列里不同位置关联起来，以计算该序列的表示；与逐位置递推的循环网络相比，自注意力层用恒定次数的串行运算连接所有位置。[2] Brown 等人在 GPT-3 中把这种不更新梯度、只靠文本里的指令或示例来指定任务的做法称为上下文学习，并写明当时模型的上下文窗口为 n_ctx = 2048 个 token。[3] 窗口大小此后在产品中已显著扩大，但「有限窗口」这一结构没有消失。[4][5]
      两件后来的事情需要分开写。第一，OpenAI 后来为 ChatGPT 提供了 Memory：在开启时，它可以从聊天和其他来源记住相关偏好与细节，而且保存的记忆与聊天记录是分开存放的；删除保存的记忆并不会给当前对话腾出窗口空间。[5][6] 第二，即使相关信息已经被放进长上下文，模型也不一定稳健地用上它们。Liu 等人发现，性能往往在相关信息位于输入开头或结尾时最高，而位于中段时显著下降，即便是明确宣传为长上下文的模型也是如此。[7]
      因此，对原问题的审慎回答是：ChatGPT「记住前面的问题」，在公开可核验的层面上，首先是把对话历史放进上下文窗口并在其中做自注意力；它不是系统自带、不受窗口限制的长期记忆。记忆产品、摘要或检索等工程扩展，以及窗口内部的使用质量，是另外的问题。未公开的服务端实现，本文不加猜测。
    definitions:
    - term: 上下文窗口（context window）
      text: >-
        OpenAI 文档的定义是：一次请求中可用于输入 token 和输出 token（对某些模型还包括推理 token）的总量。若构造了过大的提示（常常是因为加入了额外上下文、数据或示例），就有超出该窗口、导致输出被截断的风险。[4] 在 ChatGPT 中，用户消息和模型回复都会占用这一空间。[5]
    - term: 上下文学习（in-context learning）
      text: >-
        Brown 等人用来描述一种不更新梯度的任务指定方式：把预训练语言模型的文本输入当作任务说明，让模型以自然语言指令和（或）少量演示为条件，并只通过预测接下来应出现的文本来完成新的实例。[3] 多轮对话把先前回合放进同一窗口，利用的是同一种「只在前向计算中使用上下文」的能力，而不是在对话中途训练模型。
    - term: 自注意力（self-attention）
      text: >-
        Vaswani 等人的定义：自注意力（有时也称 intra-attention）是一种注意力机制，它把单一序列中的不同位置关联起来，以计算该序列的表示。[2] 直观地说，窗口里的每一个词都可以直接「看见」同一窗口里的其他词，而不必像循环网络那样一步步传过去。
    - term: Memory（ChatGPT 的记忆功能）
      text: >-
        ChatGPT 的一项可开关的产品功能：开启后，它可以从你的聊天和其他可用来源记住相关偏好与细节，以便少重复自己。[6] 官方说明把它与当前对话的上下文窗口区分开：保存的记忆与聊天记录分开存储；删除保存的记忆并不会给当前对话腾出更多空间。[5][6]
    milestones:
    - year: '2017'
      name: Transformer 与自注意力
      explanation: >-
        Vaswani 等人提出完全基于注意力、不再使用循环或卷积的 Transformer，并说明自注意力层以恒定次数的串行运算连接序列中的所有位置。[2]
    - year: '2020'
      name: GPT-3 与上下文学习
      explanation: >-
        Brown 等人训练 1750 亿参数的 GPT-3，系统测量不微调、只通过文本交互给出任务时的少样本表现，并将上下文窗口写明为 2048 个 token。[3]
    - year: '2022'
      name: 本题追问 ChatGPT 的多轮上下文
      explanation: >-
        milez 于 2022 年 12 月 4 日在 AI Stack Exchange 提出本题，并在自答中根据当时可见的 OpenAI 说明，把「上下文其实都在提示里」这一机制写了出来。[1]
    - year: '2023'
      name: 「迷失在中间」
      explanation: >-
        Liu 等人报告：即便模型能够接受长输入，相关信息处在上下文中段时，表现也常常显著下降。[7] 此后 ChatGPT 的 Memory 被写成与当前对话窗口分开的产品功能，但本文未核对一项可公开引用的准确上线日期，故不以年份标记该产品发布。[6]
    views:
    - position: 多轮对话中的「上下文」首先是被再次放进提示或请求里的历史消息，而不是模型权重里的长期记忆
      consensus_role: 与官方 API 说明和 ChatGPT 帮助中心表述一致的主流公开解释；论坛上的早期重建与此相符，但不能代替未公开的产品实现说明书
      evidence:
        label: 官方开发者文档与产品帮助页，辅以论坛自答中的公开推理
        note: >-
          API 文档描述的是文本生成请求的接口契约（请求无状态、靠再次提供消息来维持对话），并不等于一份 ChatGPT 客户端与服务端如何组装提示的完整白皮书。[4]
          帮助中心确认了产品层的窗口占用与「记忆不会腾出当前对话空间」，但没有给出窗口的精确 token 数，也没有披露截断或摘要算法。[5][6]
          milez 的自答是依据当时可见说明所做的合理重建，2023 年 2 月的补记还讨论了超长对话后可能用摘要或检索来压缩上下文；这些是工程上常见的做法，但不是 OpenAI 已核对的内部说明书，本文只把它当作公开讨论，不写成已证实的实现。[1]
      holders:
      - name: OpenAI
        identity: 开发者文档《Conversation state》与帮助中心条目的发布者；本次打开的是 2026 年 11 月仍可访问的现行页面，其中的模型名称与界面细节以该页面当时文本为准。[4][5][6]
      - name: milez
        identity: Artificial Intelligence Stack Exchange 本题提问者，也是 32 票并被采纳的自答作者；页面未提供可核对外的真实姓名或机构，故不以论坛以外的身份书写。[1]
      argument: >-
        问题里最容易产生误会的一点，是把「它好像还记得我刚刚说过的话」理解成系统在内部保存了一个不受限制的心理状态。官方接口把机制说得很直白：每一次文本生成请求是独立、无状态的；所谓多轮，是把先前消息当作参数再送回去。[4] 这样，「告诉我更多」之所以能被理解，是因为上一轮的问答仍然出现在这一轮的输入里，模型只是在续写一段已经包含那些句子的文本。
        ChatGPT 的帮助页从使用者一侧给出了同一结构的后果：消息和回复都占空间，对话会满；满了可以新开聊天，若选择带摘要继续，摘要可能漏掉细节。[5] 提问者在 2022 年的自答里已经写出了对应的判断：上下文功能来自模型接受很长输入、并被训练去续写给定提示的能力；实践上，每次提示都会按长度允许的范围拼上先前的输出和提示，「全部上下文实际上都在提示里」。[1]
        这一解释也同时说明了它的界限。窗口不是无限的；删掉 Memory 里保存的条目，并不能给当前这轮对话腾出空位。[5] 至于对话极长之后系统是否会摘要、检索或静默丢弃更早的回合，公开材料没有提供一份可逐条核对的 ChatGPT 实现说明，本文不加断言。[1]
      quotes:
      - text: >-
          While each text generation request is independent and stateless, you can still implement multi-turn conversations by providing additional messages as parameters to your text generation request.
        text_zh: 尽管每一次文本生成请求都是独立、无状态的，你仍然可以通过把额外的消息作为参数提供给文本生成请求，来实现多轮对话。
        attribution: OpenAI，Conversation state（API 文档）
        locator: 标题 “Manually manage conversation state” 下首句；本次打开 https://developers.openai.com/api/docs/guides/conversation-state
        ref: 4
      - text: >-
          Your messages and ChatGPT’s replies both take up space, so a few long exchanges can fill a chat.
        text_zh: 你的消息和 ChatGPT 的回复都会占用空间，因此几轮较长的交流就可能把一次对话填满。
        attribution: OpenAI Help Center，Why does ChatGPT say “Context window full” or “Chat memory full”?
        locator: 文首说明段
        ref: 5
      - text: >-
          So, all of the context is actually in the prompt.
        text_zh: 所以，全部上下文实际上都在提示里。
        attribution: milez，AI Stack Exchange 本题被采纳自答（2022 年 12 月前后的原答部分）
        locator: 自答第一版结尾句
        ref: 1
    - position: 窗口里的历史之所以能被用上，是因为 Transformer 的自注意力可以直接关联序列中的任意位置；这是有限长度上的上下文学习，不是无限记忆
      consensus_role: 对「为何把历史放进窗口就会起作用」的主流技术解释；窗口会满、且更长并不自动等于用得更好，也已被后来的实验所强调
      evidence:
        label: 奠基论文中的机制说明与上下文学习定义，再加上长上下文使用质量的对照实验
        note: >-
          Vaswani 等人的论文提出的是通用序列转换架构，并不讨论 ChatGPT。[2]
          Brown 等人测量的是 GPT-3 在少样本、单样本和零样本条件下的上下文学习，上下文窗口为 2048 token；这可以说明「不更新梯度、只靠窗口里的文本」这一范式，但不能直接外推为今日 ChatGPT 所用模型的窗口大小或全部训练细节。[3]
          Liu 等人的任务是多文档问答和键值检索，观察到与位置相关的 U 形表现曲线；这是关于「长上下文是否被稳健使用」的实验证据，不是对 ChatGPT 对话产品的专项审计。[7]
      holders:
      - name: Ashish Vaswani、Noam Shazeer、Niki Parmar、Jakob Uszkoreit、Llion Jones、Aidan N. Gomez、Łukasz Kaiser、Illia Polosukhin
        identity: >-
          《Attention Is All You Need》（arXiv:1706.03762v7）作者。文首署名单位为 Google Brain、Google Research，以及 University of Toronto（Aidan N. Gomez）；作者标注为同等贡献。[2]
      - name: Tom B. Brown 等
        identity: >-
          《Language Models are Few-Shot Learners》（arXiv:2005.14165v4）作者团队，文首署名单位为 OpenAI。通讯与同等贡献标记以该 PDF 文首为准。[3]
      - name: Nelson F. Liu、Kevin Lin、John Hewitt、Ashwin Paranjape、Michele Bevilacqua、Fabio Petroni、Percy Liang
        identity: >-
          《Lost in the Middle: How Language Models Use Long Contexts》（arXiv:2307.03172v3）作者。文首署名单位为 Stanford University、University of California, Berkeley 与 Samaya AI；通讯邮箱为 nfliu@cs.stanford.edu。致谢中写明该文经 TACL 编辑处理，但本次打开的是 arXiv v3，未打开期刊官方页面，故不擅写卷期页码。[7]
      argument: >-
        只说「把旧消息再贴回去」，还没有解释模型为什么能从中读出「这是在接着上一问往下说」。Transformer 的关键步骤是自注意力：它在单一序列内部把不同位置关联起来，从而计算整段序列的表示。[2] Vaswani 等人比较各类层时强调，自注意力层用恒定次数的串行运算连接所有位置，而循环层需要与长度成正比的串行步数。[2] 对对话而言，这意味着：只要上一轮的句子还在窗口里，当前的「告诉我更多」就可以直接注意到那些句子，而不必依赖一种在权重里单独保存的对话状态。
        GPT-3 论文把这种能力说成一种任务层面的现象。模型在所有任务上都不做梯度更新或微调，任务和少样本演示纯粹通过与模型的文本交互来指定；[3] 作者将「上下文学习」定义为：以自然语言指令和（或）少量演示为条件，然后只通过预测接下来的文本来完成新实例。[3] 多轮聊天可以看成同一机制的日常形式：前文是条件，后文是续写。但他们也写明，这一机制受上下文窗口限制——当时所有被训练的模型都使用 n_ctx = 2048 个 token。[3]
        窗口后来在产品中变大了，可结构限制还在。官方文档仍把上下文窗口定义为输入与输出（以及某些模型的推理 token）的总量，并警告过大的提示可能超出窗口。[4] 更重要的是，Liu 等人表明：把信息放进长窗口，并不等于模型会稳健地使用它；相关信息在开头或结尾时表现往往最好，在中间时显著变差，即使是明确的长上下文模型也如此。[7] 所以，「能记住前面的问题」既不是无限的，也不是在窗口内部均匀可靠的。
      quotes:
      - text: >-
          Self-attention, sometimes called intra-attention is an attention mechanism relating different positions of a single sequence in order to compute a representation of the sequence.
        text_zh: 自注意力（有时也称为 intra-attention）是一种注意力机制，它把单一序列中的不同位置关联起来，以便计算该序列的表示。
        attribution: Vaswani 等，Attention Is All You Need
        locator: arXiv:1706.03762v7，第 2 页，Introduction 中的定义句（原文在 “intra-attention” 后未加逗号，此处按 PDF 逐字抄录）
        ref: 2
      - text: >-
          As noted in Table 1, a self-attention layer connects all positions with a constant number of sequentially executed operations, whereas a recurrent layer requires O(n) sequential operations.
        text_zh: 如表 1 所示，自注意力层以恒定次数的串行运算连接所有位置，而循环层需要 O(n) 次串行运算。
        attribution: Vaswani 等，Attention Is All You Need
        locator: arXiv:1706.03762v7，第 6–7 页，§4 Why Self-Attention
        ref: 2
      - text: >-
          For all tasks, GPT-3 is applied without any gradient updates or fine-tuning, with tasks and few-shot demonstrations specified purely via text interaction with the model.
        text_zh: 在所有任务上，GPT-3 都不进行任何梯度更新或微调，任务和少样本演示纯粹通过与模型的文本交互来指定。
        attribution: Brown 等，Language Models are Few-Shot Learners
        locator: arXiv:2005.14165v4，第 1 页，摘要
        ref: 3
      - text: >-
          We find that performance can degrade significantly when changing the position of relevant information, indicating that current language models do not robustly make use of information in long input contexts. In particular, we observe that performance is often highest when relevant information occurs at the beginning or end of the input context, and significantly degrades when models must access relevant information in the middle of long contexts, even for explicitly long-context models.
        text_zh: 我们发现，当相关信息的位置改变时，性能可能显著下降，这表明当前的语言模型并不能稳健地使用长输入上下文中的信息。特别是，当相关信息出现在输入上下文的开头或结尾时，性能往往最高；而当模型必须取用长上下文中段的相关信息时，性能显著下降，即便是明确的长上下文模型也是如此。
        attribution: Liu 等，Lost in the Middle
        locator: arXiv:2307.03172v3，第 1 页，摘要
        ref: 7
    - position: ChatGPT 后来的 Memory 是跨对话的个性化机制，必须与当前对话的上下文窗口分开；不能把它当成「窗口记忆」的升级版一笔带过
      consensus_role: 与现行官方帮助页一致的产品区分；它回答的是「跨聊天还记不记得我」，而不是本题最初问的「这一轮里如何接上上一句」
      evidence:
        label: OpenAI 帮助中心对 Memory 与上下文窗口的并列说明
        note: >-
          这是产品帮助文本，不是经过同行评审的系统论文，也没有披露记忆写入、检索与更新的算法细节。[5][6]
          帮助页写明功能、控件和存储区分会因套餐、地区、平台和工作区设置而异，因此不能把某一账户上见到的界面写成所有用户的统一实现。[6]
          本文只依据本次打开的帮助页陈述，不补充未核对的发布博客中的日期或内部架构图。
      holders:
      - name: OpenAI
        identity: 帮助中心条目《Memory in ChatGPT》与《Why does ChatGPT say “Context window full” or “Chat memory full”?》的发布者。[5][6]
      argument: >-
        如果把后来出现的 Memory 直接说成「ChatGPT 终于有真正的记忆了」，就会把两个不同的问题混在一起。本题问的是：在同一次对话里，模型为什么能接着前面的问题往下说。帮助中心把这一现象首先与上下文窗口联系起来：当前聊天中的来回都会占空间，满了就会提示。[5]
        Memory 则被写成另一件事。开启后，ChatGPT 可以从聊天和其他可用来源记住相关偏好与细节，以便接着上次的进度、少重复自己；它并不保留每一段对话里的每一个细节。[6] 保存的记忆与聊天记录分开存储，删除原来的聊天并不会自动删除一条单独保存的记忆；反过来，删除保存的记忆，也不会给当前这轮对话腾出窗口空间。[5][6] 「参考聊天历史」（Reference chat history）若存在，也是让模型用过去对话中的相关信息来个性化未来回复，而不是把旧聊天无限地拼进当前窗口。[6]
        因此，Memory 可以改变跨会话的个性化，但不能取消上下文窗口，也不能被当成对「它如何记住前面问题」的完整答案。把两者分开，反而让原问题更清楚：一轮对话里的衔接，靠的是窗口中的文本；跨聊天还记得你是谁、你喜欢什么，则是另外一套可开关的产品机制。
      quotes:
      - text: >-
          When Memory is enabled, ChatGPT can remember relevant preferences and details from your chats and other available sources. This can help you pick up where you left off and spend less time repeating yourself.
        text_zh: 当 Memory 开启时，ChatGPT 可以从你的聊天和其他可用来源记住相关的偏好与细节。这有助于你接着上次的进度继续，并减少重复自己的时间。
        attribution: OpenAI Help Center，Memory in ChatGPT
        locator: Overview 首段
        ref: 6
      - text: >-
          Saved memories are stored separately from chat history. Deleting the original chat does not automatically delete a separate saved memory.
        text_zh: 保存的记忆与聊天记录是分开存储的。删除原来的聊天，并不会自动删除一条单独保存的记忆。
        attribution: OpenAI Help Center，Memory in ChatGPT
        locator: 标题 “Saved memories” 下
        ref: 6
      - text: >-
          Deleting saved memories won’t make more room in the chat.
        text_zh: 删除已保存的记忆，并不会在当前对话中腾出更多空间。
        attribution: OpenAI Help Center，Why does ChatGPT say “Context window full” or “Chat memory full”?
        locator: 文首说明段末句
        ref: 5
    open_parts: >-
      ChatGPT 在服务端如何具体组装、截断或压缩超长对话，公开材料并没有一份可逐条核对的实现说明。milez 后来补充说，超过最大长度后可能用语言模型做摘要，或用嵌入检索回相关片段；这在工程上常见，但仍属推测，不能写成已证实的产品细节。[1]
      推理时缓存已计算的键和值（所谓 KV cache）是 Transformer 解码中广泛讨论的实现手段，可以提高多轮生成的计算效率；但本次并未打开一份把该技术陈述为 ChatGPT 内部设计的官方文档，因此不把它当作本题的已核实答案。
      上下文窗口的具体长度随模型和套餐而变，本文只引用官方对「窗口是什么」的定义，以及 GPT-3 论文中已经写明的 2048 token，不罗列未在本轮打开的产品规格表中的数字。[3][4]
      即便窗口足够长，Liu 等人的实验表明模型仍可能对中段信息使用不稳；该文主要评估检索式问答和键值查找，它对日常闲聊的外推程度仍是开放问题。[7]
