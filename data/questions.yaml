- id: 2026-11-23-psych-sex-private
  date: '2026-11-23'
  category: psychology
  title_zh: 人类为什么通常在私密处发生性行为？
  title_en: Why do humans have sex in private?
  commentary: >-
    许多社会把「性交应当避开他人耳目」当作不言而喻的规范；可一旦拿来和常在同伴眼前交配的社会性灵长类近亲比较，它就不再只是礼仪细节，而变成一个需要跨文化证据、也不能靠演化故事直接拍板的问题。
  source_name: Psychology Stack Exchange
  source_url: https://psychology.stackexchange.com/questions/1567/why-do-humans-have-sex-in-private
  author: Piotr Migdal
  source_type: stackexchange
  tags:
  - 性行为
  - 隐私
  - 文化比较
  - 演化人类学
  answer:
    format: scholarly
    reviewed_at: '2026-11-23'
    consensus:
      label: 就「合法的、为社会规范所允许的性交，人们通常会设法避开其他成人的视听」而言，已有系统的民族志综述表明这一偏好在有记录的文化中极为广泛，但并非毫无例外，也不等于总能做到完全私密；至于「为什么会这样」，目前没有被广泛接受的、已经过严格检验的单一演化解释
      note: >-
        Ben Mocha 检索了电子人类关系区域档案（eHRAF）中 249 个文化、四千余份民族志，在能够编码「合法交配是否被感官隐蔽」的样本里，调查数据集为 130/131 个文化、标准跨文化样本/民族志图集（SCCS/EA）数据集为 81/82 个文化，被报告会至少部分地采取措施，使合法交配避开成年同类的视听。[1]
        作者同时写明：许多文化的居住条件使完全隐私难以实现；约 20 个文化在仪式或性教育等特殊情境下有公开性行为的习俗；民族志对性规范的结论必须谨慎，因为报告人未必会在来自性规范更严社会的人类学家面前展示更开放的行为。[1]
        关于功能，作者认为既有人类学假说大多简短，且不足以解释「人类中习以为常、其他社会性类人猿优势个体却很少习惯性隐蔽」这一分类学分布；他提出的「合作维持假说」（cooperation maintenance hypothesis, CMH）被他本人明确称为事后提出的假说，其力量在于可检验的预测，而不是已经完成的证实。[1]
        野生灵长类中已有关于婚外交配战术性隐蔽的观察，但这解释的是避免被发现与惩罚的非法/婚外交配，不能直接等同于对「合法交配为何也要隐蔽」的答案。[2]
    summary: >-
      原问题把「人类伴侣通常在私密处性交，不仅躲开捕食者，也躲开其他人类」与倭黑猩猩、黑猩猩、大猩猩等近亲的对比当作起点。要严肃回答，首先必须分清两种很不一样的现象：一种是为社会规范所禁止的性交（例如婚外性）因害怕惩罚或干扰而躲避；另一种是连被规范允许的「合法交配」，当事人也常设法把视、听乃至气味刺激对同类掩藏起来。[1]
      Ben Mocha 的综述把讨论对象明确限制在后一种，即合法交配的感官隐蔽——例如等到同住者入睡再进行——而不是隐瞒「已婚者会发生性关系」这一事实，因为人类通常都知道配偶之间存在合法的性关系。[1]
      在这一较严格的定义下，跨文化模式比个别逸事更清楚，也比「几乎所有物种都公开交配」的印象更复杂。作者报告：在有足够资料的文化中，几乎都有至少部分的隐蔽措施；同时，完全隐私常常做不到，特殊场合的公开性行为也有记录，传统时期的瓜希罗人（Goajiro）还被记为几乎不采取预防，不过接触传教士之前的资料薄弱。[1]
      「为什么」则仍是开放的。较早文献里常见的说法，是公开交配会激起嫉妒与公开的生殖竞争，从而损害配偶关系或群体和谐；这些说法在这篇综述里被当作简短的既有解释来讨论，但作者认为，若仅凭避免竞争，难以说明何以许多社会性动物、尤其是社会性非人类人猿的优势个体并不习惯性隐蔽交配。[1]
      作者提出的合作维持假说是：交配的感官刺激会在目击者中唤起性兴奋并可能引发求偶；若一方既试图控制对伴侣的交配机会，又必须与那些被排除在外的群体成员合作，公开交配就会把「控制」与「合作」同时置于冲突之中；隐蔽则是一种相对低成本的策略，用来避免不必要的性唤起。[1]
      必须强调：这是一条带有前提和预测的假说，证据主要来自民族志编码与跨物种比较，而不是在人类中完成的实验裁决。婚外或从属性交配为躲避干扰而隐蔽，在其他灵长类中有独立的观察支持，但那是另一类问题。[1][2]
    definitions:
    - term: 合法交配的感官隐蔽（sensory concealment of legitimate mating）
      text: >-
        Ben Mocha 所用的分析概念。合法交配指符合一对伴侣所处文化之社会规范的性交（例如规范所允许的夫妻性交），其隐蔽不能用「逃避对违规行为的惩罚」来解释；感官隐蔽指设法使交配的视觉、听觉或气味刺激不被同类感知，而不是否认合法性关系的存在。[1]
    - term: 合作维持假说（cooperation maintenance hypothesis, CMH）
      text: >-
        Ben Mocha 提出的功能假说：隐蔽交配的近端作用，是防止目击者被性唤起；远端作用，是使个体能够同时维持对伴侣交配机会的控制，以及与那些被阻止接近该伴侣的群体成员之间的合作。作者称其为事后提出的假说，并给出跨物种与跨文化的可检验预测。[1]
    - term: 战术性隐蔽（tactical concealment）
      text: >-
        le Roux 等人在野生狮尾狒（gelada）研究中使用的概念，用来描述婚外交配时降低被戴绿帽的雄性察觉的行为（例如较少发声、选择距离更远时交配）。它针对的是可能受惩罚的婚外性交，与「合法交配为何也要避开同伴」不是同一个命题。[2]
    milestones:
    - year: 2013
      name: le Roux、Snyder-Mackler、Roberts、Beehner 与 Bergman 报告野生狮尾狒的战术性隐蔽
      explanation: >-
        他们在野生狮尾狒中量化了婚外交配（约占观察到的交配的 9%）时的行为：当事者更少发声，并更常在被戴绿帽的雄性距离较远（大于 20 米）时交配；约 20% 的婚外交配随后引发该雄性的攻击，作者将其理解为可能的惩罚。这项工作为「躲避干扰/惩罚而隐蔽」提供了野外证据，但对象是婚外交配，不是对人类合法交配私密性的直接证明。[2]
    - year: 2020
      name: Ben Mocha 发表跨文化综述并系统陈述合作维持假说
      explanation: >-
        这篇发表于《Proceedings of the Royal Society B》的论文，据作者说是对「合法交配之感官隐蔽是否广泛存在、以及何种选择压力可能塑造这一偏好」所作的系统处理：它提供了基于 eHRAF 的编码结果，检讨既有人类学解释的不足，并把最初为阿拉伯噪鹛（Arabian babbler）提出的思路扩展为人类与部分非人物种的比较假说及预测。[1]
    views:
    - position: 在有民族志记录的样本中，对合法交配做至少部分的感官隐蔽，是跨文化极为广泛的偏好；但这不是毫无例外的定律，也不等于日常生活里总能获得完全隐私
      consensus_role: 目前所见最系统的跨文化描述性结论；其普遍程度取决于可编码资料的覆盖与民族志的可信度，作者本人已写下限制
      evidence:
        label: 对大型民族志数据库的文献编码，属于观察性、比较性证据，不是实验
        note: >-
          调查数据集涵盖 249 个文化中的全部相关 eHRAF 民族志，SCCS/EA 数据集则限制在标准跨文化样本与民族志图集中较可靠、并对应特定历史时期与社区的材料，以控制文化不独立与文化内变异。关于合法交配隐私的足够资料分别出现在 131 与 82 个文化中；编码结果为 130/131 与 81/82。[1]
          作者指出性生活常被报告人回避，相关记载往往贫乏。例外方面，传统瓜希罗人被记为公开进行夫妻性关系，但接触传教士前的资料差，接触后则出现严厉的性体面规范；另有 20 个文化在特殊情形下有公开性习俗。因此，「极为广泛」可核对，「全人类普遍且自古如此」则超出了这些数据所能支持的范围。[1]
      holders:
      - name: Yitzchak Ben Mocha
        identity: >-
          2020 年这篇综述的唯一作者。文中单位为苏黎世大学人类学系（Department of Anthropology, Zürich University），并同时列出马克斯·普朗克进化人类学研究所灵长类学部、马克斯·普朗克鸟类学研究所与马克斯·普朗克动物行为研究所集体行为学部。[1]
      argument: >-
        把「人类为什么通常在私密处性交」首先当成一个经验问题，比直接跳到演化故事更稳妥。Ben Mocha 的编码表明：在能够判断的文化里，伴侣几乎都被报告会采取措施，使合法交配至少部分避开其他成人的感官知觉——例如在夜间营地中进行、用席隔开、或到丛林中避开棚屋的拥挤。[1]
        与此同时，文章并不把这一偏好写成铁板一块的禁忌。居住条件常常使彻底隐私不可能；一些文化并不把隐私维持到最严格的程度；宗教仪式或性教育等场合下，公开性行为被单独记录。[1]
        对原问题而言，这一层回答是：私密性交在跨文化记录里确实是常态或至少是强烈倾向，因而很难把它只写成近代西方的偶然礼俗；但「大多数物种都公开、唯独人类隐蔽」需要更谨慎的比较，而且民族志沉默、观察者效应和例外习俗，都警告我们不要把「通常」说成「一律」。[1]
      quotes:
      - text: >-
          These results show that the preference to conceal legitimate mating from
          the sensory perception of conspecifics is, at the very least, widespread
          across human cultures. Nonetheless, conclusions from ethnographic analyses
          of sexual norms should be viewed cautiously.
        text_zh: 这些结果表明，将合法交配对同类的感官知觉加以隐蔽的偏好，至少在人类文化中是广泛存在的。尽管如此，对性规范所作的民族志分析，其结论仍应谨慎看待。
        attribution: Yitzchak Ben Mocha，Why do human and non-human species conceal mating?
        locator: 第2节末段，Proc. R. Soc. B 287(1932):20201330, 2020（本次依据 PMC 全文，按章节定位）
        ref: 1
    - position: 较早的功能解释多把隐蔽归因于避免公开交配所激起的嫉妒与生殖竞争，有的还强调这对「社会和谐」或雄性合作的好处；但仅凭这些因素，尚不足以说明何以习惯性隐蔽在人类中成为常态，而在其他社会性类人猿的优势个体中却很少见到
      consensus_role: 综述中被当作二十世纪以来的主要既有思路；本次未能打开被引的 Symons、Friedl、van Schaik 等原文，只按 Ben Mocha 的转述与批评来记录
      evidence:
        label: 间接证据——依赖一篇已打开综述对更早文献的概括与反驳，而非对原书原论文的独立核对
        note: >-
          Ben Mocha 写到，关于隐蔽交配之功能，迄今只有简短说明（往往只有几句话或一个脚注）。他概括这些解释的共同点是：避免公开的生殖竞争是人类隐蔽交配的主要功能；它们的差别在于对合作的强调程度不同。[1]
          他的反驳是比较性的：若这些压力已足够，则应在许多其他社会物种、尤其是社会性非人类人猿中看到习惯性隐蔽；据他引用的补充材料，这些物种中群体内生殖竞争常见，群体凝聚对群间竞争重要，黑猩猩中雄性合作也关键，但优势个体很少对同类主动隐蔽交配。[1]
          本次未打开其所引的 Symons（1979）、Friedl（1994）、van Schaik（2016）等原著，因此不把那些书中的原句或页码当作已核对引文，也不把「嫉妒假说已被证伪」写成定论——作者本人也承认，这些选择压力仍可能起过作用。[1]
      holders:
      - name: Yitzchak Ben Mocha（综述既有假说）
        identity: >-
          其文第3节检讨了他所称的既有人类学解释。被点名的文献包括 Symons《The evolution of human sexuality》（1979）、Friedl「Sex the invisible」（1994）以及 van Schaik《The primate origins of human nature》（2016）等；这些原著本次未能打开，身份与精确表述须以原书为准。[1]
      argument: >-
        把私密性交解释成「免得别人眼红、免得打起来」，直观上很好懂，也与日常对嫉妒的观察相容。Ben Mocha 并不否认嫉妒、竞争与和谐可能相关，但他要求任何功能假说先通过一项比较测试：它必须说明，为什么习惯性隐蔽会在人类中演化出来，却只很少出现在社会性的非人类人猿中。[1]
        按他的阅读，若解释只停在「避免公开竞争」，这一测试就没有通过。因此，在更完整的证据出现之前，审慎的表述是：竞争与嫉妒假说仍是历史上重要的思路，也可能抓住了部分选择压力，但还不能单独充当对人类这一物种模式的充分说明。[1]
      quotes:
      - text: >-
          In conclusion, although the selective pressures proposed by current
          explanations may have played a role in the evolution of concealed mating,
          in my opinion, these explanations do not sufficiently explain why habitual
          concealment evolved in humans but is rarely exhibited in other social
          great apes.
        text_zh: 总之，尽管现有解释所提出的选择压力可能在隐蔽交配的演化中起过作用，但在我看来，这些解释并不足以说明：为什么习惯性隐蔽在人类中演化出来，却很少表现在其他社会性类人猿中。
        attribution: Yitzchak Ben Mocha，Why do human and non-human species conceal mating?
        locator: 第3节末段，Proc. R. Soc. B 287(1932):20201330, 2020（本次依据 PMC 全文，按章节定位）
        ref: 1
    - position: 合作维持假说提供了一种更具体的候选机制——隐蔽是为了避免在目击者中诱发性唤起，从而同时保住对伴侣的交配控制与对合作者的依赖；它目前是可检验的假说，而不是已证实的人类演化事实
      consensus_role: 2020 年由同一作者系统陈述的新假说，有比较框架和预测，但尚未在文中完成决定性的跨物种或跨文化检验
      evidence:
        label: 概念论证加比较性、观察性材料；作者明确将其称为事后假说
        note: >-
          假说建立在三条前提上：交配的感官刺激会在目击者中唤起性兴奋并触发交配行为；某个体试图控制对伴侣的交配机会；该个体又依赖那些被其阻止接近该伴侣的群体成员的合作。若三条同时成立，公开交配会被预期同时破坏控制与合作。[1]
          支持人类一侧前提的材料，是作者对既有文献与其民族志数据集的阅读（例如各文化中配偶被赋予某种程度的性控制规范、人类依赖合作与异亲抚育等）；其中关于视觉/听觉刺激如何在人脑中起作用的具体神经机制，本次未打开其所引实验原文，故不转述为已核对的发现。[1]
          在非人物种方面，作者称：就「交配并不受同类肢体打断的个体仍习惯性隐蔽」而言，当时文献中只系统记录了人类与阿拉伯噪鹛。狮尾狒等物种中的情境性隐蔽，被他用来讨论「中等程度的控制与合作」预测，但 le Roux 等人的直接数据针对的是婚外交配。[1][2]
      holders:
      - name: Yitzchak Ben Mocha
        identity: 同上；合作维持假说在此文中被完整陈述，并追溯到他与同事关于野生阿拉伯噪鹛优势个体隐蔽交配的较早工作。[1]
      argument: >-
        这一假说的要点，不是「人类比别的动物更害羞」，而是指出一种特殊的利益冲突：既不许（或不全许）群体里的其他人与自己的伴侣交配，又还需要这些人继续帮忙——觅食、育幼、防御等等。[1]
        若目击交配会提高这些人随即尝试求偶的可能性，那么公开进行合法交配，就可能把控制变成公开冲突，并伤害日后的合作。感官上的隐蔽并不要求他人不知道配偶关系的存在，它只是去掉当场的强刺激。[1]
        作者还给出了清晰的预测，例如：只有同时满足「交配控制」与「合作依赖」的物种，优势个体才会习惯性隐蔽；在人类中，婚外性限制更严的文化应更严格地维持隐私，而双方都被允许有限度婚外性的文化则隐私要求较松——他列举了若干与此方向相符的民族志例子，但写明系统的跨文化检验超出该文范围。[1]
        对原问题而言，这是目前表述最完整的演化候选答案之一，可是它仍然是候选。作者自己把它叫做事后假说，并呼吁收集更多物种与民族志数据来检验；若被证伪，应据此产生新的、由数据驱动的替代假说。[1]
        另外，把狮尾狒婚外交配时的悄声与远离，直接说成「所以人类夫妻也要关上门」，是类别错误：那是躲避可能的惩罚与干扰；Ben Mocha 恰恰强调，人类合法交配的隐蔽不能用惩罚规避来解释，而且在不少文化中，他人还会帮助一对伴侣获得隐私，而不是去打断他们。[1][2]
      quotes:
      - text: >-
          As a post hoc hypothesis, the CMH was developed to explain the currently
          known taxonomic distribution of concealed mating in humans and non-human
          species (presence and absence). Its scientific strength thus lies in its
          ability to generate testable predictions for species with unknown mating
          behaviours.
        text_zh: 作为一个事后提出的假说，合作维持假说是为了解释目前已知的、人类与非人物种中隐蔽交配的分类学分布（存在与缺失）而发展出来的。因此，它的科学力量在于：能够为交配行为尚属未知的物种产生可检验的预测。
        attribution: Yitzchak Ben Mocha，Why do human and non-human species conceal mating?
        locator: 第4节(d)段首，Proc. R. Soc. B 287(1932):20201330, 2020（本次依据 PMC 全文，按章节定位）
        ref: 1
      - text: >-
          The cooperation maintenance hypothesis postulates that concealed mating in
          distantly related species, such as humans and Arabian babblers, is a
          behavioural strategy to prevent sexual arousal in group members (proximate
          explanation), and that it has evolved by convergent evolution driven by
          the need to manoeuvre between two conflicting pressures: maintaining mating
          control over partner(s) while relying on cooperation with group members who
          are prevented from mating with these partner(s) (ultimate explanations).
        text_zh: 合作维持假说主张：在人类与阿拉伯噪鹛这样亲缘较远的物种中，隐蔽交配是一种防止群体成员被性唤起的行为策略（近端解释）；它通过趋同演化产生，其驱动力是必须在两种相互冲突的压力之间周旋：既要维持对伴侣交配机会的控制，又要依赖那些被阻止与这些伴侣交配的群体成员的合作（远端解释）。
        attribution: Yitzchak Ben Mocha，Why do human and non-human species conceal mating?
        locator: 第6节结论第(3)点，Proc. R. Soc. B 287(1932):20201330, 2020（本次依据 PMC 全文，按章节定位）
        ref: 1
    open_parts: >-
      跨文化的「广泛存在」仍然受制于民族志的沉默、观察者效应，以及可编码样本只占人类文化的一部分；特殊仪式中的公开性行为、以及少数被记为不严格追求隐私的社会，都还需要更细的历史与田野材料，才能判断它们是规范的暂时放松、记录偏差，还是真的构成反例。[1]
      合作维持假说的三条前提，尤其是「目击者会被感官刺激唤起并付诸行动」在不同社会与不同物种中是否普遍成立，以及「合法交配」与「优势个体交配」是否真能跨物种类比，都还有待直接检验。作者列出的许多合作繁殖物种，被他称为检验该预测的有力候选，但文中并没有提供这些物种优势配对交配行为的新的系统观测。[1]
      人类一侧也缺少能够区分「文化规范习得」与「演化适应」的决定性设计；即使隐蔽偏好广泛存在，它仍可能由羞耻、礼貌、宗教、法律与儿童在场等多种近端机制共同维持，而不必只有一种远端功能。[1]
      最后，把非人物种中从属性或婚外交配的躲避行为，外推为人类合法私密性交的起源，是尤其需要避免的跳跃：两类行为在有无惩罚风险这一点上并不相同。[1][2]
    references:
    - id: 1
      citation: 'Ben Mocha, Y. (2020). Why do human and non-human species conceal mating? The cooperation maintenance hypothesis. Proceedings of the Royal Society B: Biological Sciences, 287(1932), 20201330. https://doi.org/10.1098/rspb.2020.1330'
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC7575526/
    - id: 2
      citation: 'le Roux, A., Snyder-Mackler, N., Roberts, E. K., Beehner, J. C., & Bergman, T. J. (2013). Evidence for tactical concealment in a wild primate. Nature Communications, 4, 1462. https://doi.org/10.1038/ncomms2468'
      url: https://www.nature.com/articles/ncomms2468

- id: 2026-11-23-psych-trolling
  date: '2026-11-23'
  category: psychology
  title_zh: 网络喷子/出言挑衅（trolling）背后的心理学是什么？
  title_en: What is the psychology behind trolling?
  commentary: >-
    「喷子」常被说成一小撮反社会者，或被直接归因于匿名；把人格倾向与情境诱发分开看，才能避免把所有出言挑衅都写成精神病，也不至于把责任全部推给技术。
  source_name: Psychology Stack Exchange
  source_url: https://psychology.stackexchange.com/questions/78/what-is-the-psychology-behind-trolling
  author: zergylord
  source_type: stackexchange
  tags:
  - 网络喷子
  - 黑暗人格
  - 日常施虐倾向
  - 情境效应
  - 在线社区
  answer:
    format: scholarly
    reviewed_at: '2026-11-23'
    consensus:
      label: 目前没有单一、已被普遍接受的「trolling 心理学」；较扎实的研究至少分成两条相互补充的线索——稳定的人格倾向（尤其是日常施虐倾向）与可变的情境因素（心情、讨论氛围）；证据并不支持「所有喷子都是精神病患者」这样的结论
      note: >-
        首先，学术文献对 trolling 的定义并不统一。Hardaker 从用户讨论中提炼的工作定义，强调伪装成真诚成员、实则意图制造破坏或冲突以自娱；Cheng 等人的操作定义更宽，把谩骂、人身攻击、以及社区准则以外的行为都算进去，实验里甚至包括「无论是否出于故意」的冒犯或离题言论。[1][3]
        Buckels、Trapnell 与 Paulhus 在两项在线问卷研究（合计 N = 1215）中发现，自陈的 trolling 享受、评论频率与「喷子」认同，与黑暗四边形（Dark Tetrad）中的施虐倾向、精神病态与马基雅维利主义正相关，其中施虐倾向的关联最稳定，且对聊天、辩论等其他活动的享受与施虐倾向无关；这是相关与自陈证据，不是临床诊断。[2]
        Cheng、Bernstein、Danescu-Niculescu-Mizil 与 Leskovec 用模拟在线讨论的实验表明，负性心情和看到他人的挑衅帖，都会提高随后写出被编码为 troll-like 评论的概率，两者合在一起大约把基线概率加倍；对 CNN.com 大规模帖子的观察分析，也显示许多被举报的帖来自并无既往记录的用户。他们的结论是：普通人也可能在特定条件下做出类似喷子的行为。[3]
        匿名、去抑制等机制在这些论文中被讨论或作为背景，但本次解答不以未打开的早期实验作为主要证据。
    summary: >-
      原问题把 trolling 理解成有人故意在同一社区里惹怒他人、多半为了取乐，并追问：研究是否支持「互联网的匿名导致更极端行为」？人们为何会从他人的愤怒中得到快感？这种行为是否为网络时代所独有？这些问题里，其实叠了定义、人格、情境和历史好几层，不宜并成一句答语。[1][2][3]
      定义层首先就有分歧。Hardaker 认为，既有的「不礼貌」「粗鲁」等术语并不能恰当抓住 trolling：典型的喷子会把真实的捣乱意图掩藏在假装真诚的身份之后，其成败取决于是否骗过并激怒了对方。[1] Cheng 等人则采用更宽的社区规范标准，把辱骂、骚扰式攻击、以及被站点准则视为不可接受的行为都包括进来；在他们的实验编码里，冒犯、无关或意在激起愤怒的帖子——不论是否故意——都可被标为 trolling。[3]
      因而，「谁在 troll」很大程度上取决于研究者量的是哪一种行为：一种接近有预谋的伪装挑衅，另一种更接近讨论区里各类出格或攻击性发言。后面的人格研究与情境研究，并不总是在测量同一件事。[1][3]
      在人格线索上，Buckels 等人把网络 trolling 定义为在互联网社交情境中以欺骗、破坏或扰乱的方式行事，且看不出明显的工具性目的。他们的问卷显示，把「捉弄其他用户」选为最享受之事的人，在黑暗四边形各量表上分数更高；在更精细的连续评分中，施虐倾向与 trolling 享受及简短的网络 trolling 综合指标（GAIT）关联最强，并且这种关联不能用总体上网时间来解释。作者的解读是：网络 trolling 看来是日常施虐倾向在互联网上的一种表现。[2]
      这条线索不能被改写成「喷子=精神病人」。黑暗四边形在这些研究里是针对普通样本的人格维度，使用的是亚临床量表；第一项研究中只有 5.6% 的人把 trolling 选为评论时最享受的活动，绝大多数人更喜欢辩论或聊天，或根本不评论。[2]
      在情境线索上，Cheng 等人直接挑战「喷子天生如此、只是少数反社会者」的流行叙述。实验里，事先用难测验诱发负性心情，或让人先看到带有挑衅性的种子评论，都会提高随后写出 troll-like 评论的比例；在心情较好、先前评论也较温和的条件下，该比例最低（35%），在心情差且先看到挑衅帖时最高（68%）。对新闻网站讨论的观察则显示，被举报的帖并不都来自「惯犯」，心情与讨论上下文也能预测随后的出格发言。[3]
      把两条线索合在一起，更审慎的画面是：一部分人可能更稳定地以制造混乱为乐；与此同时，心情、先前出现的攻击性言论、以及社区规范，也可以让更多平时并不会被贴上「喷子」标签的人，在当下写出类似的话。匿名也许降低了顾忌，但它既不是 Hardaker、Buckels 或 Cheng 单独证实的唯一原因，也不是所有出言挑衅的充分条件。[1][2][3]
    definitions:
    - term: trolling / troller（出言挑衅 / 喷子）
      text: >-
        词义在文献中并不统一。Hardaker 的工作定义是：troller 是计算机中介传播中的用户，表面上建构出真诚希望加入该群体的身份（包括宣称或传达假装真诚的意图），真实意图却是制造扰乱，或触发、加剧冲突，以供自己取乐。[1]
        Cheng 等人采用更宽的用法，把骂战、恶作剧式骚扰、咒骂或人身攻击，以及若干讨论区准则所不允许的行为都算作 trolling；其大规模分析还用「被其他用户举报的帖」作为代理指标。[3]
        Buckels 等人的工作定义强调欺骗性、破坏性或扰乱性、且没有明显工具目的的在线行为，并把它与身份通常更清楚、意图更直截的网络欺凌相区别。[2]
    - term: 黑暗四边形与日常施虐倾向（Dark Tetrad; everyday sadism）
      text: >-
        Buckels 等人所考察的一组「有害」人格变量：自恋、马基雅维利主义、精神病态，再加上施虐人格。此处的精神病态与施虐倾向指的是普通样本中的亚临床特质（例如以享受伤害他人为倾向），不是对某个评论者做出精神障碍诊断。作者预期，与 trolling 文化中的「lulz」（拿别人的窘况取乐）最接近的，是日常施虐倾向。[2]
    - term: 情境性 trolling（situational trolling）
      text: >-
        Cheng 等人用来与「天生的、由稳定反社会特质驱动的 trolling」相对的说法：在负性心情或已经出现挑衅言论的讨论中，普通用户也可能暂时写出类似喷子的帖子。他们在讨论中还区分了两类曾被封禁的用户——发言一向被删的人，与只在被封前不久才开始被删的人——并猜测前者可能更接近稳定倾向，后者更接近情境诱发。[3]
    milestones:
    - year: 2010
      name: Hardaker 从用户讨论出发给出 trolling 的工作定义
      explanation: >-
        她分析一个约 1.72 亿词、来自未审核 Usenet 新闻组的异步交流语料，从用户对 troll / trolling 等词的讨论中归纳出攻击、欺骗、扰乱与成功四个相互关联的条件，并据此提出强调「伪装真诚、实则求乱以自娱」的工作定义。[1]
    - year: 2014
      name: Buckels、Trapnell 与 Paulhus 将 trolling 与黑暗四边形、尤其是日常施虐倾向联系起来
      explanation: >-
        在《Personality and Individual Differences》发表的两项在线研究中，他们用评论偏好、活动享受评分和自编的 GAIT 量表，报告 trolling 与施虐倾向、精神病态、马基雅维利主义的正相关，并认为施虐倾向的关联最强且具有活动特异性。[2]
    - year: 2017
      name: Cheng 等人用实验与大规模观察检验心情和讨论情境的作用
      explanation: >-
        在 CSCW 2017 的论文中，他们结合 Mechanical Turk 上的 2×2 实验与对 CNN.com 逾 1600 万条帖子的分析，主张 trolling 既可能来自较稳定的倾向，也可能由心情和讨论上下文在普通人中被诱发。[3]
    views:
    - position: trolling 在严格意义上更接近一种带有伪装的、以扰乱或冲突为目的的沟通行为，而不是任何网上的粗鲁或不同意见；但经验研究实际测量的范围往往更宽，阅读结果时必须先看定义
      consensus_role: 语用学与礼貌研究中较有影响的概念澄清；并不排斥社会计算研究使用更宽的操作定义，但两者不能直接混用
      evidence:
        label: 基于单一未审核论坛语料的定性/语料分析，提供的是工作定义而非流行率或因果效应
        note: >-
          Hardaker 的材料来自公共、未审核的 Usenet 组 rec.equestrian，约九年、186,470 帖；检索 troll* 后排除少量误击，对余下例子按用户讨论的要点分类。这能说明该社区里人们如何识别「喷子」，但不能自动推广到当代社交媒体的全部冲突。[1]
          她也强调：一个群体的性质将决定某人是否会被视为 troller，以及其行为对个人或社区是否有害——「一个人的积极辩论，在另一个人看来就是 troll」。[1]
          Cheng 等人明确采用了更宽的定义，并在实验中把「无论是否故意」的冒犯或离题言论也标为 trolling，还用被举报帖作为野外代理；这提高了可编码性，却可能把发泄、讽刺、政治立场冲突与有预谋的伪装挑衅混在同一指标里。[3]
      holders:
      - name: Claire Hardaker
        identity: >-
          《Trolling in asynchronous computer-mediated communication: From user discussions to academic definitions》（Journal of Politeness Research, 2010）作者。文末简介为英国中央兰开夏大学（University of Central Lancashire）新闻、媒体与传播学院的英语语言学讲师。[1]
      argument: >-
        若把原问题里的 trolling 只理解成「网上说难听话」，后面的人格相关和实验效应都会被放大。Hardaker 的分析把关键放在意图结构上：喷子通常并不公开宣布「我来捣乱」，而是先扮演合格成员，把真实意图藏在假装真诚背后；成功与否，取决于别人是否上当并认真回应。[1]
        她还区分了几种结局：意图被识破却无人上钩（受挫）、被识破并被反制（被挫败）、没被识破也没激怒别人（失败），以及骗过对方并激起真诚回应（成功）。社区若把这种行为当成游戏，有时还会出现「装作在 troll」以增强群体亲密度的 mock troll，但这与被识别后常遭排斥的典型喷子并不相同。[1]
        这一澄清并不取消 Cheng 等人的发现，它只是要求读者在看到「35% 或 68% 的帖是 trolling」时，先问一句：这里的 trolling 包不包括无意的冒犯、离题和被举报的发泄。定义越宽，越容易得出「普通人也会 troll」；定义越窄，越接近有预谋的取乐型挑衅。[1][3]
      quotes:
      - text: >-
          A troller is a CMC user who constructs the identity of sincerely wishing
          to be part of the group in question, including professing, or conveying
          pseudo-sincere intentions, but whose real intention(s) is/are to cause
          disruption and/or to trigger or exacerbate conflict for the purposes of
          their own amusement.
        text_zh: 所谓 troller，是计算机中介传播中的用户：其建构出真诚希望成为该群体一员的身份，包括宣称或传达假装真诚的意图，但其真实意图是制造扰乱，和/或触发、加剧冲突，以供自己取乐。
        attribution: Claire Hardaker，Trolling in asynchronous computer-mediated communication
        locator: 第5节工作定义，Journal of Politeness Research 6(2), 2010, 第 237 页
        ref: 1
    - position: 在自陈问卷中，把网络 trolling 当作乐事或自我认同的人，更可能在日常施虐倾向以及部分其他「黑暗」人格维度上得分更高；这是倾向性关联，不是「喷子都是精神病」的诊断
      consensus_role: 人格心理学中被广泛引用的实证立场之一，针对的是稳定特质与自我报告的行为偏好，而不是全部网上冲突
      evidence:
        label: 两项在线自陈研究，相关与回归证据较强，但无行为观察，也不能做因果断言
        note: >-
          研究 1 为 418 名美国 Mechanical Turk 参与者，把「捉弄其他用户」列为最享受之评论活动的占 5.6%；选择此项者在黑暗四边形各量表上高于他人，外向性较高、宜人性较低，效应量约在 d = .24–.28。[2]
          研究 2 包括 188 名加拿大心理学本科生与 609 名美国 MTurk 参与者；在评论者子样本中，施虐倾向、精神病态与马基雅维利主义与 trolling 享受正相关（文中称皆 r > .37），自恋与 trolling 享受无显著相关；GAIT 与施虐倾向的相关尤其高（文中称 r’s > .55）。在同时进入回归时，施虐倾向对 trolling 享受与 GAIT 都保持独特贡献；控制总上网时间后模式基本不变。[2]
          作者还报告，trolling 享受部分中介了施虐倾向与 GAIT 的关系。全部测量均为自陈，样本为学生与众包，存在社会赞许性与自我选择问题；「精神病态」在此是亚临床量表，不能读成临床精神病诊断。[2]
      holders:
      - name: Erin E. Buckels、Paul D. Trapnell、Delroy L. Paulhus
        identity: >-
          《Trolls just want to have fun》（Personality and Individual Differences, 2014）作者。通讯作者 Buckels 当时在加拿大曼尼托巴大学心理学系；Trapnell 在温尼伯大学；Paulhus 在不列颠哥伦比亚大学。[2]
      argument: >-
        这条研究路线要回答的，正是原问题里「为何有人会从激怒他人中得到快乐」的那一半。Buckels 等人指出，trolling 文化本身就有一个与施虐快感几乎同义的词：lulz。[2]
        数据上，这种快乐并没有均匀地连到所有网上活动：与施虐倾向稳定相关的，是 trolling 的享受，而不是聊天或辩论的享受。作者据此认为，关系具有特异性，不能用「就是喜欢上网、喜欢发言」来解释。[2]
        他们的讨论写道，就施虐倾向与 GAIT 的关联之强而言，甚至可以说网上喷子是日常施虐者的原型；并在调解分析后写下那句经常被转述的话：施虐者只是想找乐子，而互联网是他们的游乐场。[2]
        即便如此，本文必须把结论限制在研究实际测量的范围内：这是匿名问卷里的自我认同与偏好，不是对真实评论的盲评，更不是流行病学调查。第一项研究里，最享受 trolling 的只是少数人。把「相关」写成「所有出言不逊者都有人格障碍」，既超出数据，也与下文的情境研究相冲突。[2][3]
      quotes:
      - text: >-
          Online trolling is the practice of behaving in a deceptive, destructive,
          or disruptive manner in a social setting on the Internet with no apparent
          instrumental purpose.
        text_zh: 所谓网络 trolling，是指在互联网的社交情境中，以欺骗、破坏或扰乱的方式行事，并且看不出明显的工具性目的。
        attribution: Erin E. Buckels、Paul D. Trapnell 与 Delroy L. Paulhus，Trolls just want to have fun
        locator: 引言首句，Personality and Individual Differences 67, 2014, 第 97 页
        ref: 2
      - text: >-
          Thus cyber-trolling appears to be an Internet manifestation of everyday
          sadism.
        text_zh: 因此，网络 trolling 看来是日常施虐倾向在互联网上的一种表现。
        attribution: Erin E. Buckels、Paul D. Trapnell 与 Delroy L. Paulhus，Trolls just want to have fun
        locator: 摘要末句，Personality and Individual Differences 67, 2014, 第 97 页
        ref: 2
      - text: >-
          Both trolls and sadists feel sadistic glee at the distress of others.
          Sadists just want to have fun . . . and the Internet is their playground!
        text_zh: 喷子与施虐者都会对他人的痛苦感到施虐式的快意。施虐者不过是想找乐子……而互联网就是他们的游乐场！
        attribution: Erin E. Buckels、Paul D. Trapnell 与 Delroy L. Paulhus，Trolls just want to have fun
        locator: 第4节 General discussion，Personality and Individual Differences 67, 2014, 第 101 页
        ref: 2
    - position: 心情和讨论情境也可以提高普通人写出类似喷子言论的可能性；因此不能把网上的攻击性发言全部归因于一小撮「天生的」反社会者
      consensus_role: 社会计算与计算机支持的协作研究中的主要情境论立场，用来补足（而不是简单取消）人格解释
      evidence:
        label: 一项有随机分配的在线实验，加上对单一新闻网站讨论的大规模观察分析
        note: >-
          实验为 2×2 被试间设计，667 名美国 Mechanical Turk 参与者先做测验（诱发正性或负性心情），再进入模拟新闻评论区（先前帖为温和或挑衅）。被编码为 troll 的帖子比例在「心情好 + 温和上下文」时为 35%，在「心情差 + 挑衅上下文」时为 68%；混合效应逻辑回归中，负性心情使 trolling 的发生比提高 89%，先前的挑衅帖使之提高 68%。[3]
          限制是明确的：参与者被要求至少发一帖并获得报酬；使用随机生成的化名，可能整体降低评论质量；编码标准宽于 Hardaker 的定义，包含非故意的冒犯与离题。[3]
          观察部分分析 CNN.com 的 16,500,603 帖，其中 3.5% 被举报；在被举报的帖中，26% 出自此前在其他讨论中没有被举报记录的用户。作者还报告，被举报率随已知的人群心情日节律而起伏，且讨论开头的被举报帖与随后他人被举报的概率升高相关。这些观察能与实验方向一致，但心情在野外是用代理指标推断的，不能等同于实验操纵。[3]
      holders:
      - name: Justin Cheng、Michael Bernstein、Cristian Danescu-Niculescu-Mizil、Jure Leskovec
        identity: >-
          《Anyone Can Become a Troll: Causes of Trolling Behavior in Online Discussions》（CSCW 2017）作者。Cheng、Bernstein 与 Leskovec 当时在斯坦福大学，Danescu-Niculescu-Mizil 在康奈尔大学。[3]
      argument: >-
        Cheng 等人把问题写成：trolling 究竟是「天生的」少数人的行为，还是普通人在一定条件下也会做的事？他们的实验给出的答案是：至少就他们所编码的 troll-like 评论而言，负性心情和「别人已经在骂」的现场气氛，都会把这种行为推高，合在一起大约使基线概率加倍。[3]
        若只有一小撮稳定的反社会者才会写出这类帖，如此大的条件差异很难出现。作者因此认为，相当一部分人必须是可被诱发的。CNN.com 上约四分之一被举报帖来自「没有案底」的用户，也指向同一方向。[3]
        他们在结论里写得比较平衡：trolling 既源于先天/稳定因素，也源于情境因素；先前文献较多讨论前者，他们则聚焦后者。设计含义是：只封禁「确认的喷子」，既可能误伤只是一天心情不好的普通用户，也无法处理这种会被气氛放大的出格发言。[3]
        与 Buckels 等人合看，更合理的表述不是二选一，而是分层：有人可能更经常、更享受地扮演制造混乱的角色；但同一社区里，坏心情和已经变味的讨论，也可以让更多人在当下加入攻击或胡搅。匿名在 Cheng 文中被当作可能降低质量与责任约束的背景因素来讨论，实验本身并没有单独操纵「有名/匿名」，因而不能把匿名写成已被该项实验证实的唯一开关。[2][3]
      quotes:
      - text: >-
          These results combine to suggest that ordinary people can, under the
          right circumstances, behave like trolls.
        text_zh: 这些结果合在一起表明：普通人在适当的情境下，也可能表现得像喷子一样。
        attribution: Justin Cheng、Michael Bernstein、Cristian Danescu-Niculescu-Mizil 与 Jure Leskovec，Anyone Can Become a Troll
        locator: 摘要末句，CSCW 2017 会议论文（作者 PDF 无学报页码）
        ref: 3
      - text: >-
          Trolling stems from both innate and situational factors – where prior
          work has discussed the former, this work focuses on the latter, and
          reveals that both mood and discussion context affect trolling behavior.
        text_zh: trolling 既源于先天（稳定）因素，也源于情境因素——先前研究讨论了前者，本文则聚焦后者，并表明心情与讨论情境都会影响 trolling 行为。
        attribution: Justin Cheng、Michael Bernstein、Cristian Danescu-Niculescu-Mizil 与 Jure Leskovec，Anyone Can Become a Troll
        locator: 结论首句，CSCW 2017 会议论文（作者 PDF 无学报页码）
        ref: 3
    open_parts: >-
      定义尚未统一，这直接影响流行率、人格相关和「普通人会不会 troll」的估计：窄定义下的有预谋伪装挑衅，与宽定义下的骂战、讽刺、离题或被举报发言，可能对应不同的心理机制。[1][3]
      Buckels 等人的发现来自自陈，尚未与真实评论区中经过独立编码的行为完全对接；相关不能确定是「施虐倾向使人去 troll」，还是喜欢 troll 的人更愿意在问卷上承认某些想法，或两者循环加强。作者自己也写明，反社会倾向与过度使用技术之间的因果方向仍不清楚。[2]
      Cheng 等人的实验证明的是短期、可诱发的 troll-like 发言，使用的是报酬任务和化名，外推到长期社区中的骚扰、霸凌或有组织的搅局，需要更多区分。他们也承认，不同策略（无指向咒骂对针对性骚扰）的严重程度不同，而区分「存心伤害」与「只是没把观点说好」，仍是未完成的工作。观察数据里的「心情」多是间接推断。[3]
      匿名与去抑制常常被当作常识机制，但要回答原问题里「研究是否支持匿名就是主因、以及它如何使能」，还需要直接操纵身份可识别性、或比较不同平台规则的设计；本次所打开的三篇核心文献并未单独把匿名实验成唯一自变量。至于网络出现之前是否已有功能相似的历史前驱（戏弄、公开羞辱、墙报涂鸦等），这三篇也没有提供系统的历史比较，不宜在此断言。[1][2][3]
