- id: 2026-11-11-psych-seven
  date: '2026-11-11'
  category: psychology
  title_zh: 「神奇的数字 7」还成立吗？
  title_en: Is the magical number 7 still valid?
  commentary: 「人一次只能记住 7±2 个东西」可能是心理学最出圈的数字，可连提出者自己都怀疑它是巧合——今天的工作记忆研究认为真正的上限更小，甚至可能根本不是「几个」的问题。
  source_name: Psychology Stack Exchange
  source_url: https://psychology.stackexchange.com/questions/672/is-the-magical-number-7-still-valid
  author: Benny Skogberg
  source_type: stackexchange
  tags:
  - 工作记忆
  - 短时记忆
  - 组块
  - 认知容量
  answer:
    format: scholarly
    reviewed_at: '2026-11-11'
    consensus:
      label: 「7±2 是精确容量」已不被主流接受；容量更接近 3–5 个组块是主流观点，但「离散槽位 vs 连续资源」仍有争论
      note: Cowan（2001）在《行为与脑科学》靶文中汇集大量证据，认为纯粹的短时记忆容量平均约为 4 个组块，并认为 Miller 的 7 更像粗略估计和修辞手法。[2] 视觉工作记忆研究同样报告约
        4 个对象的上限。[4][5] 另一方面，Ma、Husain 与 Bays 主张工作记忆更像可灵活分配的有限资源，表现取决于表征质量而非数量。[6]
    summary: George Miller 1956 年的经典论文把绝对判断的通道容量与即时记忆广度放在一起讨论，指出两者都在 7 左右；但他同时强调，即时记忆的限制是以「组块」而非信息比特计量的，并且对「所有这些
      7 之间有深刻联系」持保留态度，怀疑那只是「有害的毕达哥拉斯式巧合」。[1] 后来的研究基本不再把 7 当作工作记忆的真实容量。Cowan 认为，当复述、长时记忆和组块重编码等因素被排除时，存在一个平均约
      4 个组块的中央容量限制；[2] 他在 2010 年的综述中把年轻成人的中央记忆存储概括为 3 到 5 个有意义的项目。[3] Luck 与 Vogel 的视觉实验发现，人一次只能保持约 4
      种颜色或朝向，但可以保持 4 个对象的多重特征，说明容量以整合的对象为单位。[4] 与此同时，记忆广度也受材料长度与时间影响：Chen 与 Cowan 发现组块限制和长度限制都会起作用。[7]
      而资源模型认为「几个槽位」本身就是错误的比喻。[6] 所以，若问题是「7 是否是工作记忆的精确上限」，答案是否定的；若问题是「普通人能复述的数字串大约多长」，7 左右作为粗略经验值仍大体可用，但它混合了组块、复述与长时记忆的贡献。
    definitions:
    - term: 组块（chunk）
      text: Miller 区分了「比特」与「组块」：绝对判断的限制以比特计，即时记忆的限制以组块计；通过把输入重新编码为更少、更大的组块，人们能记住更多信息。[1]
    - term: 工作记忆容量
      text: Cowan 把它描述为完成认知任务时，在处理信息的同时能够保持的信息量；他认为存在一个有限的中央存储。[3]
    - term: 槽位模型与资源模型
      text: 前者认为工作记忆有固定数量的离散「槽位」；后者认为存在一种可在所有项目之间灵活分配的有限资源，项目越多每个项目的精度越低。[5][6]
    milestones:
    - year: '1956'
      name: Miller《神奇的数字 7±2》
      explanation: 发表于《Psychological Review》，讨论绝对判断与即时记忆的容量限制，提出组块与重编码概念。[1]
    - year: '1997'
      name: Luck 与 Vogel：视觉工作记忆约 4 个对象
      explanation: 在《Nature》报告人们只能保持约 4 种颜色或朝向，但能保持 4 个对象的颜色与朝向组合。[4]
    - year: '2001'
      name: Cowan「神奇的数字 4」
      explanation: 《行为与脑科学》靶文整合多种范式，论证中央容量约为 4 个组块。[2]
    - year: '2014'
      name: 资源模型的系统综述
      explanation: Ma、Husain 与 Bays 在《Nature Neuroscience》综述行为与神经证据，主张工作记忆是可灵活分配的有限资源。[6]
    views:
    - position: 真实的中央容量约为 3–5 个组块（「神奇的数字 4」）
      consensus_role: 主流观点
      evidence:
        label: 多范式行为证据的整合，加上视觉工作记忆实验
        note: Cowan 2001 是附有大量同行评论的靶文；估计值依赖于能否有效阻止复述与组块重编码。[2][3]
      holders:
      - name: Nelson Cowan
        identity: 《The magical number 4 in short-term memory》（BBS 2001）与《The Magical Mystery Four》（CDPS
          2010）作者。[2][3]
      - name: Steven J. Luck、Edward K. Vogel
        identity: 1997 年《Nature》视觉工作记忆容量论文与 2013 年《Trends in Cognitive Sciences》综述作者。[4][5]
      argument: Cowan 指出，要观察真正的容量限制，必须满足一些边界条件，例如信息过载使组块只能是单个刺激项，或采取措施专门阻止把刺激重新编码为更大组块；在这些条件下，复述和长时记忆无法把项目合成未知大小的组块，结果指向一个平均约
        4 个组块的单一中央容量限制。[2] 视觉方面，Luck 与 Vogel 发现约 4 个对象的上限，且以对象而非特征计；[4] 他们 2013 年的综述认为，现有经验证据与神经网络模型更支持离散项目上限。[5]
      quotes:
      - text: Miller (1956) summarized evidence that people can remember about seven chunks in short-term
          memory (STM) tasks. However, that number was meant more as a rough estimate and a rhetorical
          device than as a real capacity limit.
        text_zh: Miller（1956）总结的证据表明，人们在短时记忆任务中能记住大约七个组块。然而，这个数字更多是作为粗略估计和修辞手法，而不是真实的容量限制。
        attribution: Nelson Cowan，Behavioral and Brain Sciences（2001）
        locator: 摘要
        ref: 2
      - text: 'The ability to repeat information depends on task demands but can be distinguished from
          a more constant, underlying mechanism: a central memory store limited to 3 to 5 meaningful items
          in young adults.'
        text_zh: 复述信息的能力取决于任务要求，但可以与一种更恒定的底层机制区分开来：在年轻成人中，一个限于 3 到 5 个有意义项目的中央记忆存储。
        attribution: Nelson Cowan，Current Directions in Psychological Science（2010）
        locator: 摘要
        ref: 3
    - position: 容量不是「几个」，而是可灵活分配的连续资源
      consensus_role: 有力的竞争理论
      evidence:
        label: 心理物理学与神经证据，争论仍在进行
        note: 资源模型与槽位模型对同一批数据常能给出竞争性拟合；Luck 与 Vogel（2013）认为证据目前更支持离散上限，而 Ma 等人（2014）持相反倾向，可见此处尚无定论。[5][6]
      holders:
      - name: Wei Ji Ma、Masud Husain、Paul M. Bays
        identity: 《Changing concepts of working memory》（Nature Neuroscience, 2014）作者。[6]
      argument: Ma 等人指出，工作记忆通常被认为容量有限、保存固定的少量项目，例如 Miller 的 7 或 Cowan 的 4；但近来有人提出，工作记忆更应被理解为在所有待保持项目之间灵活分配的有限资源——按这一观点，决定表现的是表征的质量而不是数量。[6]
        如果这是对的，那么「到底是 7 还是 4」这个问题本身就问错了：记住更多项目并不会在某个数字处突然断崖，而是每个项目都变得更模糊。
      quotes:
      - text: According to this view, the quality rather than the quantity of working memory representations
          determines performance.
        text_zh: 按照这一观点，决定表现的是工作记忆表征的质量，而不是其数量。
        attribution: Ma、Husain 与 Bays，Nature Neuroscience（2014）
        locator: 摘要
        ref: 6
    - position: 记忆广度同时受组块数与材料长度/时间的限制
      consensus_role: 重要补充
      evidence:
        label: 受控实验
        note: Chen 与 Cowan 通过预先教授词对来人为制造双词组块，比较组块数与长度的作用；Baddeley 等人（1975）的词长效应本文未能打开原文，据 [7] 摘要中的引用。[7][8]
      holders:
      - name: Zhijian Chen、Nelson Cowan
        identity: '《Chunk Limits and Length Limits in Immediate Recall: A Reconciliation》（JEP:LMC 2005）作者。[7]'
      argument: 一些研究认为即时回忆受可回忆组块数的限制，另一些（如 Baddeley、Thomson 与 Buchanan, 1975）认为受材料长度限制。Chen 与 Cowan 发现两者都会起作用：在
        12 词列表的自由回忆中，6 个预学词对与 6 个单词回忆得差不多，符合组块限制；但在 8 词列表的顺序回忆中，4 个预学词对与 8 个单词回忆得差不多，符合长度限制。[7] 这说明「能记住几个」取决于任务是否要求保持顺序、材料能否被复述等，单一数字难以概括。
    open_parts: 第一，工作记忆容量是离散槽位、连续资源，还是两者的混合，仍是活跃争论。[5][6] 第二，「组块」本身缺乏独立于任务的操作定义，Miller 早已承认我们对什么构成一个组块并不十分确定。[1]
      第三，容量限制与注意力的关系——注意力是有限资源还是选择机制——Oberauer 的综述显示不同版本得到的支持并不一致。[9] 第四，个体差异中有多少反映真实存储容量、多少反映有效使用容量的能力，Luck
      与 Vogel 认为两者都存在。[5]
    references:
    - id: 1
      citation: 'Miller, G. A. (1956). The magical number seven, plus or minus two: Some limits on our
        capacity for processing information. Psychological Review, 63(2), 81–97. 约克大学 Classics in the
        History of Psychology 全文重排版（标注原刊页码）。'
      url: https://psychclassics.yorku.ca/Miller/
    - id: 2
      citation: 'Cowan, N. (2001). The magical number 4 in short-term memory: A reconsideration of mental
        storage capacity. Behavioral and Brain Sciences, 24(1), 87–114. 摘要据 Cambridge Core 页面。'
      url: https://doi.org/10.1017/S0140525X01003922
    - id: 3
      citation: 'Cowan, N. (2010). The magical mystery four: How is working memory capacity limited, and
        why? Current Directions in Psychological Science, 19(1), 51–57. PMC 开放全文。'
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC2864034/
    - id: 4
      citation: Luck, S. J., & Vogel, E. K. (1997). The capacity of visual working memory for features
        and conjunctions. Nature, 390, 279–281.
      url: https://www.nature.com/articles/36846
    - id: 5
      citation: 'Luck, S. J., & Vogel, E. K. (2013). Visual working memory capacity: From psychophysics
        and neurobiology to individual differences. Trends in Cognitive Sciences, 17(8), 391–400. PMC
        开放全文。'
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3729738/
    - id: 6
      citation: Ma, W. J., Husain, M., & Bays, P. M. (2014). Changing concepts of working memory. Nature
        Neuroscience, 17(3), 347–356. PMC 开放全文。
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4159388/
    - id: 7
      citation: 'Chen, Z., & Cowan, N. (2005). Chunk limits and length limits in immediate recall: A reconciliation.
        Journal of Experimental Psychology: Learning, Memory, and Cognition, 31(6), 1235–1249. PMC 开放全文。'
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC2673719/
    - id: 8
      citation: Baddeley, A. D., Thomson, N., & Buchanan, M. (1975). Word length and the structure of
        short-term memory. Journal of Verbal Learning and Verbal Behavior, 14(6), 575–589. 出版商页面对自动抓取返回拦截，本次未能打开原文。
      url: null
