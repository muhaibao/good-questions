      url: https://arxiv.org/pdf/1905.02175
- id: 2026-11-09-biz-cost-disease
  date: '2026-11-09'
  category: business
  title_zh: 为什么有些东西变得越来越贵？
  title_en: Why are certain things getting so much more expensive?
  commentary: 医疗、教育成本暴涨而电子产品暴跌——这个问题把「鲍莫尔成本病」、监管与质量未被计量绑在一起。
  source_name: Patrick Collison — Questions
  source_url: https://patrickcollison.com/questions
  author: Patrick Collison
  source_type: curated
  tags:
  - 成本病
  - 进步研究
  - 价格
  answer:
    format: scholarly
    reviewed_at: '2026-11-10'
    consensus:
      label: 鲍莫尔机制是标准解释之一，但并非所有涨价都能用它说明
      note: Baumol 1967 年提出：经济活动可大致分为技术进步部门与技术进步缓慢（或「非进步」）的部门；若工资在各部门大致按进步部门的生产率同步上升，则后者的相对成本将累积性、没有上限地上升。教育、表演艺术、市政服务、餐馆等被他列为后一类的例证。[1] Helland 与 Tabarrok 2019 年用美国 1950–2016 年的实际价格来论证：高等教育与初等/中等教育的实际价格大约分别升至原来的近六倍与五倍以上，专业服务与医疗也升至三倍以上；他们把这些部门的长期涨价主要归于鲍莫尔效应，并认为许多流行的部门内解释要么不成立，要么不足以说明长期涨价。他们同时承认，鲍莫尔效应并不能解释每一个部门的价格上升。[2] 1967 年的论文本身对例证「并未试图提供文献式的经验记录」。因此，机制清楚，对具体部门的定量分解仍可能有争论。
    summary: 有些东西变得更贵，并不是因为经济整体失去了技术进步。Baumol 的「不平衡增长」模型给出一个结构性理由：一些活动（他称为技术上进步的部门）可以通过创新、资本积累与规模经济持续提高人均产出；另一些活动就其性质而言只能零星提高生产率——现场表演、课堂教学、许多个人服务都属于此类。若劳动市场未被隔绝、工资在各部门大致一起上升，那么进步部门的生产率提高会抵消工资上涨，而在生产率几乎不变的部门，成本就会年复一年地相对上升，「累积性地、没有上限」。[1] 他在开篇把市政服务、教育、表演艺术、餐馆与闲暇活动列为由此受到几乎不可避免的实际成本上升压力的领域，并说明这一假说最初是与 William G. Bowen 在表演艺术研究中共同发展的。[1] 半个世纪后，Helland 与 Tabarrok 以 Why Are the Prices So Damn High? 为题重新提出这个问题：为何在经济整体的技术与生产率都在提高时，某些部门的价格仍大幅上升，而家电与电信却变得便宜得多？他们展示了 1950–2016 年一组消费品与服务的实际价格（1950 年标准化为 100）：高等教育升至 586，初等与中等教育升至 534，专业服务与医疗则升至三倍以上。[2] 在结论中他们避免使用「成本病」这个词，因为鲍莫尔效应的一个深层教训是：物品可以涨价，同时变得更可负担；一个更深层的教训是，某些物品价格更高，是经济增长的必然结果，而不是增长的失败——「相对价格的变化是增长的必然结果，而不是增长的失败」。他们审视教育与医疗后认为，这些部门中大多数具体的流行解释要么不真实，要么不能解释成本上升；例如教育并未变得更由行政成本主导，医疗事故费用也不是医疗成本的大头；在许多行业里，监管或市场集中度对长期价格变化的解释力也不大。[2]
    definitions:
    - term: 技术进步部门 / 非进步部门（Baumol 的二分）
      text: Baumol 的基本前提是：经济活动并非完全任意地可分成两类——技术上进步的活动，其创新、资本积累与规模经济共同造成人均产出的累积上升；以及另一类就其性质只允许零星生产率提高的活动。他强调这是程度之别，而非绝对二分。[1]
    - term: 鲍莫尔效应 / 不平衡增长
      text: 若工资在各部门随进步部门的生产率一起上升，则生产率难以提高的部门，其相对成本会累积性上升。Helland 与 Tabarrok 用「鲍莫尔效应」来指这一机制，并有意少用「成本病」一词。[1][2]
    milestones:
    - '1967 年 6 月，William J. Baumol 在 American Economic Review 第 57 卷第 3 期第 415–426 页发表 Macroeconomics of Unbalanced Growth: The Anatomy of Urban Crisis（JSTOR 1812111）。[1]'
    - 2019 年，Eric Helland 与 Alexander Tabarrok 在乔治梅森大学 Mercatus Center 出版 Why Are the Prices So Damn High? Health, Education, and the Baumol Effect。[2]
    views:
    - position: 相对价格上升可以来自部门间生产率增长不平衡，而不必来自这些部门「出了毛病」
      consensus_role: 机制的经典表述
      evidence:
        label: 理论宏观模型，附有说明性观察，但作者声明未作文献式经验记录
        note: Baumol 写明：他在文中并不试图为说明性的经验观察提供文献式记录，尽管「在每一个例子中数据都经过考察，并且看来支持这些断言」。因此，1967 年文本确立的是机制，而不是对教育或医疗价格指数的完整计量分解。[1]
      holders:
      - name: William J. Baumol
        identity: 文中作者注：普林斯顿大学经济学教授（professor of economics, Princeton University）。文中说明基本假说最初与 William G. Bowen 在二十世纪基金会资助的表演艺术研究中共同发展。[1]
      argument: Baumol 认为，有些经济力量强大到会冲破一切为压制它们而设立的障碍。他要讨论的这种机制，有助于理解市政服务、教育、表演艺术、餐馆与闲暇活动等经济服务的前景：在这些活动的技术结构中，几乎不可避免地存在着使供给它们的实际成本累进、累积上升的力量；抵消这些成本上升的努力也许暂时有效，长期来看只是对底层趋势没有显著作用的姑息。[1] 模型的关键推论是：若某一部门的生产率增长持续落后于经济其他部分，而工资在所有领域按比例上升，则非进步部门的相对成本必然上升，而且这些成本将累积性、没有上限地上升——因为进步部门的生产率提高可以抵消工资上涨，这一抵消在非进步部门必然更小。[1] 他随后写道，技术进步部门的进步本身，会不可避免地增加技术上几乎不变的部门的成本，除非这些领域的劳动市场能被隔绝、工资被绝对冻结，「而这是极不可能的」。[1]
      quotes:
      - text: I will argue that inherent in the technological structure of each of these activities are forces working almost unavoidably for progressive and cumulative increases in the real costs incurred in supplying them. As a consequence, efforts to offset these cost increases, while they may succeed temporarily, in the long run are merely palliatives which can have no significant effect on the underlying trends.
        text_zh: 我将论证，在这些活动每一种的技术结构中，几乎不可避免地存在着使供给它们所发生的实际成本累进、累积上升的力量。因此，抵消这些成本上升的努力也许暂时成功，长期来看却只不过是对底层趋势不能产生显著作用的姑息。
        attribution: William J. Baumol, 1967
        locator: American Economic Review, 57(3), 第 415 页
        ref: 1
      - text: If productivity per man hour rises cumulatively in one sector relative to its rate of growth elsewhere in the economy, while wages rise commensurately in all areas, then relative costs in the nonprogressive sectors must inevitably rise, and these costs will rise cumulatively and without limit.
        text_zh: 若一个部门的人均小时生产率相对于经济其他部分的增长率累积上升，而工资在所有领域按比例上升，则非进步部门的相对成本必然上升，而且这些成本将累积性、没有上限地上升。
        attribution: William J. Baumol, 1967
        locator: American Economic Review, 57(3), 第 419 页附近（命题表述）
        ref: 1
    - position: 教育与医疗等部门的长期实际涨价，主要可用鲍莫尔效应理解；相对价格变化可以是增长的结果而不是失败
      consensus_role: 对美国战后价格史的一种有影响的定量重述
      evidence:
        label: 专著中的价格序列与跨行业检验，不是一篇经同行评审的期刊论文
        note: Helland 与 Tabarrok 的书由 Mercatus Center 出版。引言中的价格指数（1950=100；高等教育至 586，初等与中等教育至 534，专业服务与医疗「三倍以上」）是作者对所选序列的整理；结论中对行政成本、医疗事故、监管与集中度的判断，是作者在书中审视后的主张。本书自己设有「鲍莫尔效应并不能解释每一个部门的价格上升」一章，说明作者并不把它当作万能解释。[2]
      holders:
      - name: Eric Helland
        identity: 书末作者简介：Claremont McKenna College 的 William F. Podlich 经济学教授与 George R. Roberts Fellow，并任 RAND Institute for Civil Justice 经济学家；持华盛顿大学圣路易斯分校博士学位。[2]
      - name: Alexander Tabarrok
        identity: 书末作者简介：乔治梅森大学 Mercatus Center 的 Bartley J. Madden 经济学讲席，兼乔治梅森大学经济学教授。[2]
      argument: 作者以一个尖锐的问题开场：为何在经济整体的技术与生产率都在改善时，某些部门的价格仍大幅上升？教育与医疗是似乎被不断涨价击中的显著例子，与此同时家电与电信却便宜得多。他们展示 1950–2016 年一组实际价格：高等教育涨了近六倍（100 到 586），初等与中等教育几乎同步（100 到 534），法律、会计等专业服务与医疗则都涨到三倍以上。[2] 结论中，他们有意避免「成本病」一词，因为鲍莫尔效应的深刻教训是：随着时间推移，物品可以涨价，同时也变得更可负担；一个更深刻的教训是，某些物品价格更高，是经济增长的必然结果。「相对价格的变化是增长的必然结果，而不是增长的失败。我们既可以拥有医疗，也可以拥有智能手机。」他们写到，人们看到教育、医疗与艺术的高且不断上升的价格，自然会断定这些部门出了问题；但在仔细审视教育与医疗、并对照 Baumol 与 Bowen 对艺术的研究之后，这些部门中大多数具体解释要么不真实，要么不能解释成本上升。教育并未变得更由行政成本或「懒惰的河流」（lazy rivers）所主导；医疗事故费用不是医疗成本的大头；在广泛的行业里，监管或集中度对长期价格变化的解释力也不大。[2] 任何针对这些部门的「今日解释」，都必须面对涨价早已成为这些部门显著特征这一事实。
      quotes:
      - text: Why are prices in some sectors increasing dramatically even as economy-wide technology and productivity improve? Education and healthcare are notable examples of sectors seemingly stricken by constantly rising prices. At the same time, home appliances and telecommunications have become much cheaper.
        text_zh: 为何在经济整体的技术与生产率都在改善时，某些部门的价格仍在大幅上升？教育与医疗是似乎被不断涨价击中的显著例子。与此同时，家用电器与电信却变得便宜得多。
        attribution: Helland & Tabarrok, 2019，引言
        locator: 第 1 页
        ref: 2
      - text: Changes in relative prices are an inevitable consequence of growth and not a failure of growth. We can have our healthcare and our smartphones, too.
        text_zh: 相对价格的变化是增长的必然结果，而不是增长的失败。我们既可以拥有医疗，也可以拥有智能手机。
        attribution: Helland & Tabarrok, 2019，结论
        locator: 第 72 页
        ref: 2
    open_parts: 第一，Baumol 1967 年的论文是机制陈述，作者自己声明未对说明性观察作文献式经验记录。[1] 第二，Helland 与 Tabarrok 提供了战后美国价格序列与跨行业检验，但该书不是经期刊同行评审的计量论文；对质量改进是否被价格指数充分捕捉、公共补贴与需求扩张扮演何种角色，仍可能有其他文献给出不同分解，本轮若未打开那些文本则不转述其数字。第三，作者自己设置专章指出鲍莫尔效应并不能解释每一个部门的涨价，住房等部门需要另外的解释。[2] 第四，政策含义（增加高技能劳动供给、提高这些部门的生产率）在书中有讨论，但是否以及如何落实，超出本文已核对的范围。
    references:
    - id: 1
      citation: 'Baumol, W. J. Macroeconomics of Unbalanced Growth: The Anatomy of Urban Crisis. American Economic Review, 1967, 57(3), 415–426. JSTOR 1812111（注意：不是有时被误引的 1812671）。引语核自已打开的重印 PDF。'
      url: https://cooperative-individualism.org/baumol-william_macroeconomics-of-unbalanced-growth-1967-jun.pdf
    - id: 2
      citation: 'Helland, E., & Tabarrok, A. Why Are the Prices So Damn High? Health, Education, and the Baumol Effect. Arlington, VA: Mercatus Center at George Mason University, 2019. 引语核自 Mercatus 原 PDF 的 Internet Archive 存档（2019-05-25 快照）。'
      url: https://web.archive.org/web/20190525171124/https://www.mercatus.org/system/files/helland-tabarrok_why-are-the-prices-so-damn-high_v1.pdf
- id: 2026-11-09-sci-pnp
  date: '2026-11-09'
  category: science
  title_zh: P 是否等于 NP？
  title_en: Does P = NP?
  commentary: 千禧年七大难题之一：若相等，许多「难」的搜索与证明问题将变得可高效求解，计算机科学与密码学的地基都会重排。
  source_name: Clay Mathematics Institute — Millennium Problems
  source_url: https://www.claymath.org/millennium/p-vs-np/
  author: Clay Mathematics Institute
  source_type: curated
  tags:
  - 计算复杂性
  - 千禧年难题
  answer:
    format: scholarly
    reviewed_at: '2026-11-10'
    consensus:
      label: 主流但尚未证明
      note: 「P 是否等于 NP」本身仍是开放问题，这一点没有争议。认为「P ≠ NP 为真」是复杂性理论中的主流猜想，但不是定理：既没有被接受的证明，也没有被接受的反证。[1][2] William
        Gasarch 三次专家民调显示，持 P ≠ NP 的受访者比例从 2002 年的 61%（100 人中的 61 人）升至 2012 年的 83%（152 人中的 126 人）和 2019
        年的 88%（124 人中的 109 人）。[3][4][5]
    summary: P 是可在多项式时间内用确定性算法判定的问题类；NP 是「是」答案带有多项式长度证据、且该证据可在多项式时间内核验的问题类。显然有 P ⊆ NP；P 对 NP 问题问的是这个包含是否是等式。Clay
      千禧年奖的官方陈述把问题写作：“Does P = NP?”[1] 这是一个仍然开放的数学问题。多数复杂性理论家相信答案为否，即存在可快速核验却（在多项式时间内）不可快速求解的问题。[1][2]
      这一信念有可核对的民调数据支撑，但民调记录的是主观意见，不能代替证明。[3][4][5] 与此同时，若干被证明的「障碍定理」表明：对角化/相对化、自然证明、代数化等已有技术族，并不足以分离 P
      与 NP；即便猜想为真，证明也很可能需要本质上新的想法。[1][2][6][7][8]
    definitions:
    - term: P
      text: 多项式时间（Polynomial time）：存在某台确定性图灵机，其最坏运行时间被输入长度的某个固定多项式上界所约束，从而判定的语言（判定问题）所组成的类。[1]
    - term: NP
      text: 非确定性多项式时间（Nondeterministic Polynomial time）：按今天的常用定义，一个语言属于 NP，当且仅当存在多项式时间可计算的核验关系 R，使得输入
        w 属于该语言当且仅当存在一条长度不超过 |w| 的某个多项式的证据 y，满足 R(w, y)。[1] 直观上就是：「是」的答案好查，但不一定好找。
    - term: NP-完全
      text: 一个语言 L 是 NP-完全的，当且仅当 L 本身属于 NP，并且 NP 中的每一个语言都可以多项式时间多一归约到 L。[1] 因此，若任何一个 NP-完全问题属于 P，则 P =
        NP。
    milestones:
    - year: 1971–1973
      name: Cook–Levin 定理与 NP-完全性
      explanation: Stephen Cook 在 1971 年证明：命题可满足性（SAT / 3-SAT）等自然问题是 NP-完全的（他当时使用的是多项式时间图灵归约）。[1][9] 次年
        Richard Karp 用多一归约证明另外约 20 个自然问题也是 NP-完全的，并固定了沿用至今的 P、NP 与 NP-完全记号。[1][10] Leonid Levin 独立提出了相近的「通用搜索问题」概念，并给出包括可满足性在内的例子。[1][11]
        一句话：只要你能多项式时间解决其中任何一个「完全」问题，你就能多项式时间解决整个 NP。
    - year: '1975'
      name: Baker–Gill–Solovay 相对化障碍
      explanation: 他们构造了预言机（oracle）世界 A 和 B，使得相对化之后既有 P^A = NP^A，也有 P^B ≠ NP^B。[8] 因此，若一种证明技术「相对化」——对所有预言机同样成立——它就不可能分离
        P 与 NP。对角化等从可计算性理论借来的方法通常属于这一类。[1][2][6] 一句话：只对「带任意黑盒子程序的机器」都成立的论证，分辨不了 P 和 NP。
    - year: 1994/1997
      name: Razborov–Rudich 自然证明障碍
      explanation: 许多电路下界证明可被归为「自然证明」：它们给出一种在一定意义上可有效核验、且对随机布尔函数成立的组合性质。Razborov 与 Rudich 证明：若存在足够强的伪随机生成器（这与因数分解等难题的硬度假设相关），则自然证明无法给出一般电路的超多项式下界，因而也无法用这类方法证明
        P ≠ NP。[1][7] 一句话：看上去「自然」的组合计数技巧，在标准密码学假设下到不了终点。
    - year: 2008/2009
      name: Aaronson–Wigderson 代数化障碍
      explanation: 交互证明中 IP = PSPACE 等结果已经打破相对化，其关键技术是把布尔计算「算术化」到有限域上的低次多项式。Aaronson 与 Wigderson 表明，若预言机还提供这种低次扩张（代数预言机），则已有的算术化证明仍然成立，但
        P 对 NP、NEXP 对 P/poly 等核心分离仍然不会被推出；因此证明 P ≠ NP 还需要非代数化的技术。[2][6] 一句话：连「会做低次插值的黑盒」都骗不倒的论证，仍然不够分离
        P 与 NP。
    views:
    - position: P ≠ NP（主流猜想）
      consensus_role: 主流猜想
      evidence:
        label: 专家共识与间接经验，不是证明
        note: 证据来自长期找不到 NP-完全问题的多项式时间算法、密码学假设的经验成功，以及可核对的专家民调。这些都不构成数学证明。
      holders:
      - name: Stephen A. Cook
        identity: 多伦多大学大学教授（University Professor）；1971 年 NP-完全性论文作者；Clay 千禧年问题官方陈述作者；1982 年 ACM 图灵奖得主。[1][9][12]
      - name: Scott Aaronson
        identity: 在其 2017 年长篇综述中把 P ≠ NP 列为中心猜想（Conjecture 1），并概括说「大多数计算机科学家猜想 P ≠ NP」。撰写该综述时对问题现状作了系统梳理。[2]
      - name: Gasarch 民调中的多数受访者
        identity: William I. Gasarch（马里兰大学帕克分校计算机系）于 2002、2012、2019 年三次向理论计算机科学工作者发起民意调查，并在 SIGACT News
          复杂性专栏发表。[3][4][5]
      argument: 若 P = NP，则一千多个已知的 NP-完全问题都将有多项式时间算法，并且当代许多依赖「求逆困难」的密码学假设也会失败。Cook 指出，工业界与算法研究者已花费数十年寻找这类算法而未获成功；他还举例：若
        3-SAT 存在 n² 时间算法，则可用于在数分钟内分解 200 位整数。[1] 在经验上，这被当作支持 P ≠ NP 的间接理由。民调给出了可核对的意见分布：2002 年 100 名受访者中，61
        人认为 P ≠ NP，9 人认为 P = NP，22 人未发表意见；[3] 2012 年 152 人中，126 人（83%）对 12 人（9%）；[4] 2019 年 124 人中，109
        人（88%）对 15 人（12%），其余选项（独立于 ZFC、不知道、不关心等）为 0。[5] 2012 年，Gasarch 把图灵奖、菲尔兹奖、Nevanlinna 奖、Gödel 奖、Kanellakis
        奖、Knuth 奖得主或美国国家科学院/工程院院士中的受访者单列，21 人里 17 人（81%）认为 P ≠ NP（其中 2 人声明持有较弱），2 人（9%）认为 P = NP，2 人（9%）表示不知道。[4]
        2019 年他把「已知曾认真思考过该问题」的受访者称为专家，并报告专家中约 99% 答 NO、1% 答 YES，其余受访者（他称为 masses）约为 87% 对 13%；他同时写明文中百分比是近似的，且未给出这一专家分组的样本量。[5]
      quotes:
      - text: Most complexity theorists believe that P ≠ NP.
        text_zh: 大多数复杂性理论家相信 P ≠ NP。
        attribution: Stephen Cook，Clay 官方问题陈述
        locator: 第 7 页
        ref: 1
      - text: 'Just as Hilbert’s question turned out to have a negative answer, so too in this case, most
          computer scientists conjecture that P ≠ NP: that there exist rapidly checkable problems that
          aren’t rapidly solvable, and for which brute-force search is close to the best we can do.'
        text_zh: 正如希尔伯特的问题最终得到了否定答案，在这个问题上，大多数计算机科学家也猜想 P ≠ NP：存在可被迅速核验、却不能被迅速求解的问题，对它们而言穷举搜索已接近我们所能做到的最好程度。
        attribution: Scott Aaronson，综述《P ≟ NP》
        locator: 第 24 页
        ref: 2
    - position: P = NP，或认为「存在算法」不必等于「我们已掌握算法」
      consensus_role: 少数意见
      evidence:
        label: 少数派陈述与概念澄清，缺乏被接受的构造
        note: 民调中始终有约 9%–12% 的受访者选择 P = NP，但迄今没有被同行接受的多项式时间算法或非构造存在性证明。
      holders:
      - name: Gasarch 民调中的少数受访者
        identity: 2002 年为 9/100（9%），2012 年为 12/152（9%），2019 年为 15/124（12%）。Gasarch 在 2002 年写道，这 9 人中大多数是界内受尊重的成员，且都承认自己属于少数；少数人甚至说选择这一答案带有故意唱反调的成分。[3][4][5]
      - name: Donald E. Knuth
        identity: 斯坦福大学《计算机程序设计艺术》作者；1974 年 ACM 图灵奖得主。[13] 此处仅依据其在 2019 年 Gasarch 民调中被全文刊出的评论，讨论「存在算法」与「知道算法」的区分；不把一本未能打开原文的
          2014 年访谈书作为其立场来源。
      argument: Cook 在官方陈述中单独讨论了 P = NP 如何可能被证明：最直接的途径是给出 3-SAT 或其他 NP-完全问题的多项式时间算法，但历史上已出现许多错误证明。他也指出一种理论上的可能性：某类非构造论证或许能在不给出可行算法的情况下证明
        P = NP（他联想到 Robertson–Seymour 图子式理论中「属于 P、但常数巨大到不实用」的算法）。[1] 与此相关，Knuth 在 2019 年民调中强调：P 对 NP 问的是多项式时间算法是否存在，而不是我们是否已经知道如何写出它；他举的例子是，人们已经知道任一给定的子式封闭图族都存在多项式时间成员判定算法，但除少数具体族外，并不知道怎样真正去判定。[5]
        此外，Lane A. Hemaspaandra 在 2012 年专栏导言中提醒：共同体的直觉曾经错过 NL = coNL、IP = PSPACE 等后来被证明的结果，因此「多数人这样想」并不能保证方向正确。[4]
        这一提醒并不等于主张 P = NP，而是限制我们对民调的解读。
      quotes:
      - text: I can’t wait for people to realize that P=?NP is only a question about the existence of
          a polynomial time algorithm, not about the knowledge of one. We already know, for example, that
          there exists a polynomial time algorithm to decide membership in any given minor-closed graph
          family; but we don’t know how to really decide it, except for a few actual families.
        text_zh: 我迫不及待地希望人们意识到：P=?NP 只是在问多项式时间算法是否存在，而不是我们是否已经知道这样一个算法。例如，我们已知：对任何给定的子式封闭图族，都存在判定其成员资格的多项式时间算法；但除了少数具体的族以外，我们并不知道怎样真正去判定。
        attribution: Donald Knuth，载于 Gasarch 2019 年民调
        locator: 作者 PDF 第 22 页
        ref: 5
    - position: 即便 P ≠ NP 为真，现有技术族也被证明不够用
      consensus_role: 已证明的元结果（障碍定理）
      evidence:
        label: 已发表的定理，条件明确
        note: 相对化、自然证明、代数化都是定理，不是猜想。它们限制的是「哪一类证明技术不可能成功」，并不直接推出 P ≠ NP。自然证明的障碍依赖于伪随机生成器等硬度假设。[1][6][7]
      holders:
      - name: Theodore Baker、John Gill、Robert Solovay
        identity: 1975 年论文《Relativizations of the P=?NP question》的作者，该文给出了相对化障碍的经典表述。[8]
      - name: Alexander A. Razborov、Steven Rudich
        identity: 1994/1997 年论文《Natural proofs》的作者，形式化了「自然证明」障碍。[7]
      - name: Scott Aaronson、Avi Wigderson
        identity: Aaronson 撰写该文时在 MIT；Wigderson 当时在普林斯顿高等研究院（IAS）。两人在 2008/2009 年提出代数化（algebrization）障碍。Wigderson
          于 2021 年与 László Lovász 共同获得阿贝尔奖。[6][14]
      argument: Cook 在官方陈述中已经总结了前两道障碍：Baker–Gill–Solovay 表明存在使 P = NP 成立的预言机，从而提示「对角化加归约」这类会相对化的方法不足以分离这两个类；Razborov–Rudich
        则把当时失败的电路下界努力归为自然证明，并指出在存在强伪随机生成器的假设下，这类证明无法给出一般电路的超多项式下界。[1] Aaronson 与 Wigderson 进一步证明：IP =
        PSPACE 等已打破相对化的算术化结果，在代数预言机下仍然成立，但 P 对 NP 等核心分离并不代数化，因此还需要非代数化技术。[6] Aaronson 在 2017 年综述中把这三道障碍作为理解「为什么仍然没有证明」的主线。[2]
        这些结果共同说明：把「尚未证明」仅仅解释成「大家还不够努力」，是不准确的——对若干自然的技术族，不可能性已经被证明。
      quotes:
      - text: However, in [3] it was shown that there is an oracle set A relative to which P = NP, suggesting
          that diagonalization with reduction cannot be used to separate these two classes.
        text_zh: 然而，文献 [3]（即 Baker–Gill–Solovay, 1975）表明，存在一个预言机集合 A，相对它有 P = NP，这提示对角化加归约不能用来分离这两个类。
        attribution: Stephen Cook，Clay 官方问题陈述
        locator: 第 8 页
        ref: 1
      - text: 'Any proof of P ≠ NP will have to overcome two barriers: relativization and natural proofs.
          Yet over the last decade, we have seen circuit lower bounds (for example, that PP does not have
          linear-size circuits) that overcome both barriers simultaneously. So the question arises of
          whether there is a third barrier to progress on the central questions in complexity theory.
          In this paper we present such a barrier, which we call algebraic relativization or algebrization.'
        text_zh: 任何 P ≠ NP 的证明都必须越过两道障碍：相对化与自然证明。然而在过去十年里，我们已经看到（例如「PP 没有线性规模电路」这类）同时越过这两道障碍的电路下界。于是问题变成：在复杂性理论的中心问题上，是否还存在第三道障碍。本文提出这样一道障碍，我们称之为代数相对化或代数化。
        attribution: 'Scott Aaronson 与 Avi Wigderson，《Algebrization: A New Barrier in Complexity Theory》'
        locator: 摘要，作者 PDF 第 1 页
        ref: 6
    open_parts: 第一，问题本身尚未解决：没有被接受的 P = NP 算法或证明，也没有被接受的 P ≠ NP 证明。[1][2] 第二，即使将来证明了 P ≠ NP，仍会留下大量细问题，例如哪些自然问题（如图同构、因数分解）处于
      P 与 NP-完全之间、近似与平均情况复杂度如何、以及电路复杂度的具体下界。[1][2] 第三，障碍定理并不关闭所有道路，只是排除了某些技术族；是否存在同时绕过相对化、自然证明与代数化的可扩展方法，仍是开放的研究纲领。[2][6]
      第四，民调不是随机抽样，2019 年还改用了问卷系统，与前两次的开放文本回收方式不同，跨年百分比不宜解释为严格的时间序列估计；专家分组的样本量也未给出。[5] 第五，即便 P ≠ NP，仍可能每个带「合理」输入分布的
      NP 问题在平均情况下可多项式时间求解——Cook 把这列为与经典问题相关、但并不相同的平均情况版本。[1]
