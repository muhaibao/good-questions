- id: 2026-11-22-biz-taiwan-semi
  date: '2026-11-22'
  category: business
  title_zh: 台湾为什么能在半导体市场占据主导地位？
  title_en: Why does Taiwan dominate the semiconductors market?
  commentary: 「主导」如果指全世界半导体的销售与设计，答案并不是台湾；如果指先进逻辑芯片的合同代工，台湾的位置又确实特殊。把价值链切清楚，这个问题才不会变成一句空的地理神话。
  source_name: Economics Stack Exchange
  source_url: https://economics.stackexchange.com/questions/53657/why-does-taiwan-dominate-the-semiconductors-market
  author: sourcream
  source_type: stackexchange
  tags:
  - 半导体
  - 代工
  - 台积电
  - 产业政策
  - 新竹科学园
  answer:
    format: scholarly
    reviewed_at: '2026-11-22'
    consensus:
      label: 台湾的「主导」主要发生在合同代工——尤其是先进逻辑制造——以及封测的部分环节，而不是整个半导体产业；对「何以是台湾」的解释，以产业政策、技术转移、科学园集群与纯代工模式的历史叙事为主，并非已经识别出单一因果因子的计量结论
      note: >-
        以总部所在地计的全球半导体销售额，并不是台湾领先。美国半导体产业协会 2024 年《Factbook》依据 WSTS 等来源估计：2023 年美国总部企业占全球销售额 50.2%，台湾为 7.0%。[1]
        真正高度集中的是代工。OECD 根据企业财务报表估计，2018 年纯代工市场中台积电约占 54%，联电、力晶、世界先进等台湾企业合计约占估计全球代工市场的 66%。[4]
        美国国会研究服务处 2025 年 3 月 11 日的简报，依据台湾半导体产业协会、按 2023 年产值口径，给出台湾在全球设计、代工、封测中的份额分别为 19.3%、75.2% 与 50.4%，并称全球约 90% 的先进半导体芯片生产位于台湾、由台积电完成；该简报未在可见正文中为「先进」给出明确的制程切分，本文只按原文转述。[3]
        较早的 CRS 报告则引用 SEMI 等来源：2020 年全球逻辑芯片制造产能约 35% 位于台湾、约 13% 位于美国；并写到 2022 年台积电拥有全球逻辑芯片代工产能约一半，且截至 2023 年 2 月，能够制造当时最先进的 5 纳米与 3 纳米逻辑制程的代工厂是台积电与三星。[2]
        设备、电子设计自动化（EDA）、存储与部分设计环节由美国、韩国、日本与欧洲等分担，不能说成台湾包办。[2][5][1]
        关于「为何是台湾」，本次打开的是历史与政策研究以及官方/准官方统计，不是随机试验或因果识别论文。
    summary: >-
      原问题的刺激来自「世界对台湾半导体高度依赖」这类报道，但「主导半导体市场」需要先问：主导的是哪一段价值链。若把半导体看成从研发、设计、制造、封测到设备与材料的完整链条，台湾并不在所有环节领先。[1][2][5]
      按企业总部分配的全球销售额，2023 年美国总部厂商约占一半，台湾约 7%。[1] 台湾突出的位置，是合同代工（foundry）以及与之相连的先进逻辑制造，并在封测中也占有很大份额。CRS 依据台湾半导体产业协会、按 2023 年产值口径，给出台湾在全球代工中占 75.2%、封测占 50.4%、设计占 19.3%。[3] OECD 对更早一年份的估计是：2018 年台积电独占估计全球纯代工市场的 54%，台湾多家纯代工厂合计约占 66%。[4] 先进逻辑的生产能力也高度集中：CSET 在 2021 年的简报中写道，总部在美国（英特尔）、台湾（台积电）与韩国（三星）的三家企业控制了几乎全部 ≤10 纳米先进逻辑晶圆产能。[5]
      这一结构是历史地形成的，而不是「小岛天生适合造芯片」。1970 年代中期，台湾当局经由工业技术研究院（工研院）引进美国 RCA 的集成电路技术，消化后再转向民间；联华电子在 1979 年作为工研院技术与人员转移的结果成立，并成为首家申请进入新竹科学工业园区的公司；园区本身于 1980 年设立。[6][7] 1987 年，工研院完成超大规模集成电路（VLSI）实验室并衍生出台积电，其唯一目标是为集成电路设计公司提供代工服务。[6] Fuller 把这种「只制造、不设计自有芯片」的纯代工模式，写成台湾与海外设计客户之间的相互依赖，而不是技术封闭式的国产化。[7]
      因此，比较准确的说法是：台湾主导的是先进逻辑合同制造及部分封测，而不是存储、设备或整条半导体价值链；至于「为什么是台湾而不是别处」，现有打开的文献提供的是可核对的历史机制（技术引进、衍生公司、科学园、代工模式、回报与国际客户），而不是已经排除其他可能性的因果估计。
    definitions:
    - term: 纯代工 / 合同代工（pure-play foundry）
      text: 专门为其他公司制造其设计的芯片、自己不销售自有设计产品的晶圆厂。OECD 把它与 IDM（集设计、制造于一身的整合元件制造商）以及无晶圆厂（fabless）设计公司相对照；台积电是这一模式的开创者与最大厂商之一。[4][7]
    - term: 逻辑芯片与存储芯片
      text: 逻辑芯片执行运算与控制（如处理器），存储芯片用于数据保存。CRS 指出，逻辑是 2021 年全球半导体销售中最大的产品类别；存储等许多产品仍主要由 IDM 生产，不能把逻辑代工的格局说成整个半导体。[2]
    - term: 先进制程节点（process node）
      text: 产业用来标记逻辑制造世代的标签（如 5 纳米、3 纳米），数字越小通常表示更先进的制造能力；CRS 特别说明，这些标签并不表示芯片的物理尺寸。[2] 「先进」在不同来源中的切分并不完全相同（CSET 在一处使用 ≤10 纳米），引用份额时必须连同年份与口径一起给出。[5]
    milestones:
    - year: '1975'
      name: 经工研院引进 RCA 技术
      explanation: Chang 与 Hsu 写道，1975 年政府策略选定、由工研院引进美国 RCA 的集成电路技术，经消化改进后再转移给民间，以启动台湾的集成电路产业。[6] OECD 也记述：当局于 1974 年成立电子研究所（ERSO），随后向 RCA 授权制造技术，并于 1980 年转移给联电。[4]
    - year: '1980'
      name: 新竹科学工业园区设立
      explanation: Fuller 记载，新竹科学工业园区于 1980 年成立，提供税收优惠及其他激励，并保障对集成电路产业至关重要的水、电供应；园区周边强化了清华、交大等大学的培养能力。[7] Chang 与 Hsu 记：1979 年 10 月，联电成为首家申请进入该园区的公司。[6]
    - year: '1987'
      name: 台积电衍生与纯代工模式
      explanation: Chang 与 Hsu 记载，工研院在 1987 年通过技术转移完成 VLSI 实验室，并衍生出台积电，其唯一目标是为 IC 设计公司提供代工；约 150 名技术支持人员从工研院转入，实验室则租给台积电作为代工厂。[6] Fuller 将与飞利浦合作成立的台积电，视为纯代工模式的开端。[7]
    views:
    - position: 「主导」首先是价值链上的分工事实：台湾突出在合同代工与先进逻辑制造以及部分封测，而不是全球半导体销售总额，也不包办设备、EDA 或存储
      consensus_role: 对可核对统计的描述性判断，被产业协会、国会研究机构与国际组织的报告所支持；不同来源的口径与年份必须分开阅读
      evidence:
        label: 官方或准官方统计与政策简报，口径并不统一
        note: SIA 的 7.0% 与 50.2% 是 2023 年按总部所在地计的销售额份额，来源为 WSTS、Gartner、Omdia 与 SIA 估计，不能读成「制造产能位于何地」。[1] OECD 的 54% 是 2018 年纯代工营业收入的估计市场份额，资料来自公司财务报表与网站，估计全球市场规模为 628.72 亿美元。[4] CRS 2025 年简报的 75.2% 等数字依据台湾半导体产业协会、按 2023 年产值；该简报中「约 90% 的全球先进半导体芯片生产」一语未在可见正文中定义「先进」，本文不作加码解释。[3] CRS 2023 年报告中的 35%（2020 年逻辑产能区位）引自 SEMI World Fab Forecast；「台积电拥有全球逻辑代工产能约一半」则转述 TrendForce，本次未打开 TrendForce 原文，只按 CRS 的转述记录。[2] 本次未能打开台积电年报或 Form 20-F（官方站点返回 403），故不使用该公司自行公布、但未经本次核对的份额数字。
      holders:
      - name: Semiconductor Industry Association
        identity: 美国半导体产业协会；《2024 Factbook》汇整 WSTS 等数据，给出 2023 年按总部所在地计的全球销售额份额。[1]
      - name: Congressional Research Service（Yong W. Kwon、Emily G. Blevins、Karen M. Sutter 等）
        identity: 美国国会研究服务处。R47508（2023 年 4 月 19 日）讨论逻辑产能区位与先进制程；IG10073（2025 年 3 月 11 日，Sutter）依据台湾半导体产业协会给出 2023 年产值口径的环节份额。[2][3]
      - name: OECD
        identity: '《Measuring distortions in international markets: The semiconductor value chain》（OECD Trade Policy Papers No. 234, 2019）作者机构；表 1.2 估计 2018 年纯代工市场结构。[4]'
      argument: >-
        若「主导半导体市场」被理解成「台湾企业拿走了全球大部分芯片销售收入」，与已打开的协会数据不符：2023 年美国总部企业约占全球销售额 50.2%，韩国 13.8%，欧盟 12.7%，日本 9%，中国 7.2%，台湾 7.0%。[1] 台湾的特殊性出现在制造环节的合同代工。OECD 写道，由于资本密集、必须把巨额资本开支摊到很大产量上，并跟上快速的技术更新，代工企业已集中到亚洲少数大型单位；2018 年台积电独占估计全球代工市场的 54%，前十大合计约 87%，其中联电 8%、力晶 2%、世界先进 2%，均为台湾企业。[4]
        更新的、但口径不同的数字来自 CRS 2025 年简报：按 2023 年产值，台湾在全球代工中占 75.2%，封测占 50.4%，设计占 19.3%。[3] 该简报还写：「全球约 90% 的先进半导体芯片生产位于台湾，并由台湾领先的代工企业台积电完成。」[3] 较早的 CRS 报告则从产能区位与制程能力补充：2020 年全球逻辑制造产能约 35% 位于台湾；截至 2023 年 2 月，能够制造当时最先进的 5 纳米与 3 纳米逻辑技术的代工厂是台积电与三星，三星总部在韩国。[2] CSET 也强调美国在研发与设计上的优势，以及荷兰等在光刻设备上的关键地位，同时写到台湾在最先进制造与封测上占据主导。[5]
        把这些数字放在一起，结论并不是「台湾包办了半导体」，而是：世界对台湾的依赖，高度集中在先进逻辑的合同制造（以及相当比例的封测），而设计、设备、存储和总体销售额是另一种全球分布。
      quotes:
      - text: >-
          Today, U.S.-based firms have the largest market share with 50.2 percent.
          Other countries’ industries have between 7 and 15 percent global market
          share.
        text_zh: 今天，美国总部企业拥有最大的市场份额，为 50.2%。其他国家的产业拥有 7% 到 15% 的全球市场份额。
        attribution: Semiconductor Industry Association，2024 Factbook
        locator: 'Section 1: Industry Overview，该手册第 3 页；同页图中给出 2023 年台湾 7.0%、韩国 13.8%、欧盟 12.7%、日本 9%、中国 7.2%'
        ref: 1
      - text: >-
          TSMC (Chinese Taipei) alone accounted for a staggering 54% of the estimated
          global foundry market in 2018 while the top 10 firms together made up as
          much as 87% of global sales.
        text_zh: 仅台积电（中华台北）就占 2018 年估计全球代工市场的 54%，而前十大企业合计占全球销售额高达 87%。
        attribution: 'OECD，Measuring distortions in international markets: The semiconductor value chain'
        locator: 第 21 页，表 1.2 之前的段落；表中并列联电 8%、力晶 2%、世界先进 2%
        ref: 4
      - text: About 90% of global advanced semiconductor chip production is based in
          Taiwan and produced by Taiwan's leading foundry company—Taiwan Semiconductor
          Manufacturing Company Ltd. (TSMC).
        text_zh: 全球约 90% 的先进半导体芯片生产位于台湾，并由台湾领先的代工企业——台湾积体电路制造股份有限公司（台积电）完成。
        attribution: Karen M. Sutter（Congressional Research Service），Taiwan’s Role in Global
          Semiconductor Supply Chains
        locator: IG10073（2025 年 3 月 11 日）正文段落；同页图表注明资料来自台湾半导体产业协会，按 2023 年产值，并给出代工 75.2% 等份额。该句未在可见正文中定义「先进」
        ref: 3
    - position: 台湾之所以走到这一位置，与当局主导的技术引进、工研院衍生公司以及新竹科学园的集群安排密切相关
      consensus_role: 产业史与发展研究中的标准叙述，对关键事件的记载较为一致，但这些研究提供的是历史机制，而不是可分离的因果效应
      evidence:
        label: 同行评议产业研究、政策工作论文与国际组织对既有研究的综述
        note: Chang 与 Hsu（1998）根据工研院与政府项目的文献，把台湾集成电路发展写成政府、研究机构与产业在技术选择、研发、转移上的互动，属于案例研究。[6] Fuller（2002）是麻省理工学院产业绩效中心的工作论文，主要依据制度叙述与访谈，不是计量识别。[7] OECD 对 ERSO、RCA、联电与台积电的简述，明确引用了 Tung（2001）等文献；本次未能打开 Tung 原文，故只按 OECD 已写出的句子转述，不增加其论文中的其他发现。[4] 这些来源在「发生过技术引进与衍生」上相互支持，但不能据此断言：若没有某项政策，就一定不会出现代工主导。
      holders:
      - name: Pao-Long Chang、Chiung-Wen Hsu
        identity: Chang 当时任职于国立交通大学管理科学研究所（台北）；Hsu 当时任职于工业技术研究院企划部门（新竹）。《The Development Strategies for Taiwan’s Semiconductor Industry》，IEEE Transactions on Engineering Management, 1998。[6]
      - name: Douglas B. Fuller
        identity: '麻省理工学院产业绩效中心工作论文《Globalization for Nation Building: Industrial Policy for High-Technology Products in Taiwan》（MIT-IPC-02-002, 2002）作者。[7]'
      argument: >-
        Chang 与 Hsu 把台湾集成电路的起步，写成一次有意识的技术引进：1975 年，政府策略选定的美国 RCA 集成电路技术由工研院引进，经消化改进后再转移给民间，以启动这一产业。[6] 联电是工研院技术与人员转移计划所产生的第一家集成电路制造商；1979 年 10 月，它成为首家申请进入科学工业园区的公司，并于 1982 年开始试产。[6]
        Fuller 记载，新竹科学工业园区于 1980 年成立，提供税收优惠和其他激励，并保障对集成电路产业至关重要的水电供应；园区周边则加强了当地大学的培养能力。[7] OECD 的综述与这一时间线相符：1974 年成立的 ERSO 向 RCA 授权制造技术，1980 年转移给联电；台积电也受益于飞利浦的技术，以及与英特尔、摩托罗拉等外国客户的代工协议。[4]
        1987 年这一步把制造能力从「再造一家 IDM」转向「专门为设计公司代工」：工研院完成 VLSI 实验室并衍生出台积电，约 150 名技术人员转入，实验室租给台积电作为代工厂，而台积电的唯一目标是提供代工服务。[6] 随后大量 ASIC 设计公司出现，到 1990 年已有 50 余家。[6] 政策、研究机构、园区与衍生公司在这些叙述中是缠在一起的，不宜把其中任何一项单独说成充分原因。
      quotes:
      - text: >-
          As Chang et al. [5] described in detail, in 1975 IC technology from the
          U.S.-based company RCA, strategically selected by the government, was introduced
          by the Industrial Technology Research Institute (ITRI) and then transferred
          to the private industrial sector, after being assimilated and improved,
          to initiate the IC industry.
        text_zh: 如 Chang 等人所详述，1975 年，政府策略选定的美国 RCA 公司的集成电路技术，由工业技术研究院（工研院）引进，在消化改进之后再转移给民间产业部门，以启动集成电路产业。
        attribution: Pao-Long Chang 与 Chiung-Wen Hsu，The Development Strategies for Taiwan’s Semiconductor
          Industry
        locator: 第 349 页，引言部分
        ref: 6
      - text: >-
          ITRI completed a VLSI laboratory via technology transfer activity in 1987
          and spun off the Taiwan Semiconductor Manufacturing Company (TSMC), whose
          only goal was to provide foundry services to IC design companies. Around
          150 technical support personnel were transferred to TSMC from ITRI, and
          the VLSI laboratory was rented to TSMC as a foundry.
        text_zh: 工研院在 1987 年通过技术转移活动完成了超大规模集成电路实验室，并衍生出台湾积体电路制造公司（台积电），其唯一目标是为集成电路设计公司提供代工服务。约 150 名技术支持人员从工研院转入台积电，该 VLSI 实验室则租给台积电作为代工厂。
        attribution: Pao-Long Chang 与 Chiung-Wen Hsu，The Development Strategies for Taiwan’s Semiconductor
          Industry
        locator: 第 351 页
        ref: 6
    - position: 纯代工模式是一项组织创新：台积电不与客户在设计上竞争，从而与无晶圆厂设计公司形成相互依赖，并使资本密集的制造能力能够服务全球订单
      consensus_role: 对「何以出现并巩固代工主导」的重要机制解释，常与政策史叙述一并出现
      evidence:
        label: 历史与产业组织叙述，辅以对资本密集与市场集中的描述
        note: Fuller 对代工模式的解释主要来自产业史与访谈，并承认该模式最初能否成立并不清楚，因为制造所需的知识当时仍非完全可编码。[7] OECD 把代工集中解释为高资本开支必须摊到大产量、并频繁更新设备的结果，同时引用 Lewis（2019）关于一座现代晶圆厂耗资 70 亿至 140 亿美元、前沿（如 5 纳米）甚至可超过 200 亿美元的说法；本次未打开 Lewis 原文，只记录 OECD 的转述。[4] 这些机制说明「为什么代工会高度集中」，以及「为什么纯代工会吸引设计客户」，但不能单独解释「集中点为何在台湾」——后一问题仍要回到技术引进与衍生公司的历史。[6][7]
      holders:
      - name: Douglas B. Fuller
        identity: MIT-IPC-02-002（2002）作者；文中把台积电的纯代工模式写成对当时仍以 IDM 为主的产业组织的创新。[7]
      - name: OECD
        identity: Trade Policy Paper No. 234 对纯代工模式与代工市场集中度的综述。[4]
      argument: >-
        Fuller 写道，与飞利浦合作成立台积电，标志着代工模式的开端：一家企业只制造而不设计自有芯片。在台湾发展起来的这种模式，建立在代工服务的战略性供给者与客户（其中许多是外国公司）之间的相互依赖之上。[7] 他把它对照于当时仍占主导的 IDM 模式。1980 年代出现了一些无晶圆厂设计公司，但这些公司在高质量、按需取得制造方面仍有困难；时任工研院院长、即将领导台积电的张忠谋，提议创立一种只专注于集成电路制造的新企业，以服务不断增长的设计公司市场。[7]
        这一安排的经济含义是：设计公司不必自建价值极高的晶圆厂，而代工厂则必须持续从全球客户那里获得足够订单来填满产能。OECD 从另一侧补充了为何这类制造会集中在少数几家大型单位：晶圆厂高度资本密集，需要把可观的资本开支分摊到很大的生产量上并保持高良率，再加上技术更新迅速、设备需要定期更换。[4] 台湾的特殊性在于，它把这种组织创新放在已经由工研院与科学园准备好的制造能力之上，并与海外设计客户形成互赖，而不是走「大财阀式 IDM」的道路。[4][7]
        这也有助于理解原问题里「更大的国家为何无法轻易复制」：复制的不只是一座工厂，而是与全球设计需求绑定的制造能力、良率与客户信任；同时，美国、韩国、日本与欧洲在设计、存储或设备上的既有位置，也意味着「竞争」并不发生在同一段价值链上。[5][1]
      quotes:
      - text: >-
          The formation of TSMC with cooperation from Philips marks the beginning
          of the foundry model, an industrial relationship in which a firm fabricates
          but does not design its own chips. The foundry model that has flourished
          in Taiwan is based on interdependence between the strategic supplier of
          foundry services and the customers, many of whom are foreign firms.
        text_zh: 与飞利浦合作成立台积电，标志着代工模式的开端：这是一种企业只制造而不设计自有芯片的产业关系。在台湾兴盛起来的代工模式，建立在代工服务的战略性供给者与客户——其中许多是外国公司——之间的相互依赖之上。
        attribution: Douglas B. Fuller，Globalization for Nation Building
        locator: 「The Rise of the Pureplay Foundry Model」一节开篇，MIT-IPC-02-002
        ref: 7
      - text: >-
          Taiwan’s IC industry has created true interdependence between its leading
          strategic suppliers and their international customers. The Taiwanese foundries
          and their foreign chip-designing clients are equal partners. Each depends
          on critical technologies that the other possesses.
        text_zh: 台湾的集成电路产业，在其领先的战略性供给者与国际客户之间创造了真正的相互依赖。台湾的代工厂与其外国芯片设计客户是平等的伙伴。每一方都依赖于另一方所拥有的关键技术。
        attribution: Douglas B. Fuller，Globalization for Nation Building
        locator: 工作论文开篇对集成电路部门的对照性判断
        ref: 7
    open_parts: >-
      已打开的文献能够比较有把握地描述「主导发生在哪一段价值链」以及「哪些制度与组织安排曾经出现」，但不能可靠地回答一个反事实问题：若没有工研院、新竹园区或张忠谋，代工主导是否仍会在台湾或别处出现。历史叙事与政策研究在这里提供机制，而不是识别策略。[6][7]
      份额数字随口径剧烈变化：总部销售额、产值、产能区位、纯代工收入、以及「先进」如何定义，会给出不同图像；把 2018 年的 54%、2020 年的产能区位与 2023 年的 75.2% 直接连成一条趋势，并不妥当。[1][2][3][4]
      各国正在以补贴与出口管制重塑产能地理，CRS 已记录台积电等在美国等地的新厂计划；「今天的集中」不是对未来十年的冻结。[2][3] 存储（韩国等）、设备（美国、日本、荷兰等）与设计（美国等）的格局，若被忽略，就会把「台湾主导半导体」说得过满。[1][5]
