- id: 2026-11-23-phil-cogito
  date: '2026-11-23'
  category: philosophy
  title_zh: 「我思故我在」是假的吗？
  title_en: Is 'cogito ergo sum' false?
  commentary: 提问者想用它挡住「我们什么都不能真正知道」。可是这句口号有几种原句形式，关键争执也不全在真假，而在「我」是否已被预先放入，以及它究竟是推论还是直接的洞见。
  source_name: Philosophy Stack Exchange
  source_url: https://philosophy.stackexchange.com/questions/70/is-cogito-ergo-sum-false
  author: Jez
  source_type: stackexchange
  tags:
  - 笛卡尔
  - 我思
  - 怀疑论
  - 自我
  answer:
    format: scholarly
    reviewed_at: '2026-11-23'
    consensus:
      label: Descartes 用来对抗普遍怀疑的这一洞见，很少被径直写成一句普通的假命题；但对其逻辑形式、以及「我」是否已被预设，存在长期而严肃的争议，并没有单一被普遍接受的裁定
      note: >-
        原问题的直觉是：无论我如何被欺骗，只要我正在考虑这件事，我就必须存在；因而「cogito ergo sum」似乎不可能为假。[1]
        Descartes 在 1637 年《谈谈方法》第四部分给出法语原句「je pense, donc je suis」，并把它当作所寻求的哲学的第一原理。[2]
        在 1641 年《第一哲学沉思集》第二沉思的拉丁文本中，相应的确定命题是「Ego sum, ego existo」，其必然为真，取决于它每次被我提出或在心中构想；这里并没有写成「cogito, ergo sum」式的「因此」。[3]
        Lichtenberg 在《废书》K 76 中主张：只应说「在思考」（Es denkt），正如只说「在打闪」（es blitzt）；把 cogito 译成「我思」，已经太多。[4]
        Stanford Encyclopedia 条目指出，关于 Descartes 究竟把 cogito 当作直觉还是推论，存在持续争论；该条目并转述 Hintikka 1962 年的著名非推论、行事性解读，以及 Russell 对「我」这一语法主语的异议。本次打开的 Hintikka 原文扫描件 OCR 过差、且似非完整抽印，故不引用其原句，只按 SEP 的转述标明立场。[5]
    summary: >-
      原题来自一种常见的怀疑论挑战：「我们不能真正知道任何事情」。提问者承认这对绝大多数事情或许成立，但看不出「我思故我在」怎么可能为假——无论我是什么、如何被欺骗或陷入错觉，我必须存在，才能正在以某种方式考虑这件事。[1]
      先应分清 Descartes 自己的几种表述。法语《谈谈方法》第四部分写的是：当他愿意设想一切皆假时，那个正在如此思考的「我」必须是某种东西；「je pense, donc je suis」这一真理如此坚实确定，连怀疑论者最夸张的假定也无法动摇，因而可以毫无顾忌地接受为他所寻求的哲学的第一原理。[2] 英译 Veitch 本把这句话译为 “I think, therefore I am”，但「因此」出现在《谈谈方法》里，并不等于 Descartes 在所有文本中都把它写成三段论。
      拉丁文第二沉思的写法明显不同。在假设存在一个极有能力、极狡猾的欺骗者之后，Descartes 说：只要我受骗，我就也存在；欺骗者无论力量多大，只要我思想自己是某种东西，他就永远不能使我化为虚无。经过充分考量，必须认定这一命题——「Ego sum, ego existo」（我在，我存在）——每当由我提出或在心中构想时，必然为真。[3] 紧接着他又写：我是、我存在，这是确定的；但多久为真？只要我在思想（quandiu cogito）；若我停止一切思想，也许会立即整个不再存在。此时可承认的只有必然为真者，所以他精确地说自己只是一个思想的东西（res cogitans）。[3] 标准英语 Veitch 译本把关键句译为：必须坚持，这一命题（pronunciatum）“I am, I exist” 每次被我表达或在心中构想时都必然为真。[6]
      因此，若把问题理解成「当思想正在发生时，能否连贯地否定有某种思想活动存在」，Descartes 的文本给出的是一种极强的确定性主张，而不是一句随便可以判为假的经验概括。真正的批评传统，大多不是说「其实你不存在」，而是说：从「有思想发生」到「有一个统一的、作为实体的我存在」，「我」可能已经被偷运进来。
      Lichtenberg 把这一点说得很干脆。在《废书》K 76，他先写：我们只知道自己的感觉、表象和思想的存在；然后主张，应当说「在思考」，正如说「在打闪」。把 cogito 译成「我思」，已经太多；设定、假定一个「我」，只是实践上的需要。[4]
      当代综述同样把争论的中心放在形式上。SEP 的 Descartes 知识论条目写明：最重要、仍在进行的辩论之一，是 Descartes 究竟把 cogito 当作直觉（大致即自明），还是当作推论。该条目介绍 Hintikka 的影响性主张：从「我思」到「我在」并不是逻辑推导，「我不存在」在逻辑上并不自相矛盾，关键在于思想这一行事本身具有存在上的不融贯——我不能既思想这句话又相信它为真。[5] 本次未能以可核对的全文引用 Hintikka 原句，因而只把这一解读记为 SEP 所概括的重要立场，而不写成已经在本轮核对过的原书结论。
      回到「它是假的吗」：就 Descartes 自己要保住的那一点——正在思想时，不能连贯地主张「什么也没有」——它很难被当成一句普通的假话。但若把口号理解成一个从「有思想」推出「一个作为实体的我存在」的形式推论，则其有效性从 Lichtenberg 到后来的讨论都一直受到质疑。假不假，取决于你把哪一句话当成「cogito ergo sum」。
    definitions:
    - term: je pense, donc je suis / cogito, ergo sum
      text: Descartes 在《谈谈方法》第四部分写下的法语第一原理，字面为「我思想，所以我存在」。后来广为流传的拉丁口号 cogito, ergo sum 与此对应；但在《第一哲学沉思集》第二沉思的拉丁文本中，他强调的命题是「Ego sum, ego existo」，并不写成带 ergo 的推论式。[2][3]
    - term: Ego sum, ego existo
      text: 第二沉思中的确定命题：「我在，我存在」。其必然为真，被明确限制在「每当由我提出或在心中构想」的场合。[3] Veitch 英译作 “I am, I exist”。[6]
    - term: 「在思考」（Es denkt）
      text: Lichtenberg 的批评性提法：正如天气上只说「在打闪」，对思想也应说「在思考」，而不应已经把一个「我」放进前提里；把 cogito 译成「我思」已经太多，「我」的设定是实践需要。[4]
    milestones:
    - year: '1637'
      name: 《谈谈方法》写下 je pense, donc je suis
      explanation: Descartes 在第四部分把这一真理当作所寻求的哲学的第一原理，并强调连怀疑论者最夸张的假定也无法动摇它。[2]
    - year: '1641'
      name: 第二沉思以 Ego sum, ego existo 重述确定性
      explanation: 拉丁文《第一哲学沉思集》把确定命题写成「我在，我存在」，其真依赖于每次被提出或构想，并进而把自我精确地规定为思想的东西。[3]
    - year: '18 世纪（Sudelbuch K）'
      name: Lichtenberg 提出「应说：在思考」
      explanation: 《废书》K 76 主张 cogito 一旦译成「我思」就已经过多，设定「我」只是实践需要。[4] 条目编号据 Lichtenberg-Gesellschaft 公布的选录。
    views:
    - position: 在普遍怀疑之后，仍可确定：当我思想时，我存在；这不是一条普通的经验概括，而是每当被提出或构想时便必然为真的第一原理
      consensus_role: Descartes 本人的立场，也是原问题直觉所依赖的那一侧
      evidence:
        label: 已打开的法语《谈谈方法》、拉丁文第二沉思及对应英译
        note: >-
          法语引文据维基文库的 Cousin 版《谈谈方法》第四部分，保留该书拼写（étoit、pouvois 等）；这是 19 世纪校勘本，不是 1637 年原刊本的逐页影印，但语句与同期公开文本一致。[2]
          拉丁引文据维基文库 Adam et Tannery 版 Meditatio II。[3]
          英译据 Veitch 译本（1853 年初版，1901 年重印）的第二沉思维基文库文本。[6]
          Descartes 后来如何在《哲学原理》等书中使用 cogito, ergo sum 这一拉丁口号，本次未打开相应原文，故不另作引用。
      holders:
      - name: René Descartes
        identity: 法国哲学家、数学家。《Discours de la méthode》（1637）与《Meditationes de prima philosophia》（1641）作者。[2][3]
      argument: >-
        原问题的核心直觉，其实非常接近《谈谈方法》里的论证步骤。Descartes 先愿意设想：感官所见、几何推理、乃至醒时的一切对象都可能与梦中幻象一样不真；但立刻注意到，当他愿意如此思想「一切皆假」时，那个正在思想的「我」必须是某种东西。「je pense, donc je suis」因此被接受为第一原理。[2]
        第二沉思把这确定点说得更精确，也更少依赖「因此」。即便有一个极强的欺骗者始终在骗他，只要他受骗，他就存在；只要他思想自己是某种东西，欺骗者就不能使他化为无。必须认定的命题是「我在，我存在」，而且是在每次提出或构想它时必然为真。[3] 他紧接着追问「我是什么」，并得出：此刻可承认的只有必然为真者，所以精确地说，他只是一个思想的东西。[3]
        按这一侧，原问题里「我必须存在才能正在考虑这件事」的直觉，正是 Descartes 要保住的那一点。若有人把「cogito ergo sum 是假的」理解成「也许此时什么思想主体都没有、却仍在思想」，则与这些文本中的确定性主张直接冲突。需要另外讨论的，是这一确定性到底证明了怎样的「我」，以及它是不是一步形式推论。
      quotes:
      - text: >-
          Mais aussitôt après je pris garde que, pendant que je voulois ainsi penser
          que tout étoit faux, il falloit nécessairement que moi qui le pensois fusse
          quelque chose ; et remarquant que cette vérité, je pense, donc je suis,
          étoit si ferme et si assurée, que toutes les plus extravagantes suppositions
          des sceptiques n’étoient pas capables de l’ébranler, je jugeai que je pouvois
          la recevoir sans scrupule pour le premier principe de la philosophie que
          je cherchois.
        text_zh: 但随后我立刻注意到，当我愿意这样思想一切皆假时，那个正在如此思想的我必须是某种东西；并且看到「我思想，所以我存在」这一真理是如此坚实、如此确定，连怀疑论者最夸张的假定也无法动摇它，我便判断，可以毫无顾忌地把它接受为我所寻求的哲学的第一原理。
        attribution: René Descartes，Discours de la méthode，第四部分（Cousin 版）
        locator: 维基文库《Discours de la méthode (éd. Cousin)/Quatrième partie》相应段落
        ref: 2
      - text: >-
          Adeo ut, omnibus satis superque pensitatis, denique statuendum sit hoc
          pronuntiatum, Ego sum, ego existo, quoties a me profertur, vel mente
          concipitur, necessario esse verum.
        text_zh: 以至于在充分且逾分地考量了一切之后，终于必须认定这一命题：我在，我存在，每当由我提出、或在心中被构想时，必然为真。
        attribution: René Descartes，Meditationes de prima philosophia，Meditatio II（Adam et Tannery 版）
        locator: 拉丁维基文库 Adam et Tannery 版 Meditatio II，欺骗者论证之后的确定命题
        ref: 3
      - text: >-
          So that it must, in fine, be maintained, all things being maturely and carefully
          considered, that this proposition (pronunciatum) I am, I exist, is necessarily
          true each time it is expressed by me, or conceived in my mind.
        text_zh: 因此，归根结底必须主张：在成熟而审慎地考量了一切之后，这一命题（pronunciatum）「我在，我存在」，每一次由我表达、或在我心中被构想时，都必然为真。
        attribution: René Descartes，Meditations on First Philosophy，Meditation II，John Veitch 英译
        locator: 维基文库英译第二沉思第 3 段（1853 年初版、1901 年重印的 Veitch 本）
        ref: 6
    - position: 即便承认「有思想发生」极为确定，「我思」中的「我」仍可能预设过多；更审慎的最小表述或许只是「在思考」，而「我思故我在」作为形式推论并不当然有效
      consensus_role: 自 Lichtenberg 以来持续存在的批评传统，也是原问题下高票回答所依赖的思路
      evidence:
        label: Lichtenberg 的一手格言，以及 SEP 对后来争论的权威综述
        note: >-
          Lichtenberg 的条目是一则札记，不是对《沉思集》的系统论文；它提出了「我」被设定的问题，但并不提供现代意义上的形式证明。[4]
          Hintikka 1962 年论文、Bernard Williams 与 Russell《西方哲学史》中的相关讨论，本次未能以可逐字核对的全文引用（Hintikka 的一份转载扫描件 OCR 严重，且像是从文集中途开始），因此不引用其原句；其行事性解读与 Russell「只应说存在思想」的异议，仅按已打开的 SEP 条目转述。[5]
          原问题下的高票回答提到 Williams 与 Kierkegaard 曾反对预设「我」，但那些文本本次也未打开，故不写成已核对的引语。
      holders:
      - name: Georg Christoph Lichtenberg
        identity: 18 世纪德国科学家与格言作者。《Sudelbücher》（废书）作者。本次引文据 Lichtenberg-Gesellschaft 公布的选录，编号为 K 76。[4]
      - name: Lex Newman（Stanford Encyclopedia of Philosophy 条目作者）
        identity: 'Stanford Encyclopedia 条目 “Descartes’ Epistemology” 的作者。该条目首次发布于 1997 年 12 月 3 日，本次打开的文本标注实质性修订于 2023 年 11 月 27 日。[5]'
      argument: >-
        原问题把「我正在考虑这件事」直接写成「我必须存在」。Lichtenberg 要截断的，正是这一步里的「我」。他并不否认我们意识到某些感觉、表象和思想；他否认的是，从这些发生着的思想里，已经可以合法地读出一个作为主语的「我」。应当说「在思考」，正如说「在打闪」；把 cogito 译成「我思」，已经太多。「我」是被设定、被假定的，而这是实践上的需要。[4]
        这一批评并不自动推出「cogito ergo sum 为假」，它推出的是：若该口号被理解成一个以「我思」为前提、以「我作为一个实体存在」为结论的推论，则前提可能已经包含了结论里最有争议的部分。SEP 条目把同类异议追溯到后来的讨论，并记载 Russell 认为「我」一词其实不合法，Descartes 的终极前提本应写成「存在着思想」；「我」在语法上方便，却并不描述一项所与。[5]
        同一条目还把另一条主要战线写成：这究竟是直觉还是推论。Hintikka 的影响性方案把过渡看成行事性的：重点不在从「我思」逻辑地推出「我在」，而在于思想这一表演使「我存在」在行事中自我证实。[5] 即便接受这一解读，它也改变了原问题的形状——要问的不再是「这句推论是真是假」，而是「在进行这一思想行动时，发生了什么」。
        因此，较审慎的回答是：把「我思故我在」当成对「正在思想却完全不存在」的拒斥，它很难被判为假；把它当成已经证明了一个统一意识主体或灵魂实体的形式推论，则批评传统从 18 世纪起就已经成立。原问题若要继续往下问，需要先说明自己用的是哪一种形式。
      quotes:
      - text: >-
          Wir kennen nur allein die Existenz unserer Empfindungen, Vorstellungen und
          Gedanken. Es denkt, sollte man sagen, so wie man sagt: es blitzt. Zu sagen
          cogito, ist schon zu viel, so bald man es durch Ich denke übersetzt. Das Ich
          anzunehmen, zu postulieren, ist praktisches Bedürfnis.
        text_zh: 我们仅仅知道自己的感觉、表象和思想的存在。应当说「在思考」，正如人们说「在打闪」。说 cogito，一旦把它译成「我思」，就已经太多了。设定、假定一个「我」，是实践上的需要。
        attribution: Georg Christoph Lichtenberg，Sudelbücher，K 76
        locator: Lichtenberg-Gesellschaft 公布的《Sudelbücher》选录，条目 [K 76]
        ref: 4
      - text: >-
          The most significant ongoing debate concerns whether Descartes intends the
          cogito to be an intuition (i.e., roughly, self-evident), or instead an inference.
        text_zh: 最重要、仍在进行的辩论关系到：Descartes 究竟是把 cogito 当作一种直觉（大致即自明的东西），还是当作一种推论。
        attribution: Lex Newman，Descartes’ Epistemology，Stanford Encyclopedia of Philosophy
        locator: 条目中讨论 cogito 的形式（直觉或推论）的段落；文本标注 2023 年 11 月 27 日实质性修订
        ref: 5
    open_parts: >-
      「是假的吗」这个问题，取决于把哪一句当作 cogito。法语《谈谈方法》中带 donc 的表述、拉丁第二沉思中不带 ergo 的「我在，我存在」，以及后世口号 cogito, ergo sum，并不是同一个句子。[2][3]
      「我」究竟是直接呈现在意识中的主观性，还是被语法偷运进来的实体，仍是开放争论；Lichtenberg 提出了尖锐形式，但并没有关闭后来关于自我意识与第一人称的全部讨论。[4][5]
      即便确定了「有思想发生」，由此能推出多少关于自我持续存在、心灵实体或身心关系的结论，早已超出第二沉思开头那一步。Descartes 在后文引入上帝来保证清晰明白的观念并回应欺骗者，那些步骤有独立的争议，不能单靠 cogito 一并解决。
      Hintikka、Williams、Kant、Nietzsche 等人的专门讨论，只有在打开其全文后才能逐字引用；本轮对其中若干文本未能做到这一点，故不把 SEP 的转述写成已核对的原书引语。[5]
    references:
    - id: 1
      citation: Jez (2011). Is 'cogito ergo sum' false? Philosophy Stack Exchange.
      url: https://philosophy.stackexchange.com/questions/70/is-cogito-ergo-sum-false
