- id: 2026-11-11-ai-transformer-long
  date: '2026-11-11'
  category: ai
  title_zh: 为什么 Transformer 在长距离依赖上比 RNN 和 LSTM 做得更好？
  title_en: Why does the transformer do better than RNN and LSTM in long-range context dependencies?
  commentary: 这是理解当代大模型为何「赢了」的钥匙问题：答案不只是「注意力」三个字，而牵涉梯度传播路径、并行训练、以及 Transformer 自身在超长上下文上的新短板。
  source_name: Artificial Intelligence Stack Exchange
  source_url: https://ai.stackexchange.com/questions/20075/why-does-the-transformer-do-better-than-rnn-and-lstm-in-long-range-context-depen
  author: DRV
  source_type: stackexchange
  tags:
  - Transformer
  - 注意力机制
  - 长距离依赖
  - 循环神经网络
  answer:
    format: scholarly
    reviewed_at: '2026-11-11'
    consensus:
      label: 「路径长度更短 + 训练可并行」是主流解释；但「Transformer 天然擅长长上下文」并非共识
      note: Transformer 原论文把最大路径长度 O(1)（对比 RNN 的 O(n)）作为偏好自注意力的理由之一，这一点被广泛接受。[1] 但长序列基准显示原始 Transformer
        并不擅长极长序列，状态空间模型等非注意力架构在部分长程任务上更强；即使是专门的长上下文语言模型，也会对位于中间位置的信息利用不佳。[6][7][8][9]
    summary: 经典回答有两层。第一，梯度路径：RNN 要把第 1 个词的信息传到第 n 个词，信号必须穿过 n 步循环，反向传播时误差会逐步衰减或爆炸（梯度消失/爆炸问题），这使远距离依赖难学；[2][3][4]
      LSTM 用门控与「恒定误差传送带」缓解了这一点，但信息仍须逐步传递。[2] 自注意力层让任意两个位置之间只隔常数步操作，Vaswani 等人明确以「最大路径长度」短作为选择自注意力的动机。[1]
      第二，并行性：RNN 每层需要 O(n) 次顺序操作，自注意力只需 O(1) 次，这使 Transformer 能在大规模数据上高效训练——这一工程优势与规模化本身可能同样重要。[1] 实证上，LSTM
      语言模型平均只有效利用约 200 个词元的上下文，且对 50 个词元以外的词序基本不敏感。[5] 但需要警惕把结论说过头：自注意力的计算量随序列长度平方增长；在 1K–16K 词元的 Long
      Range Arena 上，原始与高效 Transformer 都表现吃力，S4 等状态空间模型反而在该基准全部任务上取得最好成绩；[6][7] 长上下文模型对中间位置信息的利用也明显变差；[9]
      理论上，单层数固定的自注意力也有形式语言意义上的表达力限制。[10]
    definitions:
    - term: 长距离依赖（long-range dependency）
      text: 序列中相距很远的两个位置之间的统计或语义关联，例如段落开头的主语与结尾的动词一致。
    - term: 梯度消失/爆炸
      text: 在通过时间反向传播时，误差信号要连乘许多步雅可比矩阵，范数可能指数衰减或指数增长，导致远距离依赖难以学习或训练不稳定。Pascanu 等人从解析、几何与动力系统角度分析了该问题，问题本身最早由
        Bengio 等人（1994）系统阐述。[3][4]
    - term: 最大路径长度
      text: Vaswani 等人用来比较网络层类型的指标：任意输入与输出位置之间，前向与反向信号必须经过的最长步数。自注意力为 O(1)，循环层为 O(n)，卷积层为 O(log_k n)。[1]
    milestones:
    - year: '1994'
      name: 梯度消失问题的系统阐述
      explanation: Bengio、Simard 与 Frasconi 论证用梯度下降学习长期依赖是困难的；Pascanu 等人（2013）称这是「广为人知」的 RNN 训练难题，并提出梯度裁剪等对策。[3][4]
    - year: '1997'
      name: LSTM
      explanation: Hochreiter 与 Schmidhuber 用门控单元与「恒定误差传送带」强制误差恒定流动，报告可桥接超过 1000 个离散时间步的最小时间间隔。[2] 一句话：给信息修了一条不衰减的「传送带」。
    - year: '2017'
      name: Transformer：「Attention Is All You Need」
      explanation: 完全用自注意力替代循环与卷积；论文第 4 节以每层计算复杂度、可并行性与长距离依赖的路径长度三项指标论证其优势。[1]
    - year: 2020–2023
      name: 长程基准与非注意力挑战者
      explanation: Long Range Arena 系统评测高效 Transformer；[6] S4 在该基准全部任务上达到最好成绩并解决此前所有方法都失败的 16K 长度 Path-X；[7]
        Mamba 以选择性状态空间实现线性复杂度，在语言建模上与同规模 Transformer 竞争。[8]
    views:
    - position: 核心原因是更短的信息路径：任意两位置一步可达
      consensus_role: 主流解释（原论文的设计动机）
      evidence:
        label: 原始论文的复杂度分析，加上对 RNN 的经验分析
        note: 路径长度论证是结构分析而非受控实验；Khandelwal 等人对 LSTM 语言模型的消融提供了「RNN 有效上下文有限」的直接证据。[1][5]
      holders:
      - name: Ashish Vaswani、Noam Shazeer 等
        identity: 《Attention Is All You Need》作者；arXiv 版本所署单位为 Google Brain、Google Research 与多伦多大学。[1]
      - name: Urvashi Khandelwal、Dan Jurafsky 等
        identity: 《Sharp Nearby, Fuzzy Far Away》作者，用消融实验测量 LSTM 语言模型实际利用的上下文范围。[5]
      argument: Vaswani 等人写道：学习长距离依赖是许多序列转导任务的关键挑战，影响这种能力的一个关键因素是前向与反向信号在网络中必须穿越的路径长度；路径越短，越容易学习长距离依赖。[1]
        他们的表 1 给出：自注意力层的最大路径长度为 O(1)，循环层为 O(n)。[1] 与之呼应，Khandelwal 等人发现 LSTM 语言模型平均能利用约 200 个词元的上下文，但会把最近约
        50 个词元与更远的历史截然区分，远处只被当作粗略的「语义场」或话题。[5] LSTM 虽显著缓解了梯度衰减，[2] 信息仍需逐步压缩进固定大小的隐状态，这是注意力机制可以绕开的瓶颈。
      quotes:
      - text: The shorter these paths between any combination of positions in the input and output sequences,
          the easier it is to learn long-range dependencies [12].
        text_zh: 输入与输出序列中任意位置组合之间的这些路径越短，就越容易学习长距离依赖。
        attribution: Vaswani 等，Attention Is All You Need
        locator: 第 4 节，arXiv PDF 第 6 页
        ref: 1
      - text: On two standard datasets, Penn Treebank and WikiText-2, we find that the model is capable
          of using about 200 tokens of context on average, but sharply distinguishes nearby context (recent
          50 tokens) from the distant history.
        text_zh: 在 Penn Treebank 与 WikiText-2 两个标准数据集上，我们发现该模型平均能够利用约 200 个词元的上下文，但会把近处上下文（最近 50 个词元）与遥远的历史截然区分开来。
        attribution: Khandelwal 等，Sharp Nearby, Fuzzy Far Away
        locator: arXiv:1805.04623 摘要
        ref: 5
    - position: 同样重要的是并行训练与规模化，而非注意力「理解」长程
      consensus_role: 有力的补充解释
      evidence:
        label: 复杂度分析与后续架构的对照证据
        note: 原论文把可并行性列为三项指标之一；后续非注意力架构在可并行训练后也能在语言建模上接近 Transformer，提示并行性与规模是关键变量之一。这一推论属于对已发表结果的综合解读，并非单一研究的直接结论。[1][8]
      holders:
      - name: Albert Gu、Tri Dao
        identity: Mamba 论文作者，提出带硬件感知并行算法的选择性状态空间模型。[8]
      argument: 循环层每层需要 O(n) 次顺序操作，自注意力只需 O(1) 次，因此 Transformer 能更好地利用 GPU/TPU 并行，在相同时间内处理多得多的数据。[1] Gu
        与 Dao 指出，许多次二次复杂度架构（线性注意力、门控卷积、循环模型与结构化状态空间模型）此前在语言上不如注意力，关键弱点是不能做基于内容的推理；在让状态空间参数依赖输入并设计并行算法后，Mamba-3B
        在预训练与下游评测中超过同规模 Transformer、并与两倍规模的 Transformer 相当。[8] 这说明「循环」本身不是死刑，Transformer 的胜出部分来自可规模化训练与基于内容的选择能力。
      quotes:
      - text: We identify that a key weakness of such models is their inability to perform content-based
          reasoning, and make several improvements.
        text_zh: 我们认为这类模型的一个关键弱点是无法进行基于内容的推理，并为此做了若干改进。
        attribution: Gu 与 Dao，Mamba
        locator: arXiv:2312.00752 摘要
        ref: 8
    - position: Transformer 在真正的长上下文上并不完美
      consensus_role: 对主流说法的重要限定
      evidence:
        label: 基准评测与理论结果
        note: LRA、S4、Lost in the Middle 均为公开基准或受控实验；Hahn 的结论是关于形式语言的数学定理，不能直接等同于自然语言任务中的表现。[6][7][9][10]
      holders:
      - name: Yi Tay、Mostafa Dehghani 等
        identity: Long Range Arena 基准作者。[6]
      - name: Nelson F. Liu、Percy Liang 等
        identity: 《Lost in the Middle》作者。[9]
      - name: Michael Hahn
        identity: 《Theoretical Limitations of Self-Attention in Neural Sequence Models》作者。[10]
      argument: LRA 作者指出，Transformer 由于自注意力的二次复杂度，不能很好地扩展到长序列；他们用 1K–16K 词元的任务系统评测了十种高效 Transformer。[6]
        S4 随后在该基准所有任务上取得最好结果，包括此前所有方法都失败的 16K 长度 Path-X。[7] 在语言模型中，Liu 等人发现当相关信息位于长输入的中间时，性能显著下降，即使是明确的长上下文模型也如此。[9]
        Hahn 证明，若层数或头数不随输入长度增长，软/硬注意力都不能建模周期性有限状态语言与层级结构。[10] 因此更准确的说法是：Transformer 在「中等长度、需要灵活检索」的依赖上比
        RNN/LSTM 好得多，但长上下文问题并没有被注意力一劳永逸地解决。
      quotes:
      - text: In particular, we observe that performance is often highest when relevant information occurs
          at the beginning or end of the input context, and significantly degrades when models must access
          relevant information in the middle of long contexts, even for explicitly long-context models.
        text_zh: 特别是，我们观察到：当相关信息出现在输入上下文的开头或结尾时，表现往往最好；而当模型必须获取位于长上下文中间的相关信息时，表现显著下降，即便是明确面向长上下文的模型也是如此。
        attribution: Liu 等，Lost in the Middle
        locator: arXiv:2307.03172 摘要
        ref: 9
    open_parts: 第一，Transformer 的优势中有多少来自架构的归纳偏置、多少来自可并行训练带来的规模，尚无干净的因果拆分。[1][8] 第二，超长上下文（数十万到百万词元）中，注意力、状态空间模型与混合架构孰优孰劣仍在快速变化，现有基准覆盖有限。[6][7][8]
      第三，「能放进上下文」不等于「能用好上下文」，位置偏差的成因与修正方法尚未定论。[9] 第四，理论表达力限制与实际自然语言表现之间的关系仍不清楚。[10]
    references:
    - id: 1
      citation: Vaswani, A., Shazeer, N., Parmar, N., Uszkoreit, J., Jones, L., Gomez, A. N., Kaiser,
        Ł., & Polosukhin, I. (2017). Attention is all you need. Advances in Neural Information Processing
        Systems 30（NeurIPS 2017）. 页码按 arXiv:1706.03762 PDF。
      url: https://arxiv.org/pdf/1706.03762
    - id: 2
      citation: Hochreiter, S., & Schmidhuber, J. (1997). Long short-term memory. Neural Computation,
        9(8), 1735–1780. 链接为卡内基梅隆大学深度学习课程提供的阅读材料 PDF（作者机构原链接本次无法连接）。
      url: https://deeplearning.cs.cmu.edu/F23/document/readings/LSTM.pdf
    - id: 3
      citation: Bengio, Y., Simard, P., & Frasconi, P. (1994). Learning long-term dependencies with gradient
        descent is difficult. IEEE Transactions on Neural Networks, 5(2), 157–166. IEEE Xplore 对自动抓取未返回正文，本次未能打开原文；其论点据
        [4] 的转述。
      url: null
    - id: 4
      citation: Pascanu, R., Mikolov, T., & Bengio, Y. (2013). On the difficulty of training recurrent
        neural networks. Proceedings of ICML 2013. arXiv:1211.5063.
      url: https://arxiv.org/abs/1211.5063
    - id: 5
      citation: 'Khandelwal, U., He, H., Qi, P., & Jurafsky, D. (2018). Sharp nearby, fuzzy far away:
        How neural language models use context. Proceedings of ACL 2018. arXiv:1805.04623.'
      url: https://arxiv.org/abs/1805.04623
    - id: 6
      citation: 'Tay, Y., Dehghani, M., Abnar, S., et al. (2021). Long Range Arena: A benchmark for efficient
        transformers. ICLR 2021. arXiv:2011.04006.'
      url: https://arxiv.org/abs/2011.04006
    - id: 7
      citation: Gu, A., Goel, K., & Ré, C. (2022). Efficiently modeling long sequences with structured
        state spaces. ICLR 2022. arXiv:2111.00396.
      url: https://arxiv.org/abs/2111.00396
    - id: 8
      citation: 'Gu, A., & Dao, T. (2023). Mamba: Linear-time sequence modeling with selective state spaces.
        arXiv:2312.00752.'
      url: https://arxiv.org/abs/2312.00752
    - id: 9
      citation: 'Liu, N. F., Lin, K., Hewitt, J., Paranjape, A., Bevilacqua, M., Petroni, F., & Liang,
        P. (2024). Lost in the middle: How language models use long contexts. Transactions of the ACL,
        12. arXiv:2307.03172.'
      url: https://arxiv.org/abs/2307.03172
