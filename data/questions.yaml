    - id: 1
      citation: 'Hardaker, C. (2010). Trolling in asynchronous computer-mediated communication: From user discussions to academic definitions. Journal of Politeness Research, 6(2), 215–242. https://doi.org/10.1515/jplr.2010.011'
      url: https://knowledge.lancashire.ac.uk/id/eprint/4980/2/Hardaker%2C%20C.%202010.%20Trolling%20in%20ACMC.pdf
    - id: 2
      citation: 'Buckels, E. E., Trapnell, P. D., & Paulhus, D. L. (2014). Trolls just want to have fun. Personality and Individual Differences, 67, 97–102. https://doi.org/10.1016/j.paid.2014.01.016'
      url: https://www2.psych.ubc.ca/~dpaulhus/research/DARK_TRAITS/ARTICLES/PAID.2014.with.Buckels-Trapnell.pdf
    - id: 3
      citation: 'Cheng, J., Bernstein, M., Danescu-Niculescu-Mizil, C., & Leskovec, J. (2017). Anyone can become a troll: Causes of trolling behavior in online discussions. In Proceedings of the 2017 ACM Conference on Computer Supported Cooperative Work and Social Computing (CSCW ’17). ACM. https://doi.org/10.1145/2998181.2998213'
