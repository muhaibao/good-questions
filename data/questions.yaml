- id: 2026-11-23-biz-minimum-wage
  date: '2026-11-23'
  category: business
  title_zh: 提高最低工资的经济目的是什么？
  title_en: What is the economic purpose of increasing the minimum wage?
  commentary: 这道题把「目的」和「效果」分开了：即便就业效应仍有争论，也仍要问提高工资下限究竟想解决什么问题——减贫、再分配，还是矫正买方垄断。把「经济学家早已意见一致」当成前提，本身就需要核对。
  source_name: Economics Stack Exchange
  source_url: https://economics.stackexchange.com/questions/429/what-is-the-economic-purpose-of-increasing-the-minimum-wage
  author: Mathematician
  source_type: stackexchange
  tags:
  - 最低工资
  - 就业
  - 买方垄断
  - 贫困
  answer:
    format: scholarly
    reviewed_at: '2026-11-23'
    consensus:
      label: 提高最低工资的常见政策目标是提高低工资劳动者的收入并减轻贫困；但在竞争性劳动市场模型中，有效的工资下限会导致部分低效率劳动者失业。这一教科书预测与较新的实证结果长期对立，学界并没有单一结论
      note: >-
        原问题把「经济学家普遍认为最低工资扭曲均衡、增加非熟练劳动力失业」当作既定前提，再问提高它有何经济理由。[0]
        这一前提并不成立。Stigler 1946 年的经典分析把大众目标写成消除极端贫困，同时在竞争性条件下预言：若最低工资生效，边际产品低于下限的工人会被解雇。[1]
        Card 与 Krueger 对 1992 年新泽西最低工资上调的快餐店前后对照，没有发现就业下降的迹象，结论段甚至报告就业增加，并写明这与教科书的中心预测相反。[2]
        Neumark 与 Wascher 的长篇综述则明确写到：文献估计区间很宽，因而对低工资就业的总体效应缺乏共识；但他们同时认为，「新近研究不再支持传统的就业下降观点」这一说法显然不正确，他们视为最可信的研究绝大多数指向负向就业效应。[3]
        Dube、Lester 与 Reich 用跨州相邻县比较，报告在其所考察的美国最低工资上调幅度内，没有可检出的就业损失。[4]
        美国国会预算办公室（CBO）2019 年官方报告同时给出了收入上升、部分家庭脱贫，以及中位估计下的就业减少，并强调就业效应的不确定性很大。[5]
        2013 年 IGM/Clark Center 对顶尖学术经济学家的调查，也显示出对「提到 9 美元是否会明显增加低技能者就业难度」存在明显分歧。[6]
    summary: >-
      原题问的不是「该不该涨」，而是：在承认价格下限会干扰供需的教科书图像之后，提高最低工资是否仍有严格的经济理由。[0]
      把「目的」和「效果」分开，有助于看清争论。就目的而言，Stigler 写得很清楚：最低工资立法的流行目标——消除极端贫困——本身几乎不必争论；真正要问的是它是否减少贫困，以及是否存在更有效的替代政策。他自己的答案是「否」与「是」。[1]
      就机制而言，竞争性劳动市场给出的预测也很明确：每个工人得到其边际产品的价值；若最低工资生效，则服务价值低于下限的工人会被解雇，或转入未受管制的部门、失业或退出劳动力。[1] 同一篇文章也已经指出另一种理论可能：若雇主对给定质量的劳动具有显著的工资决定权，设定得当的最低工资可以提高工资和就业，并使工资更接近边际产品价值；但他随即强调，全国统一的最低工资很难满足「恰到好处」的各项条件。[1]
      实证争论从 1990 年代所谓「新最低工资研究」起变得尖锐。Card 与 Krueger 调查了新泽西最低工资从每小时 4.25 美元提到 5.05 美元前后的 410 家快餐店，并与宾夕法尼亚东部未调薪的店铺以及新泽西州内原本已高工资的店铺比较，摘要的判断是：没有迹象表明这次上调减少了就业。[2] Dube、Lester 与 Reich 把个案研究推广到 1990–2006 年全美跨州相邻县，同样报告没有不利的就业效应，并认为传统未控制地方经济条件的方法，会因与政策无关的空间异质性而产生虚假的负向结果。[4]
      相反的阅读来自 Neumark 与 Wascher：他们承认估计值范围很宽、总体效应缺乏共识，但认为被调查的多数研究、尤其是他们视为最可信的研究，相对一致地指向负向就业效应，而且对技能最低的群体证据更强；他们几乎看不到有说服力的正向就业效应，尤其是在竞争性模型所针对的更宽群体上。[3]
      CBO 的官方评估把这两面写在同一份报告里：提高联邦最低工资，对多数低工资工人意味着收入和家庭收入上升，并可使一些家庭脱贫；但另一些低工资工人会失去工作，其家庭收入下降，有时会降到贫困线以下。[5] 以把联邦最低工资本到 2025 年提到 15 美元并指数化这一方案为例，CBO 的中位估计是：2025 年平均一周将有 130 万本来会就业的工人失业，同时低于贫困线的人数将减少 130 万；就业变化有约三分之二的可能落在「接近零」到减少 370 万之间。[5]
      因此，提高最低工资可以有清晰的规范目标（提高低端工资、减轻贫困，在买方力量存在时甚至可能改善配置），但其就业与分配效果在经验上仍有严重分歧。把「经济学家已经形成共识、因而涨工资没有经济理由」或反过来「已经证明没有失业代价」写成定论，都不符合已打开的一手文献。
    definitions:
    - term: 竞争性工资决定（competitive wage determination）
      text: Stigler 用来描述雇主对给定技能与努力程度的劳动没有工资控制权的情形：每个工人得到其边际产品的价值。此时若最低工资生效，服务价值低于下限的工人会被解雇，或转入未受管制部门、失业或退出劳动力。[1]
    - term: 雇主工资决定 / 买方垄断式市场（employer wage determination / monopsony-like market）
      text: 若雇主对给定质量的劳动具有显著工资决定权，他可以把工资定在低于竞争性水平之处。Stigler 用假想数字说明：设定得当的最低工资可以提高就业和工资，并使工资更接近边际产品价值；但全国统一下限很难对准「正确」的水平，定得过高仍会减少就业。[1] Card 与 Krueger 也讨论了这类模型，并写明他们的总体发现难以用标准竞争模型或供给约束（如买方垄断或均衡搜寻）模型来解释。[2]
    - term: 新最低工资研究（new minimum wage research）
      text: Neumark 与 Wascher 用来指称 1990 年代初以来、更多利用州级差异和其他识别策略来估计最低工资就业效应的文献传统。他们指出，与较早综述相对狭窄的弹性共识相比，这一传统给出的估计区间更宽。[3]
    milestones:
    - year: '1946'
      name: Stigler 给出竞争性市场的经典政策分析
      explanation: 在《美国经济评论》发表《最低工资立法的经济学》，区分减贫目标与配置、就业、家庭收入效应，并讨论雇主控制工资时的例外情形。[1]
    - year: '1992–1994'
      name: 新泽西—宾夕法尼亚快餐自然实验
      explanation: 新泽西于 1992 年 4 月 1 日把最低工资从 4.25 美元提到 5.05 美元。Card 与 Krueger 据此调查 410 家快餐店，1994 年在 AER 报告未发现就业下降。[2]
    - year: '2007 / 2010'
      name: 综述分歧与相邻县设计
      explanation: Neumark 与 Wascher 发表对「新最低工资研究」的长篇评述，强调负向就业效应仍占多数可信证据；[3] Dube、Lester 与 Reich 用 1990–2006 年跨州相邻县比较，报告没有可检出的就业损失。[4]
    - year: '2013 / 2019'
      name: 专家调查与 CBO 官方评估
      explanation: IGM/Clark Center 就联邦最低工资提到 9 美元的就业与福利含义询问学术经济学家，意见明显分歧；[6] CBO 发布关于提高联邦最低工资对就业与家庭收入影响的报告，同时给出中位就业损失与减贫估计，并标明很大的不确定性区间。[5]
    views:
    - position: 在竞争性劳动市场中，有效的最低工资会解雇边际产品低于下限的工人；作为减贫工具，它瞄准不准，因而提高下限并不是实现其流行目标的可靠办法
      consensus_role: 长期占据教科书核心位置的理论预测，也是原问题当作「一般接受」的那一侧
      evidence:
        label: 经典理论分析，辅以后来仍坚持负向就业效应的文献综述
        note: >-
          Stigler 1946 年的文章是理论与政策评论，不是一项现代识别策略下的经验估计；文中关于总就业的数量推测（「可能有数十万工人被解雇」）被他自己写成「没有人知道确切数字」。[1]
          Neumark 与 Wascher 的判断来自对既有研究的分类阅读，而不是一篇新的随机试验；他们明确承认估计值范围很宽、领域缺乏总体共识，其「最可信研究」的名单本身是作者的评估。[3]
          竞争性预测是否适用于具体市场，取决于该市场是否接近完全竞争，以及上调幅度是否「有效」约束了工资。
      holders:
      - name: George J. Stigler
        identity: '《The Economics of Minimum Wage Legislation》（American Economic Review, 1946）作者。文中脚注将其署为明尼苏达大学经济学教授。[1]'
      - name: David Neumark、William Wascher
        identity: '《Minimum Wages and Employment》（IZA Discussion Paper No. 2570, 2007）作者。通讯作者 Neumark 当时署于加州大学欧文分校（兼 PPIC、NBER 与 IZA）；Wascher 署于美国联邦储备理事会。文中声明观点属于作者，不一定反映美联储理事会立场。[3]'
      argument: >-
        Stigler 把问题从「要不要消除极端贫困」转到「最低工资能不能做到、有没有更好办法」。在竞争性工资决定下，生效的最低工资主要带来他所谓的配置效应：产出下降，略低于下限的人或许提高收入，显著低于下限的人收入减少。[1] 关于总就业，他的方向性判断是：最低工资越高，被解雇的受覆盖工人越多；直接失业「可观且确定」，并由此推定对总就业的净效应是不利的。[1]
        即便承认雇主可能具有工资控制权，他也认为这对全国性最低工资「并不十分相关」：最优下限必须选得正确、随职业与工人质量、随企业、并随时间迅速变化，而当时并没有可容忍地准确的方法去导出所需的供需曲线。[1]
        半个多世纪后，Neumark 与 Wascher 并不否认文献已经变得远更混杂，但他们拒绝「新研究已经推翻传统观点」的说法。在他们的计数里，综述表中的 102 个条目约三分之二相对一致地指向负向就业效应；他们标出的 33 项「最可信」证据中，28 项（85%）指向负向效应；若聚焦最可能受害的低技能群体，证据在他们看来尤其强。[3]
        按这一侧的逻辑，提高最低工资的「经济目的」如果是减贫或提高最弱势者的福利，机制上并不可靠：受益的是保住工作、工资被抬高的人，代价往往落在技能最低、最可能失去工作的人身上。
      quotes:
      - text: >-
          The popular objective of minimum wage legislation—the elimination
          of extreme poverty—is not seriously debatable. The important questions are
          rather (1) Does such legislation diminish poverty? (2) Are there efficient
          alternatives?
        text_zh: 最低工资立法的流行目标——消除极端贫困——并不是真正需要争论的。重要的问题反而是：（1）这类立法是否减少贫困？（2）是否存在有效的替代方案？
        attribution: George J. Stigler，The Economics of Minimum Wage Legislation
        locator: American Economic Review 36(3), 1946, 第 358 页
        ref: 1
      - text: >-
          Each worker receives the value of his marginal product under competition.
          If a minimum wage is effective, it must therefore have one of two effects:
          first, workers whose services are worth less than the minimum wage are
          discharged (and thus forced into unregulated fields of employment, or into
          unemployment or retirement from the labor force); or, second, the productivity
          of low-efficiency workers is increased.
        text_zh: 在竞争条件下，每个工人得到其边际产品的价值。因此，若最低工资生效，它必定产生两种效果之一：第一，服务价值低于最低工资的工人被解雇（从而被迫进入未受管制的就业领域，或陷入失业，或退出劳动力）；第二，低效率工人的生产率提高。
        attribution: George J. Stigler，The Economics of Minimum Wage Legislation
        locator: American Economic Review 36(3), 1946, 第 358 页（Competitive Wage Determination 一节）
        ref: 1
      - text: >-
          However, the oft-stated assertion that recent research fails to support the
          traditional view that the minimum wage reduces the employment of low-wage
          workers is clearly incorrect. A sizable majority of the studies surveyed in
          this monograph give a relatively consistent (although not always statistically
          significant) indication of negative employment effects of minimum wages.
          In addition, among the papers we view as providing the most credible evidence,
          almost all point to negative employment effects, both for the United States
          as well as for many other countries.
        text_zh: 然而，那种常被提出的断言——近期研究不再支持「最低工资会减少低工资工人就业」的传统观点——显然是不正确的。本专论所评述的研究中，相当大部分相对一致地（尽管并不总是统计显著）显示最低工资具有负向就业效应。此外，在我们视为提供最可信证据的论文中，几乎全部都指向负向就业效应，无论是对美国还是对许多其他国家。
        attribution: David Neumark 与 William Wascher，Minimum Wages and Employment
        locator: IZA Discussion Paper No. 2570, 2007, 摘要
        ref: 3
    - position: 在低工资劳动市场中，适度提高最低工资可以提高低收入者的工资，而不一定带来可检出的就业损失；若雇主具有买方力量，理论上甚至可能同时提高工资与就业
      consensus_role: 1990 年代以来最有影响的「新最低工资研究」立场之一，直接挑战教科书的单向预测
      evidence:
        label: 自然实验与相邻县面板估计，外加教科书中已有的买方力量理论
        note: >-
          Card 与 Krueger 的对象是快餐业店铺，时间窗口覆盖一次州级上调；他们自己也提出，总体发现难以用标准竞争模型或买方垄断/搜寻模型来解释，因此机制并未被他们的数据单独裁定。[2]
          Dube、Lester 与 Reich 考察的是 1990–2006 年美国已经出现过的最低工资上调幅度，结论不能自动外推到更大、更快的全国性上调；作者也提醒，估计更多涉及低工资岗位而非低工资工人，且未解决企业是否以更高技能工人替代低技能工人的问题。[4]
          Stigler 对雇主工资决定的算术例子是假想数据，而且他本人认为这对全国统一下限「不是很相关」。[1]
      holders:
      - name: David Card、Alan B. Krueger
        identity: '《Minimum Wages and Employment: A Case Study of the Fast-Food Industry in New Jersey and Pennsylvania》（American Economic Review, 1994）作者。文中单位署为普林斯顿大学经济系。[2]'
      - name: Arindrajit Dube、T. William Lester、Michael Reich
        identity: '《Minimum Wage Effects Across State Borders: Estimates Using Contiguous Counties》（Review of Economics and Statistics, 2010）作者。脚注当时将 Dube 署于马萨诸塞大学阿默斯特分校经济系，Lester 署于北卡罗来纳大学教堂山分校城市与区域规划系，Reich 署于加州大学经济系与劳资关系研究所（IRLE）。[4]'
      argument: >-
        如果问题是「有没有经济机制，使提高最低工资可以改善低工资工人的处境」，这一侧给出了两条路径。一条是理论的：当雇主有工资决定权时，过低的工资并不等于市场出清；Stigler 自己的表 II 显示，把工资从 20 美元提到 24 美元可以使就业从 50 人增加到 70 人——当然，再高过 28 美元又会减少就业。[1]
        另一条是经验的。Card 与 Krueger 问的是：低工资雇主面对最低工资上调会怎样反应？他们写明，传统理论的预测是明确的：上升导致完全竞争雇主削减就业（并引用了 Stigler 1946）。[2] 他们对新泽西与宾夕法尼亚东部快餐店的前后比较，以及新泽西州内高工资与低工资店铺的比较，都没有给出就业下降的迹象；结论段更写明，无论用哪一种对照，他们都发现这次上调增加了就业，并且多种设定都未出现负向就业效应。[2]
        Dube、Lester 与 Reich 把这种地方性对照推广到全部跨州相邻县，摘要中的判断是「没有不利的就业效应」；在结论中他们进一步写：就过去数十年美国出现过的那类上调而言，使用地方比较、从而控制就业增长异质性的方法更为可靠，这些估计表明没有可检出的就业损失。[4]
        若这一阅读成立，提高最低工资的经济目的就可以说成：在不造成明显失业的前提下提高低工资岗位的报酬，并在存在买方力量时纠正过低的工资。不过，就连 Card 与 Krueger 也承认，他们的发现整体上既不好用标准竞争模型解释，也不好用供给约束模型解释，[2] 因此「目的能够实现」并不等于「机制已经清楚」。
      quotes:
      - text: >-
          We find no indication that the rise in the minimum wage reduced
          employment.
        text_zh: 我们没有发现任何迹象表明，这次最低工资上调减少了就业。
        attribution: David Card 与 Alan B. Krueger，Minimum Wages and Employment
        locator: American Economic Review 84(4), 1994, 第 772 页，开篇摘要段
        ref: 2
      - text: >-
          Contrary to the central prediction of the textbook model of the minimum wage,
          but consistent with a number of recent studies based on cross-sectional
          time-series comparisons of affected and unaffected markets or employers,
          we find no evidence that the rise in New Jersey's minimum wage reduced
          employment at fast-food restaurants in the state.
        text_zh: 与最低工资教科书模型的中心预测相反，但与若干基于受影响与未受影响市场或雇主的截面—时间序列比较的近期研究相一致，我们没有发现证据表明新泽西最低工资的上调减少了该州快餐店的就业。
        attribution: David Card 与 Alan B. Krueger，Minimum Wages and Employment
        locator: American Economic Review 84(4), 1994, 第 792 页，IX. Conclusions
        ref: 2
      - text: >-
          These estimates suggest no detectable employment losses from the kind of
          minimum wage increases we have seen in the United States.
        text_zh: 这些估计表明，就我们在美国所见的那类最低工资上调而言，没有可检出的就业损失。
        attribution: Arindrajit Dube、T. William Lester 与 Michael Reich，Minimum Wage Effects Across State Borders
        locator: Review of Economics and Statistics 92(4), 2010, 第 962 页，结论段
        ref: 4
    - position: 就政策评估而言，提高最低工资往往同时带来低工资劳动者的收入增益（包括部分减贫）和不确定、但中位估计不为零的就业损失；目的可以部分达到，代价的大小仍无共识
      consensus_role: 官方综合评估与专家调查所反映的「两面都在、尚未结算」的中间立场
      evidence:
        label: CBO 对联邦方案的官方模拟，以及 IGM 专家调查的公开投票表
        note: >-
          CBO 2019 年报告不是新的微观计量论文，而是基于已有研究和对工资增长、就业反应参数的中位与区间假设所做的政策模拟；报告开篇就强调任何方案的就业效应都有很大不确定性，且反应参数的可能区间并不对称：若大于中位数，可能会大得多。[5]
          本次打开的是该报告官方 PDF 的 Internet Archive 快照（因 cbo.gov 对自动抓取返回 403）；文本与报告编号 CBO-55410、页面 www.cbo.gov/publication/55410 一致。[5]
          IGM/Clark Center 2013 年调查针对的是提到每小时 9 美元并指数化的具体方案，不能直接外推到 15 美元或不同国家制度；本文只报告从已打开的逐人投票表清点出的未加权票数，不转述页面上以图像展示、未能逐字读出的置信度加权百分比。[6]
      holders:
      - name: 美国国会预算办公室（Congressional Budget Office）
        identity: 美国国会的非党派预算机构。2019 年 7 月报告《The Effects on Employment and Family Income of Increasing the Federal Minimum Wage》由其撰写并发布。[5]
      - name: IGM/Clark Center 经济专家小组（2013 年最低工资调查的响应者）
        identity: 芝加哥大学布斯商学院 IGM Forum（现 Kent A. Clark Center for Global Markets）组织的学术经济学家调查。2013 年 2 月 26 日公布的「Minimum Wage」问卷，公开列出包括 Acemoglu、Autor、Chetty、Deaton、Hoxby、Saez、Thaler 等人在内的逐人投票与简短评论。[6]
      argument: >-
        若把「经济目的」理解成可观察的政策结果，而不是某一学派的理论推论，CBO 的写法最为直接。它考察三种到 2025 年把联邦最低工资分别提到 15、12 与 10 美元的方案，并一开篇就并置两种主效应：对多数低工资工人，收入和家庭收入会增加，一些家庭将脱贫；但另一些低工资工人会失去工作，其家庭收入下降，有时降到贫困线以下。[5]
        对 15 美元方案，中位估计是 2025 年平均一周减少 130 万就业（相当于就业人数下降 0.8%），同时使低于贫困线的人数减少 130 万；工资低于 15 美元的 1700 万工人会因此提高工资，另外约 1000 万略高于新下限的工人也可能间接受益。[5] 关键的是不确定性：CBO 估计就业变化有约三分之二的可能落在接近零到减少 370 万之间。[5] 较小的 12 美元与 10 美元方案，就业与减贫效应都相应缩小。[5]
        专家层面的分歧与这份官方谨慎态度一致。在 2013 年关于「提到 9 美元是否会明显增加低技能者找工作难度」的问题上，已公布的逐人投票未加权结果为：同意 13 票，不同意 12 票，不确定 9 票，无意见 1 票，未作答 3 票。[6] 这不是「一边倒反对最低工资」，也不是「已经证明没有就业代价」。
        回到原题：提高最低工资可以有明确的分配目的，并且按 CBO 的中位估计，这一目的在减贫上会部分实现；但同一估计也包含就业损失，而且区间宽到足以包含「接近于没有损失」。经济理由存在，却不是一张已经结算清楚的成本—收益表。
      quotes:
      - text: >-
          Increasing the federal minimum wage would have two principal
          effects on low-wage workers. For most low-wage workers,
          earnings and family income would increase, which would
          lift some families out of poverty. But other low-wage
          workers would become jobless, and their family income
          would fall—in some cases, below the poverty threshold.
        text_zh: 提高联邦最低工资会对低工资工人产生两项主要影响。对大多数低工资工人而言，收入和家庭收入会增加，从而使一些家庭脱贫。但另一些低工资工人会失去工作，其家庭收入会下降——有些情况下会降到贫困线以下。
        attribution: Congressional Budget Office，The Effects on Employment and Family Income of Increasing the Federal Minimum Wage
        locator: 2019 年 7 月报告，Summary，第 1 页
        ref: 5
      - text: >-
          According to CBO’s median estimate, under the $15
          option, 1.3 million workers who would otherwise be
          employed would be jobless in an average week in 2025.
          (That would equal a 0.8 percent reduction in the number
          of employed workers.) CBO estimates that there is about
          a two-thirds chance that the change in employment
          would lie between about zero and a reduction of 3.7 million
          workers.
        text_zh: 按照 CBO 的中位估计，在 15 美元方案下，2025 年平均一周将有 130 万本来会就业的工人失业（相当于就业人数减少 0.8%）。CBO 估计，就业变化有约三分之二的可能落在接近零到减少 370 万工人之间。
        attribution: Congressional Budget Office，The Effects on Employment and Family Income of Increasing the Federal Minimum Wage
        locator: 2019 年 7 月报告，Summary，第 1 页
        ref: 5
    open_parts: >-
      目的与效果仍不应被写成已经统一结算。竞争性模型、买方垄断模型和不同识别策略下的估计，对同一项政策给出的就业弹性可以从明显为负到接近于零，Neumark 与 Wascher 自己也把「估计区间很宽、缺乏总体共识」写在摘要的开头。[3][4]
      现有主要证据多来自美国州级或地方性、幅度相对有限的上调；能否外推到更大的全国性提高（例如迅速提到 15 美元），正是 CBO 用宽区间来表达的那种不确定性。[5]
      即便就业的平均效应接近零，仍可能存在对青少年、残疾工人或最缺乏技能者的不利分配效应，以及工作时长、价格、技能替代和不被计入就业人数的其他调整；Dube 等人已提醒，他们的估计更接近「对低工资岗位」而非「对低工资工人」。[4]
      与最低工资并行的政策（如劳动所得税抵免 EITC）是否在瞄准贫困上更有效，是 Stigler 提出、后来文献反复讨论的问题，但本文未打开那些专门比较研究，故不在此下判断。[1]
      至于原问题所问的「经济目的」，规范目标（提高低端报酬、减轻贫困、在买方力量下纠正过低工资）是清楚的；这些目标在经验上能实现多少，仍然是开放的实证问题。
    references:
    - id: 0
      citation: Mathematician (2014). What is the economic purpose of increasing the minimum wage? Economics Stack Exchange.
      url: https://economics.stackexchange.com/questions/429/what-is-the-economic-purpose-of-increasing-the-minimum-wage
    - id: 1
      citation: 'Stigler, G. J. (1946). The economics of minimum wage legislation. American Economic Review, 36(3), 358–365.'
      url: https://www.cooperative-individualism.org/stigler-george_the-economics-of-minimum-wage-legislation-1946-jun.pdf
    - id: 2
      citation: 'Card, D., & Krueger, A. B. (1994). Minimum wages and employment: A case study of the fast-food industry in New Jersey and Pennsylvania. American Economic Review, 84(4), 772–793.'
      url: https://davidcard.berkeley.edu/papers/njmin-aer.pdf
    - id: 3
      citation: 'Neumark, D., & Wascher, W. (2007). Minimum wages and employment (IZA Discussion Paper No. 2570). Institute for the Study of Labor.'
      url: https://docs.iza.org/dp2570.pdf
    - id: 4
      citation: 'Dube, A., Lester, T. W., & Reich, M. (2010). Minimum wage effects across state borders: Estimates using contiguous counties. Review of Economics and Statistics, 92(4), 945–964.'
      url: https://irle.berkeley.edu/wp-content/uploads/2010/11/Minimum-Wage-Effects-Across-State-Borders.pdf
    - id: 5
      citation: 'Congressional Budget Office. (2019). The effects on employment and family income of increasing the federal minimum wage.'
      url: https://web.archive.org/web/20210101030423/https://www.cbo.gov/system/files/2019-07/CBO-55410-MinimumWage2019.pdf
    - id: 6
      citation: 'IGM Forum / Kent A. Clark Center for Global Markets. (2013, February 26). Minimum wage (Economic Experts Panel survey).'
      url: https://kentclarkcenter.org/surveys/minimum-wage/

- id: 2026-11-23-biz-replacement
  date: '2026-11-23'
  category: business
  title_zh: 在没有自然消亡机制的体系里，如何保证足够的淘汰与更新？
  title_en: How do you ensure an adequate replacement rate in systems that have no natural way to die?
  commentary: 企业会破产，机构和制度却往往只会自我保全。把「如何配置现有结构」误当成全部问题，就会忽略结构本身的创造与毁灭——而这正是许多体系逐渐僵化却难以退出的原因。
  source_name: Patrick Collison — Questions
  source_url: https://patrickcollison.com/questions
  author: Patrick Collison
  source_type: curated
  tags:
  - 创造性毁灭
  - 制度惰性
  - 组织更新
  - 官僚机构
  answer:
    format: scholarly
    reviewed_at: '2026-11-23'
    consensus:
      label: 这是一道开放的制度设计问题，没有已被证明的单一操作方案；证据主要是理论和历史—组织案例，而不是受控实验
      note: >-
        Collison 的原题把问题规定得很清楚：破产可以处理衰败的企业，但在并不自然面临灭绝过程的体系与制度里，如何保证足够的更新率？他转述 Schumpeter 的主张——资本主义的问题不在于如何把资本配置给现有结构，而在于结构如何被创造与毁灭——并提示制度命令（institutional imperative）、Berliner 关于「看不见的脚」的评论，以及 Herbert Kaufman 的短书。[1]
        Schumpeter 在《资本主义、社会主义与民主》第七章把「创造性毁灭」写成资本主义的本质事实，并写明：通常被想象的问题是资本主义如何管理现有结构，而真正相关的问题是它如何创造并毁灭这些结构。[2]
        Kaufman 对美国联邦行政部门单位 1923–1973 年的清点表明：机构一旦成立，存活机会极高，但组织死亡并非未知现象。[3]
        Buffett 在伯克希尔 1989 年股东信中描述了「制度命令」：机构会抗拒改变方向，并在制度动力学作用下走上往往被误导的路径。[4]
        Berliner 的原文本次未能打开，因此只在 Collison 的转述层面提及，不引用其句子或页码。
        上述文献共同说明「为什么更新困难」，但并不提供一套已被验证的、可普遍套用的替代灭绝机制。
    summary: >-
      Collison 问的不是企业如何新陈代谢——他写明，破产会处理衰败的企业——而是：系统和制度难免过时或变得低效，却会非常努力地活下去；在那些并不自然面临灭绝过程的体系里，怎样才能达到足够的更新率。[1]
      他用来定位问题的第一条线索，是对 Schumpeter 的转述。打开《资本主义、社会主义与民主》第七章后，可以看到比转述更完整的表述。Schumpeter 把资本主义写成一种经济变迁的形式或方法，它不仅从来不是、而且永远不可能是静止的。[2] 他接着把从手工作坊到美国钢铁那样的组织演进，说成一种「工业突变」：它从内部不断革命化经济结构，不断毁灭旧结构、创造新结构。「创造性毁灭」的过程是关于资本主义的本质事实；每一个资本主义企业都必须生活在其中。[2] 正因为如此，他写道：通常被想象的问题是资本主义如何管理现有结构，而相关的问题是它如何创造并毁灭这些结构。[2] 对单个企业的行为，也必须放在「创造性毁灭的持久风暴」中来看，而不能假设风暴已经平息。[2]
      一旦把目光转到公共机构和其他缺乏破产约束的组织，经验图像就不同了。Kaufman 的短书《政府组织是不朽的吗？》把标题当成一个有待经验检验的问题，而不是修辞。他考察了 400 多个联邦行政部门单位。在 1923 年样本的 175 个组织中，到 1973 年仍有 148 个（近 85%）还在运转，只有 27 个（略高于 15%）消失；其中 109 个（超过 62%）连地位都几乎未变。因此，一个 1923 年还活着的组织活到 1973 年的机会非常高。[3] 为该书作序的文字也写明：结论支持「机构一旦诞生就会存活」这一普遍印象，但同时表明组织死亡并非未知现象。[3]
      在企业组织内部，Buffett 把自己「最意外的发现」写成一种他称为「制度命令」的看不见的力量：他原以为体面、聪明、有经验的经理人会自动做出理性决策，后来却发现，当制度命令起作用时，理性常常枯萎。他列举的机制包括：机构像受牛顿第一定律支配一样抗拒改变当前方向；项目或收购会冒出来吸尽可用资金；领导人的任何渴望都会迅速得到回报率与战略研究的支持；同业的行为会被盲目模仿。把企业推上这些往往被误导的路径的，是制度动力学，而不是恶意或愚蠢。[4]
      把这三条线索合在一起：市场部门至少还有破产与创造性毁灭作为更新装置；许多公共机构、大型科层和类似「没有自然死亡方式」的体系，既缺乏同等强度的灭绝过程，又内生地倾向于自我保全。至于如何在这些体系里人为制造足够的更新率，已打开的文献更多是在诊断问题，而不是给出已被证明有效的通用处方。Collison 提到的 Berliner「看不见的脚」，本次未能核对原文，只能作为他本人的阅读指引保留。
    definitions:
    - term: 创造性毁灭（creative destruction）
      text: Schumpeter 用来指资本主义从内部不断革命化经济结构、不断毁灭旧结构并创造新结构的过程。他称之为关于资本主义的本质事实，并认为每个资本主义企业都必须生活在这一过程之中。[2]
    - term: 制度命令（institutional imperative）
      text: Buffett 在 1989 年股东信中的提法：一种他起初未意识到的、在商业中具有压倒性重要性的看不见的力量。其作用包括抗拒改变方向、用项目吸尽可用资金、为领导人的渴望提供论证，以及盲目模仿同业；在它起作用时，理性常常枯萎。[4]
    - term: 组织死亡与存活（organizational death and survival）
      text: Kaufman 把联邦行政机构的设立、存续与终止当成可计数的经验现象。他的 1923–1973 年清点表明，样本中的机构存活率极高，但死亡仍然发生；标题中的「不朽」被他当作有待检验的问题。[3]
    milestones:
    - year: '1942 / 1950'
      name: Schumpeter 提出创造性毁灭
      explanation: 《资本主义、社会主义与民主》初版于 1942 年；本次打开并据以引用的是 1950 年第三版、Harper Torchbooks 1962 年印本的第七章「创造性毁灭的过程」。[2]
    - year: '1976'
      name: Kaufman 检验政府组织是否「不朽」
      explanation: Brookings Institution 出版《Are Government Organizations Immortal?》，对美国联邦行政部门单位在 1923 与 1973 年的出生、存活与死亡做了系统清点。[3]
    - year: '1989–1990'
      name: Buffett 写下「制度命令」
      explanation: 在 1989 年伯克希尔·哈撒韦股东信（信末日期为 1990 年 3 月 2 日）中，把制度命令列为自己在商业中最意外的发现之一。[4]
    views:
    - position: 资本主义的关键能力不在于管理既有结构，而在于不断创造并毁灭结构；对会破产的企业而言，更新率至少有一套内生装置
      consensus_role: 创新与增长理论中极有影响的经典命题，也是 Collison 为这道题所锚定的出发点
      evidence:
        label: 理论与历史论述，不是受控的制度实验
        note: >-
          Schumpeter 的第七章是对资本主义过程的理论重述，并援引产业史与价格—工资观察来批评以静态竞争模型判断「大企业」的做法；它并不提供一套可在公共部门直接复制的操作手册，也不是随机对照试验。[2]
          Collison 的转述与原文方向一致，但原文的表述是「如何管理（administers）现有结构」与「如何创造并毁灭它们」，而不是较窄的「如何把资本配置给现有结构」。[1][2]
      holders:
      - name: Joseph A. Schumpeter
        identity: '《Capitalism, Socialism and Democracy》作者。本次引用据 1950 年第三版、Harper Torchbooks 1962 年印本第七章 The Process of Creative Destruction。[2]'
      - name: Patrick Collison
        identity: Stripe 联合创始人。本问题出自其个人网站上的问题清单，文中提示欢迎就这些题目提供阅读建议。[1]
      argument: >-
        Collison 把 Schumpeter 的要点转写成：资本主义的问题不在于如何把资本配置给现有结构，而在于结构如何被创造与毁灭。[1] 打开原文后，这一对比更加尖锐。Schumpeter 先排除了把资本主义看成静止体系的看法，强调其演化性质的首要动力并非战争、革命或人口与资本的准自动增长，而是经济结构从内部发生的革命。[2]
        他用来命名这一革命的短语是「创造性毁灭」：开辟新市场、从手工作坊发展到美国钢铁那样的组织，都展示同一种「工业突变」——它从内部不断革命化经济结构，不断毁灭旧的、创造新的。这就是资本主义的本质事实，也是每个资本主义企业必须生活于其中的环境。[2]
        由此得出方法论上的转换：若只在某一时点上看寡头行业里那些仿佛只为高价和限制产量而进行的招式，就是在假设风暴已经平息；企业的行为应被看成既是过去历史的结果，也是对即将变化的局面的应对——「通常被想象的问题是资本主义如何管理现有结构，而相关的问题是它如何创造并毁灭这些结构。」[2]
        就 Collison 的问题而言，这一侧给出的是「有自然死亡方式」的那一半答案：在企业部门，破产、失败和新进入者至少构成了一种更新装置。它并不能自动推广到学校、行政机构、国际组织或任何成功地把自己隔绝于灭绝过程之外的体系。
      quotes:
      - text: >-
          Schumpeter claimed that the problem of capitalism is not how capital is
          allocated to existing structures but how structures are created and destroyed.
          Systems and institutions inevitably get stale or become less effective but also
          work very hard to survive. (See also: the institutional imperative, Berliner's
          commentary on the “invisible foot”, and Herbert Kaufman's short book.)
          Bankruptcy takes care of senescent businesses. But how do we get a sufficient
          replacement rate in systems and institutions that aren't naturally subject to
          extinction processes?
        text_zh: Schumpeter 曾主张，资本主义的问题不在于如何把资本配置给现有结构，而在于结构如何被创造与毁灭。系统与制度难免过时或变得低效，却也会非常努力地存活下去。（另见：制度命令、Berliner 对「看不见的脚」的评论，以及 Herbert Kaufman 的短书。）破产会处理衰败的企业。但在那些并不自然面临灭绝过程的体系与制度里，我们如何获得足够的更新率？
        attribution: Patrick Collison，Questions
        locator: patrickcollison.com/questions 中题为 “How do you ensure an adequate replacement rate in systems that have no natural way to die?” 的条目正文
        ref: 1
      - text: >-
          The opening up of new markets, foreign or domestic, and the organizational
          development from the craft shop and factory to such concerns as U. S. Steel
          illustrate the same process of industrial mutation - if I may use that biological
          term - that incessantly revolutionizes the economic structure from within,
          incessantly destroying the old one, incessantly creating a new one. This
          process of Creative Destruction is the essential fact about capitalism. It is
          what capitalism consists in and what every capitalist concern has got to live in.
        text_zh: 开辟国内外新市场，以及从手工作坊和工厂发展到美国钢铁那样的企业，都说明了同一种工业突变过程——如果我可以使用这个生物学用语的话——它从内部不断地革命化经济结构，不断地毁灭旧结构，不断地创造新结构。这一创造性毁灭的过程，是关于资本主义的本质事实。资本主义就在于此，每一个资本主义企业都必须生活于此。
        attribution: Joseph A. Schumpeter，Capitalism, Socialism and Democracy，Chapter VII
        locator: 1950 年第三版，Harper Torchbooks 1962 年印本，第 82 页
        ref: 2
      - text: >-
          In other words, the problem that is usually being visualized is how capitalism
          administers existing structures, whereas the relevant problem is how it creates
          and destroys them.
        text_zh: 换句话说，通常被想象的问题是资本主义如何管理现有结构，而相关的问题是它如何创造并毁灭这些结构。
        attribution: Joseph A. Schumpeter，Capitalism, Socialism and Democracy，Chapter VII
        locator: 1950 年第三版，Harper Torchbooks 1962 年印本，第 83 页
        ref: 2
    - position: 缺乏灭绝压力的组织会高度倾向于存活和自我维持；内部的「制度命令」会进一步削弱转向的理性，因此足够的更新率不会自动出现
      consensus_role: 对公共机构与大型组织惰性的经验与实务观察，说明问题为何困难，但并不等于已经找到替代方案
      evidence:
        label: 对联邦机构半个世纪存续的历史清点，以及一份基于商业实践的股东信论述
        note: >-
          Kaufman 的研究是小规模、进入「未知领域」的探索，作者自己提醒数据有多处薄弱，应谨慎使用；样本限于联邦行政部门总部及其主要下属单位，省略了派出机构，不能直接代表州与地方、非营利组织或国际机构。[3]
          「只有约 15% 在五十年间消失」描述的是存活率，不是对「何为最优更新率」的规范答案，也不是一套改革技术。
          Buffett 的「制度命令」出自伯克希尔股东信，是作者根据商业经验提出的概括，不是一项组织学研究；它有助于理解内部抵制，但不能单独证明某种治理安排必然有效。[4]
          Berliner 关于「看不见的脚」的原文本次未打开，故不引用、不转述其具体句子。
      holders:
      - name: Herbert Kaufman
        identity: '《Are Government Organizations Immortal?》（Brookings Institution, 1976）作者。书中著录为 Herbert Kaufman, 1922– ；书前文字称其为 Brookings 高级研究员（senior fellow）。[3]'
      - name: Warren E. Buffett
        identity: 伯克希尔·哈撒韦董事长。本段论述出自其 1989 年致股东信，信末署名为 Chairman of the Board，日期为 1990 年 3 月 2 日。[4]
      argument: >-
        如果创造性毁灭依赖某种「可以死去」的压力，那么下一步就要问：那些不容易死的组织，实际上死得有多勤？Kaufman 没有把「政府组织不朽」当成口号，而是去数。1923 年样本里的 175 个组织，到 1973 年仍有近 85% 还在，只有略高于 15% 消失；超过五分之三不仅还活着，而且地位几乎相同。[3] 序言把这一结果概括为：结论支持机构一旦诞生就会存活的普遍印象，但也说明组织死亡并非未知。[3]
        高存活率本身不必等于失败——有些功能本就应当持续——但它确实意味着：在 Kaufman 所观察的联邦行政体系里，自然淘汰并不是主流机制。若新组织仍不断出现，而旧组织很少退出，Collison 所担心的「更新率不足」和「体系日益拥挤、老化」就会成为管理上的真实困难；Kaufman 在导言性质的文字里也提到，若旧组织很少死亡而新组织不断出现，随之而来的政治与管理困难将是惊人的。[3]
        Buffett 则从组织内部说明，为什么转向会这么难。制度命令的第一条就是：机构会抗拒改变当前方向；此外还有用项目填满可用资金、为领导人的渴望提供论证、以及盲目模仿同业。推动这些路线的是制度动力学，不是恶意或愚蠢；他自己写明，曾因忽视其力量而付出昂贵代价，此后则试图以组织和投资选择来减弱它的影响。[4]
        这一侧能够解释「为什么没有自然死亡方式的体系会更新不足」，却几乎没有回答「如何保证足够的更新率」。强制日落条款、定期重组、引入竞争、模拟破产或外部评审——这些常见建议并不在本次已打开的原文里得到检验，因此不能写成已经证实的方案。
      quotes:
      - text: >-
          There were 175 organizations in the 1923 sample. No less than 148
          of them (nearly 85 percent) were still going in 1973 (including 31
          now at lower administrative levels and 8 no longer in executive departments).
          Only 27 (a little over 15 percent) disappeared. Thus the chances that an
          organization alive in 1923 would still be alive in 1973 were very high.
        text_zh: 1923 年样本中有 175 个组织。其中不少于 148 个（近 85%）到 1973 年仍在运转（包括 31 个此时已处于较低行政层级、8 个已不在行政部门中）。只有 27 个（略高于 15%）消失了。因此，一个 1923 年还活着的组织活到 1973 年的机会非常高。
        attribution: Herbert Kaufman，Are Government Organizations Immortal?
        locator: Brookings Institution, 1976, 第 34 页，Findings and Evidence 章开篇
        ref: 3
      - text: >-
          My most surprising discovery: the overwhelming importance in
          business of an unseen force that we might call “the institutional
          imperative.” ... I thought then that decent, intelligent, and experienced
          managers would automatically make rational business decisions. But I
          learned over time that isn't so. Instead, rationality frequently wilts when
          the institutional imperative comes into play.
        text_zh: 我最意外的发现是：商业中有一种我们可以称为「制度命令」的看不见的力量，具有压倒性的重要性。……我当时以为，体面、聪明、有经验的经理人会自动做出理性的商业决策。但随着时间推移我认识到并非如此。相反，当制度命令起作用时，理性常常会枯萎。
        attribution: Warren E. Buffett，Berkshire Hathaway Chairman’s Letter 1989
        locator: 1989 年致股东信中关于教训与发现的条目；信末日期为 1990 年 3 月 2 日
        ref: 4
      - text: >-
          For example: (1) As if governed by Newton's First Law of
          Motion, an institution will resist any change in its current
          direction; (2) Just as work expands to fill available time,
          corporate projects or acquisitions will materialize to soak up
          available funds; (3) Any business craving of the leader, however
          foolish, will be quickly supported by detailed rate-of-return and
          strategic studies prepared by his troops; and (4) The behavior of
          peer companies, whether they are expanding, acquiring, setting
          executive compensation or whatever, will be mindlessly imitated.
        text_zh: 例如：（1）仿佛受牛顿第一定律支配，一个机构会抗拒对其当前方向的任何改变；（2）正如工作会扩展到填满可用时间，公司的项目或收购也会冒出来，以吸尽可用资金；（3）领导人的任何商业渴望，无论多么愚蠢，都会迅速得到部下准备的详细回报率与战略研究的支持；（4）同业公司的行为——无论是扩张、收购、设定高管薪酬还是别的什么——都会被盲目模仿。
        attribution: Warren E. Buffett，Berkshire Hathaway Chairman’s Letter 1989
        locator: 1989 年致股东信中紧随「制度命令」定义的例举
        ref: 4
    open_parts: >-
      Collison 的问题仍然是开放的。已打开的文献能够说明：创造性毁灭为何是市场部门的关键过程，以及公共机构与大型组织为何倾向于存活并抵制转向；但不能从中推出一套已被证明能够在「没有自然死亡方式」的体系里保证足够更新率的操作方案。[1][2][3][4]
      多少的死亡或重组才算「足够」，本身没有中性标准；过高的强制淘汰可能摧毁有价值的制度记忆，过低则导致 Kaufman 所担心的那种日益拥挤与老化。
      不同领域（行政机构、大学、国际组织、大型企业的内部部门、标准制定组织）的退出机制差异很大，Kaufman 的联邦样本不能直接外推。[3]
      Berliner 的「看不见的脚」被 Collison 明确列为阅读线索，但本次未能打开其原书或论文，因此不能核对他究竟如何表述竞争压力与创新，也不能把它写成已核对的论点。[1]
      若要进一步回答「如何保证」，需要具体制度史与可评估的改革案例，而不是把创造性毁灭的隐喻直接当成政策工具。
