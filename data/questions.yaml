- id: 2026-11-11-phil-gambler
  date: '2026-11-11'
  category: philosophy
  title_zh: 赌徒谬误为什么是谬误？
  title_en: Why is the gambler's fallacy a fallacy?
  commentary: 连开九次正面，第十次「该轮到反面了」——这个直觉错在哪里，又在什么条件下其实并不算错？问题一路牵出独立性假设、贝叶斯推理，以及 2018 年才被发现的一个有限样本「真相」。
  source_name: Philosophy Stack Exchange
  source_url: https://philosophy.stackexchange.com/questions/30546/why-is-the-gamblers-fallacy-a-fallacy
  author: Nelson Alexander
  source_type: stackexchange
  tags:
  - 概率
  - 认知偏差
  - 归纳推理
  - 决策
  answer:
    format: scholarly
    reviewed_at: '2026-11-11'
    consensus:
      label: 在「独立同分布且概率已知」的模型下它是谬误，这一点是数学共识；但它是否「总是」谬误取决于模型假设
      note: 若每次结果独立且成功概率 p 已知，则无论过去出现什么连串，下一次成功的条件概率仍为 p；拉普拉斯早在 1814 年就把彩票中的「久未开出的号码该出了」称为一种错觉。[1] 但拉普拉斯本人也指出，若硬币偏向未知，连串正面反而是硬币偏向正面的证据；若从有限的瓮中不放回抽取，负相关是真实的。[1]
        Miller 与 Sanjurjo（2018）进一步证明，在有限序列中统计「连串之后」的成功比例存在系统性向下偏差。[3]
    summary: 赌徒谬误是相信独立随机过程会「自我纠正」：一个结果连续出现后，另一个结果「该来了」。它之所以是谬误，在于硬币、轮盘等装置没有记忆：在独立同分布（i.i.d.）且概率已知的模型下，P(下一次正面
      | 过去九次正面) = P(正面)。大数定律说的是频率比例在长期中趋于概率，靠的是后续大量试验「稀释」早期偏差，而不是「补偿」它。拉普拉斯在《概率论的哲学随笔》中已描述过法国彩票中人们争相押注久未开出的号码，并把这种常见错误归因于一种「把人不自觉地带回事件起点」的错觉。[1]
      心理学上，Tversky 与 Kahneman 把这类直觉归入「小数定律」信念：人们期望小样本也像总体一样「有代表性」。[2] 这一偏差在真实高风险决策中也有记录：Chen、Moskowitz
      与 Shue 发现庇护法官、贷款审批员与棒球裁判的决定呈负自相关，最符合赌徒谬误的解释。[5] 但哲学上更有意思的是它的边界：（1）若概率未知，连串是关于装置偏向的证据，理性推理应当更相信同一结果，而不是相反；（2）若是有限总体不放回抽样，负相关是真实的；[1]
      （3）Miller 与 Sanjurjo 证明，在任何有限的 i.i.d. 序列中，「紧跟在连串成功之后的结果」中成功的期望比例严格小于真实概率——这为赌徒式直觉提供了一个经验上的「真相内核」，也推翻了经典「热手谬误」研究的结论。[3][4]
    definitions:
    - term: 独立同分布（i.i.d.）
      text: 每次试验结果的概率分布相同，且任一结果不改变其他结果的概率。在此假设下，过去的连串对下一次没有预测力。
    - term: 小数定律（law of small numbers）
      text: Tversky 与 Kahneman（1971）用来讽刺性地描述的信念：人们以为小样本也会高度代表总体特征。[2] Chen 等人把它概括为人们低估连串偶然出现的可能性。[5]
    - term: 连串选择偏差（streak selection bias）
      text: Miller 与 Sanjurjo（2018）证明的结果：在有限 i.i.d. 二元序列中，计算「紧跟在 k 次连续成功之后的成功比例」，其期望严格小于真实成功概率；偏差随序列变长而减小、随连串长度增加而增大。[3]
    milestones:
    - year: '1814'
      name: 拉普拉斯论概率估计中的错觉
      explanation: 描述法国彩票中的「冷号」押注，并区分了无限瓮（独立）、有限瓮（不放回）以及未知原因（如出生性别比的季节性）三种情形。[1]
    - year: '1971'
      name: Tversky 与 Kahneman「相信小数定律」
      explanation: 把对小样本代表性的过度信任确立为系统性偏差的研究议程。[2]
    - year: '1985'
      name: 「热手谬误」
      explanation: Gilovich、Vallone 与 Tversky 认为篮球运动员的「手感火热」是错觉，这被视为赌徒谬误的镜像（期待连串延续）。[6]
    - year: '2016'
      name: 真实决策中的赌徒谬误
      explanation: Chen、Moskowitz 与 Shue 在庇护法官、贷款审批员与职业棒球主裁判的决定数据中发现负自相关。[5]
    - year: '2018'
      name: Miller–Sanjurjo：「小数定律中的一个真相」
      explanation: 证明连串选择偏差，并指出经典热手研究受此偏差影响，纠正后其结论被反转。[3]
    views:
    - position: 在独立且概率已知的模型下，它是明确的推理错误
      consensus_role: 数学与心理学的标准立场
      evidence:
        label: 概率论定理 + 大量实验与实地证据
        note: 谬误的「错误性」是相对于 i.i.d. 模型的数学事实；人们确实犯此错误的证据来自实验心理学与真实决策数据。[1][2][5]
      holders:
      - name: Pierre-Simon Laplace
        identity: 《概率论的哲学随笔》作者（此处据 Truscott 与 Emory 英译本）。[1]
      - name: Amos Tversky、Daniel Kahneman
        identity: 《Belief in the law of small numbers》（Psychological Bulletin, 1971）作者；本文未能打开原文，其主张据 [3][5]
          的转述。[2]
      - name: Daniel L. Chen、Tobias J. Moskowitz、Kelly Shue
        identity: 《Decision Making Under the Gambler’s Fallacy》（QJE 2016）作者。[5]
      argument: 在彩票每次都把所有号码重新混匀、使每个号码被抽中的机会完全相等的情形下，过去的结果不会改变下一次的概率；拉普拉斯认为，人们之所以押注久未开出的号码，是因为不自觉地把自己带回到事件的起点，把「十次连续正面」的低先验概率错误地套用到「已经九次正面之后的第十次」上。[1]
        Chen 等人表明，这种偏差在专业决策者中也存在，并且在决策者较温和、经验较少、前面连串较长、案件相似或时间相近、以及准确性激励较弱时更强。[5]
      quotes:
      - text: When a number in the lottery of France has not been drawn for a long time the crowd is eager
          to cover it with stakes.
        text_zh: 当法国彩票中的某个号码很久没有开出时，人们便争相在它上面下注。
        attribution: Laplace，《概率论的哲学随笔》（Truscott 与 Emory 英译）
        locator: 「论概率估计中的错觉」一章，第 161 页
        ref: 1
      - text: The evidence is most consistent with the law of small numbers and the gambler's fallacy
          – people underestimating the likelihood of sequential streaks occurring by chance – leading
          to negatively autocorrelated decisions that result in errors.
        text_zh: 证据最符合小数定律与赌徒谬误的解释——人们低估了连串偶然出现的可能性——从而导致负自相关、并造成错误的决定。
        attribution: Chen、Moskowitz 与 Shue
        locator: NBER Working Paper 22026 摘要
        ref: 5
    - position: 它只是「相对于模型」的谬误：当概率未知或抽样不放回时，结论会改变
      consensus_role: 哲学与统计学的重要限定
      evidence:
        label: 概率论推理（贝叶斯更新、不放回抽样）
        note: 这是逻辑/数学层面的论证，不依赖实验；它指出「谬误」的判定依赖于对数据生成过程的背景知识。[1][7]
      holders:
      - name: Pierre-Simon Laplace
        identity: 同一章中明确讨论了硬币偏向未知与有限瓮的情形。[1]
      argument: 拉普拉斯紧接着指出：过去连续出现正面，恰恰表明硬币可能更倾向于正面，因此（在不确定硬币是否均匀时）下一次正面的概率反而更高；他还说明，从只含有限个白球和黑球的瓮中抽出白球，会提高下一次抽出黑球的概率，但当瓮中球数无限时这种效应消失；对自然界中的不规则事件，某类事件频繁出现似乎表明有某种原因偏向它。[1]
        用今天的话说：赌徒谬误错在把「可交换的独立过程」与「有记忆或有未知参数的过程」混为一谈。若你确信装置公平，连串无信息；若你不确信，连串是关于装置的证据，但它指向「继续」而不是「反转」。SEP
        关于概率诠释的条目可作为理解这些模型假设的背景。[7]
      quotes:
      - text: But the past indicating in the coin a greater propensity for heads than for tails renders
          the first of the events more probable than the second; it increases as one has seen the probability
          of throwing heads at the following throw.
        text_zh: 但过去的结果表明这枚硬币更倾向于出正面而非反面，这使前一种事件比后一种更可能；正如我们所见，它提高了下一次掷出正面的概率。
        attribution: Laplace，《概率论的哲学随笔》（Truscott 与 Emory 英译）
        locator: 第 162 页
        ref: 1
    - position: 有限序列中存在真实的「连串后偏差」，为直觉提供了一个真相内核
      consensus_role: 近年的重要新结果（数学上已证明，心理学含义仍在讨论）
      evidence:
        label: 数学证明 + 对既有数据的再分析
        note: 偏差本身是定理；其能否解释人们为何持有赌徒谬误信念，作者称之为「新的结构性候选解释」，尚属假说。[3]
      holders:
      - name: Joshua B. Miller、Adam Sanjurjo
        identity: 《Surprised by the Hot Hand Fallacy? A Truth in the Law of Small Numbers》（Econometrica
          2018）作者。[3][4]
      argument: Miller 与 Sanjurjo 构造了一个例子：研究者 Jack 抛一枚硬币 100 次，每次出现正面后就记下下一次的结果，他自然预期所记结果中正面占一半——但对公平硬币而言，期望比例小于一半。[3]
        他们证明，对任何有限的 i.i.d. 二元序列，紧跟在连续成功之后的结果中成功的期望比例严格小于基础概率；在抛三次的最简单情形里，这一期望是 5/12。[3] 由于人们的经验恰恰来自有限序列，这一偏差意味着「连串后更可能反转」在被以这种方式统计时会显得有经验支持；作者在脚注中指出，这与样本量忽视的准贝叶斯模型结合，可为赌徒谬误信念的持续存在提供一种新的结构性候选解释。[3]
        他们还发现，Gilovich 等人（1985）的经典热手研究使用了类似 Jack 的有偏统计，纠正后结论被反转。[3][6]
      quotes:
      - text: Shockingly, Jack is wrong. For a fair coin, the expected proportion of heads is smaller
          than one-half.
        text_zh: 令人震惊的是，Jack 错了。对一枚公平硬币而言，（他记下的结果中）正面的期望比例小于二分之一。
        attribution: Miller 与 Sanjurjo，Econometrica（2018）
        locator: arXiv:1902.01265 PDF 第 2 页
        ref: 3
    open_parts: 第一，人们犯赌徒谬误，究竟主要源于「代表性」启发式、对有限序列经验的合理（但被误用的）学习，还是对数据生成过程的不同先验，仍在讨论中。[2][3][5] 第二，在现实中区分「真正独立的过程」与「存在负反馈的过程」（例如库存、配额或均值回归）本身就很难，Chen
      等人也承认不能完全排除顺序对比效应等替代解释。[5] 第三，热手现象在不同运动与任务中的真实大小，在纠正连串选择偏差后仍有争议。[3][6] 第四，与之相关的「逆赌徒谬误」（从观察到的结果推断有过很多次试验）在宇宙学设计论证中的适用性，是哲学上的开放话题；本文未能打开
      Hacking（1987）原文，故不展开。[8]
