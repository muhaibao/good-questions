- id: 2026-11-09-ai-explainable
  date: '2026-11-09'
  category: ai
  title_zh: 我们为什么需要可解释的人工智能？
  title_en: Why do we need explainable AI?
  commentary: 当模型决策影响信贷、医疗与司法时，「能用」不再够用——问题逼出透明度与问责的边界。
  source_name: Artificial Intelligence Stack Exchange
  source_url: https://ai.stackexchange.com/questions/14224/why-do-we-need-explainable-ai
  author: malioboro
  source_type: stackexchange
  tags:
  - 可解释性
  - 问责
  - 机器学习
  answer:
    format: scholarly
    reviewed_at: '2026-11-10'
    consensus:
      label: 高风险场景需要某种可说明性，是较为广泛的政策与研究动机；但「解释」应如何定义与实现，存在严重分歧
      note: Doshi-Velez 与 Kim 把可解释性当作在安全、非歧视、技术债与「解释权」等难以完全量化的准则上的退而求其次的检验手段，并呼吁把它做成可严格评估的科学。[1] Lipton
        则指出，「可解释」并非单一概念，事后解释与对人类透明是相互竞争的观念。[2] Rudin 进一步主张：高风险决策应直接使用本质上可解释的模型，而不是为黑箱提供事后说明。[3]
    summary: 当机器学习系统进入医疗、刑事司法、信贷和驾驶等会显著影响人身与权利的领域时，仅有预测准确率往往不够：还需要判断推理是否在安全、公平和其他辅助准则上站得住。[1] 文献对「我们为什么需要可解释人工智能」大致共享这一动机，但对「解释」是什么却缺少共识。[1][2]
      一种路线是发展并评估事后解释技术，把可解释性变成可检验的科学问题。[1] 另一种路线警告：这个词被用得太含混，线性模型可解释、深度网络不可解释之类断言并不显然成立。[2] 第三种路线更强：在高风险决策中，试图解释黑箱可能延续不良实践，正确做法是设计一开始就可解释的模型。[3]
    definitions:
    - term: 事后解释（post-hoc explanation）
      text: Lipton 把对人类透明（transparency）与事后解释列为两种相互竞争的「可解释」观念：前者关乎模型本身是否可被理解，后者是在模型训练之后再生成说明。[2]
    - term: 本质可解释模型（inherently interpretable model）
      text: Rudin 用来与「为黑箱提供解释」相对：模型的决策规则在构造上就可以被相关人理解，而不是另附一套可能不忠实的说明。[3]
    views:
    - position: 高风险应用需要可解释性，并应把它当作可严格评估的科学问题
      consensus_role: 研究议程与政策动机上的主流表述之一
      evidence:
        label: 有影响的综述/议程论文，不是一项新的随机试验
        note: Doshi-Velez 与 Kim（2017）是 arXiv 上的纲领性文章，提出应用接地、人类接地与功能接地三类评估。它对欧盟当时讨论的「解释权」有所引述，但本文并不把一篇综述当成法律文本本身。[1]
      holders:
      - name: Finale Doshi-Velez、Been Kim
        identity: 《Towards A Rigorous Science of Interpretable Machine Learning》（arXiv:1702.08608v2, 2017）共同第一作者。该
          arXiv 文本未在文首列出所属机构，故此处不补充未核到的头衔。[1]
      argument: 作者指出，机器学习系统日益用于复杂应用，除了预期任务表现，还被要求满足安全、非歧视、避免技术债或提供解释等准则；这些准则往往不能被完全量化。在这种情况下，一个流行的退路就是可解释性：如果系统能说明其推理，我们就可以检验该推理在这些辅助准则上是否站得住。[1]
        他们同时承认，对可解释性是什么、如何评估，几乎没有共识，并警告既有评估常依赖「看了就知道」。若要比较方法并理解何时可推广，就需要把这些概念形式化并建立在证据之上。[1]
      quotes:
      - text: 'In such cases, a popular fallback is the criterion of interpretability: if the system can
          explain its reasoning, we then can verify whether that reasoning is sound with respect to these
          auxiliary criteria.'
        text_zh: 在这些情况下，一个流行的退路是可解释性这一准则：如果系统能说明其推理，我们就可以检验该推理相对于这些辅助准则是否站得住。
        attribution: Finale Doshi-Velez 与 Been Kim，Towards A Rigorous Science of Interpretable Machine
          Learning
        locator: 作者 PDF 第 1 页（arXiv:1702.08608v2）
        ref: 1
    - position: 「可解释」一词本身含混，透明与事后说明不是一回事
      consensus_role: 对概念基础的有影响力澄清
      evidence:
        label: 概念分析论文（研讨会/预印本）
        note: Lipton 的文章先作为 2016 年 ICML 人类可解释性研讨会论文流传，本次打开的是 arXiv:1606.03490v3（2017-03-06）。后继若有期刊修订本，本文未打开，故只依据该版本。[2]
      holders:
      - name: Zachary C. Lipton
        identity: 该文版本中的通讯单位为加州大学圣迭戈分校（University of California, San Diego）。[2]
      argument: Lipton 开篇就指出：人们希望模型不仅表现好，还要可解释，但「解释」任务本身规定不足。不同论文给出的动机并不重合，对何种属性使模型可解释也众说纷纭；尽管如此，许多论文仍把可解释性当作公理直接宣称。[2]
        他的澄清是：可解释性不是铁板一块的概念，而是反映若干不同观念。在讨论被认为赋予可解释性的模型性质与技术时，他把「对人类透明」和「事后解释」识别为相互竞争的概念，并质疑「线性模型可解释、深度网络不可解释」这一常见断言。[2]
        因此，在问「我们为什么需要 XAI」之前，需要先问：需要的是哪一种可解释，以及它是否真能兑现被寄予的信任、可争辩性或发现功能。
      quotes:
      - text: Then, we address model properties and techniques thought to confer interpretability, identifying
          transparency to humans and post-hoc explanations as competing notions.
        text_zh: 然后，我们讨论那些被认为赋予可解释性的模型性质与技术，并把「对人类透明」与「事后解释」识别为相互竞争的概念。
        attribution: Zachary C. Lipton，The Mythos of Model Interpretability
        locator: 摘要，arXiv:1606.03490v3 第 1 页
        ref: 2
    - position: 高风险决策不应解释黑箱，而应使用本质可解释模型
      consensus_role: 少数但论证完整的规范性主张
      evidence:
        label: 同行评议立场文章（及对应预印本）
        note: Rudin 的文章刊于 Nature Machine Intelligence, 1, 206–215（2019）。本次打开并据以摘句的是作者 arXiv:1811.10154v3（2019-09-22）；PMC
          条目页亦已打开，用于核对期刊与 DOI，但其 PDF 下载在本环境返回的不是 PDF 文件。[3][4]
      holders:
      - name: Cynthia Rudin
        identity: 杜克大学（Duke University），该预印本署名单位。文章主张在高风险场景用本质可解释模型替代对黑箱的解释。[3]
      argument: Rudin 的出发点与「我们需要解释」并不矛盾，但她认为路径选错了。摘要指出：黑箱模型正被用于贯穿医疗、刑事司法等领域的高风险决策；人们希望用解释方法缓解问题，然而试图解释黑箱、而不是一开始就构造可解释模型，很可能延续不良实践，并可能对社会造成灾难性伤害。出路是设计本质上可解释的模型。[3]
        这一主张把「可解释性」从模型的附带说明，提升为模型类的选择问题：若解释不忠实，高风险场景中的问责只是表面被满足。
      quotes:
      - text: People have hoped that creating methods for explaining these black box models will alleviate
          some of these problems, but trying to explain black box models, rather than creating models
          that are interpretable in the first place, is likely to perpetuate bad practices and can potentially
          cause catastrophic harm to society. There is a way forward – it is to design models that are
          inherently interpretable.
        text_zh: 人们曾希望，为这些黑箱模型创造解释方法将缓解部分问题；然而，试图解释黑箱模型，而不是一开始就创造可解释的模型，很可能延续不良实践，并可能对社会造成灾难性伤害。有一条向前的路——那就是设计本质上可解释的模型。
        attribution: Cynthia Rudin，Stop Explaining Black Box Machine Learning Models…
        locator: 摘要，arXiv:1811.10154v3 第 1 页
        ref: 3
    open_parts: 仍然没有公认的「解释质量」尺度：对谁解释、解释到哪一层算够、解释与商业秘密或隐私如何权衡，都未解决。[1][2] 本质可解释模型在大规模深度网络上能否达到与黑箱相当的性能，是经验上仍在争论的问题。[3]
      「解释权」作为法律概念，其范围也不能由一篇机器学习论文单独决定。
    references:
    - id: 1
      citation: Doshi-Velez, F., & Kim, B. (2017). Towards a rigorous science of interpretable machine
        learning. arXiv:1702.08608v2.
      url: https://arxiv.org/pdf/1702.08608
    - id: 2
      citation: Lipton, Z. C. (2016/2017). The mythos of model interpretability. arXiv:1606.03490v3. 文中注明为
        ICML Workshop on Human Interpretability in Machine Learning (WHI 2016) 论文。
      url: https://arxiv.org/pdf/1606.03490
    - id: 3
      citation: Rudin, C. (2019). Stop explaining black box machine learning models for high stakes decisions
        and use interpretable models instead. Nature Machine Intelligence, 1(5), 206–215. https://doi.org/10.1038/s42256-019-0048-x
        引文据 arXiv:1811.10154v3 核对。
      url: https://arxiv.org/pdf/1811.10154
    - id: 4
      citation: Rudin, C. (2019). 同上。PubMed Central 条目页（用于核对期刊信息）：PMC9122117。
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC9122117/
- id: 2026-11-09-ai-fooled
  date: '2026-11-09'
  category: ai
  title_zh: 深度神经网络为什么如此容易被愚弄？
  title_en: How is it possible that deep neural networks are so easily fooled?
  commentary: 对抗样本暴露了「高准确率」与「稳健理解」之间的裂缝，是通往对齐与安全的入口问题。
  source_name: Artificial Intelligence Stack Exchange
  source_url: https://ai.stackexchange.com/questions/92/how-is-it-possible-that-deep-neural-networks-are-so-easily-fooled
  author: kenorb
  source_type: stackexchange
  tags:
  - 对抗样本
  - 稳健性
  answer:
    format: scholarly
    reviewed_at: '2026-11-10'
    consensus:
      label: 对抗脆弱性这一现象有强共识；主要机制与能否被消除，仍有争议
      note: 自 Szegedy 等人系统报告「对抗样本」以来，深度网络以及其他一些分类器会把对人几乎不可见的扰动判成错误类别，这一现象已被多次独立展示。[1][2] 对原因的解释则从「高维中的线性」到「非稳健但有用的特征」不等，目前没有被广泛接受、能在保持性能的同时消除该脆弱性的训练方法。[2][4]
    summary: 深度神经网络可以在标准测试集上达到很高准确率，却会把经过精心设计、对人往往难以察觉的扰动输入，以高置信度标成完全错误的类别。[1][2] Szegedy 等人把这类输入称为对抗样本，并观察到它们并非全然随机、甚至可在不同模型间转移。[1]
      Goodfellow、Shlens 与 Szegedy 主张，主要原因不是高度非线性或过拟合，而是网络在高维空间中过分线性，使小扰动足以越过决策边界。[2] 另一条证据是：网络也会把人类完全无法识别的图像（例如接近白噪声的图案）以极高置信度标成具体物体。[3]
      Ilyas 等人则提出，对抗样本可以直接归因于数据中「非稳健特征」：它们对分类很有预测力，却脆弱且对人类不可理解，因而对抗样本未必只是漏洞。[4]
    definitions:
    - term: 对抗样本（adversarial examples）
      text: Szegedy 等人的用法：通过对测试图像施加精心寻找的、往往难以察觉的非随机扰动，可以任意改变网络的预测；这样得到的例子被称为对抗样本。[1]
    - term: 非稳健特征（non-robust features）
      text: Ilyas 等人的用法：源自数据分布中某些模式的特征，它们有高度预测力，但脆弱，因而对人类难以理解。[4]
    milestones:
    - year: 2013/2014
      name: Szegedy 等系统报告对抗样本
      explanation: 在展示深度网络的反直觉性质时，他们发现对输入的微小扰动足以任意改变预测，并引入「对抗样本」这一术语。[1] 一句话：高准确率并不等于对微小改动稳健。
    - year: '2015'
      name: 线性解释与「易被愚弄」的不可识别图像
      explanation: Goodfellow 等提出线性解释，并使快速构造对抗样本、从而进行对抗训练变得可行。[2] Nguyen、Yosinski 与 Clune 则展示网络会把人类无法识别的图像标成具体类别且置信度极高。[3]
    - year: '2019'
      name: 「不是漏洞，而是特征」
      explanation: Ilyas 等把对抗样本归因于非稳健却有用的特征，并在标准数据集中论证其普遍存在。[4] 一句话：模型可能在用人类看不到的统计规律做对题。
    views:
    - position: 这是深度网络（及其他模型）在高维输入上的结构性脆弱
      consensus_role: 关于现象的主流描述，以及一种有影响的机制假说
      evidence:
        label: 多篇同行评议/正式会议论文与预印本，现象可复现；线性假说仍是一种解释
        note: 现象本身已被多组作者展示。Goodfellow 等的线性说明能解释为何极小扰动在高维中足够，并导出快速生成方法，但它并不排除其他机制。[1][2]
      holders:
      - name: Christian Szegedy、Wojciech Zaremba、Ilya Sutskever、Joan Bruna、Dumitru Erhan、Ian Goodfellow、Rob
          Fergus
        identity: 《Intriguing properties of neural networks》（arXiv:1312.6199v4, 2014-02-19）作者。该版本署名单位包括
          Google Inc.、New York University、University of Montreal。[1]
      - name: Ian J. Goodfellow、Jonathon Shlens、Christian Szegedy
        identity: Google Inc., Mountain View, CA。文章作为 ICLR 2015 会议论文发表，本次打开 arXiv:1412.6572v3。[2]
      argument: Szegedy 等报告：通过对测试图像施加难以察觉的非随机扰动，可以任意改变网络预测，他们称之为对抗样本；并且这些样本相对稳健，可被层数、激活函数或训练子集不同的网络所共享。[1]
        Goodfellow 等在摘要中回顾：早期解释聚焦于非线性与过拟合；他们主张，神经网络对对抗扰动脆弱的首要原因是其线性本性，这一看法既得到新的定量结果支持，也给出了此前缺失的对对抗训练为何有效的说明，并表明在高维空间中的线性行为足以产生对抗样本。[2]
      quotes:
      - text: We argue instead that the primary cause of neural networks’ vulnerability to adversarial
          perturbation is their linear nature.
        text_zh: 我们转而主张：神经网络对对抗扰动脆弱的首要原因，是它们的线性本性。
        attribution: Ian J. Goodfellow、Jonathon Shlens 与 Christian Szegedy，Explaining and Harnessing Adversarial
          Examples
        locator: 摘要，arXiv:1412.6572v3 / ICLR 2015，作者 PDF 第 1 页
        ref: 2
    - position: 网络也会对人类无法识别的图像给出极高置信度的「识别」
      consensus_role: 补充性的实证现象，说明脆弱不只限于微扰
      evidence:
        label: 同行评议会议论文中的构造性证据
        note: Nguyen 等使用进化算法等手段生成对人类不可识别、但对在 ImageNet 或 MNIST 上训练良好的卷积网络却有极高置信度的图像。这与「只有不可见微扰才能愚弄模型」的直觉不同。[3]
      holders:
      - name: Anh Nguyen、Jason Yosinski、Jeff Clune
        identity: 撰写该文时，Nguyen 与 Clune 在怀俄明大学，Yosinski 在康奈尔大学。论文发表于 2015 IEEE Conference on Computer Vision
          and Pattern Recognition (CVPR), pp. 427–436。[3]
      argument: 若对抗样本只是「在一张清晰的狗照片上加一点人眼看不见的噪声」，人们仍可认为模型大体抓住了正确的概念。Nguyen 等展示了另一类愚弄：图像对人类完全无法识别，最先进的深度网络却相信它们是可识别的物体，置信度可达
        99.99%，例如把白噪声静态图确信地标成一头狮子。[3] 这说明模型的高置信度输出，并不保证其内部判别依据对人类有意义。
      quotes:
      - text: it is easy to produce images that are completely unrecognizable to humans, but that state-of-the-art
          DNNs believe to be recognizable objects with 99.99% confidence (e.g. labeling with certainty
          that white noise static is a lion).
        text_zh: 很容易生成一些对人类完全无法识别的图像，但最先进的深度神经网络却相信它们是可识别的物体，置信度达 99.99%（例如把白噪声静态图确信地标成一头狮子）。
        attribution: Anh Nguyen、Jason Yosinski 与 Jeff Clune，Deep Neural Networks are Easily Fooled
        locator: 摘要，arXiv:1412.1897v4 / CVPR 2015，作者 PDF 第 1 页
        ref: 3
    - position: 对抗样本未必只是漏洞，也可能是有用但不稳健的特征
      consensus_role: 有影响的另类机制解释
      evidence:
        label: 同行评议/预印本中的理论框架与实验
        note: Ilyas 等（arXiv:1905.02175v4, 2019-08-12）把对抗样本直接归因于非稳健特征，并声称在标准数据集中证明其普遍存在。这是对「纯漏洞」叙事的修正，不是对脆弱性本身的否认。[4]
      holders:
      - name: Andrew Ilyas、Shibani Santurkar、Dimitris Tsipras、Logan Engstrom、Brandon Tran、Aleksander Madry
        identity: 该文版本的署名单位为 MIT。[4]
      argument: 若对抗扰动只是模型的病理缺陷，它们不应与对正确输入的分类有系统联系。Ilyas 等则证明：对抗样本可以直接归因于非稳健特征——它们来自数据分布中的模式，有高度预测力，但脆弱，因而对人类不可理解。[4]
        在这一视角下，攻击者是在操纵那些对模型有用、对人类不显著的规律；「愚弄」揭示的是人类与模型所用特征的错位，而不只是训练失败。这并不意味着脆弱可以忽略，而是改变了「修复」应当针对什么。
      quotes:
      - text: 'We demonstrate that adversarial examples can be directly attributed to the presence of
          non-robust features: features (derived from patterns in the data distribution) that are highly
          predictive, yet brittle and (thus) incomprehensible to humans.'
        text_zh: 我们证明，对抗样本可以直接归因于非稳健特征的存在：这些特征源自数据分布中的模式，具有高度预测力，但很脆弱，因而（也就）对人类不可理解。
        attribution: Ilyas, Santurkar, Tsipras, Engstrom, Tran & Madry，Adversarial Examples Are Not Bugs,
          They Are Features
        locator: 摘要，arXiv:1905.02175v4 第 1 页
        ref: 4
    open_parts: 目前没有被广泛接受的训练方法能在保持标准性能的同时消除对抗脆弱性。线性几何、非稳健特征与分布外泛化失败，各自能说明一部分事实，但尚未统一。[2][4] 这些样本在物理世界（打印、拍摄、贴附）中的普遍威胁程度，也仍是经验问题。把「容易被愚弄」写成「模型毫无理解」或「已有完备补丁」，都超过了现有证据。
    references:
    - id: 1
      citation: Szegedy, C., Zaremba, W., Sutskever, I., Bruna, J., Erhan, D., Goodfellow, I., & Fergus,
        R. (2014). Intriguing properties of neural networks. arXiv:1312.6199v4.
      url: https://arxiv.org/pdf/1312.6199
    - id: 2
      citation: Goodfellow, I. J., Shlens, J., & Szegedy, C. (2015). Explaining and harnessing adversarial
        examples. In International Conference on Learning Representations (ICLR 2015). arXiv:1412.6572v3.
      url: https://arxiv.org/pdf/1412.6572
    - id: 3
      citation: 'Nguyen, A., Yosinski, J., & Clune, J. (2015). Deep neural networks are easily fooled:
        High confidence predictions for unrecognizable images. In 2015 IEEE Conference on Computer Vision
        and Pattern Recognition (CVPR) (pp. 427–436). https://doi.org/10.1109/CVPR.2015.7298640 引文据 arXiv:1412.1897v4
        核对。'
      url: https://arxiv.org/pdf/1412.1897
    - id: 4
