- id: 2026-11-24-sci-yang-mills
  date: '2026-11-24'
  category: science
  title_zh: 杨–米尔斯理论是否存在质量间隙？
  title_en: Yang–Mills Existence and Mass Gap
  commentary: >-
    经典杨–米尔斯方程描述的是以光速传播的无质量波，强相互作用却是短程的、粒子带有正质量。把这个「质量间隙」从实验与模拟写成四维量子规范理论的数学存在性定理，既是量子场论的基础问题，也是千禧年难题所要的那一跃。
  source_name: Clay Mathematics Institute — Millennium Problems
  source_url: https://www.claymath.org/millennium/yang-mills-the-maths-gap/
  author: Clay Mathematics Institute
  source_type: curated
  tags:
  - 杨–米尔斯
  - 质量间隙
  - 千禧年难题
  - 量子场论
  - 规范理论
  answer:
    format: scholarly
    reviewed_at: '2026-11-24'
    consensus:
      label: >-
        这是一个尚未被证明的数学问题，也是 Clay 数学研究所千禧年七题之一。官方条目页写明：实验和计算机模拟暗示量子杨–米尔斯方程的解中存在「质量间隙」，但这一性质尚无证明。官方问题陈述要求证明：对任意紧致单规范群 G，在四维欧氏/闵氏时空 R^4 上存在非平凡的量子杨–米尔斯理论，并且具有质量间隙 Δ > 0。物理上的成功与格点模拟不能替代这一数学存在性证明。本次未找到可核对的系统民意调查数字，因此不虚构「百分之多少的数学物理学家相信它可被证明」的比例
      note: >-
        Clay 官方页面把问题概括为：量子杨–米尔斯理论已是多数基本粒子理论的基础，其预言在许多实验中得到检验，但数学基础仍不清楚；它在强相互作用上的成功依赖于一种微妙的量子性质，即「质量间隙」——量子粒子具有正质量，尽管经典波以光速传播。这一性质由物理学家从实验中发现、并由计算机模拟确认，但尚未从理论的角度被理解；要确立杨–米尔斯理论与质量间隙的存在，需要在物理和数学中引入根本性的新思想。[1]
        Jaffe 与 Witten 撰写的官方问题陈述把「质量间隙」写成精确的谱条件，并给出上述存在性命题；他们同时写明：目前还不知道任何满足 Wightman（或任何其他合理）公理的非平凡四维相对论性场论。[2]
        这些都是官方陈述中的定性判断，不是抽样调查。格点规范理论和实验对量子色动力学（QCD）的支持，被作者用作物理动机，而不是已经完成的数学证明。[1][2]
    summary: >-
      Clay 数学研究所把「杨–米尔斯存在性与质量间隙」列为千禧年难题。官方条目的现行地址是 https://www.claymath.org/millennium/yang-mills-the-maths-gap/ （短地址 /millennium/yang-mills/ 会重定向至此；建议书中的 …/yang-mills-the-mass-gap/ 本次返回 HTTP 404）。页面把问题标为未解决，并指出：实验和计算机模拟暗示量子杨–米尔斯方程的解中存在质量间隙，但尚无证明。[1]
      所谓经典杨–米尔斯理论，是把电磁学中的阿贝尔规范群 U(1) 换成一个紧致规范群 G 之后得到的非阿贝尔规范理论。Jaffe 与 Witten 写出，曲率成为 F = dA + A ∧ A，运动方程由杨–米尔斯拉氏量导出；与麦克斯韦方程不同，这些方程是非线性的，但它们同样给出以光速传播的无质量波的经典描述。[2]
      把这一经典理论量子化之后，情况会发生变化。对弱相互作用，人们借助 Higgs 场等额外结构来避免经典波的无质量性；对强相互作用，关键则被归于量子杨–米尔斯理论自身的性质，尤其是渐近自由，以及在长距离上与经典图像截然不同的量子行为。若要用量子色动力学（规范群为 SU(3) 的非阿贝尔规范理论，再加上夸克场）成功地描述强力，Jaffe 与 Witten 要求它在量子层面具备三项与经典理论迥异的性质：质量间隙、夸克禁闭，以及手征对称性破缺。其中第一项被用来解释核力为何既强又短程：真空的每个激发都应具有某个正的最低能量 Δ。[2]
      千禧年问题所要的，不只是把这幅物理图像说圆，而是给出四维量子规范理论的一个数学上完备的例子。作者写明：经典规范理论已在数学可达的范围内，并在三、四维流形的研究中起过重要作用；但人们还没有一个四维时空中数学上完备的量子规范理论例子，甚至还没有四维量子规范理论的精确定义。[2]
      官方命题因而有两个彼此扣在一起的部分。存在性：定义一个满足至少与 Wightman 以及 Osterwalder–Schrader 公理同样强的公理性质的量子场论，其局域算子与曲率及其协变导数的规范不变多项式相对应，并且短距离上的关联函数应与渐近自由和微扰重整化的预言一致。质量间隙：哈密顿量 H 的谱在区间 (0, Δ) 中为空，对某个 Δ > 0；真空是零能量的、庞加莱不变的本征态，并且要求质量有限。[2]
      「构造性量子场论」（constructive quantum field theory, CQFT）正是为把这类存在性从物理论证变成数学定理而发展起来的工作整体。它在二、三维的标量场和其他模型上取得了大量成果，也对圆周率化的四维杨–米尔斯给出过部分估计；但官方陈述的判断是：这些答案仍是部分的，现有方法既没有指出如何建立对体积一致的质量间隙，也没有指出如何得到从四维环面到 R^4 的无限体积极限。需要新的思想。[2]
    definitions:
    - term: 经典杨–米尔斯理论（classical Yang–Mills theory）
      text: >-
        把电磁学的规范群 U(1) 换成紧致规范群 G 后得到的非阿贝尔规范理论。曲率取 F = dA + A ∧ A，场方程由杨–米尔斯拉氏量的变分得到。Jaffe 与 Witten 强调：这些方程是非线性的，但在经典层面上仍然描述以光速传播的无质量波。[2]
    - term: 质量间隙（mass gap）
      text: >-
        在官方陈述中有两层紧密相关的说法。对 QCD 的物理要求是：存在常数 Δ > 0，使真空的每个激发都至少具有能量 Δ，用以解释核力的短程性。[2]
        写成量子场论的谱条件则是：哈密顿量 H 在区间 (0, Δ) 中没有谱；这类 Δ 的上确界是质量 m，并要求 m 有限。有质量间隙的一个重要推论是聚类（clustering）：适当中心化的局域算子的关联在空间中以指数速度衰减。[2]
    - term: 构造性量子场论（constructive quantum field theory, CQFT）
      text: >-
        Jaffe 与 Witten 用来统称如下工作传统的名称：不满足于形式微扰，而是通过求解一列近似问题并证明其收敛，在数学上构造满足公理的非线性量子场论。其已知成果多在较低维时空或紧致近似（如环面）上；官方陈述认为，它为千禧年问题提供了部分答案，但还不是四维杨–米尔斯在 R^4 上带一致质量间隙的完整构造。[2]
    milestones:
    - year: 1954
      name: Yang 与 Mills 提出非阿贝尔规范理论
      explanation: >-
        Jaffe 与 Witten 将杨–米尔斯理论的发现指向 C. N. Yang 与 R. L. Mills, Physical Review 96 (1954) 191–195。本次未打开该原文，年份与出处仅按官方陈述文末文献表第 50 项记录，不转述其原文句子。[2]
    - year: 1960s–1970s
      name: 渐近自由与量子色动力学
      explanation: >-
        官方陈述把强相互作用中「经典杨–米尔斯波无质量」这一障碍的解决，归于量子杨–米尔斯理论本身的渐近自由等性质，以及随后以 SU(3) 为规范群的量子色动力学。本次未打开渐近自由的原始论文，叙述仅依据 Jaffe 与 Witten 的综述性说明。[2]
    - year: 2000
      name: Clay 千禧年问题正式提出
      explanation: >-
        Clay 数学研究所将「杨–米尔斯存在性与质量间隙」列为七道千禧年难题之一。官方问题陈述由 Arthur Jaffe 与 Edward Witten 撰写，现行官方 PDF 由条目页以 Official Problem Description 为题给出。[1][2]
    views:
    - position: 需要证明的是一个精确的数学命题：对任意紧致单规范群 G，R^4 上存在非平凡的量子杨–米尔斯理论，并且具有质量间隙 Δ > 0；存在性须达到至少与既有公理体系同样强的标准
      consensus_role: Clay 官方问题陈述，是讨论该问题的基准表述
      evidence:
        label: 官方条目页与官方问题陈述 PDF
        note: >-
          命题的精确措辞、公理要求、质量间隙的谱定义以及「非平凡」的短距离渐近自由条件，均以打开的官方 PDF 为准。[2]
          条目页提供物理动机与「尚无证明」的公开表述，但不替代 PDF 中的形式命题。[1]
          PDF 文件元数据中的 CreationDate 为 2006 年 8 月 5 日；它由现行官方条目页以 Official Problem Description by Arthur Jaffe and Edward Witten 为链接给出。
      holders:
      - name: Arthur Jaffe、Edward Witten
        identity: >-
          Clay 官方条目页将现行问题说明书标注为 Official Problem Description by Arthur Jaffe and Edward Witten。本次打开的 PDF 题为 QUANTUM YANG–MILLS THEORY，署名为这两位作者。打开的官方页面与 PDF 正文均未写明其当时所属机构，故不以未核对的职衔或单位称呼。[1][2]
      argument: >-
        官方陈述首先把「何谓四维量子规范理论存在」写具体。人们应定义一个量子场论，其局域场算子与曲率 F 及其协变导数的规范不变局域多项式相对应；这些算子的关联函数在短距离上应与渐近自由和教科书中的微扰重整化预言一致，其中包括应力张量和算子乘积展开，以及由渐近自由所规定的局域奇性。[2]
        在此之上再加质量间隙。真空向量 Ω 是庞加莱不变的，因而 HΩ = 0。正能量公理说 H 的谱落在 [0, ∞) 中。若对某个 Δ > 0，H 在 (0, Δ) 中没有谱，就称该理论具有质量间隙 Δ；这类 Δ 的上确界是质量 m，并要求 m < ∞。[2]
        形式命题只有一句：证明对任意紧致单规范群 G，R^4 上存在非平凡的量子杨–米尔斯理论，并且具有质量间隙 Δ > 0。所谓存在，包括建立至少与 Streater–Wightman 以及 Osterwalder–Schrader 所引公理同样强的公理性质。[2]
        作者还指出一些自然的延伸（孤立的单粒子态、禁闭、把存在定理从 R^4 推到任意四维流形等），但明确说：即使只解决上面这一陈述，也会成为数学上理解量子场论的一个转折点。[2]
      quotes:
      - text: >-
          Yang–Mills Existence and Mass Gap. Prove that for any compact simple gauge
          group G, a non-trivial quantum Yang–Mills theory exists on R^4 and has a mass gap
          Δ > 0. Existence includes establishing axiomatic properties at least as strong as
          those cited in [45, 35].
        text_zh: 杨–米尔斯存在性与质量间隙。证明：对任意紧致单规范群 G，R^4 上存在非平凡的量子杨–米尔斯理论，并且具有质量间隙 Δ > 0。所谓存在，包括建立至少与所引文献 [45, 35] 中公理同样强的公理性质。
        attribution: Arthur Jaffe 与 Edward Witten, Quantum Yang–Mills Theory（Clay 官方问题陈述）
        locator: 第 4 节 “The Problem”，第 6 页。公式中的 R^4、Δ 按原文写出；原文所标文献 45 为 Streater 与 Wightman (1964)，文献 35 为 Osterwalder 与 Schrader 的公理体系。
        ref: 2
      - text: >-
          A quantum field theory has a mass gap Δ if H has no spectrum in the interval (0, Δ) for some Δ > 0.
          The supremum of such Δ is the mass m, and we require m < ∞.
        text_zh: 若对某个 Δ > 0，哈密顿量 H 在区间 (0, Δ) 中没有谱，则称该量子场论具有质量间隙 Δ。这类 Δ 的上确界是质量 m，并且我们要求 m < ∞。
        attribution: Arthur Jaffe 与 Edward Witten, Quantum Yang–Mills Theory
        locator: 第 4 节，第 6 页
        ref: 2
    - position: 实验与计算机模拟为量子色动力学中的质量间隙提供了物理上的鼓励，但这不等于已经有一个令人信服的、更不必说数学上完备的理论计算；经典无质量波与量子带质量粒子之间的差别，正是问题的物理核心
      consensus_role: 官方陈述给出的物理动机，也是条目页对公众的概括
      evidence:
        label: 官方条目页与官方陈述中对实验、模拟和「尚未被理论理解」的判断
        note: >-
          条目页与 PDF 都把质量间隙说成已由实验发现、并由计算机模拟确认，但尚未从理论观点上被理解。[1][2]
          PDF 对 QCD 三项性质的判断更审慎：它们在某种程度上可以在高度简化的模型（如强耦合格点规范理论）中被看到，但并不存在一个令人信服的——无论是否数学上完备的——理论计算，在 QCD 本身而非其严重简化的截断中证明其中任何一项。[2]
          具体实验数字、格点论文的数据，本次均未打开，故不转述。
      holders:
      - name: Clay Mathematics Institute
        identity: 千禧年难题官方条目页的发布者；页面将问题标为 Unsolved。[1]
      - name: Arthur Jaffe、Edward Witten
        identity: 同上，官方问题陈述第 1 节对 QCD 三项性质的讨论。[2]
      argument: >-
        经典杨–米尔斯波以光速传播、因而是无质量的，这曾经是把该理论用于弱力和核力的严重障碍：这两种力是短程的，而且许多粒子是有质量的。[2]
        官方条目用一句话抓住后来的转折：杨–米尔斯理论能够成功描述基本粒子的强相互作用，依赖于一种微妙的量子力学性质，即「质量间隙」——量子粒子具有正质量，尽管经典波以光速传播。[1]
        对 QCD，Jaffe 与 Witten 把质量间隙列为三项必需的量子性质之首，并解释其物理功能：它是为了说明核力为何既强又短程。他们承认，实验——因为 QCD 在与实验的对照中有许多成功——以及自 1970 年代末以来的计算机模拟，都强烈鼓励人们相信 QCD 具备这些性质；但他们紧接着写明，这些性质尚未被充分从理论上理解，也不存在一个令人信服的理论计算，在 QCD 本身中证明其中任何一项。[2]
        因此，把「质量间隙是否存在」理解成一个已经由对撞机或格点计算关闭的物理问题，并不符合官方陈述的层次：物理图像可以很有说服力，千禧年问题要的却是数学上的存在性与谱间隙。
      quotes:
      - text: >-
          Experiment and computer simulations suggest the existence of a “mass gap” in the solution to the quantum versions of the Yang-Mills equations. But no proof of this property is known.
        text_zh: 实验和计算机模拟暗示，量子版本的杨–米尔斯方程的解中存在「质量间隙」。但这一性质尚无证明。
        attribution: Clay Mathematics Institute, Yang-Mills & the Mass Gap 官方条目
        locator: 条目页开篇导语，https://www.claymath.org/millennium/yang-mills-the-maths-gap/ ，本次按 2026-11-24 打开的页面核对
        ref: 1
      - text: >-
          The successful use of Yang-Mills theory to describe the strong interactions of elementary particles depends on a subtle quantum mechanical property called the “mass gap”: the quantum particles have positive masses, even though the classical waves travel at the speed of light.
        text_zh: 杨–米尔斯理论能够成功描述基本粒子的强相互作用，依赖于一种微妙的量子力学性质，即所谓「质量间隙」：量子粒子具有正质量，尽管经典波以光速传播。
        attribution: Clay Mathematics Institute, Yang-Mills & the Mass Gap 官方条目
        locator: 条目页概述正文，同上 URL
        ref: 1
      - text: >-
          It must have a “mass gap;” namely there must be some constant Δ > 0
          such that every excitation of the vacuum has energy at least Δ.
        text_zh: 它必须具有「质量间隙」；也就是说，必须存在某个常数 Δ > 0，使得真空的每个激发都至少具有能量 Δ。
        attribution: Arthur Jaffe 与 Edward Witten, Quantum Yang–Mills Theory
        locator: 第 1 节对 QCD 三项量子性质的第 (1) 条，第 3 页
        ref: 2
    - position: 构造性量子场论已经在较低维和某些简化模型中证明了非线性量子场的存在与质量间隙，但对四维杨–米尔斯在 R^4 上给出带一致质量间隙的完整构造，现有方法尚未指出道路
      consensus_role: 官方陈述对二十世纪数学进展的自我估价，也是「为何问题仍然开放」的直接说明
      evidence:
        label: 官方问题陈述第 6 节对 CQFT 的综述
        note: >-
          有关二维、三维标量场、二维 Higgs 模型以及 Balaban 在三、四维格点上的工作，均按 Jaffe 与 Witten 的转述记录；本次未打开这些原始论文，因而不引用其定理编号或页码，也不把官方综述写成对这些工作的独立复核。[2]
          官方陈述对「尚未有非平凡四维 Wightman 理论」「对体积一致的质量间隙尚无现成思路」的判断，是本文关于未解部分的直接依据。[2]
      holders:
      - name: Arthur Jaffe、Edward Witten
        identity: 同上；第 6 节 “Mathematical Perspective” 及第 6.5 节对杨–米尔斯构造的讨论。[2]
      argument: >-
        Jaffe 与 Witten 把 Wightman 等人约五十年来的追问写成：数学上定义良好的相对论性非线性量子场论究竟是否存在。他们给出的部分答案是：随着构造性量子场论这一整套工作的出现，非线性量子场论的存在性与物理性质已经被大量证明。[2]
        说「部分」，是因为这些理论多半把四维闵氏时空换成了二维或三维，或换成环面之类的紧致近似。作者提到，关于四维环面 T^4 上的杨–米尔斯已有一些结果，并且有充分迹象表明已知方法可以延伸到在 T^4 上构造该理论；但即便如此，他们接着写的是一个更强的否定：目前还不知道任何满足 Wightman（或任何其他合理）公理的非平凡四维相对论性场论。即便完成紧致空间上杨–米尔斯的详细数学构造，也会是重大突破；可即便做到了，也还没有现成的想法指出如何建立对体积一致的质量间隙，或如何得到 T^4 → R^4 的无限体积极限。[2]
        在方法上，CQFT 被描述为通过一列近似问题的收敛来得到非线性问题的精确解，其分析工具包括关联不等式、对称性和所谓集团展开。官方陈述回顾了 1970 年代起在 R^2 上带小多项式非线性的场论（先有限体积，再无限体积极限）如何被证明满足 Wightman 公理并给出非平凡散射，以及后来在三维和其他相互作用上的延伸；也提到二维阿贝尔 Higgs 模型是当时唯一被完整构造、满足公理且具有质量间隙的相互作用规范理论例子。把这些结论推到哪怕是二维的非阿贝尔 Higgs 模型，在他们看来也已是定性上的进展。[2]
        针对杨–米尔斯，Wilson 的格点方案被写成一条重要路径：在紧致规范群和紧致时空上，泛函积分变成有限维积分，然后必须证明格距趋于零、体积趋于无穷时，规范不变观测量的期望存在极限。Balaban 在三维周期格点以及随后在四维上的工作，被作者视为朝向紧致时空上连续极限的重要步骤，尤其是对渐近自由的分析；但这些结果仍有待延伸到规范不变函数的期望。官方陈述的结语是：要证明对时空体积一致的质量间隙，需要新的思想；而这样的结果大概才能使人着手研究 T^4 → R^4 的极限。[2]
      quotes:
      - text: >-
          In fact, at present we do not know any non-trivial relativistic field theory that
          satisfies the Wightman (or any other reasonable) axioms in four dimensions.
        text_zh: 事实上，目前我们还不知道任何在四维中满足 Wightman（或任何其他合理）公理的非平凡相对论性场论。
        attribution: Arthur Jaffe 与 Edward Witten, Quantum Yang–Mills Theory
        locator: 第 6 节开篇，第 7 页
        ref: 2
      - text: >-
          New ideas are needed to prove the existence of a mass gap that is uniform in
          the volume of space-time.
        text_zh: 要证明存在一个对时空体积一致的质量间隙，需要新的思想。
        attribution: Arthur Jaffe 与 Edward Witten, Quantum Yang–Mills Theory
        locator: 第 6.5 节末尾，第 12 页
        ref: 2
    open_parts: >-
      官方命题至今仍是开放的：它要求的是 R^4 上非平凡量子杨–米尔斯理论的数学存在，加上质量间隙，而不是对简化模型或有限体积近似的部分结果。[1][2]
      Jaffe 与 Witten 自己列出了若干未被本题正式要求、但自然相关的延伸：孤立单粒子态（在质量间隙之上再要一个上间隙）、禁闭、手征对称性破缺、以及其他保持渐近自由的四维规范理论中的动力学问题，并把存在定理从 R^4 推到任意四维流形。[2] 这些都比原命题更强，不能把其中任何一项的进展自动算成对千禧年问题的解答。
      官方陈述还提到一些可能的思路——例如非经典的变量替换或对偶、大 N 展开与弦论描述、以及超对称理论中的质量间隙——但均被写成推测或仅在带物质场的特定系统中有进展，而不是对无费米子纯规范理论的现成证明。[2] 本次未打开这些被引文献，故不转述其具体结果。
      自该官方陈述（现行 PDF 元数据时间为 2006 年）以来是否出现了改变问题地位的新证明，需要另以此后经过同行评议的文献为准；本文只依据 2026-11-24 打开的官方条目（仍标为 Unsolved）和官方问题陈述，不把未被打开的后续主张写进结论。
    references:
    - id: 1
      citation: >-
        Clay Mathematics Institute. Yang-Mills & the Mass Gap. Millennium Problems. 本次按 2026-11-24 打开的官方条目页核对，现行 URL 为 https://www.claymath.org/millennium/yang-mills-the-maths-gap/ （注意 slug 中为 maths，页面标题为 Yang-Mills & the Mass Gap）。短地址 https://www.claymath.org/millennium/yang-mills/ 会 301 重定向至上述页面；https://www.claymath.org/millennium/yang-mills-the-mass-gap/ 本次返回 HTTP 404。
      url: https://www.claymath.org/millennium/yang-mills-the-maths-gap/
    - id: 2
      citation: >-
        Jaffe, A., & Witten, E. Quantum Yang–Mills Theory. Official problem description, Clay Mathematics Institute. 由官方条目页以 Official Problem Description by Arthur Jaffe and Edward Witten 为题链接。本次打开的 PDF 为 https://www.claymath.org/wp-content/uploads/2022/06/yangmills.pdf （HTTP 200，application/pdf，14 页，195,976 字节；PDF 元数据 CreationDate 为 2006 年 8 月 5 日）。
      url: https://www.claymath.org/wp-content/uploads/2022/06/yangmills.pdf
- id: 2026-11-24-phil-demarcation
  date: '2026-11-24'
  category: philosophy
  title_zh: 一个未受专业训练但理性的人，怎样区分科学与宗教？
  title_en: How can an uneducated but rational person differentiate between science and religion?
  commentary: >-
    当宇宙论或进化论被说成「不过是另一种创世神话」时，外行往往既无法立刻讲清证据链，又不想只靠权威压人。这个问题把「划界」从专家内部的技术争论，拉回到一个理性但缺乏训练的人还能不能公开检验的标准上来。
  source_name: Philosophy Stack Exchange
  source_url: https://philosophy.stackexchange.com/questions/29755/how-can-an-uneducated-but-rational-person-differentiate-between-science-and-reli
  author: Alexander S King
  source_type: stackexchange
  tags:
  - 科学与宗教
  - 划界问题
  - 可证伪性
  - 不相重叠教导权
  - 知识论
  answer:
    format: scholarly
    reviewed_at: '2026-11-24'
    consensus:
      label: >-
        哲学界没有一套可放进口袋的算法，能让未受专业训练的人一劳永逸地把「科学」与「宗教」切开；科学与伪科学的划界，也不等于科学与宗教的划界。仍有若干可公开使用的判准——如可否与观测冲突、是否在失败后修正、主张落在经验世界还是意义与价值——但它们既不机械，也不能覆盖所有历史与教义形态
      note: >-
        Stanford Encyclopedia of Philosophy（下称 SEP）条目「Science and Pseudo-Science」开篇即指出：在具体案例上的一致，远大于在一般标准上的一致；这本身说明科学与伪科学的关系仍有大量哲学工作要做。[1]
        同一条目第 8 节把「科学与宗教」明确写成与「科学与伪科学」相关、但并不相同的另一组区分。[1]
        Popper 把可证伪性（更精确地说，陈述系统须能与可能的观测相冲突）作为经验科学与伪科学或形而上学的划界标准，但这首先针对的是科学与伪科学／形而上学，而不是「科学对宗教」的完整定义。[1][2]
        Gould 提出不相重叠的教导权（NOMA），把科学限于经验宇宙的事实与理论、宗教限于道德意义与价值；SEP「Religion and Science」把它归入有影响的「独立」模型，同时指出宗教似乎也会作出经验性主张，因而独立模型有明显困难。[3][4]
        本次未找到可核对的哲学家抽样调查，因此不虚构「百分之多少的科学哲学家接受某一划界标准」。
    summary: >-
      原问题来自 Philosophy Stack Exchange：提问者 Alexander S King 设想一个只受过基本读写训练、却头脑清楚、心态开放的人——在他或她看来，科学论文像难懂的经文，教授与机构像有准入门槛的神职与教廷，宇宙学与进化论则像无法亲自核验的「形而上学」主张。若再加上不必轻信传闻、传统或权威的态度，似乎同样有理由怀疑科学结论与宗教教义。[本次经 Stack Exchange 官方 API 核对题名与提问者显示名；页面 HTML 对简单抓取返回 403，故身份不以未打开的实时 HTML 为准。]
      首先需要分开两件常被混在一起的事。二十世纪科学哲学里的「划界问题」（Popper 所用德语为 Abgrenzungsproblem），主要是问：凭什么把某些主张算作经验科学，而把另一些算作伪科学或形而上学。[1][2]
      科学与宗教如何相处，则是另一条文献传统：Barbour 的冲突、独立、对话、整合四分法，以及 Gould 的 NOMA，讨论的是两个领域是否重叠、应否彼此约束，而不是给「伪科学」下定义。[3][4]
      对那个「未受专业训练但理性」的人，诚实的答复是：没有单一测试可以代替对具体主张的考察，也没有必要先修完相对论才能开始区分。较可用的公共问题包括：这条主张是否对经验世界作出可用观测加以冲突的判断？当观测不如预期时，主张是被修正，还是被额外假说保护起来？它主要在谈宇宙如何运作，还是在谈人应当如何生活、苦难与拯救意味着什么？提出它的共同体，是否以公开程序承认错误？这些标准来自已打开的哲学讨论，它们有用，但不构成算法，尤其当宗教也对历史或自然发出经验性命题、或科学被用于价值争论时，边界会收紧。[1][3][4]
    definitions:
    - term: 划界问题（demarcation problem）
      text: >-
        Popper 在 1933 年引入德语 Abgrenzungsproblem，要求一个标准，以区分「经验—科学的」断言与「形而上学的」断言；在《研究的逻辑》中，他又把它说成是区分经验科学与数学、逻辑以及「形而上学」体系的问题。Hansson 指出，这些较早文本并未提及「伪科学」；Popper 后来才把目的说成也包括划分经验科学与伪科学。[1]
    - term: 可证伪性（falsifiability）
      text: >-
        Popper 拒绝把可证实性当作科学的标准，转而要求理论必须可证伪。Hansson 转述其更精确的表述是：陈述或陈述系统若要被列为科学的，必须能够与可能的或可设想的观测相冲突。按 Popper 后来的强调，这首先关乎句子的逻辑结构，即使实践上暂时无法完成证伪，一个陈述仍可在逻辑上是可证伪的。[1][2]
    - term: 不相重叠的教导权（NOMA, nonoverlapping magisteria）
      text: >-
        Gould 借用天主教「教导权」（magisterium，即教学权威的领域）一词，主张科学与宗教各有合法的教导范围且不应重叠：科学之网覆盖经验宇宙（由什么构成、何以如此运作），宗教之网覆盖道德意义与价值问题。他把这一原则称为 NOMA。[4]
    - term: 独立模型（independence model）
      text: >-
        SEP「Religion and Science」在介绍科学—宗教关系的类型学时，将独立模型概括为：科学与宗教探索分离的领域、提出不同的问题。Gould 的 NOMA 被列为其中有影响的一种；该条目同时记录了对这一模型的批评，即宗教往往也会作出经验性主张。[3]
    milestones:
    - year: 1933–1935
      name: Popper 提出划界问题并在《研究的逻辑》中展开
      explanation: >-
        据 Hansson 的梳理，Popper 1933 年的短文引入 Abgrenzungsproblem；1935 年的 Logik der Forschung 把它表述为区分经验科学与数学、逻辑及形而上学体系的任务。本次未打开这些德文或 1959 年英译原书，上述要点仅以已打开的 SEP 条目为准。[1]
    - year: 1962
      name: Kuhn《科学革命的结构》出版，随后以「解谜」对抗单纯的证伪图景
      explanation: >-
        Hansson 转述 Kuhn 对 Popper 的批评：后者用只适用于偶尔出现的革命时期的语汇来刻画整个科学事业；Kuhn 主张，最能把科学与其他活动区分开来的，是革命之间的「常规科学」及其解谜能力。本次未打开 Kuhn 原书，仅依据 SEP 对 Kuhn 1974 年表述的转述。[1]
    - year: 1997
      name: Gould 发表「不相重叠的教导权」
      explanation: >-
        Gould 在 Natural History 1997 年 3 月号发表 Nonoverlapping Magisteria，以 NOMA 作为他认为可原则性消解科学与宗教「冲突」或「战争」的方案，并以 Pius XII 与 John Paul II 关于进化的文献为讨论线索。[4]
    views:
    - position: 可公开使用的划界线索是可检验性：一个经验科学的主张必须能够与可能的观测相冲突，而不能只被不断地「证实」或用辅助假说免疫
      consensus_role: >-
        这是二十世纪科学哲学中最广为人知的划界方案之一，但即便在科学与伪科学问题上也远非无争议；把它直接当成「科学对宗教」的定义，则超出了 Popper 问题的原初范围
      evidence:
        label: 权威综述对 Popper 文本史与标准本身的转述，而非本次打开的 Popper 原书
        note: >-
          可证伪性的准确措辞与限定，依据 Hansson 与 Thornton 两篇已打开的 SEP 条目。本次未能合法打开《研究的逻辑》或 Conjectures and Refutations 全文，因此不引用这两本书的页码或未在 SEP 中出现的原句，也不把 Popper 后来对达尔文理论等的复杂评价写进正文。[1][2]
      holders:
      - name: Karl Popper
        identity: >-
          二十世纪科学哲学家；其划界与可证伪性主张，此处仅按已打开的 SEP 条目「Science and Pseudo-Science」「Karl Popper」所转述来介绍。[1][2]
      - name: Sven Ove Hansson
        identity: Stanford Encyclopedia of Philosophy 条目「Science and Pseudo-Science」作者。该条目首次发布于 2008 年 9 月 3 日，本次打开的文本标明实质性修订日期为 2025 年 7 月 28 日。[1]
      argument: >-
        对那个无法亲自推导场方程或阅读专业期刊的人，Popper 传统提供的不是「先把物理学学会再来谈」，而是一个可以对着具体句子提问的标准：它有没有指出何种观测会与之冲突？[1][2]
        Thornton 在 Popper 生平部分记载：Einstein 理论具有若为假便可证伪该理论的可检验推论，而 Popper 认为精神分析先驱的理论被表述得只适合于被证实；这种对比，正是提问者所需要的那种不必先成为专家也能抓住的差别。[2]
        Hansson 也提醒，Popper 较早文本里的划界对象是经验科学与形而上学，伪科学是后来才明确进入其问题表述的；因此，即使用可证伪性来检查某些宗教的经验命题（例如对自然史的字面主张），也不能由此推出「凡宗教皆伪科学」，或「凡不可证伪的都没有意义」。[1]
        作为实践规则，它仍然有用：若一种宇宙论或进化叙事不断指出可失败的观测，并在失败时修正自身，它就与「只许证实、不许反驳」的教义话语不同；但「有用」不等于「充分」，下文两种立场会说明单纯一条逻辑标准为什么不够。
      quotes:
      - text: >-
          Instead he proposed as a criterion that the theory be
          falsifiable, or more precisely that “statements or systems of
          statements, in order to be ranked as scientific, must be capable of
          conflicting with possible, or conceivable observations” (Popper
          1962, 39).
        text_zh: 相反，他提出的标准是理论必须可证伪，或更精确地说，「陈述或陈述系统若要被列为科学的，必须能够与可能的或可设想的观测相冲突」（Hansson 转引 Popper 1962, 39）。
        attribution: Sven Ove Hansson，SEP 条目 Science and Pseudo-Science 转述 Popper
        locator: 第 4.3 节 “Popper’s falsificationism”。括号内 “Popper 1962, 39” 是该条目的文献定位；本次未打开 Popper 1962 原书，故不把 39 页当作已核对的原书页码
        ref: 1
    - position: 历史与社会学取向表明，科学日常实践并不等于不断证伪基本理论；哲学家在一般标准上几乎无法达成一致，因此不存在一条可代替判断力的分界线
      consensus_role: >-
        对「单一逻辑标准即可划界」的主流批评路径之一；Hansson 把它写成当代讨论中的一个突出悖论：个案上高度一致，原则上高度分歧
      evidence:
        label: SEP 对 Kuhn 批评的转述，以及 Hansson 对划界共识结构的判断
        note: >-
          Kuhn 的「解谜」标准与对证伪主义的批评，本次仅依据 Hansson 第 4.4 节对 Kuhn 1974 年文本的转述，未打开《科学革命的结构》。第 8 节关于「具体问题上近乎全体一致、一般标准上几乎完全不同意」的判断，是综述作者的定性估计，不是抽样调查。[1]
      holders:
      - name: Thomas Kuhn
        identity: >-
          其以常规科学的解谜活动来区分科学与其他事业的主张，此处仅按 Hansson 对 Kuhn 1974 年表述的转述介绍；本次未打开 Kuhn 原书或该 1974 年文本。[1]
      - name: Sven Ove Hansson
        identity: 同上，SEP 条目「Science and Pseudo-Science」作者。[1]
      argument: >-
        若把 Popper 的标准理解成「科学家整天都在试图推翻自己的基本理论」，Kuhn 的反驳是：那种图景只适用于科学偶尔进入革命的时刻；更常见的「常规科学」是在接受当前理论的前提下解谜，失败了往往去调整测量或参数，而不是立即抛弃理论。[1]
        他也用天文学与占星术作对比：自古以来天文学是解谜活动，因而算科学；预测失败对占星术并不构成可在理论内部着手解决的谜题。Hansson 随即指出一个令人深思的现象：Kuhn 与 Popper 的标准在理论上大不相同，却对何者算科学、何者算伪科学得出大体相同的结论。[1]
        第 8 节把这种「理论分歧、个案收敛」推广为相当一般的现象，并列举创世论、占星术、顺势疗法、气候变迁否认等在知识共同体中被广泛视为伪科学的例子；与此同时，一般标准几乎完全无法统一。对原问题而言，这意味着：一个理性的外行可以合理依赖「这些具体主张是否会被该领域严肃对待为科学」这类公共事实，但若指望哲学家交给他一条定义，让他在遇到全新话语时自动判定，现有文献并不支持这种期待。[1]
        同一节还把「科学与宗教」列为与伪科学识别相关、却又另外成篇的问题。换言之，即使用于科学／伪科学的判准在个案上相当齐整，也不能直接把它当成科学／宗教的同一把尺子。[1]
      quotes:
      - text: >-
          It is in a sense paradoxical that so much agreement has been reached
          in particular issues in spite of almost complete disagreement on the
          general criteria that these judgments should presumably be based upon.
        text_zh: 在某种意义上显得悖谬的是：尽管在这些判断本应依据的一般标准上几乎完全无法同意，人们却在具体问题上达成了如此之多的一致。
        attribution: Sven Ove Hansson，SEP 条目 Science and Pseudo-Science
        locator: 第 8 节 “Unity in diversity”
        ref: 1
    - position: 可以把科学与宗教看成两个不相重叠的教导领域，从而给外行一条简捷规则：科学管经验事实与理论，宗教管道德意义与价值
      consensus_role: >-
        在科学与宗教的公众讨论中影响很大的「独立」方案；在专门的科学—宗教研究领域里，它是重要类型之一，但并非没有有力批评
      evidence:
        label: 已打开的 1997 年原文，以及 SEP 对其在类型学中的定位与批评
        note: >-
          Gould 的定义与「两网」比喻来自本次打开的 Natural History 1997 年 3 月号文章的可靠转载本（原刊页码未能在该转载本上核对）。SEP 对其「既是描述性也是规范性」的概括，以及「宗教也会作经验主张」的批评，来自已打开的「Religion and Science」条目；该条目所引 Gould 2001: 739 的另一处表述，因本次未打开 2001 年文本，不予引用。[3][4]
      holders:
      - name: Stephen Jay Gould
        identity: >-
          所打开的文章文末介绍：在哈佛大学教授生物学、地质学与科学史，并为美国自然史博物馆无脊椎动物部的 Frederick P. Rose Honorary Curator。文章刊于 Natural History，1997 年 3 月。[4]
      - name: Helen De Cruz
        identity: Stanford Encyclopedia of Philosophy 条目「Religion and Science」作者。该条目首次发布于 2017 年 1 月 17 日，本次打开的文本标明实质性修订日期为 2022 年 9 月 3 日。[3]
      argument: >-
        Gould 并不否认科学与宗教的边界会「互相嵌合」，也举出既需要进化事实、又需要道德论证的问题（例如对其他物种的责任）。但他的原则性主张是：不应存在科学与宗教的「冲突」或「战争」，因为各自的合法教导范围并不重叠。[4]
        对提问者设想的那个人，NOMA 给出一种不必先学会宇宙学就能使用的分工：若争论的是宇宙年龄、物种起源或黑洞是否存在，应问经验证据；若争论的是生命的意义、苦难如何承受或人该如何生活，那是另一套教导权。Gould 本人在文中写到，灵魂一类题目是科学触碰不到的，因而也不会被某种神学立场所威胁。[4]
        这一方案的吸引力在于清晰。可是「独立」若被推到「宗教不得作出任何事实陈述」，SEP 指出将很难为其价值与伦理主张提供理由；更直接的反例是：宗教传统看起来确实会作出经验性主张，例如耶稣死后显现，或早期希伯来人走过分开的红海。[3]
        因此，NOMA 作为防止范畴错误的启发式规则是有用的，但不能预先保证所有自我理解的「宗教」都不会进入科学的经验网。对于「大爆炸是否只是另一种创世神话」这种原问题里的挑衅，NOMA 与可检验性可以合用：神话若提出对宇宙历史的经验断言，它就已经离开了纯价值领域，必须接受与观测冲突的检验；若它只谈论意义，则不必也不应被当成物理理论来竞争。
      quotes:
      - text: >-
          No such conflict should exist because each subject has a legitimate
          magisterium, or domain of teaching authority— and these magisteria
          do not overlap (the principle that I would like to designate as NOMA,
          or “nonoverlapping magisteria”). The net of science covers the
          empirical universe: what is it made of (fact) and why does it work
          this way (theory). The net of religion extends over questions of
          moral meaning and value.
        text_zh: 不应存在这种冲突，因为每个主题都有其合法的教导权，亦即教学权威的领域——而这些教导权并不重叠（我愿将这一原则称为 NOMA，即「不相重叠的教导权」）。科学之网覆盖经验宇宙：它由什么构成（事实），以及它何以如此运作（理论）。宗教之网则延伸到道德意义与价值的问题。
        attribution: Stephen Jay Gould，Nonoverlapping Magisteria
        locator: >-
          Natural History，1997 年 3 月号。本次打开并核对的是转载 PDF（文内页码为转载本第 4 页）；该转载本未印出原刊页码，故不以未核对的原刊页码定位
        ref: 4
    - position: 科学与宗教并非总是分治两个互不来往的领域；冲突是少数立场，但「有时重叠」是必须承认的事实，对话或整合则是另外的回应方式
      consensus_role: >-
        SEP 将「冲突模型」写成该研究领域中目前的少数立场，同时把独立模型的经验反例、以及对话／整合类型，作为同一类型学里的其他选项
      evidence:
        label: 一篇已打开的 SEP 领域综述，对类型学与文献分布作定性判断
        note: >-
          「该领域绝大多数作者对冲突模型持批评态度」「冲突模型目前是少数立场」是 De Cruz 条目中的定性概括，不是调查百分比。Plantinga「冲突不在科学与宗教、而在科学与自然主义」以及 McGrath 的 POMA 等，本次均未打开其原书，只按该条目的简述记录，不转述其论证细节或页码。[3]
      holders:
      - name: Helen De Cruz
        identity: 同上，SEP 条目「Religion and Science」作者。[3]
      argument: >-
        若提问者面对的，不只是「科学像不像宗教机构」，而是某些宗教确实对宇宙年龄、物种历史或神迹作出与科学研究相竞争的经验主张，那么坚持「两个领域永不相遇」就会低估实际重叠。[3]
        De Cruz 介绍 Barbour 仍最具影响的四分法：冲突、独立、对话、整合。冲突模型严重依赖伽利略审判与达尔文主义接受史这类叙事；该条目判断，科学与宗教研究领域的绝大多数作者认为这一模型基于对历史记录的浅薄、党派性阅读，尽管仍有少数作者以哲学论证或重新检视历史来支持它。[3]
        条目也写明：当代公共领域中，进化论与创世论／智能设计的对峙（并提到 2005 年 Kitzmiller v. Dover 等诉讼）容易让人以为科学与宗教必然冲突；即便只看进化论的接受史，关系也更复杂，例如英国与美国的差异。[3]
        对话模型假定双方在预设、方法或概念上有共同地基；整合则走得更远，包括自然神学、自然的神学等路径。这些方案是否成功，本身仍有争议，但它们共同反对一种对原问题有害的简化：要么科学与宗教是同一类「信仰体系」，要么它们在逻辑上永远不可能对同一命题发言。[3]
        对那个理性的外行，更审慎的态度或许是：先问眼前这个具体主张属于哪一类——可检验的经验命题、意义与价值的教导，还是二者的混合物——再选用可证伪性、NOMA 的分工，或承认重叠后去看证据，而不是先选择一种总理论。
      quotes:
      - text: >-
          One obvious problem with the independence model is that if religion were
          barred from making any statement of fact, it would be difficult to
          justify its claims of value and ethics. For example, one could not
          argue that one should love one’s neighbor because it pleases the
          creator (Worrall 2004). Moreover, religions do seem to make empirical
          claims, for example, that Jesus appeared after his death or that the
          early Hebrews passed through the parted waters of the Red Sea.
        text_zh: 独立模型的一个明显问题是：如果禁止宗教作出任何事实陈述，就很难为其价值与伦理主张辩护。例如，人们将不能主张「应当爱邻人，因为这使造物主喜悦」（Worrall 2004）。此外，宗教看起来确实会作出经验性主张，例如耶稣在死后显现，或早期希伯来人走过分开的红海之水。
        attribution: Helen De Cruz，SEP 条目 Religion and Science
        locator: 第 1.3 节 “Taxonomies of the interaction between science and religion” 中讨论独立模型的段落
        ref: 3
    open_parts: >-
      划界标准在哲学上仍未统一：Hansson 把「个案一致、原则分歧」本身视为尚待解释的问题，而不是已经关闭的争论。[1]
      科学与宗教的关系依赖「宗教」「科学」在具体传统中如何被理解——不同宗教对经典、自然与神迹的态度差别很大，本次主要依据以基督教讨论为重要线索的已打开文献，不能外推成对一切宗教的答案。[3]
      Gould 的 NOMA 是否成功，取决于宗教是否以及在何种程度上作出经验主张；这一点在公共争论中仍尖锐，而对话、整合与冲突模型各自如何处理重叠，也没有单一裁决。[3][4]
      Popper 原书、Kuhn 原书以及 Plantinga、McGrath 等在 SEP 中被点名的著作，本次均未打开，他们的限定、修订与反批评不能在这里被当成已核对的原文。
    references:
    - id: 1
      citation: >-
        Hansson, S. O. Science and Pseudo-Science. The Stanford Encyclopedia of Philosophy. First published 3 September 2008; substantive revision 28 July 2025. 本次打开并核对的是 https://plato.stanford.edu/entries/pseudo-science/ 。
      url: https://plato.stanford.edu/entries/pseudo-science/
    - id: 2
      citation: >-
        Thornton, S. Karl Popper. The Stanford Encyclopedia of Philosophy. First published 13 November 1997; substantive revision 31 July 2026. 本次打开并核对的是 https://plato.stanford.edu/entries/popper/ 。
      url: https://plato.stanford.edu/entries/popper/
    - id: 3
      citation: >-
        De Cruz, H. Religion and Science. The Stanford Encyclopedia of Philosophy. First published 17 January 2017; substantive revision 3 September 2022. 本次打开并核对的是 https://plato.stanford.edu/entries/religion-science/ 。
      url: https://plato.stanford.edu/entries/religion-science/
    - id: 4
      citation: >-
        Gould, S. J. (1997). Nonoverlapping magisteria. Natural History (March 1997). 本次打开并核对的转载本为 https://jbburnett.com/resources/gould_nonoverlapping.pdf ；并以 Internet Archive 快照 https://web.archive.org/web/20170104061453/http://www.stephenjaygould.org/library/gould_noma.html 交叉核对应文。转载本未印原刊页码，引用不以未核对的原刊页码为准。
      url: https://jbburnett.com/resources/gould_nonoverlapping.pdf
- id: 2026-11-24-phil-omni-god
  date: '2026-11-24'
  category: philosophy
  title_zh: 「全知、全能、全在」的上帝定义是自洽的吗？
  title_en: Is the "omniscient-omnipotent-omnipresent" definition of God consistent?
  commentary: >-
    把「无限知识、无限能力、无处不在」捆成一个定义，会把至少四类不同的一致性问题叠在一起。先把问题拆开，比急于给出一个「自洽」或「悖论」的总判决更重要。
  source_name: Philosophy Stack Exchange
  source_url: https://philosophy.stackexchange.com/questions/300/is-the-omniscient-omnipotent-omnipresent-definition-of-god-consistent
  author: AIB
  source_type: stackexchange
  tags:
  - 全能
  - 全知
  - 全在
  - 恶的问题
  - 自由意志
  answer:
    format: scholarly
    reviewed_at: '2026-11-24'
    consensus:
      label: >-
        没有单一、被普遍接受的裁决。标题里捆在一起的至少是四类不同问题：全能自身（如「石头悖论」）、全能与全善（以及全知）在恶的问题中是否逻辑相容、无误预知与自由意志、以及作为另一属性的全在。答案高度依赖于如何定义这些属性——尤其是全能究竟指「能做任何事」，还是「能做一切绝对可能的事」
      note: >-
        SEP「Omnipotence」把全能理解为极大的能力，并开篇提出：是否存在对全能的一致分析、这一分析对上帝本性意味着什么；若全能被发现不可理解，或与道德完美不相容，则传统西方有神论为假。[1]
        该条目用「石头悖论」展示表面上无论怎样回答都会失去「全能」，随后给出在「本质地全能」与「偶性地全能」下的不同消解，其前提是全能者不必能实现不可能的事态。[1]
        这一限定与 Aquinas 将全能理解为能做一切「绝对可能」之事、而不包括自相矛盾之事的经典路线一致。[2]
        Mackie 则把恶的问题写成一个逻辑问题：在补充「善者会尽力消除恶」与「全能者的能力没有限制」之后，一个全能且全善的存在与恶的存在不相容；他认为所考察的解决方案无一站得住，除非以严重改动有神论核心命题的方式修改其中至少一项。[3]
        预知与自由是另一条独立文献：SEP「Foreknowledge and Free Will」将神学宿命论表述为——若有存在无误地知道全部未来，则无人的行动是自由的——并记录相容论与不相容论的长期争论，同时强调该论证是否可靠并不显而易见。[5]
        全在被同一传统列为神圣属性，但 SEP「Omnipresence」指出它所吸引的哲学注意少于全能、全知或永恒，其核心困难是非物质的上帝如何在空间中在场，而不是石头悖论那种同一形式的二难。[6]
        本次未找到可核对的哲学家民意调查数字，因此不虚构赞成或反对「该定义自洽」的比例。
    summary: >-
      原问题由 AIB 于 2011 年在 Philosophy Stack Exchange 提出。提问者把上帝「通常」定义为全知（无限知识）、全能（不受限制的能力）、全在（无处不在）的存在，并举出两类悖论：一是「上帝是否知道自己明天要做什么，若知道，还能不能做别的」；二是「全能者能否造出一块自己举不起的石头」。他问：这是否意味着这个常见定义在逻辑上不一致。[本次经 Stack Exchange 官方 API 核对题名与提问者显示名；页面 HTML 对简单抓取返回 403。]
      这四个词并不是同一个问题。石头悖论首先挑战的是「全能」这一属性单独是否可理解。[1]
      恶的问题则把全能与「全善」（提问标题未写，但论证中常被一并引入）以及恶的存在放在一起，问它们是否逻辑相容；全知在标准表述里也会进入：若上帝知道恶的存在，又有能力并有意愿消除它，为何恶仍在。[3][4]
      「知道明天要做什么、还能不能做别的」以及「无误预知与人的自由」，属于预知—自由意志文献，即使把石头悖论按 Aquinas 的方式消解，这一问题仍然存在。[5]
      全在是另一项传统属性，主要困难在于：一个无身体、非物质的存在如何谈得上位于各处；它并不自动产生「举不起的石头」那种形式的矛盾，但也不应被默认为已经清楚。[6]
      因而，对「这个定义是否自洽」的审慎答复是：在把全能限制于逻辑上可能之事的定义下，许多哲学家认为石头悖论可以被消解；恶的问题与预知问题则仍是开放且分裂的争论；全在需要单独分析。把三者写成一个已证明自相矛盾、或已证明毫无问题的模块，都不符合已打开的文献。
    definitions:
    - term: 全能（omnipotence）
      text: >-
        SEP 将全能定义为极大的能力（maximal power），并指出极大的伟大或完美包含全能；传统西方有神论因此把上帝理解为全能。[1]
        一种有影响的限定（Aquinas）是：所谓「上帝能做一切事」，应理解为能做一切绝对可能的事；蕴含矛盾的并不在神圣全能的范围之内，最好说「这样的事不能被做」，而不是「上帝不能做它们」。[2]
    - term: 全知（omniscience）
      text: >-
        SEP 将全知定义为完备或极大的知识，并把它与全能、完美的善一并列为通常意义上的核心神圣属性。[7]
    - term: 全在（omnipresence）
      text: >-
        即上帝无处不在。SEP 指出，相关经文既被读成上帝真正位于诸特定处所，也被读成没有一处上帝不在；经典有神论同时主张上帝是非物质的，于是产生「无身体者如何在空间中定位」的问题。[6]
    - term: 神学宿命论（theological fatalism）
      text: >-
        SEP「Foreknowledge and Free Will」的用法：宿命论是指人的行动出于必然因而并不自由；神学宿命论则是指，对一项人类行动的无误预知使该行动成为必然，因而使之不自由。若有一个存在无误地知道全部未来，则无人的行动是自由的。[5]
    milestones:
    - year: 1265–1274
      name: Aquinas《神学大全》讨论「上帝是否全能」
      explanation: >-
        在 Prima Pars 第 25 题第 3 条，Aquinas 把「上帝能做一切事」解释为能做一切绝对可能之事，并主张蕴含词项矛盾的并不属于神圣全能的范围。本次打开并引用的是 New Advent 所刊英译。[2]
    - year: 1955
      name: Mackie 发表 “Evil and Omnipotence”
      explanation: >-
        在 Mind 新序列第 64 卷第 254 期，Mackie 把传统的恶的问题表述为有神论核心命题之间的逻辑不一致，并讨论包括全能悖论在内的相关困难。[3]
    - year: 1965
      name: Pike 对预知与自由之两难的表述激发大量后续文献
      explanation: >-
        SEP 将 Nelson Pike 1965 年的讨论，记为以清晰有力的方式提出这一两难、并引出相容论者与不相容论者大量工作的关键节点。本次未打开 Pike 原文，仅依据该条目的记述。[5]
    views:
    - position: 若把全能理解为「能实现一切绝对可能的事态」，而不是「能做自相矛盾的事」，则石头悖论可以被消解；但这已经放弃了「毫无限制的能力」这一字面读法
      consensus_role: >-
        西方有神论哲学中处理全能悖论的经典与当代主流路线之一；与「上帝也能创造或推翻逻辑必然真理」的少数更强读法相对
      evidence:
        label: 已打开的 Aquinas 英译，以及 SEP 对石头悖论及其两种消解的形式化讨论
        note: >-
          Aquinas 的关键限定来自 New Advent 所刊《神学大全》I, q. 25, a. 3 英译。SEP 对石头悖论的「是／否」二难，以及「本质地全能」与「偶性地全能」两种回应，来自 Hoffman 与 Rosenkrantz 撰写的条目；这是概念分析，不是实证研究。该条目也列出「上帝能否创造或推翻逻辑与数学的必然真理」作为另一个仍被追问的问题，说明「逻辑可能性限制」并非唯一被讨论的定义。[1][2]
      holders:
      - name: Thomas Aquinas
        identity: 《神学大全》（Summa Theologiae）第一部第 25 题作者；此处依据 New Advent 所刊英译文本。[2]
      - name: Joshua Hoffman、Gary Rosenkrantz
        identity: Stanford Encyclopedia of Philosophy 条目「Omnipotence」作者。该条目首次发布于 2002 年 5 月 21 日，本次打开的文本标明实质性修订日期为 2026 年 5 月 21 日。[1]
      argument: >-
        石头悖论的表面结构是：若全能者 Jane 能造出一块她搬不动的石头，则有她不能实现的事态（那块石头移动）；若她不能造出这样的石头，则同样有她不能实现的事态（存在着一块她搬不动的石头）。无论怎样回答，似乎都有某种可能事态是全能者不能实现的，于是显得悖谬。[1]
        SEP 给出的第一条出路适用于本质地全能的行动者：Jane 处于非全能是不可能的，而全能者必然能移动任何石头，因此「存在着一块 Jane 搬不动的石头」这一事态本身是不可能的；但全能者不被要求能够实现不可能的事态。[1]
        若 Jane 只是偶性地全能，则她可以在某一时刻造出并移动石头，再在另一时刻使自己不再全能从而搬不动它；两个事态必须在不同时间获得。[1]
        这两条出路都依赖于：全能不是「连逻辑不可能也做得到」。Aquinas 把这一点说得很干脆：仔细想来，「上帝能做一切事」应指能做一切可能之事；绝对的可能与不可能，取决于词项之间是否相容。蕴含同时是而又不是的，并不在神圣全能范围之内，不是因为上帝的能力有缺陷，而是因为那种对象没有「可被做成」的本性。「因此，更好的说法是：这样的事不能被做，而不是上帝不能做它们。」[2]
        对原问题而言，这意味着：若「全能」被读成提问者括号里的「不受限制的能力」，石头悖论确实构成严重压力；若采用 Aquinas—SEP 这条限定，许多讨论者认为该悖论不再证明「全能」一词自相矛盾。但限定本身已经改变了定义，不能再被说成是对「绝对字面全能」的挽救。
      quotes:
      - text: >-
          Therefore, everything that does not imply a contradiction in terms, is
          numbered amongst those possible things, in respect of which God is
          called omnipotent: whereas whatever implies contradiction does not
          come within the scope of divine omnipotence, because it cannot have
          the aspect of possibility. Hence it is better to say that such things
          cannot be done, than that God cannot do them.
        text_zh: 因此，凡不蕴含词项矛盾的，都被列入那些绝对可能的事物之中，上帝正是就此而被称为全能的；而凡蕴含矛盾的，并不进入神圣全能的范围，因为它不能具有可能性这一面相。所以，更好的说法是：这样的事不能被做，而不是上帝不能做它们。
        attribution: Thomas Aquinas，Summa Theologiae I, q. 25, a. 3（New Advent 英译）
        locator: Prima Pars, Question 25, Article 3, “I answer that…” 一段的收束部分；https://www.newadvent.org/summa/1025.htm
        ref: 2
      - text: >-
          The intelligibility of the notion of omnipotence has been challenged
          by the so-called paradox or riddle of the stone. Can an omnipotent
          agent, Jane, bring it about that there is a stone of some mass,
          m, which Jane cannot move? If the answer is
          ‘yes’, then there is a state of affairs that Jane cannot
          bring about, namely, (S1) that a stone of mass m moves. On
          the other hand, if the answer is ‘no’, then there is
          another state of affairs that Jane cannot bring about, namely, (S2)
          that there is a stone of mass m which Jane cannot move. Thus,
          it seems that whether or not Jane can make the stone in question,
          there is some possible state of affairs that an omnipotent agent
          cannot bring about. And this appears to be paradoxical.
        text_zh: 所谓石头悖论或谜题，向来被用来质疑全能概念是否可理解。一个全能的行动者 Jane，能否使存在一块质量为 m、而她搬不动的石头？若答「能」，则有一种她不能实现的事态，即（S1）这块质量为 m 的石头在移动。若答「不能」，则另有一种她不能实现的事态，即（S2）存在着一块质量为 m、而 Jane 搬不动的石头。于是，无论她能否造出这块石头，似乎都有某种可能事态是全能者不能实现的。这显得悖谬。
        attribution: Joshua Hoffman 与 Gary Rosenkrantz，SEP 条目 Omnipotence
        locator: 第 2 节 “The Scope of Omnipotence” 开篇
        ref: 1
    - position: 即使把石头悖论放下，把上帝理解为全能且全善（并通常也是全知），仍会与恶的存在形成逻辑压力；要消除矛盾，往往得修改有神论的某一核心命题
      consensus_role: >-
        这是恶的问题的「不相容」表述中最常被引用的当代出发点之一；它并不等于已经结束的争论，因为「何为适当的修改」以及自由意志进路是否成功，仍严重分裂
      evidence:
        label: 已打开的 Mackie 1955 年论文，辅以 SEP「The Problem of Evil」对不相容论证与自由意志进路的综述
        note: >-
          Mackie 的逻辑表述与结论来自本次打开的 Mind 64(254) JSTOR 数字化转载本。Tooley 条目把 Mackie 写成不相容论证的辩护者之一，并另设专节讨论自由意志进路；该条目最近一次标明的实质性修订是 2015 年 3 月 3 日。Alvin Plantinga 的 God, Freedom, and Evil 等书本次未打开，因此不引用其页码或未在 SEP 中出现的原句，也不把 Tooley 对「自由意志进路」的三点概括直接写成已核对的 Plantinga 原文。[3][4]
      holders:
      - name: J. L. Mackie
        identity: “Evil and Omnipotence”（Mind, 1955）作者。所打开文本在文末标明 University of Sydney。[3]
      - name: Michael Tooley
        identity: Stanford Encyclopedia of Philosophy 条目「The Problem of Evil」作者。该条目首次发布于 2002 年 9 月 16 日，本次打开的文本标明实质性修订日期为 2015 年 3 月 3 日。[4]
      argument: >-
        Mackie 明确把问题限定为：只对那些相信存在一位既全能又全善的上帝的人，恶才构成此处所说的问题；而且这是一个澄清并调和若干信念的逻辑问题，不是再观察或再做一个决定就能解决的科学或实践问题。[3]
        其最简形式是：上帝全能；上帝全善；然而恶存在。任意两句为真，第三句似乎就为假。但三者又都被他称为大多数神学立场的本质部分。矛盾并非立刻出现，还需要补充前提：善与恶相对立，因而善的事物会尽其所能消除恶；以及全能者的能力没有限制。由此推出：一个全能的善者会把恶完全消除，于是「存在全能的善者」与「恶存在」不相容。[3]
        Mackie 区分「适当的」解决方案与不适当的方案：若有人愿意说上帝并非全善、并非真正全能、恶并不存在，或全能者的能力其实有限制，则问题对这个人不再发生。他的判断是，所考察的方案无一经得起批评；这一研究强烈暗示，不存在既不修改至少一项构成命题、又不严重触及有神论核心的有效解决。[3]
        他还说，即便撤开恶的问题，全能悖论也已经表明上帝的全能必须以某种方式受到限制，不能把不受限定的全能归给任何贯穿时间而持续的存在。[3]
        SEP 把后来的讨论进一步分成不相容论证与证据性论证，并介绍「自由意志」作为一种重要的神义论进路：自由意志（在不受行动者之外原因决定的意义上）被认为极有价值；即连上帝也不能使一个人既自由又必然行义；因此，创造一个具有这种自由、即使可能被滥用的世界，被认为优于创造一个没有这种自由的世界。[4]
        Tooley 随即列举强硬反驳，包括：有价值并不蕴涵永不干预；自由不必包含造成极大伤害的能力；地震与疾病一类自然恶并不显然来自道德上错误的行动。这些反驳是否决定性，本身仍在争论中；它们足以说明：Mackie 式的不一致指控并未被哲学共同体当作已经结案，但也不能被「自由意志」四个字轻易取消。[4]
        对原问题而言，恶的问题所挑战的，已经不只是「全知—全能—全在」三个词的组合，而是这个组合在传统中几乎必然带上的全善，以及世界里可观察的恶。把标题里的三个前缀写成「已经自洽」或「已经破产」，都会漏掉这一层。
      quotes:
      - text: >-
          In its simplest form the problem is this : God is omnipotent ;
          God is wholly good ; and yet evil exists. There seems to be
          some contradiction between these three propositions, so that if
          any two of them were true the third would be false. But at the
          same time all three are essential parts of most theological
          positions : the theologian, it seems, at once must adhere and
          cannot consistently adhere to all three.
        text_zh: 其最简形式是这样的：上帝是全能的；上帝是全然善的；然而恶存在着。这三句命题之间似乎有某种矛盾，以致若任意两句为真，第三句便为假。但与此同时，三者又都是大多数神学立场的本质部分：神学家似乎既必须坚持这三者，又不能一致地坚持这三者。
        attribution: J. L. Mackie，Evil and Omnipotence
        locator: Mind, New Series, Vol. 64, No. 254 (April 1955), 第 200 页正文对问题的「最简形式」陈述；本次打开的是 JSTOR 数字化转载本
        ref: 3
      - text: >-
          Of the proposed solutions of the problem of evil which we have
          examined, none has stood up to criticism. There may be other
          solutions which require examination, but this study strongly
          suggests that there is no valid solution of the problem which does not
          modify at least one of the constituent propositions in a way which
          would seriously affect the essential core of the theistic position.
        text_zh: 在我们所考察的、针对恶的问题而提出的解决方案中，没有一个经受住了批评。也许还有其他方案需要考察，但本研究强烈暗示：不存在这样一种有效的解决——它不必以一种将严重触及有神论立场之本质核心的方式，修改构成命题中的至少一项。
        attribution: J. L. Mackie，Evil and Omnipotence
        locator: 文末 “Conclusion” 一节，Mind 64(254), 1955, 第 212 页；本次打开的是 JSTOR 数字化转载本。转写时按印刷单词连续阅读，不保留扫描分词造成的异常空格
        ref: 3
    - position: 无误的预知与人类自由意志是否相容，是另一个未决的一致性问题，不能被石头悖论或恶的问题的结论代替
      consensus_role: >-
        当代分析的宗教哲学中持续活跃的专门争论；相容论者与不相容论者都有大量文献，条目作者强调其论证是否可靠并不显而易见
      evidence:
        label: 一篇已打开的 SEP 长条目，梳理神学宿命论论证及主要回应类型
        note: >-
          Pike 1965 年论文、Ockham 式「软事实」、Boethius／Aquinas 的永恒方案以及开放有神论等，本次均未打开其原始文本；下文只按 Hunt 与 Zagzebski 条目已写出的结构来介绍，不添加未在该条目中出现的论证步骤或页码。[5]
      holders:
      - name: David Hunt、Linda Zagzebski
        identity: Stanford Encyclopedia of Philosophy 条目「Foreknowledge and Free Will」作者。该条目首次发布于 2004 年 7 月 6 日，本次打开的文本标明实质性修订日期为 2026 年 2 月 17 日。版权栏给出 Hunt 的联系邮箱为 dhunt@whittier.edu。[5]
      argument: >-
        原问题里的第一个例子——「上帝是否知道自己明天要做什么；若知道，还能不能做别的」——把全知与全能缠在一起，并且把上帝放进时间里的「明天」。SEP 所处理的标准神学宿命论，则更常以「无误预知与人的自由」为轴，但其结构十分接近：对过去信念无法现在加以改变，加上该信念无误，似乎推出你不能做与被预知者不同的事；若不能另做他事，该行动便不自由。[5]
        条目给出的非正式推理是：对于你将要做的任何未来行动，若某存在过去无误地相信该行动会发生，你现在既不能改变他曾如此相信（无人能控制过去），也不能使他的信念为假（他是无误的）；因此你不能做与他所信不同的事；若你不能另做他事，你就不是自由地做这件事。若有一个存在无误地知道全部未来，则没有人能控制未来。[5]
        Hunt 与 Zagzebski 强调，关于这一论证是否可靠的争论历史很长，因而其可靠性一定不是显而易见的。他们把 Pike 1965 年的表述记为激发相容论与不相容论大量后续工作的关键节点。[5]
        相容论者必须指出前提为假，或指出结论并不由此推出；不相容论者接受无误预知与（论证所针对的那种）自由不相容，从而放弃其中一侧。条目列举的相容论回应包括：否认关于偶然未来的命题已有真值、把上帝置于时间之外（永恒方案）、把上帝过去的预知信念视为关于过去的「软事实」，以及其他关于必然性传递的质疑。[5]
        这些策略没有一项被写成已经获胜。对原问题而言，关键是：即使采用 Aquinas 对全能的逻辑限制，从而避开石头悖论，「预知是否取消自由（或取消上帝自己的行动自由）」仍需单独回答；把上帝移出时间，或许缓解「明天祂还能否做别的」，但又会回到 Mackie 已经触及的疑问：对一个不在时间中的存在，还能不能有意义地谈论能力与行动。[3][5]
      quotes:
      - text: >-
          Theological fatalism is the thesis that infallible
          foreknowledge of a human act makes the act necessary and hence unfree.
          If there is a being who knows the entire future infallibly, then no
          human act is free.
        text_zh: 神学宿命论是这样一种论题：对一项人类行动的无误预知，使该行动成为必然，因而使之不自由。若有一个存在无误地知道全部未来，则没有人的行动是自由的。
        attribution: David Hunt 与 Linda Zagzebski，SEP 条目 Foreknowledge and Free Will
        locator: 条目开篇定义段
        ref: 5
    - position: 全在是一项需要单独分析的神圣属性，其主要困难是非物质的上帝如何「在」空间之中；它通常并不与石头悖论或恶的问题构成同一个形式矛盾
      consensus_role: >-
        经典有神论的标准属性之一，但当代哲学对它的讨论明显少于全能与全知；文献重点在定位与「全然在场」，而不是三属性的联合不一致证明
      evidence:
        label: 已打开的 SEP「Omnipresence」对概念、历史线索与问题结构的概述
        note: >-
          条目对 Augustine、Anselm 的引述来自该文已写出的英文；本次未打开 Letter 187、Monologion 等原书去核对页码，故不以那些原书页码作为定位。该条目并不试图用全在推出「全知—全能—全在」定义整体不一致。[6]
      holders:
      - name: Edward Wierenga
        identity: Stanford Encyclopedia of Philosophy 条目「Omnipresence」以及「Omniscience」作者。「Omnipresence」首次发布于 2005 年 7 月 15 日，本次打开的文本标明实质性修订日期为 2026 年 6 月 1 日。[6][7]
      argument: >-
        提问者把 omnipresent 解释为「无处不在」，这与 SEP 的工作定义一致。但经典有神论同时主张上帝是非物质的，于是立刻出现一个与石头、与恶都不同的问题：一个没有（或不具有）身体的东西，如何位于空间之中？[6]
        早期讨论通常一开始就把上帝在空间中的在场，与物质身体的在场区分开。条目引 Augustine 之说：我们虽说上帝无处在场，却必须抵制肉体性的想像，不能把上帝想成像土、水、气、光那样以某种广延的大小分布在万物之中。[6]
        该传统还强调两个进一步要点：上帝是「全然」在他所在之处，而不像有部分的物体只把部分放在空间的各部分；上帝也不被任何处所包围或限制。[6]
        这些是关于神圣在场之方式的概念困难，它们当然可能与全知（上帝对各地的认知）或全能（上帝对各地的作用）发生关联，但并不自动生成「既全能又不能」或「既全善又允许恶」那种直接的形式矛盾。因此，即令有人认为石头悖论或恶的问题已经显示定义破裂，把「全在」当作同一破裂的第三个症状，是一种尚未被这篇文献承担起来的跳跃；反之，若有人认为前两类问题都已解决，全在仍有其自身的工作要做。[6]
      quotes:
      - text: >-
          This is the claim that God is omnipresent. Divine
          omnipresence is thus one of the traditional divine attributes, although
          it has attracted less philosophical attention than such attributes as
          omnipotence, omniscience, or being eternal.
        text_zh: 这就是上帝全在的主张。因此，神圣的全在是传统神圣属性之一，尽管它所吸引的哲学注意，少于全能、全知或永恒这类属性。
        attribution: Edward Wierenga，SEP 条目 Omnipresence
        locator: 条目导论，在引述诗篇 139:7–8 并说明「无处不在」这一主张之后
        ref: 6
    open_parts: >-
      「全能」要不要受逻辑可能性约束，本身仍是定义之争：SEP 仍把「能否创造或推翻逻辑与数学必然真理」列为开放问题；若拒绝这一约束，石头悖论与「全能者能否使 2+2=4 为假」会重新变得尖锐。[1]
      恶的问题已从 Mackie 式的不相容论证，扩展到证据性论证、辩护（defense）与神义论（theodicy）的精细区分；自由意志进路的形而上学负担（何为自由、如何处理自然恶）仍有力地争论着。Plantinga 等关键原书本次未打开，不能在此代表其完整方案。[3][4]
      预知与自由的各种方案（永恒、软事实、开放有神论、放弃无误预知或放弃该种自由）没有公认赢家。[5]
      全在与时间性、知识、能力如何互相约束，以及「全知、全能、全在」加上全善是否构成一个极大且共可能的属性集，仍取决于所采用的完美存在神学，而非一个已经完成的一致性证明。[1][6][7]
    references:
