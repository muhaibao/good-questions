        Riemann, B. (1859/1860). Ueber die Anzahl der Primzahlen unter einer gegebenen Grösse. Monatsberichte der Berliner Akademie. 本次打开并核对的是 David R. Wilkins 1998 年公开英译 Preliminary Version，以及同一站点的德文转写。
      url: https://www.maths.tcd.ie/pub/HistMath/People/Riemann/Zeta/EZeta.pdf
